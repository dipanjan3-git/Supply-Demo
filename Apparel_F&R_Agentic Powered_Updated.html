                    <span style={{ fontSize: 10, color: '#22C55E', fontWeight: 600 }}>{h.impact}</span>
                  </div>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(200px,1fr))', gap: 0 }}>
                  {[
                    { label: 'Action Taken', value: h.actionTaken, color: 'var(--text)' },
                    { label: 'Action NOT Taken', value: h.notTaken, color: '#FBBF24' },
                    { label: 'Outcome', value: h.outcome, color: '#F87171' },
                    { label: 'Key Learning', value: h.learning, color: '#22C55E' },
                  ].map(f => (
                    <div key={f.label} style={{ padding: '10px 14px', borderRight: '1px solid var(--border)', borderTop: '1px solid var(--border)' }}>
                      <div style={{ fontSize: 8, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.4px', marginBottom: 3 }}>{f.label}</div>
                      <div style={{ fontSize: 10, color: f.color, lineHeight: 1.4 }}>{f.value}</div>
                    </div>
                  ))}
                </div>
              </div>
            ))}

            {/* DEEP-DIVE ANALYSIS — collapsible static SHAP summary */}
            <div style={{ marginTop: 16, background: 'rgba(168,85,247,0.04)', border: '1px solid rgba(168,85,247,0.2)', borderRadius: 'var(--radius-sm)', overflow: 'hidden' }}>
              <div style={{ padding: '10px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer', borderBottom: deepDiveOpen ? '1px solid rgba(168,85,247,0.15)' : 'none' }} onClick={() => setDeepDiveOpen(o => !o)}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--text)' }}>SHAP Deep-Dive Analysis</span>
                  <span style={{ fontSize: 9, color: '#A855F7', background: 'rgba(168,85,247,0.12)', padding: '2px 8px', borderRadius: 5, fontWeight: 600 }}>Optional</span>
                </div>
                <span style={{ fontSize: 11, color: '#A855F7' }}>{deepDiveOpen ? '▲' : '▼'}</span>
              </div>
              {deepDiveOpen && (
                <div style={{ padding: '12px 14px' }}>
                  <p style={{ fontSize: 11, color: 'var(--muted)', marginBottom: 10, lineHeight: 1.5 }}>Full SHAP feature attribution for this scenario. The values below represent the decomposed contribution of each feature to the AI's demand revision.</p>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(220px,1fr))', gap: 8 }}>
                    {(sc.agentData?.features || []).map((f, i) => {
                      const barW = Math.min(100, Math.abs(parseFloat(f.updated) - parseFloat(f.prev)) / Math.max(parseFloat(f.updated), parseFloat(f.prev), 1) * 100 + 20);
                      return (
                        <div key={i} style={{ background: 'var(--bg2)', borderRadius: 6, padding: '10px 12px', border: '1px solid var(--border)' }}>
                          <div style={{ fontSize: 8, color: '#A855F7', textTransform: 'uppercase', letterSpacing: '.4px', fontWeight: 700, marginBottom: 3 }}>{f.type}</div>
                          <div style={{ fontSize: 10, fontWeight: 600, marginBottom: 3, fontFamily: 'var(--font-mono)', color: 'var(--brand-light)' }}>{f.name}</div>
                          <div style={{ height: 4, background: 'var(--card)', borderRadius: 2, marginBottom: 5 }}>
                            <div style={{ height: '100%', width: `${barW}%`, background: 'linear-gradient(90deg,#A855F7,#7C3AED)', borderRadius: 2 }} />
                          </div>
                          <div style={{ fontSize: 9, color: 'var(--muted)', lineHeight: 1.4 }}>{f.impact}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          </>
        }
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   CUSTOM ALLOCATION PANEL (FEEDBACK #2 + STEP 4A)
   Used inside Next Best Action — Priority Store Allocation (n3).
   Lets the planner manually edit per-store allocation while
   enforcing the supply constraint: Σ allocations ≤ available inventory.
───────────────────────────────────────────── */
function CustomAllocationPanel({ sc, action, isSelected, customAllocs, setCustomAllocs, disabled }) {
  // Available inventory comes from the DC constraint when present;
  // fallback to a sensible aggregate if not.
  const dc = sc.dcConstraint;
  const totalAvailable = (dc && dc.atpAvailable)
    ? dc.atpAvailable
    : Math.max(800, Math.round((sc.affected || 30) * 16));

  // Build the per-store list deterministically from sc.locStores.
  // Each entry: { id, name, region, baseAlloc (default fair share) }
  const storeList = (() => {
    const out = [];
    const locs = sc.locStores || {};
    let storeNum = 1;
    Object.entries(locs).forEach(([region, count]) => {
      for (let i = 0; i < count; i++) {
        out.push({
          id: `${region}-${i}`,
          name: `Store #${(storeNum++).toString().padStart(4, '0')}`,
          region,
        });
      }
    });
    // Fallback for scenarios without locStores
    if (out.length === 0) {
      const n = sc.affected || 30;
      for (let i = 0; i < n; i++) out.push({ id: `S-${i}`, name: `Store #${(i+1).toString().padStart(4,'0')}`, region: sc.region || '—' });
    }
    return out;
  })();

  // Fair share = available / N (rounded down so we don't exceed budget).
  const fairShare = Math.floor(totalAvailable / storeList.length);

  // Initialise / read state. Stored under action.id (e.g. 'n3').
  const stateKey = action.id;
  const current = customAllocs[stateKey];
  const perStore = (current && current.perStore) || (() => {
    const init = {};
    storeList.forEach(s => { init[s.id] = fairShare; });
    return init;
  })();

  // ── ALLOCATION TOTALS & VALIDATION STATUS ──
  // Memoised so we don't recompute on unrelated re-renders. Recomputes
  // exactly when per-store values or the supply ceiling changes — giving
  // the planner immediate, real-time feedback as they edit any input.
  const { totalAllocated, remaining, utilPct, skippedCount, allocStatus } = useMemo(() => {
    const total = Object.values(perStore).reduce((a, b) => a + (Number(b) || 0), 0);
    const rem = totalAvailable - total;                      // +ve = under, -ve = over, 0 = exact
    const pct = totalAvailable > 0 ? Math.min(100, Math.round((total / totalAvailable) * 100)) : 0;
    const skipped = storeList.filter(s => (Number(perStore[s.id]) || 0) === 0).length;
    const status = total > totalAvailable ? 'over' : total < totalAvailable ? 'under' : 'exact';
    return {
      totalAllocated: total,
      remaining: rem,
      utilPct: pct,
      skippedCount: skipped,
      allocStatus: status,
    };
  }, [perStore, totalAvailable, storeList]);

  function update(storeId, val) {
    if (disabled) return;
    const v = Math.max(0, parseInt(val) || 0);
    setCustomAllocs(prev => ({
      ...prev,
      [stateKey]: {
        perStore: { ...((prev[stateKey] && prev[stateKey].perStore) || perStore), [storeId]: v },
        totalAvailable,
      }
    }));
  }

  function distributeEvenly() {
    if (disabled) return;
    const fs = Math.floor(totalAvailable / storeList.length);
    const next = {};
    storeList.forEach(s => { next[s.id] = fs; });
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable } }));
  }

  function autoBalance() {
    if (disabled) return;
    // Scale all current allocations proportionally to fit budget exactly.
    const cur = Object.values(perStore).reduce((a, b) => a + (Number(b) || 0), 0);
    if (cur === 0) { distributeEvenly(); return; }
    const ratio = totalAvailable / cur;
    const next = {};
    storeList.forEach(s => { next[s.id] = Math.floor((Number(perStore[s.id]) || 0) * ratio); });
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable } }));
  }

  function clearAll() {
    if (disabled) return;
    const next = {};
    storeList.forEach(s => { next[s.id] = 0; });
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable } }));
  }

  // Limit visible rows but allow scroll
  const [showAll, setShowAll] = useState(false);
  const visibleStores = showAll ? storeList : storeList.slice(0, 8);

  // Status colour — drives both the budget bar and the "Allocated" value
  // tint. Maps directly to the three allocation cases:
  //   over  → bad   (red)
  //   under → warn  (amber)
  //   exact → ok    (green)
  const utilCls = allocStatus === 'over' ? 'bad' : allocStatus === 'under' ? 'warn' : 'ok';

  return (
    <div className={`custom-panel${isSelected ? ' selected' : ''}`}>
      <div className="custom-panel-head">
        <span className="custom-tag">Custom</span>
        <div style={{ flex: 1 }}>
          <div className="custom-panel-title">Manual per-store allocation</div>
          <div className="custom-panel-sub">Edit any store. Total allocation must not exceed available inventory.</div>
        </div>
      </div>

      {/* SUPPLY BUDGET */}
      <div className="custom-budget">
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Available</div>
          <div className="custom-budget-val">{totalAvailable.toLocaleString()} units</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Allocated</div>
          <div className={`custom-budget-val ${utilCls}`}>{totalAllocated.toLocaleString()} units</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">
            {allocStatus === 'over' ? 'Over by' : allocStatus === 'under' ? 'Under by' : 'Remaining'}
          </div>
          <div className={`custom-budget-val ${utilCls}`}>
            {Math.abs(remaining).toLocaleString()} units
          </div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Stores covered</div>
          <div className="custom-budget-val">{storeList.length - skippedCount}/{storeList.length}</div>
        </div>
        <div className="custom-budget-bar" title={`${utilPct}% utilised`}>
          <div className={`custom-budget-bar-fill ${utilCls}`} style={{ width: `${Math.min(100, utilPct)}%` }} />
        </div>
      </div>

      {/* ── REAL-TIME ALLOCATION VALIDATION ──
          Exactly one primary status message is shown at a time, driven by
          allocStatus ('over' | 'under' | 'exact'). Updates live on every
          input change. Skipped-stores note is informational only and
          appears underneath when relevant. */}
      {allocStatus === 'over' && (
        <div className="custom-msg bad" role="alert" aria-live="polite">
          ⚠ You are over-allocating by {Math.abs(remaining).toLocaleString()} units.
          Reduce per-store quantities until total ≤ {totalAvailable.toLocaleString()} units.
        </div>
      )}
      {allocStatus === 'under' && (
        <div className="custom-msg warn" role="status" aria-live="polite">
          ⚠ You are under-allocating by {remaining.toLocaleString()} units.
          {totalAvailable.toLocaleString()} units available — {totalAllocated.toLocaleString()} units assigned.
        </div>
      )}
      {allocStatus === 'exact' && totalAllocated > 0 && (
        <div className="custom-msg ok" role="status" aria-live="polite">
          ✓ Allocation matches available supply ({totalAvailable.toLocaleString()} units).
        </div>
      )}
      {/* Secondary informational note — does not block, just flags intent */}
      {allocStatus !== 'over' && skippedCount > 0 && (
        <div className="custom-msg warn" style={{ marginTop: 6 }}>
          {skippedCount} store{skippedCount > 1 ? 's' : ''} set to 0 — these will receive no allocation. Acceptable if intentional.
        </div>
      )}

      {/* CONTROLS */}
      <div className="custom-actions">
        <button className="custom-mini-btn" disabled={disabled} onClick={distributeEvenly}>↔ Distribute evenly</button>
        <button className="custom-mini-btn" disabled={disabled} onClick={autoBalance}>⚖ Auto-balance to budget</button>
        <button className="custom-mini-btn" disabled={disabled} onClick={clearAll}>✕ Clear all</button>
        <span style={{ fontSize: 9, color: 'var(--muted)', marginLeft: 'auto' }}>
          Fair share: {fairShare.toLocaleString()} units/store · {storeList.length} stores
        </span>
      </div>

      {/* PER-STORE TABLE */}
      <div className="custom-table" style={{ marginTop: 10, maxHeight: 300, overflowY: 'auto' }}>
        <div className="custom-row hdr">
          <div>Store · Region</div>
          <div style={{ textAlign: 'center' }}>Fair share</div>
          <div style={{ textAlign: 'center' }}>Your allocation</div>
          <div style={{ textAlign: 'center' }}>Δ vs fair</div>
          <div></div>
        </div>
        {visibleStores.map(s => {
          const v = Number(perStore[s.id]) || 0;
          const delta = v - fairShare;
          const isZero = v === 0;
          return (
            <div key={s.id} className={`custom-row${isZero ? ' invalid' : ''}`}>
              <div>
                <div style={{ fontWeight: 600 }}>{s.name}</div>
                <div style={{ fontSize: 9, color: 'var(--muted)' }}>{s.region}</div>
              </div>
              <div style={{ textAlign: 'center', color: 'var(--muted)', fontSize: 10 }}>{fairShare}</div>
              <div>
                <input
                  type="number"
                  className={`custom-input${isZero ? ' invalid' : ''}`}
                  min="0"
                  value={v}
                  disabled={disabled}
                  onChange={e => update(s.id, e.target.value)}
                  onFocus={e => e.target.select()}
                />
              </div>
              <div className={`custom-row-tag ${delta > 0 ? 'ok' : delta < 0 ? 'warn' : ''}`} style={{ textAlign: 'center' }}>
                {delta > 0 ? `+${delta}` : delta < 0 ? delta : '—'}
              </div>
              <div style={{ textAlign: 'center', fontSize: 11, color: isZero ? 'var(--red-l)' : 'var(--muted)' }} title={isZero ? 'Skipped' : 'Allocated'}>
                {isZero ? '∅' : '✓'}
              </div>
            </div>
          );
        })}
      </div>
      {storeList.length > 8 && (
        <button className="custom-mini-btn" style={{ marginTop: 8 }} onClick={() => setShowAll(s => !s)}>
          {showAll ? '↑ Collapse list' : `↓ Show all ${storeList.length} stores`}
        </button>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────
   CUSTOM SUBSTITUTION PANEL (FEEDBACK #2 + STEP 4B)
   Used inside Next Best Action — Product Substitution (n4).
   Lets the planner manually define substitution quantities per substitute SKU,
   constrained by available substitute supply for each.
───────────────────────────────────────────── */
function CustomSubstitutionPanel({ sc, action, isSelected, customAllocs, setCustomAllocs, disabled }) {
  // Build substitute SKU list. Use scenario-derived defaults so it works for any scenario.
  // Each substitute: { id, name, available (cs), crossElasticity }
  // Available is derived from scenario gain/affected.
  const baseAvailable = Math.max(60, Math.round((sc.affected || 30) * 4));
  const substitutes = [
    { id: 'sub-a', name: 'Down Vest Unisex/Olive/L', available: baseAvailable,            crossElasticity: 0.78 },
    { id: 'sub-b', name: 'Down Vest Unisex/Olive/L',        available: Math.round(baseAvailable*0.7), crossElasticity: 0.85 },
    { id: 'sub-c', name: 'Down Vest Unisex/Olive/L',  available: Math.round(baseAvailable*0.5), crossElasticity: 0.62 },
  ];

  const stateKey = action.id;
  const current = customAllocs[stateKey];
  const perSub = (current && current.perStore) || (() => {
    const init = {};
    // Default: 50% of each substitute used
    substitutes.forEach(s => { init[s.id] = Math.floor(s.available * 0.5); });
    return init;
  })();

  // Aggregate gap to fill = the original action.qty if defined, else use a sensible default
  const targetGap = action.qty || 180;
  const totalSubstituted = Object.values(perSub).reduce((a, b) => a + (Number(b) || 0), 0);
  const gapRemaining = Math.max(0, targetGap - totalSubstituted);
  const gapClosedPct = Math.min(100, Math.round((totalSubstituted / targetGap) * 100));

  // Per-SKU constraint check
  const perSkuViolations = substitutes.filter(s => (Number(perSub[s.id]) || 0) > s.available);
  const anyViolation = perSkuViolations.length > 0;

  function update(subId, val) {
    if (disabled) return;
    const v = Math.max(0, parseInt(val) || 0);
    setCustomAllocs(prev => ({
      ...prev,
      [stateKey]: {
        perStore: { ...((prev[stateKey] && prev[stateKey].perStore) || perSub), [subId]: v },
        totalAvailable: targetGap,
      }
    }));
  }

  function fillGap() {
    if (disabled) return;
    // Fill the gap greedily within each substitute's available stock, in elasticity order
    let need = targetGap;
    const next = {};
    substitutes.forEach(s => { next[s.id] = 0; });
    const sorted = [...substitutes].sort((a, b) => b.crossElasticity - a.crossElasticity);
    for (const s of sorted) {
      if (need <= 0) break;
      const take = Math.min(need, s.available);
      next[s.id] = take;
      need -= take;
    }
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable: targetGap } }));
  }

  function clearAll() {
    if (disabled) return;
    const next = {};
    substitutes.forEach(s => { next[s.id] = 0; });
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable: targetGap } }));
  }

  const utilCls = anyViolation ? 'bad' : (gapClosedPct < 50 ? 'warn' : 'ok');

  return (
    <div className={`custom-panel${isSelected ? ' selected' : ''}`}>
      <div className="custom-panel-head">
        <span className="custom-tag">Custom</span>
        <div style={{ flex: 1 }}>
          <div className="custom-panel-title">Manual substitution mix</div>
          <div className="custom-panel-sub">Define how much of each substitute SKU to deploy. Total per SKU must respect available supply.</div>
        </div>
      </div>

      {/* GAP BUDGET */}
      <div className="custom-budget">
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Demand gap</div>
          <div className="custom-budget-val">{targetGap.toLocaleString()} units</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Substituted</div>
          <div className={`custom-budget-val ${utilCls}`}>{totalSubstituted.toLocaleString()} units</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Gap closed</div>
          <div className={`custom-budget-val ${utilCls}`}>{gapClosedPct}%</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Gap remaining</div>
          <div className={`custom-budget-val ${gapRemaining > 0 ? 'warn' : 'ok'}`}>{gapRemaining.toLocaleString()} units</div>
        </div>
        <div className="custom-budget-bar" title={`${gapClosedPct}% of gap covered`}>
          <div className={`custom-budget-bar-fill ${utilCls}`} style={{ width: `${Math.min(100, gapClosedPct)}%` }} />
        </div>
      </div>

      {/* MESSAGES */}
      {anyViolation && (
        <div className="custom-msg bad">
          ⚠ Supply violation on {perSkuViolations.length} substitute{perSkuViolations.length > 1 ? 's' : ''}. Reduce the highlighted quantities to within available supply.
        </div>
      )}
      {!anyViolation && gapRemaining > 0 && totalSubstituted > 0 && (
        <div className="custom-msg warn">
          Partial coverage. {gapRemaining.toLocaleString()} units of demand gap still uncovered — service level may dip on the primary SKU.
        </div>
      )}
      {!anyViolation && gapRemaining === 0 && totalSubstituted > 0 && (
        <div className="custom-msg ok">
          ✓ Demand gap fully covered within substitute supply. No constraint violation.
        </div>
      )}

      {/* CONTROLS */}
      <div className="custom-actions">
        <button className="custom-mini-btn" disabled={disabled} onClick={fillGap}>⚡ Auto-fill gap (by elasticity)</button>
        <button className="custom-mini-btn" disabled={disabled} onClick={clearAll}>✕ Clear all</button>
      </div>

      {/* PER-SUBSTITUTE TABLE */}
      <div className="custom-table" style={{ marginTop: 10 }}>
        <div className="custom-row hdr">
          <div>Substitute SKU</div>
          <div style={{ textAlign: 'center' }}>Available</div>
          <div style={{ textAlign: 'center' }}>Your qty</div>
          <div style={{ textAlign: 'center' }}>Elasticity</div>
          <div></div>
        </div>
        {substitutes.map(s => {
          const v = Number(perSub[s.id]) || 0;
          const violates = v > s.available;
          return (
            <div key={s.id} className={`custom-row${violates ? ' invalid' : ''}`}>
              <div>
                <div style={{ fontWeight: 600 }}>{s.name}</div>
                <div style={{ fontSize: 9, color: 'var(--muted)' }}>Cross-sub for {(sc.dcConstraint && sc.dcConstraint.constrainedSku) || 'primary SKU'}</div>
              </div>
              <div style={{ textAlign: 'center', color: 'var(--muted)', fontSize: 10 }}>{s.available.toLocaleString()} units</div>
              <div>
                <input
                  type="number"
                  className={`custom-input${violates ? ' invalid' : ''}`}
                  min="0"
                  max={s.available}
                  value={v}
                  disabled={disabled}
                  onChange={e => update(s.id, e.target.value)}
                  onFocus={e => e.target.select()}
                />
              </div>
              <div className="custom-row-tag" style={{ textAlign: 'center' }}>{s.crossElasticity.toFixed(2)}</div>
              <div style={{ textAlign: 'center', fontSize: 11, color: violates ? 'var(--red-l)' : v === 0 ? 'var(--muted)' : 'var(--green-l)' }}
                title={violates ? 'Exceeds supply' : v === 0 ? 'Not used' : 'OK'}>
                {violates ? '⚠' : v === 0 ? '∅' : '✓'}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AgPanel8({ sc, nbaState, setNbaState, nbaSubmitted, setNbaSubmitted, onResume, fcstState, dcAllocChoice, setDcAllocChoice, customAllocs, setCustomAllocs }) {
  const actions = sc.agentData?.nbaActions || [];
  const dc = sc.dcConstraint;
  const noImpact = false;
  const slBase = SL_BASE_MAP[sc.id] || 76;
  const rm = computeResolutionModel(sc);
  const autoOnlySL = rm ? rm.autoOnlySL : slBase;  // SL after autonomous actions, before planner options
  // Baseline-consistent SL labels: auto-done cards show the running cumulative on top of
  // slBase; the per-option labels (below) show auto-only + that option's lift. Every SL
  // figure on this screen derives from the same slBase, so they are at par with the chain.
  const doneSLByIdx = (() => { let cum = 0; const m = {}; actions.filter(a => a.done).forEach(a => { cum += (a.kpiDelta?.sl || 0); m[a.id] = Math.min(98.5, slBase + cum); }); return m; })();
  function doneSLLabel(a) { return (a.kpiDelta && a.kpiDelta.sl) ? `+${a.kpiDelta.sl}pp → ${doneSLByIdx[a.id].toFixed(0)}%` : a.slImpact; }
  function toggleSLLabel(a) { return (a.kpiDelta && a.kpiDelta.sl) ? `+${a.kpiDelta.sl}pp → ${Math.min(98.5, autoOnlySL + a.kpiDelta.sl).toFixed(0)}%` : a.slImpact; }
  const dcDecisionNeeded = dc?.affected && !dcAllocChoice && dc.shortfallCases > 0;

  function toggleAction(id) {
    if (nbaSubmitted) return;
    setNbaState(s => ({ ...s, [id]: !s[id] }));
  }

  function submitNba() {
    setNbaSubmitted(true);
    setTimeout(onResume, 600);
  }

  // Compute projected outcome from NBA + DC decision
  const proj = computeNbaProjection(sc, fcstState || {}, nbaState, dcAllocChoice);

  // FEEDBACK #2: Detect if any selected Custom plan is over its supply budget.
  // Used to block the Confirm button until the planner fixes their custom plan.
  const customInvalid = (() => {
    for (const a of actions) {
      const sel = nbaState[a.id];
      if (!sel || !sel.endsWith || !sel.endsWith('-custom')) continue;
      const ca = customAllocs[a.id];
      if (!ca || !ca.perStore) continue;
      const total = Object.values(ca.perStore).reduce((s, v) => s + (Number(v) || 0), 0);
      if (/substitut/i.test(a.title)) {
        // For substitution: any single SKU exceeds its supply ⇒ invalid.
        // We re-derive the same supply caps used inside CustomSubstitutionPanel to keep parity.
        const baseAvailable = Math.max(60, Math.round((sc.affected || 30) * 4));
        const caps = { 'sub-a': baseAvailable, 'sub-b': Math.round(baseAvailable*0.7), 'sub-c': Math.round(baseAvailable*0.5) };
        for (const [k, v] of Object.entries(ca.perStore)) {
          if ((Number(v) || 0) > (caps[k] || Infinity)) return true;
        }
      } else {
        // For allocation: total must not exceed available.
        if (total > ca.totalAvailable) return true;
      }
    }
    return false;
  })();

  // DC alloc KPI note
  let dcKpiNote = null;
  if (dc?.affected && dcAllocChoice) {
    if (dcAllocChoice === 'full')          dcKpiNote = { text: `Full transfer approved — ${(dc.atpAvailable||0).toLocaleString()} units arriving from ${dc.transferOption?.from}`, color: '#22C55E' };
    else if (dcAllocChoice === 'top10')    dcKpiNote = { text: `Top stores prioritised — ${dc.shortfallStores || 28} stores at reduced allocation`, color: '#FBBF24' };
    else if (dcAllocChoice === 'proportional') dcKpiNote = { text: `Proportional allocation — all stores share shortfall equally`, color: '#FBBF24' };
    else if (dcAllocChoice === 'accept')   dcKpiNote = { text: `Constraint accepted — ${dc.shortfallStores || 28} stores will receive zero ${dc.constrainedSku}`, color: '#F87171' };
  }

  // Selected actions (auto-done + planner-toggled) — used for counts and the checklist.
  // All KPI numbers come from `proj` (computeNbaProjection) so every figure on this
  // screen is derived from one model.
  const selected = actions.filter(a => a.done || nbaState[a.id]);
  const pendingActions = actions.filter(a => !a.done);

  return (
    <div className="apanel" style={{ borderColor: 'rgba(217,119,6,0.3)' }}>
      <div className="aph" style={{ background: 'rgba(217,119,6,0.04)' }}>
        <div className="apb2" style={{ background: '#D97706' }}>08</div>
        <div><h3>Next Best Action</h3><div className="aps">Human checkpoint — select mitigation actions · {sc.affected} stores</div></div>
        <HelpBox text="<strong>What it does:</strong> The automation has already handled everything it can. This is a human checkpoint for the remaining exceptions.<br><br><strong>Story:</strong> Auto-execute actions are done — their impact is already baked in. You review the ranked planner options, select the ones you want to apply, and see the KPI impact update in real time before confirming.<br><br><strong>How to use:</strong> Toggle actions on/off. The KPI panel on the right updates live. When satisfied with the projected outcome, submit to resume chain." />
        <div className={`apst${nbaSubmitted ? '' : ' pend'}`}>{nbaSubmitted ? '✓ Actions Confirmed' : '⏳ Awaiting Decision'}</div>
      </div>
      <div className="apbody">
        {noImpact
          ? <div className="abox ok"><div className="abox-i" style={{ fontSize: 12, fontWeight: 700, color: '#22C55E' }}>✓</div><div className="abox-t"><strong>No supply constraints for selected filter</strong></div></div>
          : <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>

            {/* LEFT COLUMN — main actions */}
            <div style={{ flex: 1, minWidth: 0 }}>
            {/* DC CONSTRAINT ACTIVE banner is rendered at the wrapping UI level — see ACTIVE AGENT CONTENT section */}
            {/* SUPPLY RISK BANNER */}
            {sc.agentData?.supplyRisk && (
              <div className="abox crit" style={{ marginBottom: 14 }}>
                <div className="abox-i" style={{ fontSize: 14 }}>!</div>
                <div className="abox-t">
                  <strong>Supply Constraint Risk: {sc.agentData.supplyRisk.label}</strong>
                  <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 3, lineHeight: 1.5 }}>{sc.agentData.supplyRisk.detail}</div>
                </div>
              </div>
            )}

            {/* COUNTERFACTUAL — BGS layout: revenue protected · SL · OOS · ROI */}
            <div className="imp-row">
              <div className="imp-box bad">
                <div className="imp-lbl">✕ No Action</div>
                <div className="imp-v">−${sc.loss.toLocaleString()}K</div>
                <div style={{ fontSize: 8, color: '#F87171', marginTop: 2 }}>revenue at risk</div>
                <div style={{ fontSize: 9, color: 'var(--muted)', marginTop: 6, lineHeight: 1.7 }}>
                  SL: ~{slBase}%<br />
                  OOS: {sc.skus} SKUs
                </div>
              </div>
              <div className="imp-arr">→</div>
              <div className="imp-box good">
                <div className="imp-lbl">✓ With Selected Actions</div>
                <div className="imp-v">+${Math.round(sc.loss * proj.projSL / 100).toLocaleString()}K</div>
                <div style={{ fontSize: 8, color: '#22C55E', marginTop: 2 }}>revenue protected · ROI {sc.roi}x</div>
                <div style={{ fontSize: 9, color: 'var(--muted)', marginTop: 6, lineHeight: 1.7 }}>
                  SL: {proj.projSL.toFixed(1)}%<br />
                  OOS: {Math.max(0, Math.round(sc.skus * (1 - proj.projSL / 100)))} SKUs
                </div>
              </div>
            </div>

            {/* AUTO-DONE ACTIONS */}
            <div style={{ fontWeight: 600, fontSize: 11, margin: '14px 0 8px', display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ background: 'rgba(34,197,94,0.1)', color: '#22C55E', padding: '2px 8px', borderRadius: 5, fontSize: 9, fontWeight: 700 }}>AUTOMATION COMPLETE</span>
              Actions already executed
            </div>
            {actions.filter(a => a.done).map(a => (
              <div key={a.id} style={{ background: 'rgba(34,197,94,0.05)', border: '1px solid rgba(34,197,94,0.2)', borderRadius: 'var(--radius-sm)', padding: '10px 14px', marginBottom: 8, display: 'flex', alignItems: 'flex-start', gap: 10 }}>
                <span style={{ fontSize: 10, fontWeight: 700, color: '#22C55E', flexShrink: 0, marginTop: 1 }}>Done</span>
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 3 }}>
                    <span style={{ fontSize: 11, fontWeight: 700 }}>#{a.rank} {a.title}</span>
                    <span style={{ fontSize: 8, color: '#22C55E', fontWeight: 700, background: 'rgba(34,197,94,0.1)', padding: '2px 7px', borderRadius: 4 }}>Auto-Executed</span>
                  </div>
                  <div style={{ fontSize: 10, color: 'var(--muted)', lineHeight: 1.4, marginBottom: 4 }}>{a.reason}</div>
                  <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
                    {[
                      { l: 'SL Impact', v: doneSLLabel(a), c: '#22C55E' },
                      { l: 'Cost', v: a.costImpact, c: a.kpiDelta?.cost < 0 ? '#22C55E' : '#FBBF24' },
                    ].map(m => (
                      <div key={m.l} style={{ fontSize: 9 }}><span style={{ color: 'var(--muted)' }}>{m.l}:</span> <span style={{ fontWeight: 700, color: m.c }}>{m.v}</span></div>
                    ))}
                  </div>
                </div>
              </div>
            ))}

            {/* PLANNER ACTIONS TO DECIDE */}
            {pendingActions.length > 0 && <>
              <div style={{ fontWeight: 600, fontSize: 11, margin: '14px 0 8px', display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ background: 'rgba(217,119,6,0.12)', color: '#D97706', padding: '2px 8px', borderRadius: 5, fontSize: 9, fontWeight: 700 }}>YOUR DECISION</span>
                Select your preferred approach — KPI panel updates live
              </div>
              {pendingActions.map(a => {
                if (a.options && a.options.length > 0) {
                  // Radio-style option group (A / B / C / Custom)
                  const selectedOpt = nbaState[a.id];
                  const customId = `${a.id}-custom`;
                  const customSelected = selectedOpt === customId;
                  // FEEDBACK #2: detect which custom panel to render based on action title
                  const isAllocationAction = /allocation|allocate|store/i.test(a.title);
                  const isSubstitutionAction = /substitut/i.test(a.title);
                  const customAvailable = isAllocationAction || isSubstitutionAction;
                  return (
                    <div key={a.id} style={{ background: 'var(--bg2)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', overflow: 'hidden', marginBottom: 12 }}>
                      <div style={{ padding: '10px 14px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <div>
                          <span style={{ fontSize: 11, fontWeight: 700 }}>#{a.rank} {a.title}</span>
                          <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 2 }}>{a.reason}</div>
                        </div>
                        <span style={{ fontSize: 8, fontWeight: 700, background: 'rgba(245,158,11,0.12)', color: '#FBBF24', padding: '2px 8px', borderRadius: 4, flexShrink: 0 }}>Choose one</span>
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: customAvailable ? 'repeat(4,1fr)' : 'repeat(3,1fr)', gap: 0 }}>
                        {a.options.map((opt, oi) => {
                          const isChosen = selectedOpt === opt.id;
                          return (
                            <div key={opt.id} onClick={() => !nbaSubmitted && setNbaState(s => ({ ...s, [a.id]: opt.id }))}
                              style={{ padding: '12px 14px', borderRight: oi < a.options.length - 1 || customAvailable ? '1px solid var(--border)' : 'none', cursor: nbaSubmitted ? 'default' : 'pointer', background: isChosen ? 'rgba(0,159,224,0.08)' : 'transparent', borderBottom: isChosen ? `2px solid var(--brand-light)` : '2px solid transparent', transition: 'all .2s' }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
                                <div style={{ width: 16, height: 16, borderRadius: '50%', border: `2px solid ${isChosen ? 'var(--brand-light)' : 'var(--muted)'}`, background: isChosen ? 'var(--brand-light)' : 'transparent', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 8, color: '#fff', transition: 'all .2s' }}>{isChosen ? '●' : ''}</div>
                                <span style={{ fontSize: 10, fontWeight: 700, color: isChosen ? 'var(--brand-light)' : 'var(--text)' }}>{opt.label}: {opt.title}</span>
                              </div>
                              <div style={{ fontSize: 9, color: 'var(--muted)', lineHeight: 1.4, marginBottom: 8 }}>{opt.detail}</div>
                              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 4 }}>
                                {[
                                  { l: 'SL', v: (opt.kpiDelta && opt.kpiDelta.sl) ? `+${opt.kpiDelta.sl}pp → ${Math.min(98.5, autoOnlySL + opt.kpiDelta.sl).toFixed(0)}%` : 'No change', c: '#22C55E' },
                                  { l: 'Cost', v: opt.costImpact, c: opt.kpiDelta?.cost < 0 ? '#22C55E' : opt.kpiDelta?.cost === 0 ? 'var(--muted)' : '#FBBF24' },
                                ].map(m => (
                                  <div key={m.l} style={{ background: 'var(--card)', borderRadius: 4, padding: '4px 6px', border: '1px solid var(--border)' }}>
                                    <div style={{ fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.3px' }}>{m.l}</div>
                                    <div style={{ fontSize: 9, fontWeight: 700, color: m.c }}>{m.v}</div>
                                  </div>
                                ))}
                              </div>
                            </div>
                          );
                        })}
                        {/* FEEDBACK #2: 4th option — Custom (manual planner override).
                            Pill is absolute-positioned in the top-right corner; title row reserves
                            paddingRight so the title text physically can't reach the pill. The body
                            (detail + KPI grid) uses the full card width below it. */}
                        {customAvailable && (
                          <div onClick={() => !nbaSubmitted && setNbaState(s => ({ ...s, [a.id]: customId }))}
                            style={{
                              padding: '12px 14px',
                              cursor: nbaSubmitted ? 'default' : 'pointer',
                              background: customSelected ? 'rgba(139,92,246,0.10)' : 'rgba(139,92,246,0.03)',
                              borderBottom: customSelected ? `2px solid var(--purple)` : '2px solid transparent',
                              borderLeft: '1px dashed rgba(139,92,246,0.4)',
                              transition: 'all .2s',
                              position: 'relative',
                            }}>
                            {/* Anchored badge — sits in the corner, doesn't participate in flex flow */}
                            <span
                              className="custom-tag"
                              style={{
                                position: 'absolute',
                                top: 8,
                                right: 8,
                                fontSize: 7,
                                padding: '2px 6px',
                                lineHeight: 1.2,
                                pointerEvents: 'none',
                              }}
                            >Custom</span>

                            {/* Title row — reserves paddingRight equal to pill width so title can never overlap it */}
                            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4, paddingRight: 56 }}>
                              <div style={{ width: 16, height: 16, borderRadius: '50%', border: `2px solid ${customSelected ? 'var(--purple)' : 'var(--muted)'}`, background: customSelected ? 'var(--purple)' : 'transparent', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 8, color: '#fff', transition: 'all .2s' }}>{customSelected ? '●' : ''}</div>
                              <span style={{ fontSize: 10, fontWeight: 700, color: customSelected ? 'var(--purple-l)' : 'var(--text)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                                Option D: Custom {isAllocationAction ? 'allocation' : 'substitution'}
                              </span>
                            </div>

                            {/* Detail + KPI grid use the full card width below the title — pill is well above */}
                            <div style={{ fontSize: 9, color: 'var(--muted)', lineHeight: 1.4, marginBottom: 8 }}>
                              {isAllocationAction
                                ? 'Manually edit per-store quantities. Useful when none of A/B/C fits — e.g., must protect specific stores or honour a customer commitment.'
                                : 'Manually define substitution mix per substitute SKU. Useful when your allocation strategy demands a specific category-share split.'}
                            </div>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 4 }}>
                              {[
                                { l: 'SL', v: 'Depends on plan', c: 'var(--purple-l)' },
                                { l: 'Cost', v: 'Redistribution only', c: 'var(--muted)' },
                                { l: 'Risk', v: 'Planner-owned', c: 'var(--orange-l)' },
                              ].map(m => (
                                <div key={m.l} style={{ background: 'var(--card)', borderRadius: 4, padding: '4px 6px', border: '1px solid var(--border)' }}>
                                  <div style={{ fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.3px' }}>{m.l}</div>
                                  <div style={{ fontSize: 9, fontWeight: 700, color: m.c }}>{m.v}</div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                      {/* FEEDBACK #2: Render the editable Custom panel directly under the option group when Custom is selected */}
                      {customAvailable && customSelected && isAllocationAction && (
                        <div style={{ padding: '0 14px 14px' }}>
                          <CustomAllocationPanel sc={sc} action={a} isSelected={true} customAllocs={customAllocs} setCustomAllocs={setCustomAllocs} disabled={nbaSubmitted} />
                        </div>
                      )}
                      {customAvailable && customSelected && isSubstitutionAction && (
                        <div style={{ padding: '0 14px 14px' }}>
                          <CustomSubstitutionPanel sc={sc} action={a} isSelected={true} customAllocs={customAllocs} setCustomAllocs={setCustomAllocs} disabled={nbaSubmitted} />
                        </div>
                      )}
                    </div>
                  );
                }
                // Fallback: simple toggle (no options array)
                const isSelected = !!nbaState[a.id];
                return (
                  <div key={a.id} onClick={() => toggleAction(a.id)} style={{ background: isSelected ? 'rgba(0,159,224,0.06)' : 'var(--bg2)', border: `1px solid ${isSelected ? 'var(--brand-light)' : 'var(--border)'}`, borderRadius: 'var(--radius-sm)', padding: '10px 14px', marginBottom: 8, cursor: nbaSubmitted ? 'default' : 'pointer', transition: 'all .2s', display: 'flex', alignItems: 'flex-start', gap: 10 }}>
                    <div style={{ width: 18, height: 18, borderRadius: 4, border: `2px solid ${isSelected ? 'var(--brand-light)' : 'var(--muted)'}`, background: isSelected ? 'var(--brand-light)' : 'transparent', flexShrink: 0, marginTop: 2, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, color: '#fff', transition: 'all .2s' }}>{isSelected ? '✓' : ''}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 3 }}>
                        <span style={{ fontSize: 11, fontWeight: 700 }}>#{a.rank} {a.title}</span>
                        <span style={{ fontSize: 8, fontWeight: 700, background: 'rgba(245,158,11,0.12)', color: '#FBBF24', padding: '2px 7px', borderRadius: 4 }}>Planner Review</span>
                      </div>
                      <div style={{ fontSize: 10, color: 'var(--muted)', lineHeight: 1.4, marginBottom: 6 }}>{a.reason}</div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(120px,1fr))', gap: 6 }}>
                        {[{ l: 'SL Impact', v: toggleSLLabel(a), c: '#22C55E' },{ l: 'Cost', v: a.costImpact, c: a.kpiDelta?.cost < 0 ? '#22C55E' : '#FBBF24' }].map(m => (
                          <div key={m.l} style={{ background: 'var(--card)', borderRadius: 5, padding: '5px 8px', border: '1px solid var(--border)' }}>
                            <div style={{ fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.4px', marginBottom: 2 }}>{m.l}</div>
                            <div style={{ fontSize: 10, fontWeight: 700, color: m.c }}>{m.v}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                );
              })}
            </>}

            {/* DC CONSTRAINT DECISION — blocking if present */}
            {dc?.affected && dc.shortfallCases > 0 && (
              <div style={{ background: 'rgba(239,68,68,0.05)', border: '1px solid rgba(239,68,68,0.3)', borderRadius: 'var(--radius-sm)', padding: '12px 14px', marginBottom: 14 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                  <span style={{ fontSize: 11, fontWeight: 700, color: '#F87171' }}>⚠ DC Allocation Decision Required</span>
                  {!dcAllocChoice && <span style={{ fontSize: 9, fontWeight: 700, color: '#F87171', background: 'rgba(239,68,68,0.1)', padding: '2px 8px', borderRadius: 5 }}>Blocking submission</span>}
                  {dcAllocChoice  && <span style={{ fontSize: 9, fontWeight: 700, color: '#22C55E', background: 'rgba(34,197,94,0.1)', padding: '2px 8px', borderRadius: 5 }}>✓ Decision made</span>}
                </div>
                <div style={{ fontSize: 10, color: 'var(--muted)', lineHeight: 1.6, marginBottom: 10 }}>
                  {dc.constrainedSku} shortfall: <strong style={{ color: '#F87171' }}>{dc.shortfallCases} units</strong> across {dc.shortfallStores || sc.affected} stores.
                  {dc.transferOption && ` Transfer from ${dc.transferOption.from}: ${dc.transferOption.cases} units, ${dc.transferOption.transitHrs}hr transit, +$${dc.transferOption.costK}K.`}
                  {dc.archetype === 'transfer_window' && ` Window closes ${dc.transferOption?.cutoffHr} tonight.`}
                </div>
                {[
                  { id: 'full',         label: `Option A — Approve Transfer from ${dc.transferOption?.from || 'Secondary DC'}`, desc: `${(dc.transferOption?.cases||0).toLocaleString()} units transfer closes most of the inventory gap. +$${dc.transferOption?.costK||0}K logistics. Highest SL outcome.`, sl: '+4pp SL', risk: 'LOW',    color: '#22C55E' },
                  { id: 'top10',        label: 'Option B — Priority Allocate Top Stores',         desc: `Concentrate available ${(dc.atpAvailable||0).toLocaleString()} units in highest-revenue stores. ${dc.shortfallStores||28} stores at reduced allocation.`, sl: '+2pp SL', risk: 'MEDIUM', color: '#FBBF24' },
                  { id: 'proportional', label: 'Option C — Proportional Allocation',              desc: `Distribute ${(dc.atpAvailable||0).toLocaleString()} units equally across all ${sc.affected} stores. Operationally simplest.`,              sl: '+0pp SL', risk: 'MEDIUM', color: '#FBBF24' },
                  { id: 'accept',       label: 'Option D — Accept Constraint, No Transfer',       desc: `No logistics. ${dc.shortfallStores||28} stores receive zero ${dc.constrainedSku}. OOS for event window.`,                             sl: '−3pp SL', risk: 'HIGH',   color: '#F87171' },
                ].map(opt => (
                  <div key={opt.id} className={`dc-alloc-option${dcAllocChoice === opt.id ? ' selected' : ''}`} onClick={() => !nbaSubmitted && setDcAllocChoice(opt.id)}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                      <span style={{ fontSize: 10, fontWeight: 700 }}>{opt.label}</span>
                      <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                        <span style={{ fontSize: 8, fontWeight: 700, padding: '2px 6px', borderRadius: 4, background: opt.risk === 'LOW' ? 'rgba(34,197,94,0.1)' : opt.risk === 'HIGH' ? 'rgba(239,68,68,0.1)' : 'rgba(245,158,11,0.1)', color: opt.color }}>{opt.risk} risk</span>
                        {dcAllocChoice === opt.id && <span style={{ fontSize: 8, fontWeight: 700, color: '#22C55E' }}>✓ Selected</span>}
                      </div>
                    </div>
                    <div style={{ fontSize: 9, color: 'var(--muted)', lineHeight: 1.4, marginBottom: 4 }}>{opt.desc}</div>
                    <span style={{ color: opt.color, fontWeight: 600, fontSize: 9 }}>{opt.sl}</span>
                  </div>
                ))}
                {dcKpiNote && <div style={{ marginTop: 8, fontSize: 9, fontWeight: 600, color: dcKpiNote.color }}>→ {dcKpiNote.text}</div>}
              </div>
            )}

            {/* LIVE KPI SUMMARY */}
            <div style={{ background: 'rgba(0,159,224,0.04)', border: '1px solid rgba(0,159,224,0.15)', borderRadius: 'var(--radius-sm)', padding: '12px 14px', margin: '14px 0' }}>
              <div style={{ fontSize: 9, fontWeight: 700, color: 'var(--brand-light)', textTransform: 'uppercase', letterSpacing: '.5px', marginBottom: 8 }}>Projected Outcome — Updates Live</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(130px,1fr))', gap: 8 }}>
                {[
                  { l: 'Allocation Accuracy', v: `${proj.projSL.toFixed(1)}%`, sub: `from ${slBase}%`,         c: '#22C55E' },
                  { l: 'Net Cost',      v: `${proj.dCost >= 0 ? '+' : ''}$${proj.dCost}K`, sub: 'logistics + product', c: proj.dCost > 0 ? '#FBBF24' : '#22C55E' },
                  { l: 'Revenue Protected', v: `$${Math.round((sc.loss || 0) * proj.projSL / 100)}K`, sub: `at ${proj.projSL.toFixed(1)}% SL · of $${sc.loss}K at risk`, c: 'var(--brand-light)' },
                  { l: 'ROI',           v: `${sc.roi}x`,   sub: 'on action cost',          c: 'var(--brand-light)' },
                ].map(m => (
                  <div key={m.l} style={{ background: 'var(--card)', borderRadius: 6, padding: '8px 10px', border: '1px solid var(--border)' }}>
                    <div style={{ fontSize: 8, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.4px', marginBottom: 2 }}>{m.l}</div>
                    <div style={{ fontSize: 16, fontWeight: 700, color: m.c }}>{m.v}</div>
                    <div style={{ fontSize: 8, color: 'var(--muted)', marginTop: 1 }}>{m.sub}</div>
                  </div>
                ))}
              </div>
            </div>

            <div className="submit-bar">
              <div className="sb-info"><strong>{selected.length} actions</strong> selected ({actions.filter(a=>a.done).length} auto-done, {selected.filter(a=>!a.done).length} planner-selected){customInvalid ? ' · ⚠ custom plan exceeds supply' : ''}</div>
              <button className={`sb-btn ${nbaSubmitted ? 'sb-submitted' : 'sb-submit'}`} disabled={nbaSubmitted || dcDecisionNeeded || customInvalid} onClick={submitNba}>
                {nbaSubmitted ? '✓ Actions Confirmed — Resuming' : dcDecisionNeeded ? 'DC Decision required above ↑' : customInvalid ? 'Fix custom plan ↑' : 'Confirm Actions & Resume Chain →'}
              </button>
            </div>

                ].map(m => (

}

function AgPanel9({ sc, filter, escState, setEscState, escSubmitted, setEscSubmitted, nbaState, fcstState }) {
  const items = sc.escItems;
  const dec = Object.keys(escState).length;
  // orderEdits: { itemIdx: { aggregate: number, stores: { storeIdx: number } } }
  const [orderEdits, setOrderEdits] = useState({});
  const [expandedStore, setExpandedStore] = useState(null);

  function approve(i) { setEscState(s => ({ ...s, [i]: 'approved' })); }
  function reject(i) { setEscState(s => ({ ...s, [i]: 'rejected' })); }
  function approveAll() { const ns = {}; items.forEach((_, i) => { ns[i] = 'approved'; }); setEscState(ns); }
  function submit() { setEscSubmitted(true); }

  // ── Orders flow from the APPROVED FORECAST (Forecast Approval → NBA → Adjudication) ──
  // Match each escalated line to its forecast product by name, then use the value the
  // planner approved upstream (fcstState), falling back to the AI value. The store's
  // order quantity = that approved per-store forecast. If a line has no matching forecast
  // product (e.g. a substitute SKU), fall back to the authored chg% heuristic.
  function matchFcst(e) {
    const idx = (sc.fcst || []).findIndex(p => p.name === e.prod);
    return idx >= 0 ? { p: sc.fcst[idx], idx } : null;
  }
  function approvedValOf(e) {
    const m = matchFcst(e);
    if (!m) return null;
    const st = fcstState && fcstState[m.idx];
    return st ? st.value : m.p.ai;
  }
  function getBaseQty(e) {
    const v = approvedValOf(e);
    const m = matchFcst(e);
    const skuStores = m ? (m.p.storeCount || sc.affected) : sc.affected;
    if (v != null) return v * skuStores;           // total units across location stores
    const chgPct = parseFloat(e.chg.replace('%','').replace('+','')) / 100;
    return Math.round(sc.affected * 0.5 * chgPct); // fallback for non-forecast SKUs
  }
  // Change vs plan, derived from the forecast (old → approved). Falls back to authored chg.
  function getChgLabel(e) {
    const m = matchFcst(e);
    if (m && m.p.old) {
      const v = approvedValOf(e);
      const pct = Math.round(((v - m.p.old) / m.p.old) * 100);
      return `${pct >= 0 ? '+' : ''}${pct}%`;
    }
    return e.chg;
  }

  // ±25% bounds
  function getBounds(baseQty) {
    return { lb: Math.max(1, Math.round(baseQty * 0.75)), ub: Math.round(baseQty * 1.25) };
  }

  // Build store breakdown with deterministic seed (no Math.random on render)
  function getStoreBreakdown(e, itemIdx) {
    const storeList = Object.entries(sc.locStores || {});
    if (storeList.length === 0) return [];
    const totalBase = getBaseQty(e); // total units across all location stores
    const m = matchFcst(e);
    const skuStores = m ? (m.p.storeCount || sc.affected) : sc.affected;
    const totalStoreCount = storeList.reduce((s, [,c]) => s + Math.min(c, 3), 0);
    let stores = [];
    let globalSi = 0;
    storeList.forEach(([loc, count]) => {
      const storeCount = Math.min(count, 3);
      // Distribute total units proportionally — per store = total / skuStores
      const perStoreBase = Math.round(totalBase / skuStores);
      for (let si = 0; si < storeCount; si++) {
        const storeQty = Math.max(1, Math.round(perStoreBase * (1 + (si === 0 ? 0.1 : si === 1 ? 0 : -0.1))));
        const currentEdit = orderEdits[itemIdx]?.stores?.[globalSi];
        const displayQty = currentEdit !== undefined ? currentEdit : storeQty;
        const storeNum = 1000 + (itemIdx * 100 + globalSi * 17 + loc.charCodeAt(0)) % 8000;
        stores.push({ store: `Store #${storeNum}`, loc, defaultQty: storeQty, qty: displayQty, pri: si === 0 && (count / sc.affected) > 0.3 ? 'High' : 'Normal', storeIdx: globalSi });
        globalSi++;
      }
    });
    return { stores, totalStoreCount };
  }

  // Edit aggregate → redistribute proportionally to stores
  function editAggregate(i, newVal) {
    const base = getBaseQty(items[i]);
    const { stores } = getStoreBreakdown(items[i], i);
    const totalDefault = stores.reduce((s, st) => s + st.defaultQty, 0) || 1;
    const newStores = {};
    stores.forEach(st => {
      newStores[st.storeIdx] = Math.max(1, Math.round((st.defaultQty / totalDefault) * newVal));
    });
    setOrderEdits(s => ({ ...s, [i]: { aggregate: newVal, stores: newStores } }));
  }

  // Edit individual store → update aggregate as sum
  function editStoreQty(itemIdx, storeIdx, newVal) {
    setOrderEdits(s => {
      const prev = s[itemIdx] || {};
      const base = getBaseQty(items[itemIdx]);
      const { stores } = getStoreBreakdown(items[itemIdx], itemIdx);
      const prevStores = prev.stores || {};
      const newStores = { ...prevStores, [storeIdx]: newVal };
      const newAggregate = stores.reduce((sum, st) => sum + (newStores[st.storeIdx] !== undefined ? newStores[st.storeIdx] : st.defaultQty), 0);
      return { ...s, [itemIdx]: { aggregate: newAggregate, stores: newStores } };
    });
  }

  const autoN = parseInt(sc.autoN.replace(/,/g,''));
  const autoR = sc.autoR;
  const hasOob = items.some((e, i) => {
    const base = getBaseQty(e);
    const { lb, ub } = getBounds(base);
    const val = orderEdits[i]?.aggregate !== undefined ? orderEdits[i].aggregate : base;
    return val < lb || val > ub;
  });

  return (
    <div className="apanel">
      <div className="aph">
        <div className="apb2" style={{ background: '#00529F' }}>09</div>
        <div><h3>Adjudication & Performance Outcomes</h3><div className="aps">Collective chain consequences · Final gatekeeper before allocation release</div></div>
        <HelpBox text="<strong>What it does:</strong> Surfaces all SKU-level outcomes that breached threshold after the full chain ran — whether from autonomous actions or planner decisions. Both paths land here. Planner reviews the consequence list and confirms or overrides before allocation release. Performance outcomes update after submission.<br><br><strong>Order range:</strong> Each order has an allowed ±25% band around the AI-derived quantity. Values outside this range block approval — consistent with forecast approval bounds logic.<br><br><strong>Store breakdown:</strong> Editing the aggregate redistributes quantities to stores proportionally. Editing individual stores updates the aggregate as the sum. The aggregate is what gets submitted to DC.<br><br><strong>LPI Update:</strong> Allocation Fill Rate, Allocation Accuracy, Markdown Rate, Inventory Turns all recalculate on finalization." />
        <div className={`apst${escSubmitted ? '' : ' pend'}`}>{escSubmitted ? '✓ Done' : '⏳ Review'}</div>
      </div>
      <div className="apbody">
        {(() => {
          const actions = sc.agentData?.nbaActions || [];
          const summaryParts = [];
          actions.forEach(a => {
            if (a.done) { summaryParts.push(`${a.title} (auto-executed)`); }
            else if (a.options) { const chosenId = nbaState?.[a.id]; const chosen = chosenId && a.options.find(o => o.id === chosenId); if (chosen) summaryParts.push(`${a.title}: ${chosen.label} — ${chosen.title}`); }
            else if (nbaState?.[a.id]) { summaryParts.push(a.title); }
          });
          return summaryParts.length > 0 ? (
            <div style={{ background: 'rgba(0,82,159,0.08)', border: '1px solid rgba(0,82,159,0.25)', borderRadius: 'var(--radius-sm)', padding: '12px 16px', marginBottom: 14 }}>
              <div style={{ fontSize: 9, fontWeight: 700, color: 'var(--brand-light)', textTransform: 'uppercase', letterSpacing: '.5px', marginBottom: 6 }}>Strategy Confirmed in Next Best Action</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                {summaryParts.map((s, i) => (<div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 6, fontSize: 10 }}><span style={{ color: '#22C55E', fontWeight: 700, flexShrink: 0 }}>✓</span><span style={{ color: 'var(--text)' }}>{s}</span></div>))}
              </div>
              <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 8, paddingTop: 8, borderTop: '1px solid var(--border)' }}>The orders below are the exceptions that resulted from executing this strategy — those that exceeded the 25% volume escalation threshold. You are ratifying the output, not re-deciding the strategy.</div>
            </div>
          ) : null;
        })()}
        <div className="adj-r">
          <div className="adj-c a-au"><div className="an3">{autoN.toLocaleString()}</div><div className="al3">Auto-Approved</div></div>
          <div className="adj-c a-rv2"><div className="an3">{items.length}</div><div className="al3">Escalated (review)</div></div>
          <div className="adj-c a-rt"><div className="an3">{autoR}%</div><div className="al3">Autonomous Rate</div></div>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', margin: '8px 0' }}>
          <div style={{ fontWeight: 600, fontSize: 12 }}>Threshold Breaches — {items.length} items requiring review</div>
          <button className="fcst-btn approve" style={{ padding: '4px 12px', fontSize: 9 }} onClick={approveAll} disabled={escSubmitted || hasOob}>Approve All</button>
        </div>
        {items.map((e, i) => {
          const st = escState[i];
          const base = getBaseQty(e);
          const { lb, ub } = getBounds(base);
          const currentAgg = orderEdits[i]?.aggregate !== undefined ? orderEdits[i].aggregate : base;
          const isOob = currentAgg < lb || currentAgg > ub;
          const storeExpanded = expandedStore === `${i}`;
          const { stores: breakdown } = storeExpanded ? getStoreBreakdown(e, i) : { stores: [] };
          const isEdited = orderEdits[i] !== undefined;

          return (
            <div key={i} style={{ background: 'var(--bg2)', border: `1px solid ${isOob ? 'rgba(239,68,68,0.35)' : st === 'approved' ? 'rgba(34,197,94,0.25)' : st === 'rejected' ? 'rgba(239,68,68,0.2)' : 'var(--border)'}`, borderRadius: 'var(--radius-sm)', marginBottom: 8, overflow: 'hidden' }}>
              <div className="esc-card" style={{ marginBottom: 0, background: 'transparent', border: 'none', borderRadius: 0 }}>
                <div style={{ fontSize: 13, width: 20, textAlign: 'center', color: e.pri === 'Critical' ? '#F87171' : '#FBBF24' }}>{i+1}</div>
                <div className="esc-info">
                  <div className="esc-store">{e.prod}</div>
                  <div className="esc-detail">Threshold breach · {Object.entries(sc.locStores||{}).find(([k])=>k.includes(e.loc.split(',')[1]?.trim()||e.loc))?.[1]||(sc.locStores ? Object.values(sc.locStores).reduce((a,b)=>a+b,0) : sc.affected)} stores affected</div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: 3, alignItems: 'center', minWidth: 110 }}>

                  <div style={{ position: 'relative' }}>
                    <input
                      type="number" min={lb} max={ub}

                      disabled={escSubmitted}
                      onChange={e2 => { const v = parseInt(e2.target.value); if (!isNaN(v) && v >= 0) editAggregate(i, v); }}
                      style={{ width: 88, background: 'var(--bg)', border: `1px solid ${isOob ? '#F87171' : isEdited ? '#818CF8' : 'var(--border)'}`, borderRadius: 5, padding: '4px 6px', color: isOob ? '#F87171' : 'var(--text)', fontFamily: 'inherit', fontSize: 11, fontWeight: 600, textAlign: 'center', outline: 'none' }}
                    />

                      return (
                        <div key={s2.storeIdx} style={{ background: 'var(--card)', borderRadius: 6, padding: '8px 10px', border: `1px solid ${storeOob ? 'rgba(239,68,68,0.3)' : 'var(--border)'}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

                              style={{ width: 64, background: 'var(--bg)', border: `1px solid ${storeOob ? '#F87171' : 'var(--border)'}`, borderRadius: 4, padding: '3px 5px', color: storeOob ? '#F87171' : 'var(--text)', fontFamily: 'inherit', fontSize: 10, fontWeight: 700, textAlign: 'center', outline: 'none' }} />
                            <div style={{ fontSize: 7, color: 'var(--muted)', marginTop: 1 }}>[{storeLb}–{storeUb}]</div>

            };
            const lpiCards = [
              { icon: null, label: 'Alloc. Fill Rate', key: 'fillRate' },
              { icon: null, label: 'Allocation Accuracy', key: 'serviceLevel' },
              { icon: null, label: 'Markdown Rate', key: 'wasteRate' },
              { icon: null, label: 'Inv. Turns', key: 'invTurns' },
              { icon: null, label: 'Weeks of Supply', key: 'safetyStock' },
              { icon: null, label: 'Size Availability', key: 'orderAccuracy' },

            return lpiCards.map((l, i) => {
              const d = lpi[l.key] || {};

              return (
                <div key={i} className={`lpi-card${escSubmitted ? ' updated' : ''}`}>

                    {escSubmitted ? `${isWaste ? '↓' : '↑'} from ${d.prev || '—'}` : 'Awaiting finalization'}
                  </div>
                </div>
              );
            });
          })()}
        </div>
      </div>
    </div>
  );
}

// Aggregate across stores = forecast value (units per store) × number of stores. Plain multiplication.
const SL_BASE_MAP = { w1:74, w2:72, p1:72, p2:73, e1:74, e2:68, e3:70 };

function computeScenarioNums(sc, fcstState) {
  const _fs = fcstState || {};
  const prods = sc.fcst || [];
  const stores = sc.affected;
  const rows = prods.map((p, i) => {
    const st = _fs[i];
    const approvedVal = st ? st.value : p.ai;
    const oldCs = p.old;
    const newCs = approvedVal;
    const dailyVel = Math.max(1, approvedVal);
    const currentIOH = Math.round(dailyVel * 5);
    const inTransit  = Math.round(dailyVel * 2);
    const ssTarget   = Math.round(dailyVel * 3.5);
    const netAvail   = currentIOH + inTransit;
    const doh        = (netAvail / Math.max(1, dailyVel)).toFixed(1);
    return { ...p, approvedVal, oldCs, newCs, deltaCs: newCs - oldCs, currentIOH, inTransit, ssTarget, netAvail, doh, wasEdited: !!(st && !st.approved) };
  });
  const totalOldCases = rows.reduce((s, r) => s + r.oldCs * stores, 0);
  const totalNewCases = rows.reduce((s, r) => s + r.newCs * stores, 0);
  const incrCases = totalNewCases - totalOldCases;
  const slBase  = SL_BASE_MAP[sc.id] || 76;
  const autoSL  = (sc.agentData?.nbaActions || []).filter(a => a.done).reduce((s, a) => s + (a.kpiDelta?.sl || 0), 0);
  const slAfter = Math.min(98.5, slBase + autoSL + 12);
  return { rows, totalOldCases, totalNewCases, incrCases, slBase, slAfter, stores };
}

function computeImplications(sc, fcstState, allProds) {
  const HOLDING_COST = 0.18;
  const REVENUE_PER_CASE = 14.4;
  const MARGIN = 0.28;
  let totalNewCases = 0, totalOldCases = 0, totalDOH = 0;
  let surgeCount = 0, suppressCount = 0;
  (allProds || sc.fcst || []).forEach((p, i) => {
    const st = fcstState?.[i];
    const approvedVal = st ? st.value : p.ai;
    const oldCs = p.old;
    const newCs = approvedVal;
    totalOldCases += oldCs * sc.affected;
    totalNewCases += newCs * sc.affected;
    totalDOH += 3.5 + 2; // safetyDays + leadDays
    if (approvedVal > p.old) surgeCount++;
    if (approvedVal < p.old) suppressCount++;
  });
  const prods = allProds || sc.fcst || [];
  const avgDOH = (totalDOH / Math.max(1, prods.length)).toFixed(1);
  const incrCases = totalNewCases - totalOldCases;
  const incrRevenue   = Math.round(incrCases * REVENUE_PER_CASE * MARGIN / 1000);
  const wcImpact      = Math.round(totalNewCases * HOLDING_COST / 1000);
  const postEventPos  = Math.max(0, Math.round(totalNewCases * 0.08));
  const dc = sc.dcConstraint;
  const constraintCoverage  = dc?.affected ? dc.coveragePct : 100;
  const constraintShortfall = dc?.affected ? dc.shortfallCases : 0;
  const constrainedCount    = dc?.affected ? 1 : 0;
  const slBase = SL_BASE_MAP[sc.id] || 76;
  // ── Reconciled with the Command Centre (computeResolutionModel) ──
  // Forecast Approval SL must live inside the SAME range the Command Centre projects:
  // base → best-case (base + autonomous + best human option). It cannot exceed the
  // best-case ceiling. It scales with how much of the AI-recommended uplift the planner
  // keeps (coverage): full AI forecast → best-case ceiling; cut it back → toward base.
  const _rm = computeResolutionModel(sc);
  const _ceilingSL = _rm ? _rm.bestSL : (slBase + 20);
  const _aiIncrCases = (allProds || sc.fcst || []).reduce((s, p) =>
    s + (p.ai - p.old) * sc.affected, 0);
  const coverage = _aiIncrCases > 0 ? Math.max(0, Math.min(1, incrCases / _aiIncrCases)) : 1;
  const constraintPenalty = dc?.affected ? (1 - constraintCoverage / 100) * 8 : 0;
  const projSL   = Math.max(slBase, Math.min(_ceilingSL, slBase + (_ceilingSL - slBase) * coverage - constraintPenalty));
  const projFill = Math.min(98.8, projSL + 1.4 - constraintPenalty * 0.4);
  const wasteBase  = sc.trigType === 'weather' ? 2.8 : 1.8;
  const projWaste  = Math.max(0.4, wasteBase - suppressCount * 0.3 - (constraintCoverage < 100 ? 0.4 : 0)).toFixed(1) + '%';
  const projTurns  = (14.2 + (incrCases / Math.max(1, totalOldCases)) * 2).toFixed(1) + 'x';
  return {
    totalNewCases, totalOldCases, incrCases, avgDOH,
    incrRevenue, wcImpact, postEventPos,
    projSL: projSL.toFixed(1) + '%', projFill: projFill.toFixed(1) + '%', projWaste, projTurns,
    surgeCount, suppressCount, constrainedCount, constraintCoverage, constraintShortfall, slBase,
  };
}

function computeNbaProjection(sc, fcstState, nbaState, dcAllocChoice) {
  const base = computeScenarioNums(sc, fcstState);
  const actions = sc.agentData?.nbaActions || [];
  let dSL = 0, dFill = 0, dCost = 0, dWaste = 0;
  actions.forEach(a => {
    const kd = a.done ? a.kpiDelta
      : (a.options && nbaState?.[a.id]) ? (a.options.find(o => o.id === nbaState[a.id])?.kpiDelta)
      : (!a.options && nbaState?.[a.id]) ? a.kpiDelta : null;
    if (kd) { dSL += kd.sl || 0; dFill += kd.fill || 0; dCost += kd.cost || 0; dWaste += kd.waste || 0; }
  });
  const dc = sc.dcConstraint;
  if (dc?.affected && dcAllocChoice) {
    if (dcAllocChoice === 'full')         { dSL += 4; dCost += dc.transferOption?.costK || 12; }
    else if (dcAllocChoice === 'top10')     dSL += 2;
    else if (dcAllocChoice === 'accept')    dSL -= 3;
  }
  const projSL   = Math.min(98.5, base.slBase + Math.min(22, dSL));
  const projFill = Math.min(98.8, projSL + 1.4);
  return { ...base, dSL, dFill, dCost, dWaste, projSL, projFill };
}
