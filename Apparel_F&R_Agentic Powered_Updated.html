<body>
  <div id="root"></div>
  <script>
    // Diagnostic safety net: turn any pre-render failure (blocked/failed CDN, transpile
    // or top-level error) into readable on-screen text instead of a blank white page.
    (function () {
      function showErr(title, detail) {
        var r = document.getElementById('root');
        if (r && r.childElementCount > 0) return;
        if (!r) return;
        r.innerHTML =
          '<div style="padding:40px;font-family:monospace;color:#F87171;background:#0A0F1E;min-height:100vh">' +
          '<div style="font-size:20px;font-weight:700;margin-bottom:12px">⚠ ' + title + '</div>' +
          '<pre style="font-size:12px;color:#7B9BBF;white-space:pre-wrap">' + (detail || '') + '</pre>' +
          '<div style="font-size:11px;color:#5a7799;margin-top:16px">Open the browser console (F12) for the full stack.</div>' +
          '</div>';
      }
      window.addEventListener('error', function (e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          showErr('Failed to load a required script', 'Could not load: ' + (e.target.src || e.target.href) + '\n\nUsually a network/offline or blocked-CDN issue.');
        } else {
          showErr('Script error', (e && e.message ? e.message : 'Unknown error') + (e && e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        showErr('Unhandled promise rejection', (e && e.reason && e.reason.message) ? e.reason.message : String(e && e.reason));
      });
      window.addEventListener('load', function () {
        setTimeout(function () {
          var r = document.getElementById('root');
          if (r && r.childElementCount === 0) showErr('App did not render', 'No content mounted. Check the console for a Babel/syntax message, or whether a CDN script failed to load.');
        }, 4000);
      });
    })();
  </script>

  <script type="text/babel" data-presets="env,react">
/* @jsxRuntime classic */
const { useState, useEffect, useRef, useMemo } = React;

/* ─────────────────────────────────────────────
   DESIGN TOKENS — match original exactly
───────────────────────────────────────────── */
const CSS = `
*{margin:0;padding:0;box-sizing:border-box;}

/* ═══════════════════════════════════════════════════════════════
   ENTERPRISE DESIGN SYSTEM v2.0
   Tokens → Primitives → Components
═══════════════════════════════════════════════════════════════ */
:root{
  /* — BRAND — */
  --brand-dark:#0A4FA8;--brand-light:#1AA8E8;--blue:#1AA8E8;--blue-l:#5BCAEF;
  --navy:#0A4FA8;
  /* — SEMANTIC — */
  --red:#EF4444;--red-l:#F87171;--red-bg:rgba(239,68,68,0.08);
  --orange:#F59E0B;--orange-l:#FBBF24;--orange-bg:rgba(245,158,11,0.08);
  --green:#10B981;--green-l:#34D399;--green-bg:rgba(16,185,129,0.08);
  --purple:#8B5CF6;--purple-l:#A78BFA;--purple-bg:rgba(139,92,246,0.08);
  /* — SURFACE — refined dark with subtle warmth */
  --bg:#070D1C;            /* page */
  --bg-1:#0B1426;          /* alt page */
  --bg-2:#101B33;          /* sunken */
  --bg2:#101B33;           /* alias — referenced without hyphen in several components */
  --card:#0F1B33;          /* primary card */
  --card-2:#152544;        /* elevated card */
  --card-3:#1B2E54;        /* hover/active card */
  --overlay:rgba(7,13,28,0.72);
  /* — STROKES — refined for clarity */
  --stroke:rgba(148,180,216,0.08);
  --stroke-2:rgba(148,180,216,0.14);
  --stroke-3:rgba(148,180,216,0.22);
  --stroke-brand:rgba(26,168,232,0.28);
  --border:var(--stroke);
  /* — TEXT — proper hierarchy */
  --text:#F1F5FB;          /* primary */
  --text-2:#C8D5E5;        /* secondary */
  --text-3:#94A8C2;        /* tertiary */
  --muted:#7990AC;         /* labels */
  --muted-2:#55677F;       /* placeholder */
  /* — RADII — */
  --r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-2xl:20px;
  --radius:var(--r-lg);--radius-sm:var(--r-md);
  /* — SHADOWS — layered enterprise depth */
  --shadow-xs:0 1px 2px rgba(0,0,0,0.32);
  --shadow-sm:0 2px 6px rgba(0,0,0,0.28),0 1px 2px rgba(0,0,0,0.32);
  --shadow-md:0 6px 16px rgba(0,0,0,0.36),0 2px 6px rgba(0,0,0,0.32);
  --shadow-lg:0 16px 40px rgba(0,0,0,0.5),0 4px 12px rgba(0,0,0,0.4);
  --shadow-xl:0 24px 64px rgba(0,0,0,0.6),0 8px 24px rgba(0,0,0,0.45);
  --glow-brand:0 0 0 4px rgba(26,168,232,0.16);
  --glow-success:0 0 0 4px rgba(16,185,129,0.16);
  --glow-danger:0 0 0 4px rgba(239,68,68,0.16);
  /* — MOTION — natural easing curves */
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-in-out:cubic-bezier(0.65,0,0.35,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --dur-fast:120ms;--dur-base:200ms;--dur-slow:320ms;--dur-slower:480ms;
  /* — TYPE — */
  --font-sans:'Inter','DM Sans','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-display:'Inter','DM Sans',-apple-system,system-ui,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono','Cascadia Code','Fira Mono',monospace;
  /* — Z — */
  --z-base:0;--z-raised:10;--z-sticky:50;--z-overlay:100;--z-dropdown:200;--z-modal:500;--z-toast:800;--z-splash:9999;
}

/* ═══════════════════════════════════════════════════════════════
   BASE
═══════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
*:focus-visible{outline:2px solid var(--brand-light);outline-offset:2px;border-radius:var(--r-xs);}
html{font-feature-settings:"cv11","ss01","ss03";}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text);
  font-size:13px;line-height:1.5;letter-spacing:-0.005em;
  overflow-x:hidden;min-height:100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(26,168,232,0.06),transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 10%,rgba(139,92,246,0.04),transparent 50%);
  background-attachment:fixed;
}

/* Smooth scrollbars */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--stroke-2);border-radius:99px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--stroke-3);}

/* Selection */
::selection{background:rgba(26,168,232,0.3);color:var(--text);}

/* ═══════════════════════════════════════════════════════════════
   TYPOGRAPHY SCALE
═══════════════════════════════════════════════════════════════ */
.t-display-lg{font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1.15;}
.t-display{font-size:24px;font-weight:700;letter-spacing:-0.018em;line-height:1.2;}
.t-h1{font-size:20px;font-weight:700;letter-spacing:-0.014em;line-height:1.25;}
.t-h2{font-size:16px;font-weight:600;letter-spacing:-0.01em;line-height:1.3;}
.t-h3{font-size:14px;font-weight:600;letter-spacing:-0.006em;line-height:1.35;}
.t-body{font-size:13px;font-weight:400;line-height:1.5;}
.t-body-sm{font-size:12px;font-weight:400;line-height:1.5;}
.t-caption{font-size:11px;font-weight:500;line-height:1.45;color:var(--text-3);}
.t-micro{font-size:10px;font-weight:600;line-height:1.4;letter-spacing:0.02em;color:var(--muted);}
.t-eyebrow{font-size:10px;font-weight:700;line-height:1.2;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.t-mono{font-family:var(--font-mono);font-feature-settings:"ss01","ss02";letter-spacing:-0.01em;}
.t-num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

/* ═══════════════════════════════════════════════════════════════
   SPLASH — refined entrance
═══════════════════════════════════════════════════════════════ */
.splash{position:fixed;inset:0;z-index:var(--z-splash);display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,#0E2244 0%,#070D1C 60%,#040814 100%);transition:opacity .7s var(--ease-out),transform .7s var(--ease-out);}
.splash.hidden{opacity:0;pointer-events:none;transform:scale(1.04);}
.splash-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(26,168,232,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(26,168,232,0.04) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);animation:gridMove 24s linear infinite;}
@keyframes gridMove{to{background-position:64px 64px;}}
.splash-sub{color:var(--muted);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin:20px 0 8px;z-index:1;font-weight:600;}
.splash-net{color:var(--text-3);font-size:11px;letter-spacing:1.4px;margin-bottom:36px;z-index:1;}
.splash-tag{font-size:22px;color:var(--text);max-width:580px;text-align:center;line-height:1.55;margin-bottom:48px;opacity:0;animation:fadeUp .8s .4s var(--ease-out) forwards;z-index:1;font-weight:600;letter-spacing:-0.01em;}
.splash-btn{
  background:linear-gradient(135deg,var(--brand-light),var(--brand-dark));
  color:#fff;border:none;padding:14px 44px;font-size:14px;font-weight:600;
  border-radius:99px;cursor:pointer;font-family:inherit;
  opacity:0;animation:fadeUp .8s .8s var(--ease-out) forwards;z-index:1;
  transition:transform var(--dur-base) var(--ease-spring),box-shadow var(--dur-base) var(--ease-out);
  box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,0.18);
  letter-spacing:-0.005em;
}
.splash-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-xl),inset 0 1px 0 rgba(255,255,255,0.24),0 0 40px rgba(26,168,232,0.4);}
.splash-btn:active{transform:translateY(0);}

/* ═══════════════════════════════════════════════════════════════
   HEADER — refined glass top bar
═══════════════════════════════════════════════════════════════ */
.header{
  position:fixed;top:0;left:0;right:0;height:56px;
  background:rgba(7,13,28,0.72);
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  border-bottom:1px solid var(--stroke-2);
  z-index:200;display:flex;align-items:center;padding:0 20px;gap:0;
}
.h-left{display:flex;align-items:center;gap:0;min-width:0;flex:0 1 auto;max-width:50%;}
.h-divider{width:1px;height:20px;background:var(--stroke-2);margin:0 14px;flex-shrink:0;}
.breadcrumb{display:flex;align-items:center;gap:0;min-width:0;flex:1 1 auto;overflow:hidden;}
.breadcrumb > div{flex-shrink:0;min-width:0;}
.breadcrumb > div:last-child{flex-shrink:1;overflow:hidden;}
.breadcrumb > div:last-child > .bc-seg{min-width:0;overflow:hidden;}
.breadcrumb > div:last-child > .bc-seg.bc-active{white-space:nowrap;text-overflow:ellipsis;}
.bc-seg{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text-3);cursor:pointer;padding:5px 10px;border-radius:var(--r-sm);transition:all var(--dur-fast) var(--ease-out);white-space:nowrap;letter-spacing:-0.005em;}
.bc-seg:hover{color:var(--text);background:var(--card-2);}
.bc-seg.bc-active{color:var(--text);cursor:default;font-weight:600;}
.bc-seg.bc-active:hover{background:transparent;}
.bc-icon{font-size:11px;flex-shrink:0;opacity:0.85;}
.bc-arrow{color:var(--muted-2);font-size:11px;margin:0 2px;flex-shrink:0;}
.h-center{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:16px;min-width:0;padding:0 12px;overflow:hidden;}
.h-chain-bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r-md);padding:5px 10px;min-width:0;max-width:100%;overflow:hidden;}
.h-chain-steps{display:flex;gap:3px;align-items:center;flex-shrink:0;}
.h-step{width:14px;height:4px;border-radius:99px;transition:background var(--dur-base) var(--ease-out);flex-shrink:0;}
.h-step.hs-done{background:var(--green);}
.h-step.hs-active{background:var(--brand-light);animation:pulse 1.4s infinite;}
.h-step.hs-human{background:var(--purple);}
.h-step.hs-idle{background:var(--stroke-2);}
.h-chain-label{font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap;letter-spacing:0.01em;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.h-kpi-strip{display:flex;gap:18px;align-items:center;}
.h-kpi{display:flex;flex-direction:column;align-items:center;}
.h-kpi-val{font-size:13px;font-weight:700;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
.h-kpi-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-top:1px;}
.h-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.hp{padding:4px 12px;border-radius:99px;font-size:10px;font-weight:600;letter-spacing:0.02em;white-space:nowrap;border:1px solid transparent;transition:all var(--dur-fast) var(--ease-out);}
.hp-live{background:rgba(239,68,68,0.12);color:var(--red-l);display:flex;align-items:center;gap:5px;border-color:rgba(239,68,68,0.2);}
.hp-live::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--red-l);box-shadow:0 0 8px var(--red-l);animation:pulse 1.4s infinite;}
.hp-net{background:rgba(26,168,232,0.1);color:var(--blue-l);border-color:rgba(26,168,232,0.18);}
.hp-time{background:transparent;color:var(--text-3);font-family:var(--font-mono);font-size:11px;border-color:var(--stroke-2);}
.hp-sol{background:rgba(139,92,246,0.1);color:var(--purple-l);cursor:pointer;border-color:rgba(139,92,246,0.2);}
.hp-sol:hover{background:rgba(139,92,246,0.18);transform:translateY(-1px);}

/* ═══════════════════════════════════════════════════════════════
   VIEW & LAYOUT
═══════════════════════════════════════════════════════════════ */
.view{padding:80px 28px 40px;max-width:1440px;margin:0 auto;}

/* ═══════════════════════════════════════════════════════════════
   FILTERS — refined select pattern
═══════════════════════════════════════════════════════════════ */
.gf-bar{display:flex;gap:8px;align-items:center;padding:10px 0;margin-bottom:18px;flex-wrap:wrap;}
.gf-bar label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;}
.gf-select{
  background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r-md);
  padding:7px 30px 7px 12px;color:var(--text);font-family:inherit;font-size:12px;font-weight:500;
  cursor:pointer;appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2394A8C2' fill='none' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;
  min-width:140px;transition:all var(--dur-fast) var(--ease-out);
  letter-spacing:-0.005em;
}
.gf-select:hover{border-color:var(--stroke-3);background-color:var(--card-2);}
.gf-select:focus{outline:none;border-color:var(--brand-light);box-shadow:var(--glow-brand);}
.gf-badge{background:rgba(26,168,232,0.1);color:var(--blue-l);padding:4px 12px;border-radius:99px;font-size:10px;font-weight:600;margin-left:auto;border:1px solid rgba(26,168,232,0.18);letter-spacing:0.005em;}

/* ═══════════════════════════════════════════════════════════════
   CARDS, TABLES, BOXES
═══════════════════════════════════════════════════════════════ */
.tw2{
  background:var(--card);
  border:1px solid var(--stroke-2);
  border-radius:var(--r-lg);
  overflow:hidden;margin-bottom:20px;
  box-shadow:var(--shadow-sm);
  transition:border-color var(--dur-base) var(--ease-out);
}
.tw2t{padding:14px 20px;font-size:13px;font-weight:600;border-bottom:1px solid var(--stroke);letter-spacing:-0.006em;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600;letter-spacing:0.01em;line-height:1.4;border:1px solid transparent;}
.tag-w{background:rgba(245,158,11,0.12);color:var(--orange-l);border-color:rgba(245,158,11,0.22);}
.tag-p{background:rgba(26,168,232,0.12);color:var(--blue-l);border-color:rgba(26,168,232,0.22);}
.tag-e{background:rgba(139,92,246,0.12);color:var(--purple-l);border-color:rgba(139,92,246,0.22);}
.tag-ok{background:rgba(16,185,129,0.12);color:var(--green-l);border-color:rgba(16,185,129,0.22);}

.abox{display:flex;gap:11px;padding:11px 14px;border-radius:var(--r-md);margin:8px 0;align-items:flex-start;font-size:12px;line-height:1.55;border:1px solid transparent;transition:all var(--dur-base) var(--ease-out);}
.abox.info{background:rgba(26,168,232,0.06);border-color:rgba(26,168,232,0.18);}
.abox.info .abox-i{color:var(--blue-l);}
.abox.ok{background:rgba(16,185,129,0.06);border-color:rgba(16,185,129,0.2);}
.abox.ok .abox-i{color:var(--green-l);}
.abox.crit{background:rgba(239,68,68,0.06);border-color:rgba(239,68,68,0.22);}
.abox.crit .abox-i{color:var(--red-l);}
.abox.warn{background:rgba(245,158,11,0.06);border-color:rgba(245,158,11,0.2);}
.abox.warn .abox-i{color:var(--orange-l);}
.abox.human{background:rgba(139,92,246,0.06);border-color:rgba(139,92,246,0.2);}
.abox.human .abox-i{color:var(--purple-l);}
.abox-i{font-size:14px;flex-shrink:0;margin-top:1px;font-weight:700;}
.abox-t{font-size:12px;line-height:1.55;color:var(--text-2);}
.abox-t strong{display:block;margin-bottom:3px;font-weight:600;color:var(--text);letter-spacing:-0.005em;}

.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0;}
.mc{
  background:var(--card-2);
  border:1px solid var(--stroke-2);
  border-radius:var(--r-md);padding:14px;
  transition:all var(--dur-base) var(--ease-out);
  position:relative;overflow:hidden;
}
.mc:hover{border-color:var(--stroke-3);background:var(--card-3);transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.mc::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top right,rgba(26,168,232,0.06),transparent 60%);pointer-events:none;}
.mc .ml{font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:5px;font-weight:600;position:relative;}
.mc .mv{font-size:20px;font-weight:700;letter-spacing:-0.018em;font-variant-numeric:tabular-nums;position:relative;}
.mc .md2{font-size:10px;margin-top:3px;color:var(--text-3);position:relative;}

/* ═══════════════════════════════════════════════════════════════
   EXEC VIEW
═══════════════════════════════════════════════════════════════ */
.ev-section{margin-bottom:28px;}
.ev-section-title{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px;letter-spacing:-0.008em;}
.ev-badge{font-size:9px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:0.06em;text-transform:uppercase;}
.kpi-cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.kpi-card-exec{
  background:var(--card);
  border:1px solid var(--stroke-2);
  border-radius:var(--r-md);
  padding:16px;position:relative;overflow:hidden;
  transition:all var(--dur-base) var(--ease-out);
}
.kpi-card-exec:hover{border-color:var(--stroke-3);background:var(--card-2);transform:translateY(-2px);box-shadow:var(--shadow-md);}
.kpi-card-exec::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0;}
.kpi-card-exec.tech::before{background:linear-gradient(90deg,var(--brand-light),var(--blue-l));}
.kpi-card-exec.ops::before{background:linear-gradient(90deg,var(--orange),var(--orange-l));}
.kpi-card-exec.biz::before{background:linear-gradient(90deg,var(--purple),var(--purple-l));}
.kce-id{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:0.06em;margin-bottom:4px;text-transform:uppercase;}
.kce-name{font-size:12px;font-weight:600;margin-bottom:6px;line-height:1.35;letter-spacing:-0.005em;}
.kce-val{font-size:22px;font-weight:700;margin-bottom:3px;letter-spacing:-0.018em;font-variant-numeric:tabular-nums;}
.kce-target{font-size:10px;color:var(--muted);}
.kce-impact{margin-top:8px;padding-top:8px;border-top:1px solid var(--stroke);font-size:10px;line-height:1.4;color:var(--text-3);}
.kpi-expand-btn{
  background:rgba(26,168,232,0.08);border:1px solid rgba(26,168,232,0.18);
  color:var(--blue-l);font-size:10px;font-weight:600;padding:5px 14px;
  border-radius:var(--r-sm);cursor:pointer;font-family:inherit;
  transition:all var(--dur-fast) var(--ease-out);margin-top:10px;
  letter-spacing:0.005em;
}
.kpi-expand-btn:hover{background:rgba(26,168,232,0.16);transform:translateY(-1px);}

/* ═══════════════════════════════════════════════════════════════
   IMPACT SCENARIOS
═══════════════════════════════════════════════════════════════ */
.impact-scenario{background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;}
.is-header{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--stroke);}
.is-icon{font-size:20px;}
.is-header h3{font-size:14px;font-weight:600;letter-spacing:-0.008em;}
.is-sev{margin-left:auto;font-size:10px;font-weight:700;padding:3px 11px;border-radius:99px;letter-spacing:0.04em;}
.is-body{padding:14px 18px;}
.is-kpi-impacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px;}
.is-kpi{background:var(--card-2);border-radius:var(--r-md);padding:12px;border:1px solid var(--stroke-2);}
.isk-name{font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:500;}
.isk-before{font-size:11px;color:var(--text-3);}
.isk-after{font-size:15px;font-weight:700;margin:3px 0;letter-spacing:-0.012em;}
.isk-delta{font-size:10px;font-weight:600;}
.ev-cta{display:flex;gap:10px;margin-top:24px;justify-content:center;flex-wrap:wrap;}
.ev-btn{padding:11px 28px;border-radius:var(--r-md);font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all var(--dur-base) var(--ease-spring);letter-spacing:-0.005em;}
.ev-btn-primary{background:linear-gradient(135deg,var(--brand-light),var(--brand-dark));color:#fff;box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,0.16);}
.ev-btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,0.24);}
.ev-btn-sec{background:var(--card-2);color:var(--brand-light);border:1px solid var(--stroke-brand);}
.ev-btn-sec:hover{background:var(--card-3);}

/* ═══════════════════════════════════════════════════════════════
   TRIGGER CARDS
═══════════════════════════════════════════════════════════════ */
.th{text-align:center;padding:24px 0 8px;}
.th h1{font-size:32px;font-weight:700;letter-spacing:-0.022em;margin-bottom:8px;line-height:1.15;}
.th h1 em{font-style:normal;background:linear-gradient(135deg,var(--brand-light),var(--purple-l));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.th p{color:var(--text-3);font-size:14px;max-width:640px;margin:0 auto;line-height:1.55;}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px;}
.tcard{background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r-lg);cursor:pointer;transition:all var(--dur-slow) var(--ease-out);position:relative;overflow:hidden;}
.tcard:hover{transform:translateY(-4px);border-color:var(--stroke-3);box-shadow:var(--shadow-lg);}
.tc-top{padding:22px 20px 14px;}
.tc-icon{width:46px;height:46px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.tcard.tw .tc-icon{background:linear-gradient(135deg,var(--orange),var(--red));}
.tcard.tp .tc-icon{background:linear-gradient(135deg,var(--brand-light),var(--brand-dark));}
.tcard.te .tc-icon{background:linear-gradient(135deg,var(--purple),#06B6D4);}
.tc-top h2{font-size:16px;font-weight:700;margin-bottom:5px;letter-spacing:-0.012em;}
.tc-top p{font-size:12px;color:var(--text-3);line-height:1.5;}
.tc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--stroke);border-top:1px solid var(--stroke);}
.tc-stat{background:var(--card);padding:11px 14px;}
.tc-stat .sl{font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:3px;font-weight:600;}
.tc-stat .sv{font-size:15px;font-weight:700;letter-spacing:-0.012em;font-variant-numeric:tabular-nums;}
.tcard.tw .sv{color:var(--orange);}
.tcard.tp .sv{color:var(--brand-light);}
.tcard.te .sv{color:var(--purple-l);}
.tc-foot{padding:11px 20px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--stroke);font-size:11px;color:var(--text-3);}

/* TRIGGER EXPANDED */
.tcard-expanded{background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r-lg);overflow:hidden;margin-top:24px;}
.te-header{padding:18px 22px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;gap:10px;}
.te-header h2{font-size:15px;font-weight:600;letter-spacing:-0.01em;}
.sub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--stroke);}
.sub-card{padding:18px 22px;border-right:1px solid var(--stroke);cursor:pointer;transition:all var(--dur-base) var(--ease-out);position:relative;}
.sub-card:last-child{border-right:none;}
.sub-card:hover{background:var(--card-2);}
.sub-card.active{background:rgba(26,168,232,0.06);}
.sub-card.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand-light);}
.sub-card .sc-label{font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:5px;font-weight:600;}
.sub-card .sc-title{font-size:13px;font-weight:600;margin-bottom:3px;letter-spacing:-0.006em;}
.sub-card .sc-desc{font-size:11px;color:var(--text-3);line-height:1.45;margin-bottom:10px;}
.sub-card .sc-stats{display:flex;gap:8px;flex-wrap:wrap;}
.sub-card .sc-stat{font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;}
.sub-card .sc-launch{font-size:10px;font-weight:600;color:var(--brand-light);margin-top:10px;display:flex;align-items:center;gap:4px;}

/* ═══════════════════════════════════════════════════════════════
   COMMAND CENTRE LAYOUT
═══════════════════════════════════════════════════════════════ */
.cc-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px;}
.cc-left{display:flex;flex-direction:column;gap:16px;}
.cc-right{display:flex;flex-direction:column;gap:16px;}
.cc-panel{background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-xs);}
.cc-panel-header{padding:14px 18px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;justify-content:space-between;}
.cc-panel-header h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-2);}
.cc-panel-body{padding:14px 18px;}

/* TRIG ROW */
.trig-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-md);margin-bottom:8px;background:var(--card-2);border:1px solid var(--stroke-2);cursor:pointer;transition:all var(--dur-base) var(--ease-out);}
.trig-row:hover{border-color:var(--stroke-3);transform:translateX(2px);}
.trig-row:last-child{margin-bottom:0;}
.trig-icon{width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-weight:700;}
.trig-info{flex:1;}
.trig-name{font-size:12px;font-weight:600;margin-bottom:2px;letter-spacing:-0.005em;}
.trig-desc{font-size:10px;color:var(--text-3);}
.trig-sev{font-size:9px;font-weight:700;padding:3px 9px;border-radius:99px;flex-shrink:0;letter-spacing:0.04em;}
.sev-high{background:rgba(239,68,68,0.14);color:var(--red-l);border:1px solid rgba(239,68,68,0.22);}
.sev-medhigh{background:rgba(245,158,11,0.14);color:var(--orange-l);border:1px solid rgba(245,158,11,0.22);}

/* NEWS */
.news-item{padding:11px 0;border-bottom:1px solid var(--stroke);}
.news-item:last-child{border-bottom:none;}
.news-source{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:3px;}
.news-headline{font-size:12px;font-weight:600;line-height:1.45;margin-bottom:4px;letter-spacing:-0.005em;}
.news-body{font-size:11px;color:var(--text-3);line-height:1.5;}

/* DEMAND ROWS */
.demand-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--stroke);}
.demand-row:last-child{border-bottom:none;}
.demand-cat{font-size:12px;font-weight:500;}
.demand-dir{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:0.04em;}
.dir-surge{background:rgba(239,68,68,0.14);color:var(--red-l);}
.dir-up{background:rgba(245,158,11,0.14);color:var(--orange-l);}
.dir-suppress{background:rgba(16,185,129,0.14);color:var(--green-l);}
.dir-none{background:rgba(148,168,194,0.12);color:var(--muted);}
.demand-lift{font-size:12px;font-weight:700;width:46px;text-align:right;font-variant-numeric:tabular-nums;}

/* MINI KPI */
.mini-kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mini-kpi{background:var(--card-2);border-radius:var(--r-md);padding:12px;border:1px solid var(--stroke-2);transition:all var(--dur-base) var(--ease-out);}
.mini-kpi:hover{border-color:var(--stroke-3);}
.mini-kpi .mk-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;font-weight:600;}
.mini-kpi .mk-val{font-size:18px;font-weight:700;letter-spacing:-0.014em;font-variant-numeric:tabular-nums;}
.mini-kpi .mk-delta{font-size:10px;font-weight:600;margin-top:2px;}

/* ═══════════════════════════════════════════════════════════════
   AGENT BAR & ORCHESTRATOR
═══════════════════════════════════════════════════════════════ */
.at-bar{position:sticky;top:56px;background:rgba(7,13,28,0.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--stroke-2);padding:8px 16px;z-index:90;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
.at-bar::-webkit-scrollbar{display:none;}
.ats{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--r-sm);font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer;transition:all var(--dur-base) var(--ease-out);flex-shrink:0;}
.ats .an{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;border:2px solid currentColor;flex-shrink:0;font-weight:700;}
.ats.done{color:var(--green-l);}.ats.done .an{background:var(--green);color:var(--bg);border-color:var(--green);}
.ats.act{color:#fff;background:rgba(26,168,232,0.14);}.ats.act .an{background:var(--brand-light);color:#fff;border-color:var(--brand-light);}
.ats.running{color:var(--brand-light);}.ats.running .an{border-color:var(--brand-light);animation:pulse 1s infinite;}
.atc{width:12px;height:2px;background:var(--stroke-2);flex-shrink:0;border-radius:99px;}

/* PROGRESS BAR */
.chain-progress{height:4px;background:var(--stroke);border-radius:99px;overflow:hidden;}
.chain-fill{height:100%;background:linear-gradient(90deg,var(--brand-light),var(--green-l));transition:width 1s var(--ease-out);border-radius:99px;box-shadow:0 0 12px rgba(26,168,232,0.4);}

/* RUN CONTROLS */
.run-controls{display:flex;align-items:center;gap:14px;padding:14px 28px;border-top:1px solid var(--stroke);background:rgba(7,13,28,0.6);backdrop-filter:blur(8px);}
.run-status{font-size:12px;color:var(--text-3);flex:1;letter-spacing:-0.005em;}
.run-status strong{color:var(--text);font-weight:600;}
.run-btn{padding:10px 28px;border-radius:var(--r-md);font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all var(--dur-base) var(--ease-spring);display:flex;align-items:center;gap:7px;letter-spacing:-0.005em;}
.run-btn.start{background:linear-gradient(135deg,var(--brand-light),var(--brand-dark));color:#fff;box-shadow:var(--shadow-md);}
.run-btn.start:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.run-btn.resume{background:linear-gradient(135deg,var(--green),#0F9466);color:#fff;box-shadow:var(--shadow-md);}
.run-btn.resume:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.run-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none!important;}

/* ═══════════════════════════════════════════════════════════════
   AGENT PANEL
═══════════════════════════════════════════════════════════════ */
.apanel{
  background:var(--card);
  border:1px solid var(--stroke-2);
  border-radius:var(--r-lg);
  overflow:hidden;margin-bottom:16px;
  animation:slideUp .4s var(--ease-out);
  box-shadow:var(--shadow-sm);
}
.aph{padding:18px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--stroke);flex-wrap:wrap;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);}
.apb2{width:34px;height:34px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0;letter-spacing:-0.01em;box-shadow:var(--shadow-sm);}
.aph h3{font-size:14px;font-weight:600;letter-spacing:-0.008em;}
.aph .aps{font-size:11px;color:var(--text-3);margin-top:2px;}
.apst{margin-left:auto;font-size:10px;font-weight:600;color:var(--green-l);flex-shrink:0;letter-spacing:0.005em;padding:4px 10px;border-radius:99px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);}
.apst.pend{color:var(--orange-l);background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.2);}
.apbody{padding:18px 22px;}

/* HELP TOGGLE */
.help-toggle{font-size:10px;font-weight:600;color:var(--purple-l);cursor:pointer;padding:4px 11px;border-radius:var(--r-sm);background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.22);transition:all var(--dur-fast) var(--ease-out);margin-left:8px;letter-spacing:0.005em;}
.help-toggle:hover{background:rgba(139,92,246,0.16);transform:translateY(-1px);}
.help-content{margin:10px 0;animation:slideUp .3s var(--ease-out);}
.help-box{display:flex;gap:11px;padding:12px 14px;border-radius:var(--r-md);background:rgba(139,92,246,0.06);border-left:3px solid var(--purple);font-size:12px;line-height:1.6;}

/* ═══════════════════════════════════════════════════════════════
   TABLES
═══════════════════════════════════════════════════════════════ */
table.dt{width:100%;border-collapse:collapse;font-size:12px;}
table.dt th{text-align:left;padding:10px 16px;font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);border-bottom:1px solid var(--stroke);font-weight:600;background:rgba(255,255,255,0.015);}
table.dt td{padding:10px 16px;border-bottom:1px solid var(--stroke);letter-spacing:-0.003em;}
table.dt tr:last-child td{border-bottom:none;}
table.dt tr{transition:background var(--dur-fast) var(--ease-out);}
table.dt tr:hover{background:rgba(26,168,232,0.03);}
.up{color:var(--red-l);font-weight:600;}
.dn{color:var(--green-l);font-weight:600;}

/* VBAR */
.vbar-wrap{display:flex;align-items:center;gap:10px;margin:6px 0;}
.vbar-label{width:148px;font-size:11px;font-weight:500;flex-shrink:0;letter-spacing:-0.003em;}
.vbar-track{flex:1;height:24px;background:var(--card-2);border-radius:var(--r-sm);overflow:hidden;display:flex;position:relative;border:1px solid var(--stroke);}
.vbar-fill{height:100%;border-radius:0 var(--r-sm) var(--r-sm) 0;display:flex;align-items:center;padding-left:8px;font-size:10px;font-weight:700;color:#fff;transition:width 1.2s var(--ease-out);font-variant-numeric:tabular-nums;}
.vbar-fill.vb-up{background:linear-gradient(90deg,var(--red),#DC2626);}
.vbar-fill.vb-dn{background:linear-gradient(90deg,var(--brand-light),var(--brand-dark));}
.vbar-fill.vb-green{background:linear-gradient(90deg,var(--green),#059669);}

/* ═══════════════════════════════════════════════════════════════
   FORECAST APPROVAL
═══════════════════════════════════════════════════════════════ */
.fcst-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 36px;gap:0;border-bottom:1px solid var(--stroke);align-items:center;font-size:12px;transition:background var(--dur-fast) var(--ease-out);}
.fcst-row:hover{background:rgba(26,168,232,0.025);}
.fcst-row.hdr{font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--stroke-2);background:rgba(255,255,255,0.015);}
.fcst-cell{padding:10px 14px;}
.fcst-input{width:100%;background:var(--bg-2);border:1px solid var(--stroke-2);border-radius:var(--r-sm);padding:6px 10px;color:var(--text);font-family:inherit;font-size:12px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;transition:all var(--dur-fast) var(--ease-out);}
.fcst-input:focus{outline:none;border-color:var(--brand-light);box-shadow:var(--glow-brand);}
.fcst-input.edited{border-color:var(--purple);background:rgba(139,92,246,0.08);}
.fcst-input.oob{border-color:var(--orange);background:rgba(245,158,11,0.08);box-shadow:0 0 0 3px rgba(245,158,11,0.12);}

/* ── BOUNDS WARNING TOOLTIP ── */
.fcst-input-wrap{position:relative;display:block;}
.bounds-tip{
  position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);
  background:var(--card-3);border:1px solid var(--orange);border-left:3px solid var(--orange);
  color:var(--text);font-size:10px;font-weight:500;line-height:1.4;
  padding:6px 10px;border-radius:var(--r-sm);white-space:nowrap;
  box-shadow:var(--shadow-md);z-index:var(--z-dropdown);
  animation:tipIn .18s var(--ease-out);pointer-events:none;
}
.bounds-tip::before{
  content:'';position:absolute;left:50%;top:-5px;transform:translateX(-50%) rotate(45deg);
  width:8px;height:8px;background:var(--card-3);border-left:1px solid var(--orange);border-top:1px solid var(--orange);
}
.bounds-tip strong{color:var(--orange-l);font-weight:700;}
@keyframes tipIn{from{opacity:0;transform:translateX(-50%) translateY(-4px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

/* ── CUSTOM ALLOCATION / SUBSTITUTION PANELS ── */
.custom-panel{
  background:linear-gradient(180deg,rgba(139,92,246,0.05),rgba(139,92,246,0.02));
  border:1.5px dashed rgba(139,92,246,0.45);border-radius:var(--r-md);
  padding:14px 16px;margin-top:10px;position:relative;
  transition:border-color var(--dur-base) var(--ease-out);
}
.custom-panel.selected{border-style:solid;border-color:var(--purple);background:linear-gradient(180deg,rgba(139,92,246,0.08),rgba(139,92,246,0.03));box-shadow:0 0 0 3px rgba(139,92,246,0.12);}
.custom-panel-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.custom-tag{
  display:inline-flex;align-items:center;gap:5px;background:rgba(139,92,246,0.15);
  border:1px solid rgba(139,92,246,0.35);color:var(--purple-l);
  font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;
}
.custom-tag::before{content:'✎';font-size:10px;}
.custom-panel-title{font-size:11px;font-weight:700;letter-spacing:-0.005em;}
.custom-panel-sub{font-size:10px;color:var(--muted);margin-top:2px;}

.custom-budget{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r-sm);
  padding:8px 12px;margin-bottom:10px;font-size:11px;
}
.custom-budget-item{display:flex;flex-direction:column;gap:2px;}
.custom-budget-lbl{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:700;}
.custom-budget-val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;}
.custom-budget-val.ok{color:var(--green-l);}
.custom-budget-val.warn{color:var(--orange-l);}
.custom-budget-val.bad{color:var(--red-l);}
.custom-budget-bar{flex:1;min-width:120px;height:6px;background:var(--bg-2);border-radius:99px;overflow:hidden;border:1px solid var(--stroke-2);}
.custom-budget-bar-fill{height:100%;border-radius:99px;transition:width .25s var(--ease-out),background .2s var(--ease-out);}
.custom-budget-bar-fill.ok{background:linear-gradient(90deg,var(--green),#059669);}
.custom-budget-bar-fill.warn{background:linear-gradient(90deg,var(--orange),#D97706);}
.custom-budget-bar-fill.bad{background:linear-gradient(90deg,var(--red),#DC2626);}

.custom-row{
  display:grid;grid-template-columns:1.6fr 1fr 1fr 0.9fr 26px;gap:8px;align-items:center;
  padding:6px 10px;border-bottom:1px solid var(--stroke);font-size:11px;
}
.custom-row.hdr{font-size:8px;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);font-weight:700;background:rgba(255,255,255,0.015);border-bottom:1px solid var(--stroke-2);}
.custom-row.invalid{background:rgba(239,68,68,0.04);}
.custom-table{background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r-sm);overflow:hidden;}
.custom-input{
  width:100%;background:var(--bg-2);border:1px solid var(--stroke-2);border-radius:var(--r-xs);
  padding:5px 8px;color:var(--text);font-family:inherit;font-size:11px;font-weight:600;
  text-align:center;font-variant-numeric:tabular-nums;transition:all var(--dur-fast) var(--ease-out);
}
.custom-input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,92,246,0.18);}
.custom-input.invalid{border-color:var(--red);background:rgba(239,68,68,0.06);}
.custom-row-tag{font-size:9px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;}
.custom-row-tag.ok{color:var(--green-l);}
.custom-row-tag.warn{color:var(--orange-l);}
.custom-row-tag.bad{color:var(--red-l);}
.custom-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;}
.custom-mini-btn{
  background:rgba(139,92,246,0.12);color:var(--purple-l);border:1px solid rgba(139,92,246,0.3);
  border-radius:var(--r-sm);padding:5px 11px;font-size:10px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all var(--dur-fast) var(--ease-out);
}
.custom-mini-btn:hover{background:rgba(139,92,246,0.2);}
.custom-mini-btn:disabled{opacity:0.4;cursor:not-allowed;}
.custom-msg{font-size:10px;font-weight:600;padding:6px 10px;border-radius:var(--r-sm);margin-top:8px;}
.custom-msg.ok{background:rgba(16,185,129,0.08);color:var(--green-l);border:1px solid rgba(16,185,129,0.22);}
.custom-msg.bad{background:rgba(239,68,68,0.08);color:var(--red-l);border:1px solid rgba(239,68,68,0.25);}
.custom-msg.warn{background:rgba(245,158,11,0.08);color:var(--orange-l);border:1px solid rgba(245,158,11,0.25);}
.fcst-btn{padding:4px 12px;border-radius:var(--r-sm);font-size:10px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all var(--dur-fast) var(--ease-out);letter-spacing:0.005em;}
.fcst-btn.approve{background:rgba(16,185,129,0.14);color:var(--green-l);border:1px solid rgba(16,185,129,0.22);}
.fcst-btn.approve:hover{background:rgba(16,185,129,0.22);}
.fcst-btn.approve.active{background:var(--green);color:#fff;border-color:var(--green);}
.fcst-btn.override{background:rgba(139,92,246,0.14);color:var(--purple-l);border:1px solid rgba(139,92,246,0.22);}
.fcst-btn.override:hover{background:rgba(139,92,246,0.22);}
.fcst-btn.override.active{background:var(--purple);color:#fff;border-color:var(--purple);}
.fcst-status{font-size:10px;font-weight:600;padding:3px 10px;border-radius:99px;text-align:center;letter-spacing:0.005em;}
.fst-approved{background:rgba(16,185,129,0.14);color:var(--green-l);}
.fst-edited{background:rgba(139,92,246,0.14);color:var(--purple-l);}
.fst-pending{background:rgba(245,158,11,0.1);color:var(--orange-l);}
.submit-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 0;margin-top:12px;border-top:1px solid var(--stroke);}
.submit-bar .sb-info{font-size:12px;color:var(--text-3);letter-spacing:-0.003em;}
.submit-bar .sb-info strong{color:var(--text);font-weight:600;}
.sb-btn{padding:11px 30px;border-radius:var(--r-md);font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all var(--dur-base) var(--ease-spring);letter-spacing:-0.005em;}
.sb-submit{background:linear-gradient(135deg,var(--green),#0F9466);color:#fff;box-shadow:var(--shadow-md);}
.sb-submit:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.sb-submit:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
.sb-submitted{background:var(--green);color:#fff;pointer-events:none;}

/* ESC CARDS */
.esc-card{background:var(--card-2);border:1px solid var(--stroke-2);border-radius:var(--r-md);padding:13px 16px;margin:8px 0;display:flex;align-items:center;gap:14px;transition:all var(--dur-base) var(--ease-out);}
.esc-card:hover{border-color:var(--stroke-3);}
.esc-info{flex:1;}
.esc-store{font-size:13px;font-weight:600;letter-spacing:-0.005em;}
.esc-detail{font-size:11px;color:var(--text-3);margin-top:3px;}
.esc-change{font-size:12px;font-weight:700;margin-top:4px;color:var(--red-l);font-variant-numeric:tabular-nums;}
.esc-btn{padding:6px 14px;border-radius:var(--r-sm);font-size:10px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all var(--dur-fast) var(--ease-out);}
.esc-btn.ea{background:rgba(16,185,129,0.14);color:var(--green-l);}
.esc-btn.ea.active{background:var(--green);color:#fff;}
.esc-btn.er{background:rgba(239,68,68,0.12);color:var(--red-l);}
.esc-btn.er.active{background:var(--red);color:#fff;}
.esc-status{font-size:10px;font-weight:600;padding:3px 10px;border-radius:99px;}
.es-pend{background:rgba(245,158,11,0.1);color:var(--orange-l);}
.es-appr{background:rgba(16,185,129,0.14);color:var(--green-l);}
.es-rej{background:rgba(239,68,68,0.12);color:var(--red-l);}

/* LPI */
.lpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:16px 0;}
.lpi-card{background:var(--card-2);border:1px solid var(--stroke-2);border-radius:var(--r-md);padding:18px;text-align:center;transition:all .5s var(--ease-out);position:relative;overflow:hidden;}
.lpi-card.updated{border-color:rgba(16,185,129,0.4);background:rgba(16,185,129,0.04);animation:lpiPulse .8s var(--ease-spring);}
.lpi-card.updated::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(16,185,129,0.1),transparent 60%);pointer-events:none;}
.lpi-icon{font-size:20px;margin-bottom:6px;}
.lpi-label{font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:5px;font-weight:600;}
.lpi-val{font-size:24px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
.lpi-sub{font-size:10px;color:var(--text-3);margin-top:3px;}
@keyframes lpiPulse{0%{transform:scale(1);}50%{transform:scale(1.03);}100%{transform:scale(1);}}

/* GAUGES */
.gauge-wrap{display:flex;justify-content:center;gap:32px;margin:16px 0;flex-wrap:wrap;align-items:center;}
.gauge{text-align:center;width:130px;}
.gauge .g-label{font-size:10px;color:var(--text-3);margin-top:6px;font-weight:500;}
.gauge .g-val{font-size:20px;font-weight:700;margin-top:3px;letter-spacing:-0.014em;font-variant-numeric:tabular-nums;}

/* DONUT */
.donut-wrap{display:flex;align-items:center;gap:24px;justify-content:center;flex-wrap:wrap;margin:16px 0;}
.donut-legend{display:flex;flex-direction:column;gap:6px;}
.dl-item{display:flex;align-items:center;gap:8px;font-size:11px;}
.dl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

/* NBA */
.nba{background:var(--card-2);border-radius:var(--r-md);padding:12px 16px;margin:8px 0;border-left:3px solid var(--stroke-2);transition:all var(--dur-base) var(--ease-out);}
.nba:hover{border-color:var(--stroke-3);}
.nba .nt{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.nba .nt strong{font-size:12px;font-weight:600;letter-spacing:-0.005em;}
.nba p{font-size:11px;color:var(--text-3);line-height:1.5;}
.nba.ng{border-left-color:var(--green-l);}
.nba.nb{border-left-color:var(--brand-light);}
.nba.no{border-left-color:var(--orange);}
.nba.np{border-left-color:var(--purple-l);}

/* COUNTERFACTUAL */
.imp-row{display:grid;grid-template-columns:1fr 44px 1fr;gap:14px;align-items:center;margin:16px 0;}
.imp-box{padding:20px;border-radius:var(--r-lg);text-align:center;border:1px solid transparent;transition:all var(--dur-base) var(--ease-out);}
.imp-box.bad{background:rgba(239,68,68,0.06);border-color:rgba(239,68,68,0.22);}
.imp-box.good{background:rgba(16,185,129,0.06);border-color:rgba(16,185,129,0.22);}
.imp-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.imp-box.bad .imp-lbl{color:var(--red-l);}
.imp-box.good .imp-lbl{color:var(--green-l);}
.imp-v{font-size:26px;font-weight:700;letter-spacing:-0.022em;font-variant-numeric:tabular-nums;}
.imp-box.bad .imp-v{color:var(--red-l);}
.imp-box.good .imp-v{color:var(--green-l);}
.imp-arr{text-align:center;font-size:20px;color:var(--muted);}

/* ADJ */
.adj-r{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:16px 0;}
.adj-c{text-align:center;padding:20px;border-radius:var(--r-lg);border:1px solid transparent;transition:all var(--dur-base) var(--ease-out);}
.adj-c .an3{font-size:30px;font-weight:700;letter-spacing:-0.022em;font-variant-numeric:tabular-nums;}
.adj-c .al3{font-size:10px;color:var(--text-3);margin-top:3px;font-weight:500;}
.a-au{background:rgba(16,185,129,0.06);border-color:rgba(16,185,129,0.22);}
.a-au .an3{color:var(--green-l);}
.a-rv2{background:rgba(248,113,113,0.06);border-color:rgba(248,113,113,0.22);}
.a-rv2 .an3{color:var(--red-l);}
.a-rt{background:rgba(26,168,232,0.06);border-color:rgba(26,168,232,0.22);}
.a-rt .an3{color:var(--blue-l);}

/* CHAIN COMPLETE */
.chain-complete{background:linear-gradient(135deg,rgba(16,185,129,0.08),rgba(26,168,232,0.06));border:1px solid rgba(16,185,129,0.3);border-radius:var(--r-lg);padding:24px;text-align:center;margin:18px 0;animation:slideUp .5s var(--ease-out);box-shadow:var(--shadow-md);}
.chain-complete h2{font-size:20px;font-weight:700;color:var(--green-l);margin-bottom:8px;letter-spacing:-0.014em;}
.chain-complete p{font-size:13px;color:var(--text-2);line-height:1.6;}

/* MODAL */
.fcst-modal-overlay{position:fixed;inset:0;background:rgba(7,13,28,0.88);backdrop-filter:blur(8px);z-index:var(--z-modal);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s var(--ease-out);}
.fcst-modal{background:var(--card-2);border:1px solid var(--stroke-2);border-radius:var(--r-lg);padding:24px;max-width:720px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-xl);animation:modalIn .3s var(--ease-out);}
@keyframes modalIn{from{opacity:0;transform:scale(0.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.fcst-modal h3{font-size:15px;font-weight:600;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-0.01em;}
.fcst-modal-close{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:18px;padding:6px;border-radius:var(--r-sm);transition:all var(--dur-fast) var(--ease-out);}
.fcst-modal-close:hover{background:var(--card-3);color:var(--text);}

/* SCENARIO TAG */
.scenario-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(26,168,232,0.08);border:1px solid rgba(26,168,232,0.22);border-radius:99px;padding:5px 14px;font-size:11px;font-weight:600;color:var(--blue-l);margin-bottom:14px;letter-spacing:-0.003em;}

/* ═══════════════════════════════════════════════════════════════
   ANIMATIONS
═══════════════════════════════════════════════════════════════ */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
@keyframes typeCursor{0%,100%{opacity:1;}50%{opacity:0;}}
@keyframes handoffSlide{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
@keyframes orcPulse{0%,100%{box-shadow:0 0 0 0 rgba(26,168,232,0.4);}70%{box-shadow:0 0 0 8px rgba(26,168,232,0);}}
@keyframes streamIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
@keyframes asstspin{to{transform:rotate(360deg);}}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}

.stream-row{animation:streamIn .35s var(--ease-out);}

/* SKELETON LOADERS */
.skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card-2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:var(--r-sm);}

/* IMPLICATIONS PANEL */
.impl-panel{background:var(--card-2);border:1px solid rgba(16,185,129,0.22);border-radius:var(--r-md);padding:14px 16px;min-width:240px;max-width:280px;flex-shrink:0;align-self:flex-start;position:sticky;top:80px;box-shadow:var(--shadow-sm);}
.impl-metric{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--stroke);}
.impl-metric:last-child{border-bottom:none;}
.impl-metric-label{font-size:11px;color:var(--text-3);flex:1;}
.impl-metric-right{text-align:right;}
.impl-metric-val{font-size:14px;font-weight:700;letter-spacing:-0.008em;font-variant-numeric:tabular-nums;}
.impl-metric-delta{font-size:9px;font-weight:600;margin-top:2px;}
.impl-metric-delta.up{color:var(--green-l);}
.impl-metric-delta.down{color:var(--red-l);}
.impl-metric-delta.warn{color:var(--orange-l);}
.impl-metric-delta.neutral{color:var(--muted);}

/* DC CONSTRAINT (legacy) */
.dc-constraint-banner{background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.22);border-radius:var(--r-md);padding:12px 16px;margin-bottom:14px;}
.dc-constraint-title{font-size:11px;font-weight:700;color:var(--red-l);margin-bottom:5px;letter-spacing:-0.005em;}
.dc-constraint-body{font-size:11px;color:var(--text-3);line-height:1.5;}
.dc-cm{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:10px;}
.dc-cm-l{color:var(--muted);}
.dc-cm-v{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
.dc-alloc-option{background:var(--card-2);border:1px solid var(--stroke-2);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;transition:all var(--dur-base) var(--ease-out);margin-bottom:8px;}
.dc-alloc-option:hover{border-color:var(--stroke-brand);transform:translateX(2px);}
.dc-alloc-option.selected{border-color:var(--green);background:rgba(16,185,129,0.04);box-shadow:var(--glow-success);}

/* AGENT HANDOFF STRIP */
.handoff-strip{
  background:linear-gradient(135deg,rgba(10,79,168,0.12),rgba(26,168,232,0.06));
  border:1px solid rgba(26,168,232,0.22);
  border-radius:var(--r-md);
  padding:9px 16px;margin:0 0 14px;display:flex;align-items:center;gap:11px;
  animation:handoffSlide .4s var(--ease-out);font-size:11px;
}
.handoff-from{font-weight:600;color:var(--brand-light);}
.handoff-arrow{color:var(--muted);font-size:13px;}
.handoff-to{font-weight:600;color:var(--green-l);}
.handoff-payload{margin-left:auto;font-size:10px;color:var(--text-3);background:rgba(26,168,232,0.08);padding:3px 10px;border-radius:99px;border:1px solid rgba(26,168,232,0.18);}

/* ORCHESTRATOR NODE BAR */
.orc-bar{background:rgba(7,13,28,0.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--stroke-2);padding:14px 24px;overflow-x:auto;scrollbar-width:none;}
.orc-bar::-webkit-scrollbar{display:none;}
.orc-inner{display:flex;align-items:center;gap:0;min-width:max-content;}
.orc-node{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 12px;cursor:pointer;transition:all var(--dur-base) var(--ease-out);position:relative;}
.orc-node:hover .orc-label{color:var(--text);}
.orc-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;border:2px solid transparent;transition:all var(--dur-slow) var(--ease-spring);position:relative;letter-spacing:-0.01em;}
.orc-dot.orc-done{background:var(--green);border-color:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,0.16);}
.orc-dot.orc-running{border-color:var(--brand-light);animation:orcPulse 1.5s infinite;}
.orc-dot.orc-act{background:var(--brand-light);border-color:var(--brand-light);box-shadow:var(--glow-brand);}
.orc-dot.orc-human{border-color:var(--purple);background:rgba(139,92,246,0.2);}
.orc-dot.orc-human.orc-act{background:var(--purple);}
.orc-dot.orc-idle{background:var(--card-2);border-color:var(--stroke-2);color:var(--muted);}
.orc-label{font-size:9px;color:var(--muted);text-align:center;white-space:nowrap;max-width:74px;font-weight:600;transition:color var(--dur-fast) var(--ease-out);letter-spacing:0.005em;}
.orc-node.orc-node-done .orc-label,.orc-node.orc-node-act .orc-label{color:var(--text);}
.orc-conn{width:22px;height:2px;background:var(--stroke-2);flex-shrink:0;margin-top:-18px;transition:background var(--dur-slow) var(--ease-out);border-radius:99px;}
.orc-conn.orc-conn-done{background:var(--green);}

/* AGENT NETWORK STRIP */
.agent-strip{background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-xs);}
.agent-strip-top{display:flex;align-items:stretch;border-bottom:1px solid var(--stroke);}
.agent-pill{display:flex;align-items:center;gap:10px;padding:11px 16px;flex:1;border-right:1px solid var(--stroke);min-width:0;transition:background var(--dur-base) var(--ease-out);}
.agent-pill:last-of-type{border-right:none;}
.agent-pill.ap-active{background:rgba(26,168,232,0.04);}
.agent-pill.ap-done{background:rgba(16,185,129,0.03);}
.ap-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ap-info{flex:1;min-width:0;}
.ap-label{font-size:8px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:2px;}
.ap-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.005em;}
.ap-badge{font-size:8px;font-weight:700;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;flex-shrink:0;}
.ap-badge-auto{background:rgba(26,168,232,0.12);color:var(--brand-light);}
.ap-badge-human{background:rgba(139,92,246,0.14);color:var(--purple-l);}
.ap-badge-done{background:rgba(16,185,129,0.12);color:var(--green-l);}
.ap-badge-idle{background:rgba(148,168,194,0.08);color:var(--muted);}
.agent-mode-toggle{display:flex;align-items:center;gap:8px;padding:11px 16px;border-left:1px solid var(--stroke);flex-shrink:0;}
.agent-ticker{display:flex;align-items:center;gap:12px;padding:7px 16px;background:var(--card-2);}
.ticker-label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;flex-shrink:0;}
.ticker-track{flex:1;overflow:hidden;height:20px;position:relative;}
.ticker-inner{position:absolute;inset:0;display:flex;align-items:center;gap:8px;animation:tickerIn .35s var(--ease-out);font-size:11px;white-space:nowrap;overflow:hidden;}
.ticker-from{font-weight:600;flex-shrink:0;}
.ticker-sep{color:var(--muted);flex-shrink:0;}
.ticker-tag{font-size:8px;font-weight:700;padding:2px 6px;border-radius:99px;text-transform:uppercase;flex-shrink:0;letter-spacing:0.04em;}
.ticker-text{color:var(--text-3);overflow:hidden;text-overflow:ellipsis;min-width:0;}
.ticker-time{color:var(--muted);font-size:9px;flex-shrink:0;margin-left:auto;font-family:var(--font-mono);}
@keyframes tickerIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}

/* DOWNSTREAM IMPACT */
.ds-dot-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.ds-dot{width:10px;height:10px;border-radius:50%;background:var(--orange);cursor:pointer;flex-shrink:0;animation:dsPulse 1.8s ease-in-out infinite;}
@keyframes dsPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0.6);}60%{box-shadow:0 0 0 6px rgba(245,158,11,0);}}
.ds-tooltip{position:fixed;z-index:9999;width:280px;background:var(--card-2);border:1px solid rgba(245,158,11,0.35);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow-xl);pointer-events:none;}
.ds-tooltip-title{font-size:10px;font-weight:700;color:var(--orange-l);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.ds-tooltip-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.ds-tooltip-metric{background:var(--card);border-radius:var(--r-sm);padding:9px 11px;border:1px solid var(--stroke);}
.dtm-label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px;font-weight:600;}
.dtm-val{font-size:14px;font-weight:700;line-height:1;letter-spacing:-0.012em;font-variant-numeric:tabular-nums;}
.dtm-sub{font-size:9px;font-weight:600;margin-top:3px;}
.ds-tooltip-agents{font-size:9px;color:var(--text-3);border-top:1px solid var(--stroke);padding-top:9px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.ds-tooltip-agents strong{color:var(--text);font-weight:600;}

/* DOWNSTREAM SUMMARY BAR */
.ds-summary-bar{display:flex;align-items:stretch;background:rgba(245,158,11,0.04);border:1px solid rgba(245,158,11,0.22);border-radius:var(--r-md);margin-top:10px;overflow:hidden;animation:slideUp .3s var(--ease-out);}
.dsb-head{display:flex;flex-direction:column;justify-content:center;padding:10px 14px;border-right:1px solid rgba(245,158,11,0.14);flex-shrink:0;gap:3px;}
.dsb-cell{flex:1;padding:9px 14px;border-right:1px solid rgba(245,158,11,0.1);min-width:0;}
.dsb-cell:last-of-type{border-right:none;}
.dsb-label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:3px;}
.dsb-val{font-size:14px;font-weight:700;line-height:1.1;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
.dsb-sub{font-size:9px;font-weight:600;margin-top:2px;}
.dsb-tail{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:9px 12px;flex-shrink:0;border-left:1px solid rgba(245,158,11,0.14);}
.ds-toggle-row{display:flex;align-items:center;gap:6px;}
.ds-toggle{width:30px;height:16px;border-radius:99px;cursor:pointer;display:flex;align-items:center;padding:0 2px;transition:background var(--dur-base) var(--ease-out);flex-shrink:0;}
.ds-toggle-knob{width:12px;height:12px;border-radius:50%;background:#fff;transition:transform var(--dur-base) var(--ease-spring);box-shadow:var(--shadow-xs);}

/* AI CHAT */
.ai-chat-wrap{background:rgba(139,92,246,0.04);border:1px solid rgba(139,92,246,0.22);border-radius:var(--r-md);overflow:hidden;margin-top:18px;}
.ai-chat-header{padding:11px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-bottom:1px solid rgba(139,92,246,0.16);}
.ai-chat-header h4{font-size:12px;font-weight:600;color:var(--purple-l);display:flex;align-items:center;gap:7px;letter-spacing:-0.005em;}
.ai-chat-body{padding:14px 16px;}
.ai-chat-msgs{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:11px;margin-bottom:11px;scrollbar-width:thin;}
.chat-msg{display:flex;gap:9px;align-items:flex-start;}
.chat-msg.user{flex-direction:row-reverse;}
.chat-bubble{max-width:78%;padding:10px 14px;border-radius:var(--r-md);font-size:12px;line-height:1.6;letter-spacing:-0.003em;}
.chat-bubble.user{background:rgba(139,92,246,0.16);border:1px solid rgba(139,92,246,0.28);color:var(--text);}
.chat-bubble.agent{background:var(--card);border:1px solid var(--stroke-2);color:var(--text);}
.chat-bubble.thinking{background:var(--card);border:1px solid var(--stroke-2);color:var(--muted);font-style:italic;}
.chat-avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px;}
.chat-avatar.user-av{background:rgba(139,92,246,0.22);color:var(--purple-l);}
.chat-avatar.agent-av{background:linear-gradient(135deg,var(--brand-light),var(--brand-dark));color:#fff;box-shadow:var(--shadow-xs);}
.chat-followups{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
.chat-fu-btn{font-size:10px;padding:4px 10px;border-radius:var(--r-sm);background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.22);color:var(--purple-l);cursor:pointer;font-family:inherit;transition:all var(--dur-fast) var(--ease-out);}
.chat-fu-btn:hover{background:rgba(139,92,246,0.18);transform:translateY(-1px);}
.ai-chat-input-row{display:flex;gap:9px;}
.ai-chat-input{flex:1;background:var(--card-2);border:1px solid rgba(139,92,246,0.28);border-radius:var(--r-sm);padding:8px 14px;color:var(--text);font-family:inherit;font-size:12px;outline:none;transition:border-color var(--dur-fast) var(--ease-out);}
.ai-chat-input:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(139,92,246,0.12);}
.ai-chat-send{padding:8px 18px;background:var(--purple);color:#fff;border:none;border-radius:var(--r-sm);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all var(--dur-fast) var(--ease-out);}
.ai-chat-send:hover{background:#7C3AED;}
.ai-chat-send:disabled{opacity:0.5;cursor:not-allowed;}
.chat-cursor{display:inline-block;width:2px;height:13px;background:var(--purple-l);margin-left:2px;animation:typeCursor .7s infinite;vertical-align:middle;}

/* ═══════════════════════════════════════════════════════════════
   ASSISTANT PANEL (right side, persistent, resizable)
═══════════════════════════════════════════════════════════════ */
.app-shell{
  transition:padding-right var(--dur-base) var(--ease-out);
  min-height:100vh;
}
.asst-panel{
  position:fixed;top:56px;right:0;bottom:0;
  background:linear-gradient(180deg,var(--card) 0%,var(--bg-1) 100%);
  border-left:1px solid var(--stroke-2);
  box-shadow:-12px 0 32px rgba(0,0,0,0.32);
  display:flex;flex-direction:column;
  z-index:180;
  transition:width var(--dur-base) var(--ease-out);
  overflow:hidden;
}
.asst-resize{
  position:absolute;left:-3px;top:0;bottom:0;width:6px;
  cursor:col-resize;z-index:2;
  background:transparent;transition:background var(--dur-fast);
}
.asst-resize:hover,.asst-resize.dragging{background:rgba(26,168,232,0.32);}
.asst-collapsed-rail{
  position:fixed;top:56px;right:0;bottom:0;width:44px;z-index:180;
  background:linear-gradient(180deg,var(--card) 0%,var(--bg-1) 100%);
  border-left:1px solid var(--stroke-2);
  display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:10px;
  cursor:pointer;
}
.asst-rail-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--brand-light),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;
  box-shadow:0 4px 12px rgba(26,168,232,0.32);
}
.asst-rail-label{
  writing-mode:vertical-rl;transform:rotate(180deg);
  font-size:10px;font-weight:600;color:var(--text-3);letter-spacing:0.5px;
  text-transform:uppercase;margin-top:6px;
}
.asst-rail-pulse{
  width:8px;height:8px;border-radius:50%;background:var(--green);
  margin-top:auto;margin-bottom:14px;animation:pulse 1.6s infinite;
}
.asst-header{
  flex-shrink:0;padding:12px 16px;
  border-bottom:1px solid var(--stroke-2);
  display:flex;align-items:center;gap:10px;
  background:rgba(26,168,232,0.04);
}
.asst-avatar{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,var(--brand-light),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;
  box-shadow:0 2px 8px rgba(26,168,232,0.32);
}
.asst-title{flex:1;min-width:0;}
.asst-title-main{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-0.008em;}
.asst-title-sub{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:1px;}
.asst-status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
.asst-iconbtn{
  background:none;border:1px solid var(--stroke-2);color:var(--text-3);
  cursor:pointer;width:26px;height:26px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;transition:all var(--dur-fast);
}
.asst-iconbtn:hover{background:var(--card-3);color:var(--text);border-color:var(--stroke-3);}
.asst-context-bar{
  flex-shrink:0;padding:8px 16px;
  background:rgba(124,58,237,0.06);
  border-bottom:1px solid var(--stroke);
  display:flex;align-items:center;gap:8px;
  font-size:10px;color:var(--text-2);
}
.asst-context-pill{
  padding:2px 8px;border-radius:99px;
  background:rgba(26,168,232,0.12);
  border:1px solid rgba(26,168,232,0.28);
  color:var(--brand-light);font-weight:600;font-size:9px;
  text-transform:uppercase;letter-spacing:0.4px;
}
.asst-msgs{
  flex:1;overflow-y:auto;padding:14px 16px;
  display:flex;flex-direction:column;gap:12px;
}
.asst-msg{display:flex;gap:8px;animation:fadeIn .25s var(--ease-out);}
.asst-msg.user{flex-direction:row-reverse;}
.asst-msg-av{
  width:24px;height:24px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;
}
.asst-msg-av.bot{background:linear-gradient(135deg,var(--brand-light),var(--purple));color:#fff;}
.asst-msg-av.user{background:var(--card-3);color:var(--text-2);border:1px solid var(--stroke-2);}
.asst-msg-bubble{
  max-width:calc(100% - 36px);
  padding:9px 12px;border-radius:10px;
  font-size:12px;line-height:1.55;
  word-wrap:break-word;
}
.asst-msg.bot .asst-msg-bubble{
  background:var(--card-2);border:1px solid var(--stroke-2);
  color:var(--text);border-top-left-radius:3px;
}
.asst-msg.user .asst-msg-bubble{
  background:rgba(26,168,232,0.14);border:1px solid rgba(26,168,232,0.28);
  color:var(--text);border-top-right-radius:3px;
}
.asst-msg-bubble strong{color:var(--brand-light);font-weight:600;}
.asst-action-card{
  background:linear-gradient(135deg,rgba(124,58,237,0.1),rgba(26,168,232,0.06));
  border:1px solid rgba(124,58,237,0.32);
  border-radius:10px;padding:12px;margin-top:8px;
}
.asst-action-title{
  font-size:10px;font-weight:700;color:var(--purple-l);
  text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;
  display:flex;align-items:center;gap:6px;
}
.asst-action-summary{font-size:12px;color:var(--text);margin-bottom:8px;line-height:1.5;}
.asst-action-impact{
  background:rgba(7,13,28,0.4);
  border-radius:6px;padding:8px 10px;margin-bottom:10px;
  font-size:11px;color:var(--text-2);line-height:1.5;
}
.asst-action-impact-row{display:flex;justify-content:space-between;padding:2px 0;}
.asst-action-impact-label{color:var(--muted);}
.asst-action-impact-val{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
.asst-action-btns{display:flex;gap:6px;flex-wrap:wrap;}
.asst-action-btn{
  flex:1;min-width:80px;padding:7px 10px;border-radius:6px;
  font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;
  border:1px solid var(--stroke-2);background:var(--card-3);color:var(--text);
  transition:all var(--dur-fast);
}
.asst-action-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.asst-action-btn.primary{
  background:linear-gradient(135deg,var(--green),#059669);
  border-color:rgba(16,185,129,0.5);color:#fff;
}
.asst-action-btn.primary:hover{box-shadow:0 4px 12px rgba(16,185,129,0.4);}
.asst-action-btn.danger{
  background:transparent;border-color:rgba(239,68,68,0.32);color:var(--red-l);
}
.asst-action-btn.danger:hover{background:rgba(239,68,68,0.08);}
.asst-action-status{
  font-size:10px;text-transform:uppercase;letter-spacing:0.5px;
  font-weight:700;padding:4px 8px;border-radius:5px;
  display:inline-block;margin-top:6px;
}
.asst-action-status.executed{background:rgba(16,185,129,0.14);color:var(--green-l);}
.asst-action-status.cancelled{background:rgba(239,68,68,0.10);color:var(--red-l);}
.asst-quickactions{
  flex-shrink:0;padding:10px 16px 0;
  display:flex;flex-wrap:wrap;gap:6px;
  border-top:1px solid var(--stroke);
}
.asst-qa-btn{
  font-size:10px;padding:5px 10px;border-radius:99px;
  background:rgba(26,168,232,0.08);
  border:1px solid rgba(26,168,232,0.22);
  color:var(--brand-light);cursor:pointer;font-family:inherit;
  transition:all var(--dur-fast);letter-spacing:-0.003em;font-weight:500;
}
.asst-qa-btn:hover{background:rgba(26,168,232,0.18);transform:translateY(-1px);}
.asst-input-area{
  flex-shrink:0;padding:10px 14px 14px;
  border-top:1px solid var(--stroke);
  background:rgba(7,13,28,0.4);
}
.asst-input-row{display:flex;gap:7px;}
.asst-input{
  flex:1;background:var(--card-2);
  border:1px solid var(--stroke-2);
  border-radius:8px;padding:9px 12px;
  color:var(--text);font-family:inherit;font-size:12px;
  outline:none;transition:all var(--dur-fast);
}
.asst-input:focus{border-color:var(--brand-light);box-shadow:0 0 0 3px rgba(26,168,232,0.14);}
.asst-send{
  padding:0 14px;
  background:linear-gradient(135deg,var(--brand-light),var(--purple));
  color:#fff;border:none;border-radius:8px;
  font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:all var(--dur-fast);min-width:46px;
}
.asst-send:hover:not(:disabled){box-shadow:0 4px 12px rgba(26,168,232,0.4);}
.asst-send:disabled{opacity:0.4;cursor:not-allowed;}
.asst-thinking{
  display:flex;gap:4px;align-items:center;padding:6px 0;
}
.asst-thinking span{
  width:6px;height:6px;border-radius:50%;background:var(--brand-light);
  animation:pulse .9s infinite;
}
.asst-thinking span:nth-child(2){animation-delay:.15s;}
.asst-thinking span:nth-child(3){animation-delay:.3s;}
.asst-empty{
  text-align:center;padding:24px 16px;color:var(--muted);font-size:11px;
  line-height:1.6;
}
.asst-empty-icon{
  width:48px;height:48px;border-radius:12px;margin:0 auto 12px;
  background:linear-gradient(135deg,rgba(26,168,232,0.14),rgba(124,58,237,0.14));
  display:flex;align-items:center;justify-content:center;
  font-size:22px;border:1px solid var(--stroke-2);
}
.asst-empty-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;}

@media(max-width:900px){
  .tgrid{grid-template-columns:1fr;}
  .ats{font-size:9px;padding:4px 8px;}
  .ats .an{width:16px;height:16px;font-size:7px;}
  .fcst-row{grid-template-columns:1fr;}
  .imp-row{grid-template-columns:1fr;}
  .sub-grid{grid-template-columns:1fr;}
  .cc-layout{grid-template-columns:1fr;}
  .mg{grid-template-columns:1fr 1fr;}
  .kpi-cat-grid{grid-template-columns:1fr 1fr;}
  .is-kpi-impacts{grid-template-columns:1fr 1fr;}
  .adj-r{grid-template-columns:1fr;}
  .lpi-grid{grid-template-columns:1fr 1fr;}
}


`;

// ── Connected revenue economics (BGS-style, per-scenario) ──
// Service level builds up from the scenario's base SL + the autonomous-chain lift
// (auto-approved actions) + the human-selectable option lift. The Command Centre
// shows this as a RANGE; the Next Best Action tab lands inside it as the planner
// selects options, so the story stays consistent end-to-end:
//   auto-only  = base + autonomous actions  (lower bound — no human option yet)
//   best-case  = base + autonomous + best human option per decision (upper bound)
//   Revenue Protected = Revenue at Risk × SL achieved (always ≤ at risk).
function computeResolutionModel(sc) {
  if (!sc) return null;
  const loss = sc.loss || 0;
  const slBase = (typeof SL_BASE_MAP !== 'undefined' ? SL_BASE_MAP[sc.id] : null) || 76;
  const actions = (sc.agentData && sc.agentData.nbaActions) || [];
  // autonomous chain — actions already auto-approved (done)
  const autoSLLift = actions.filter(a => a.done)
    .reduce((s, a) => s + ((a.kpiDelta && a.kpiDelta.sl) || 0), 0);
  // human decisions — each has options; best/worst pick per decision
  const optionActions = actions.filter(a => a.options && a.options.length && !a.done);
  const bestOptSL  = optionActions.reduce((s, a) => s + Math.max(...a.options.map(o => (o.kpiDelta && o.kpiDelta.sl) || 0)), 0);
  const worstOptSL = optionActions.reduce((s, a) => s + Math.min(...a.options.map(o => (o.kpiDelta && o.kpiDelta.sl) || 0)), 0);
  // simple planner toggles (no options) — selectable, so they count toward the best case
  const toggleActions = actions.filter(a => (!a.options || !a.options.length) && !a.done);
  const toggleSL = toggleActions.reduce((s, a) => s + ((a.kpiDelta && a.kpiDelta.sl) || 0), 0);
  const bestNBASL = bestOptSL + toggleSL;   // best option per decision + all toggles on
  const worstNBASL = worstOptSL;            // worst option per decision + toggles off (0)
  // SL bounds (same cap logic as the NBA projection: total lift capped at +22pp, SL at 98.5%)
  const autoOnlySL = Math.min(98.5, slBase + Math.min(22, autoSLLift));
  const bestSL     = Math.min(98.5, slBase + Math.min(22, autoSLLift + bestNBASL));
  const worstSL    = Math.min(98.5, slBase + Math.min(22, autoSLLift + worstNBASL));
  // Revenue protected at each end of the SL range
  const revMin = Math.round(loss * autoOnlySL / 100);   // auto-only
  const revMax = Math.round(loss * bestSL / 100);        // auto + best option
  // Fill rate tracks service level with a small consistent offset (same relationship
  // used in Forecast Approval: fill ≈ SL + 1.4pp, capped at 98.8%). One SL driver.
  const bestFill = Math.min(98.8, bestSL + 1.4);
  return { loss, slBase, autoSLLift, bestNBASL, worstNBASL, autoOnlySL, bestSL, worstSL, revMin, revMax, bestFill };
}
// Headline single values (best-case) for tabs that show one number.
function slAfterFor(sc) { const r = computeResolutionModel(sc); return r ? r.bestSL : 97.5; }
function revProtectedFor(sc) { const r = computeResolutionModel(sc); return r ? r.revMax : 0; }

/* KPI value coloring */
function kpiColor(kpi, val) {
  if (kpi.targetDir === 'info') return '#7B9BBF';
  if (kpi.targetDir === 'lt') return val <= kpi.thresh ? '#22C55E' : '#F87171';
  if (kpi.targetDir === 'gt') return val >= kpi.thresh ? '#22C55E' : '#F87171';
  if (kpi.targetDir === 'range') return '#FBBF24';
  return '#E8ECF4';
}
function formatKpiVal(key, val) {
  if (key === 'lostSales') return `$${val.toFixed(1)}M/wk`;
  if (key === 'revenueRisk') return val > 0 ? `$${val}K` : '—';
  if (key === 'transferVol') return val > 0 ? `${val} units` : '—';
  if (key === 'promoLift') return val > 0 ? `${val}x` : 'N/A';
  return `${val}`;
}

      </div>

        {shown.map(k => {
          const raw = kpiVals[k.key] ?? BASE_KPI[k.key] ?? 0;

          return (
            <div key={k.id} className={`kpi-card-exec ${kpiType}`}>
              <div className="kce-name">{k.name}</div>
              <div className="kce-val" style={{ color }}>{formatKpiVal(k.key, raw)}{k.unit && !['lostSales','revenueRisk','transferVol','promoLift'].includes(k.key) ? k.unit : ''}</div>

}

                // Collapsible broader-category group: header shows the category + scenario count,
                // expands (one at a time, driven by activeTrigId) to reveal its scenarios.
                const isExpanded = t.id === activeTrigId;
                const accent = t.color;
                const grad = t.id === 'weather' ? 'linear-gradient(135deg,#F59E0B,#EF4444)'
                           : t.id === 'promo'   ? 'linear-gradient(135deg,#009FE0,#00529F)'

                const abbr = t.id === 'weather' ? 'WX' : t.id === 'promo' ? 'PR' : 'EV';
                const rgba = t.id === 'weather' ? '245,158,11' : t.id === 'promo' ? '0,159,224' : '129,140,248';
                return (
                  <div key={t.id} style={{ marginBottom: 4 }}>
                    {/* ── CATEGORY HEADER — click to expand/collapse ── */}
                    <div
                      onClick={() => setActiveTrigId(isExpanded ? null : t.id)}
                      style={{
                        display: 'flex', alignItems: 'center', gap: 8,
                        padding: '8px 10px', borderRadius: 8, cursor: 'pointer',
                        background: isExpanded ? `rgba(${rgba},0.08)` : 'var(--card-2)',
                        border: `1px solid ${isExpanded ? accent + '44' : 'var(--stroke)'}`,
                        transition: 'all .18s ease', userSelect: 'none',
                      }}>
                      <div style={{ width: 4, height: 28, borderRadius: 2, background: grad, flexShrink: 0 }} />
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 11, fontWeight: 700, color: isExpanded ? accent : 'var(--text)', letterSpacing: '-0.01em' }}>
                          {t.label}
