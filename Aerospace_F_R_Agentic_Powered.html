      <div className="gf-badge">{active.length ? `Filter: ${active.join(' / ')}` : 'Showing: All Products'}</div>
    </div>
  );
}

/* KPI value coloring */
function kpiColor(kpi, val) {
  if (kpi.targetDir === 'info') return '#7B9BBF';
  if (kpi.targetDir === 'lt') return val <= kpi.thresh ? '#22C55E' : '#F87171';
  if (kpi.targetDir === 'gt') return val >= kpi.thresh ? '#22C55E' : '#F87171';
  if (kpi.targetDir === 'range') return '#FBBF24';
  return '#E8ECF4';
}
function formatKpiVal(key, val) {
  if (key === 'lostSales') return `$${val.toFixed(1)}K/wk`;
  if (key === 'revenueRisk') return val > 0 ? `$${val}K` : '—';
  if (key === 'transferVol') return val > 0 ? `${val} units` : '—';
  if (key === 'aogResTime') return val > 0 ? `${val} hrs` : 'N/A';
  return `${val}`;
}

/* KPI Section with expand */
function KpiSection({ title, badge, badgeStyle, kpiType, kpis, kpiVals }) {
  const [expanded, setExpanded] = useState(false);
  const relevant = kpis; // Show all KPIs for this section — business health is independent of active trigger
  const shown = expanded ? relevant : relevant.slice(0, 5);
  const hasMore = relevant.length > 5;
  return (
    <div className="ev-section">
      <div className="ev-section-title">
        {title}
        <span className="ev-badge" style={badgeStyle}>{badge}</span>
      </div>
      <div className="kpi-cat-grid">
        {shown.map(k => {
          const raw = kpiVals[k.key] ?? BASE_KPI[k.key] ?? 0;
          const color = kpiColor(k, raw);
          return (
            <div key={k.id} className={`kpi-card-exec ${kpiType}`}>
              <div className="kce-name">{k.name}</div>
              <div className="kce-val" style={{ color }}>{formatKpiVal(k.key, raw)}{k.unit && !['lostSales','revenueRisk','transferVol','aogResTime'].includes(k.key) ? k.unit : ''}</div>
              <div className="kce-target">Target: {k.target}</div>
            </div>
          );
        })}
      </div>
      {hasMore && (
        <button className="kpi-expand-btn" onClick={() => setExpanded(e => !e)}>
          {expanded ? `▲ Show fewer` : `▼ +${relevant.length - 5} more KPIs`}
        </button>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────
   RESOLUTION MODEL
   Derives auto-resolved, NBA-dependent range,
   and residual risk from actual scenario data.
   Accepts selectedNBA map so panel can show
   exact values once planner picks an option.
───────────────────────────────────────────── */
function computeResolutionModel(sc, selectedNBA = {}, fcstState = {}) {
  if (!sc) return null;

  const loss         = sc.loss || 0;
  const autoRate     = parseFloat(sc.autoR || 0) / 100;
  const slBase       = SL_BASE_MAP[sc.id] || 74;
  const fAdj         = fcstSLAdj(sc, fcstState); // forecast-coverage SL term (≤0, 0 at default)

  const nbaActions    = sc.agentData?.nbaActions || [];
  const autoDone      = nbaActions.filter(a => a.done);
  const optionActions = nbaActions.filter(a => a.options && !a.done);

  // Auto chain SL lift — always applies
  const autoSLLift = autoDone.reduce((s, a) => s + (a.kpiDelta?.sl || 0), 0);

  // Range: best / worst across all option actions
  const bestNBASL  = optionActions.reduce((s, a) => {
    if (!a.options || !a.options.length) return s;
    return s + Math.max(...a.options.map(o => o.kpiDelta?.sl || 0));
  }, 0);
  const worstNBASL = optionActions.reduce((s, a) => {
    if (!a.options || !a.options.length) return s;
    return s + Math.min(...a.options.map(o => o.kpiDelta?.sl || 0));
  }, 0);

  // Service level after action — SINGLE SOURCE OF TRUTH.
  // (Previously a separate hardcoded sc.fillRateAfter drove revenue, which could
  //  disagree with the SL shown on the panel. Now both derive from the same lift.)
  const slBestCase  = Math.min(100, slBase + autoSLLift + bestNBASL + fAdj);
  const slWorstCase = Math.min(97,  slBase + autoSLLift + worstNBASL + fAdj);

  // Revenue ceiling now derives from the best-case post-action service level.
  // At best-case SL you protect that fraction of the at-risk revenue; the rest is structural residual.
  const fillRateAfter  = slBestCase;
  const maxResolvable  = Math.round(loss * (slBestCase / 100));
  const alwaysResidual = loss - maxResolvable;

  const totalMaxLift = autoSLLift + bestNBASL || 1;
  const autoResolved = Math.round(maxResolvable * (autoSLLift / totalMaxLift));
  const nbaRevBest   = Math.round(maxResolvable * (bestNBASL  / totalMaxLift));
  const nbaRevWorst  = Math.round(maxResolvable * (worstNBASL / totalMaxLift));
  const residualBest  = Math.max(0, loss - autoResolved - nbaRevBest);
  const residualWorst = Math.max(0, loss - autoResolved - nbaRevWorst);

  // Selected state — computed when planner has chosen an option for every action
  const allSelected = optionActions.length > 0 &&
    optionActions.every(a => selectedNBA[a.id]);

  let selSLLift = 0, selNBARevenue = 0, selCost = 0, selLabel = '';
  if (allSelected) {
    optionActions.forEach(a => {
      const chosen = a.options.find(o => o.id === selectedNBA[a.id]);
      if (chosen) {
        selSLLift    += chosen.kpiDelta?.sl   || 0;
        selCost      += chosen.kpiDelta?.cost || 0;
        selLabel      = chosen.label;
      }
    });
    selNBARevenue = Math.round(maxResolvable * (selSLLift / totalMaxLift));
  }

  // Expedite cost range across options (only premium cost, not base PO cost)
  const bestNBACost  = optionActions.reduce((s, a) => {
    if (!a.options || !a.options.length) return s;
    const opt = a.options.reduce((b, o) => ((o.kpiDelta?.sl||0) > (b.kpiDelta?.sl||0) ? o : b), a.options[0]);
    return s + (opt?.kpiDelta?.cost || 0);
  }, 0);
  const worstNBACost = optionActions.reduce((s, a) => {
    if (!a.options || !a.options.length) return s;
    const opt = a.options.reduce((w, o) => ((o.kpiDelta?.sl||0) < (w.kpiDelta?.sl||0) ? o : w), a.options[0]);
    return s + (opt?.kpiDelta?.cost || 0);
  }, 0);

  // Working capital freed — sum of |cost| from auto-done actions where cost < 0
  // These are PO cancellations and cost savings generated automatically by the chain
  // (e.g. cancel excess old-P/N orders, reduce open POs on retiring-fleet parts)
  const workingCapFreed = autoDone.reduce((s, a) => {
    const c = a.kpiDelta?.cost || 0;
    return s + (c < 0 ? Math.abs(c) : 0);
  }, 0);

  // Net benefit = revenue protected − expedite premium + working capital freed
  const netBenefitBest     = autoResolved + nbaRevBest   - bestNBACost  + workingCapFreed;
  const netBenefitWorst    = autoResolved + nbaRevWorst  - worstNBACost + workingCapFreed;
  const netBenefitSelected = allSelected
    ? autoResolved + selNBARevenue - selCost + workingCapFreed
    : null;

  const slSelected      = allSelected ? Math.min(98.5, slBase + autoSLLift + selSLLift + fAdj) : null;
  const residualSelected= allSelected ? Math.max(0, loss - autoResolved - selNBARevenue) : null;

  const autoBarPct      = (autoResolved / Math.max(1, loss)) * 100;
  const nbaBestBarPct   = (nbaRevBest   / Math.max(1, loss)) * 100;
  const selBarPct       = allSelected ? (selNBARevenue / Math.max(1, loss)) * 100 : null;
  const residualBestPct = (residualBest / Math.max(1, loss)) * 100;
  const residualSelPct  = allSelected ? (residualSelected / Math.max(1, loss)) * 100 : null;

  return {
    loss, maxResolvable, alwaysResidual,
    autoResolved, autoRate: Math.round(autoRate * 100),
    nbaRevBest, nbaRevWorst, selNBARevenue,
    residualBest, residualWorst, residualSelected,
    slBase, slBestCase, slWorstCase, slSelected,
    autoSLLift, bestNBASL, worstNBASL, selSLLift,
    selCost, selLabel, bestNBACost, worstNBACost,
    workingCapFreed,
    netBenefitBest, netBenefitWorst, netBenefitSelected,
    hasPlannerDecision: optionActions.length > 0,
    allSelected,
    nbaActions, autoDone, optionActions,
    autoBarPct, nbaBestBarPct, selBarPct,
    residualBestPct, residualSelPct,
  };
}

/* ─────────────────────────────────────────────
   RESIDUAL EXPLANATION
   Builds contextual reason text from scenario
   data — lead times, fill rate cap, DC
   constraints, and NBA option choice.
───────────────────────────────────────────── */
function getResidualExplanation(sc, r) {
  const fillRateAfter  = (r && r.slBestCase != null) ? r.slBestCase : parseFloat(sc.fillRateAfter || 95);
  const gapPct         = (100 - fillRateAfter).toFixed(1);
  const dc             = sc.agentData?.dcConstraint || sc.dcConstraint;
  const structural     = r.alwaysResidual;
  const choiceResidual = r.allSelected
    ? Math.max(0, (r.residualSelected || 0) - structural)
    : null;

  // Scenario-specific structural reason
  let structuralWhy = '';
  if (fillRateAfter >= 100) {
    structuralWhy = 'No structural residual for this scenario — LLP demand is deterministic. Full resolution is possible if stock is ordered in time. Any residual shown comes entirely from the NBA option chosen.';
  } else if (dc?.shortfallTails && dc?.leadTimeWeeks) {
    structuralWhy = `${dc.shortfallTails} tails have compliance deadlines before the standard ${dc.leadTimeWeeks}-week lead time. Even with expediting, parts cannot physically reach these tails before their maintenance window closes. This creates a hard floor of ~$${structural}K that no planning action can eliminate.`;
  } else if (sc.id?.startsWith('w')) {
    structuralWhy = `Airworthiness Directive compliance scheduling — hangar slots and operator capacity mean not all ${sc.affected} affected tails can complete the inspection within the compliance window, regardless of parts availability. The ${gapPct}% gap (~$${structural}K) reflects this hard scheduling constraint.`;
  } else if (sc.id?.startsWith('e')) {
    structuralWhy = `Stock repositioning lag — physically moving inventory to all affected FSLs takes time. The ${gapPct}% gap (~$${structural}K) reflects tails that will experience a brief coverage window before repositioned stock arrives at their home FSL.`;
  } else if (sc.id?.startsWith('d')) {
    structuralWhy = `Demand signal uncertainty — the trigger is based on quote and search patterns, not firm orders. The ${gapPct}% gap (~$${structural}K) reflects the probability that not all signalled demand converts to real orders within the forecast horizon.`;
  } else {
    structuralWhy = `The ${gapPct}% structural gap (~$${structural}K) reflects physical supply chain constraints — lead times, repair cycle times, and logistics capacity — that cannot be fully closed within the planning horizon regardless of which actions are taken.`;
  }

  // NBA choice contribution (only when option is selected)
  const choiceWhy = choiceResidual > 0
    ? `An additional $${choiceResidual}K of residual comes from the ${r.selLabel} choice. Selecting a higher-SL option would reduce this portion.`
    : r.allSelected && choiceResidual === 0
    ? `No additional residual from the ${r.selLabel} choice — this option fully utilises the available resolution capacity.`
    : null;

  // What to do about it
  const mitigation = fillRateAfter >= 100 ? null
    : dc?.shortfallTails
    ? 'These tails can be managed via: interim P/N fitment under transitional approval, operator maintenance slot rescheduling, or regulatory deferral request where airworthiness permits.'
    : sc.id?.startsWith('w')
    ? 'Operator coordination on inspection slot sequencing can reduce this further. Priority scheduling for highest-risk tails is already handled by the NBA allocation decision.'
    : 'Residual tails are flagged for the next planning cycle. They do not disappear — they become priority items tracked as open risk.';

  return { structural, choiceResidual, structuralWhy, choiceWhy, mitigation, fillRateAfter, gapPct };
}


/* ─────────────────────────────────────────────
   RISK FOCUS — per-part risk concentration
   Ranks the affected parts in a scenario by how
   much planning attention they need, BEFORE any
   agent acts. Combines criticality, size of the
   demand shift, forecast uncertainty band, and
   confidence into a single relative risk score,
   with a plain-language reason per part.
───────────────────────────────────────────── */
function computeRiskFocus(sc) {
  const products = (sc.fcst || []).map(p => {
    const old = p.old || 0;
    const ai  = p.ai  || 0;
    const change    = ai - old;
    const changeMag = Math.abs(change);
    const relChange = old > 0 ? changeMag / old : 1;          // new P/N = full relative shift
    const band      = (p.ub || ai) - (p.lb || ai);
    const uncertainty = ai > 0 ? band / ai : 0.5;
    const conf      = p.conf != null ? p.conf : 80;
    const confPenalty = (100 - conf) / 100;
    const critWeight  = p.criticality === 'aog' ? 1 : p.criticality === 'critical' ? 0.65 : 0.4;
    const rawScore  = critWeight * (0.4 + Math.min(1.2, relChange)) * (1 + uncertainty * 0.8 + confPenalty * 0.6);
    const direction = change > 0 ? 'surge' : change < 0 ? 'drawdown' : 'flat';
    const critLabel = p.criticality === 'aog' ? 'AOG-critical' : p.criticality === 'critical' ? 'Critical' : 'Routine';

    let why;
    if (p.newPart)               why = `New P/N at zero stock — full build of ${ai} units to cover ${p.scope || 'the fleet'}. Highest exposure until first receipts land.`;
    else if (direction === 'surge')    why = `Demand surge +${changeMag} units vs current plan — under-stocked; risk of expedites and missed AOG cover.`;
    else if (direction === 'drawdown') why = `Demand drawdown −${changeMag} units — obsolescence / excess-stock and write-off risk if POs aren't trimmed.`;
    else                          why = `Demand broadly stable — monitor only.`;
    if (conf < 80) why += ` Forecast confidence ${conf}% — wide band adds uncertainty.`;

    return { name: p.name, criticality: p.criticality, critLabel, direction, change, changeMag, old, ai, conf, rawScore, why, newPart: !!p.newPart, partType: p.partType, cat: p.cat };
  });

  const maxScore = Math.max(1, ...products.map(p => p.rawScore));
  products.forEach(p => { p.riskPct = Math.round((p.rawScore / maxScore) * 100); });
  products.sort((a, b) => b.rawScore - a.rawScore);
  return products;
}

            { label:'Service Level — With Action (range)', color:'#22C55E', formula:'auto: slBase + autoSLLift   →   best: + bestNBASL', desc:'Lower bound is the autonomous chain alone (auto-approved actions, no planner option); upper bound adds the best next-best-action option. The live decision happens later in the pipeline.' },

    </div>
  );

// Explicit agent sequence — handles the '6b' string step correctly
const CHAIN_SEQ = [1, 2, 3, 4, 5, 6, '6b', 7, 8, 9];
function chainNext(cur) {
  const idx = CHAIN_SEQ.indexOf(cur);
  return idx < CHAIN_SEQ.length - 1 ? CHAIN_SEQ[idx + 1] : null;
}
function chainIsLast(cur) { return CHAIN_SEQ.indexOf(cur) >= CHAIN_SEQ.length - 1; }

/* ─────────────────────────────────────────────

───────────────────────────────────────────── */
function Gauge({ pct, color, size = 110 }) {
  const r = size / 2 - 10;
  const circ = Math.PI * 2 * r;
  const off = circ - (pct / 100) * circ;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="7" />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="7"
        strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`} style={{ transition: 'stroke-dashoffset 1.5s ease' }} />
    </svg>
  );
}

function DonutChart({ segs, size = 130 }) {
  const r = size / 2 - 14;
  const circ = Math.PI * 2 * r;
  let offset = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {segs.map((s, i) => {
        const len = (s.pct / 100) * circ;
        const el = <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={s.color}
          strokeWidth="18" strokeDasharray={`${len} ${circ - len}`}
          strokeDashoffset={-offset} transform={`rotate(-90 ${size/2} ${size/2})`} />;
        offset += len;
        return el;
      })}
    </svg>
  );
}

function TrendBandSVG({ name, hist, fcstPt, fcstLB, fcstUB, onExpand }) {
  const W = 340, H = 110, PAD = 28;
  const all = [...hist, ...fcstPt, ...fcstLB, ...fcstUB];
  const mn = Math.min(...all) * 0.75, mx = Math.max(...all) * 1.18;
  const scX = i => PAD + i * ((W - 2*PAD) / (hist.length + fcstPt.length - 1));
  const scY = v => H - PAD - (v - mn) / (mx - mn) * (H - 2*PAD);
  const fStart = hist.length - 1;

  const histPath = hist.map((v,i) => `${i===0?'M':'L'}${scX(i).toFixed(1)},${scY(v).toFixed(1)}`).join(' ');
  const fcstPath = `M${scX(fStart).toFixed(1)},${scY(hist[fStart]).toFixed(1)} ` +
    fcstPt.map((v,i) => `L${scX(fStart+1+i).toFixed(1)},${scY(v).toFixed(1)}`).join(' ');

  const ubPts = fcstUB.map((v,i) => `${scX(fStart+1+i).toFixed(1)},${scY(v).toFixed(1)}`);
  const lbPtsRev = [...fcstLB].reverse().map((v,i) => `${scX(fStart+fcstLB.length-i).toFixed(1)},${scY(v).toFixed(1)}`);
  const bandPoly = [...ubPts, ...lbPtsRev].join(' ');

  const baseY = scY(hist[hist.length-1]);
  const baseLine = `M${scX(fStart).toFixed(1)},${baseY.toFixed(1)} L${scX(fStart+fcstPt.length).toFixed(1)},${baseY.toFixed(1)}`;
  const ubPath = `M${scX(fStart).toFixed(1)},${scY(hist[fStart]).toFixed(1)} ` + fcstUB.map((v,i)=>`L${scX(fStart+1+i).toFixed(1)},${scY(v).toFixed(1)}`).join(' ');
  const lbPath = `M${scX(fStart).toFixed(1)},${scY(hist[fStart]).toFixed(1)} ` + fcstLB.map((v,i)=>`L${scX(fStart+1+i).toFixed(1)},${scY(v).toFixed(1)}`).join(' ');

  return (
    <div style={{ background: 'var(--bg2)', borderRadius: 8, padding: 10, border: '1px solid var(--border)', cursor: onExpand ? 'pointer' : 'default' }}
      onClick={onExpand} title={onExpand ? 'Click for full view' : ''}>

        <span>{name}</span>
        {onExpand && <span style={{ fontSize: 8, color: 'var(--brand-light)' }}>🔍 expand</span>}
      </div>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ display: 'block' }}>
        <rect x={scX(fStart)} y="4" width={W - scX(fStart) - 4} height={H-8} fill="rgba(0,159,224,0.03)" rx="3" />
        <text x={scX(fStart)+3} y="13" fontSize="7" fill="var(--muted)" fontFamily="DM Sans">Forecast</text>
        <text x={PAD} y="13" fontSize="7" fill="var(--muted)" fontFamily="DM Sans">Historical</text>
        <polygon points={bandPoly} fill="rgba(0,159,224,0.10)" stroke="none" />
        <path d={histPath} fill="none" stroke="rgba(255,255,255,0.28)" strokeWidth="1.5" />
        <path d={baseLine} fill="none" stroke="rgba(255,255,255,0.12)" strokeWidth="1" strokeDasharray="4 4" />
        <path d={ubPath} fill="none" stroke="rgba(0,159,224,0.38)" strokeWidth="1" strokeDasharray="3 3" />
        <path d={lbPath} fill="none" stroke="rgba(0,159,224,0.38)" strokeWidth="1" strokeDasharray="3 3" />
        <path d={fcstPath} fill="none" stroke="#009FE0" strokeWidth="2" strokeDasharray="5 3" />
        {fcstPt.map((v,i) => <circle key={i} cx={scX(fStart+1+i)} cy={scY(v)} r="2.5" fill="#009FE0" />)}
        <text x={scX(fStart+fcstPt.length)+2} y={scY(fcstUB[fcstUB.length-1])-2} fontSize="7" fill="rgba(0,159,224,0.55)" fontFamily="DM Sans">UB</text>

      </svg>
    </div>
  );
}

/* build per-product history/forecast arrays from scenario data */
function buildProductChartData(p) {
  const seed = p.old;
  const hist = Array.from({ length: 13 }, (_, i) => Math.max(1, Math.round(seed * (0.85 + Math.sin(i * 0.7) * 0.12 + (i/13)*0.08))));
  hist.push(seed);
  const span = 3;
  const fcstPt = Array.from({ length: span }, (_, i) => Math.round(p.ai * (1 + Math.sin(i * 0.9) * 0.06)));
  const fcstLB = fcstPt.map(v => Math.round(v * (p.lb / p.ai)));
  const fcstUB = fcstPt.map(v => Math.round(v * (p.ub / p.ai)));
  return { ...p, histData: hist, fcstData: fcstPt, lbData: fcstLB, ubData: fcstUB };
}

/* ─────────────────────────────────────────────
   BOUNDED INPUT — for Forecast Approval "Your value"
   Non-blocking tooltip warning when value is outside [lb, ub]
───────────────────────────────────────────── */
function BoundedInput({ value, lb, ub, edited, disabled, onChange }) {
  const [focused, setFocused] = useState(false);
  const [hovered, setHovered] = useState(false);
  const numVal = Number(value);
  const oob = !isNaN(numVal) && (numVal < lb || numVal > ub);
  const showTip = oob && (focused || hovered);
  const direction = numVal < lb ? 'below' : numVal > ub ? 'above' : null;

  return (
    <div
      className="fcst-input-wrap"
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
    >
      <input
        type="number"
        className={`fcst-input${edited ? ' edited' : ''}${oob ? ' oob' : ''}`}
        value={value}
        min="0"
        disabled={disabled}
        onChange={e => {
          const v = parseInt(e.target.value);
          if (!isNaN(v) && v >= 0) onChange(v);
        }}
        onFocus={e => { setFocused(true); e.target.select(); }}
        onBlur={() => setFocused(false)}
        aria-invalid={oob}
        title={oob ? `Value is outside bounds [${lb}–${ub}]` : ''}
      />
      {showTip && (
        <div className="bounds-tip" role="alert">
          <strong>⚠ Value is outside bounds</strong>
          <div style={{ fontSize: 9, color: 'var(--text-3)', marginTop: 2, fontWeight: 500 }}>
            {direction === 'below' ? `Below LB ${lb}` : `Above UB ${ub}`} · Range [{lb}–{ub}]
          </div>
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────
   FORECAST CHANGE REASONS
   Scenario- and direction-aware reason list for
   when a planner overrides the AI forecast.
   Increasing vs decreasing yields different
   reasons; trigger type adds context-specific
   options. Always ends with "Other".
───────────────────────────────────────────── */
function getForecastReasons(sc, p, editedVal) {
  const increasing = editedVal > p.ai;
  const t = sc.trigType;
  const reasons = [];

  if (increasing) {
    reasons.push('Operator AOG history suggests higher demand');
    reasons.push('Conservative buffer for AOG-critical part');
    if (t === 'promo')  reasons.push('Faster supersession uptake than modeled');
    if (t === 'weather') reasons.push('Higher inspection finding rate expected');
    if (t === 'demand') reasons.push('Cross-operator demand breadth underestimated');
    if (t === 'event')  reasons.push('Fleet utilisation ramping ahead of plan');
    if (t === 'llp')    reasons.push('Additional tails approaching cycle limit');
    reasons.push('Supplier lead-time risk — build safety stock');
  } else {
    reasons.push('Excess stock already in the pipeline');
    reasons.push('Model over-reacting to a one-time signal');
    if (t === 'promo')  reasons.push('Slower transition — legacy P/N still in service');
    if (t === 'weather') reasons.push('Lower finding rate than modeled');
    if (t === 'demand') reasons.push('Demand signal not yet confirmed by firm orders');
    if (t === 'event')  reasons.push('Tails retiring sooner than modeled');
    if (t === 'llp')    reasons.push('Cycle-limit dates later than forecast');
    reasons.push('Working capital / budget constraint');
  }
  reasons.push('Engineering judgment / SME override');
  reasons.push('Aligning with customer contract commitment');
  reasons.push('Other (add comment below)');
  return reasons;
}

function AgPanel6b({ sc, filter, fcstState, setFcstState, fcstSubmitted, setFcstSubmitted, onResume, autonomousToggle, setAutonomousToggle }) {
  const [localFilter, setLocalFilter] = useState({ cat: 'All Categories', loc: 'All Locations' });
  const [expandedRow, setExpandedRow] = useState(null);

  // All products for this scenario (no filter — planner approves all)
  const allProds = sc.fcst;
  // Filtered view for the approval table
  const prods = allProds.filter(p => {
    const catMatch = localFilter.cat === 'All Categories' || p.cat === localFilter.cat;
    const locMatch = localFilter.loc === 'All Locations' || p.loc === localFilter.loc;
    return catMatch && locMatch;
  });

  const noImpact = prods.length === 0;
  const dec = Object.keys(fcstState).length;
  const tot = allProds.length; // submit requires ALL products reviewed, not just filtered
  const approved = Object.values(fcstState).filter(s => s.approved).length;
  const edited = dec - approved;

  // Resolution model — aligns with Command Centre numbers
  const r6b = computeResolutionModel(sc, {}, fcstState);

  // Aggregate metrics — always over all products × all tails
  const totalRevisedUnits = allProds.reduce((s, p) => {
    const st = fcstState[allProds.indexOf(p)];
    const v = st ? st.value : p.ai;
    return s + Math.ceil(v);
  }, 0);
  const totalBaselineUnits = allProds.reduce((s, p) => s + Math.ceil(p.old || 0), 0);
  const netRevUnits = totalRevisedUnits - totalBaselineUnits;
  const avgConfidence = Math.round(allProds.reduce((s, p) => s + p.conf, 0) / allProds.length);
  // Revenue impact proxy
  const revImpact = Math.round(netRevUnits * 0.65 * 8200 / 1000); // rough: units × avg MRO part value $8.2K

  // Suppression count
  const suppressions = allProds.filter(p => p.ai < p.old).length;
  const surges = allProds.filter(p => p.ai > p.old).length;

  // FEEDBACK #1: Hard bounds enforcement.
  // A row is out-of-bounds when its current value is < lb or > ub.
  // Out-of-bounds rows cannot be Accepted, and the plan cannot be Submitted
  // until all rows are within bounds. This protects downstream order generation
  // from forecast values the model has not endorsed within its 80% prediction interval.
  function isOob(p, val) {
    const v = Number(val);
    if (isNaN(v)) return false;
    return v < p.lb || v > p.ub;
  }
  // Per-row OOB lookup against the value the planner currently has staged
  function rowOob(p, gi) {
    const st = fcstState[gi];
    const v = st ? st.value : p.ai;
    return isOob(p, v);
  }
  // Plan-level: any row out of bounds blocks Submit
  const oobCount = allProds.filter((p, i) => rowOob(p, i)).length;
  const hasOob = oobCount > 0;

  function approveProd(globalIdx) {
    // Accept = approve at whatever value is currently in the input (edited or AI)
    const currentVal = fcstState[globalIdx]?.value ?? allProds[globalIdx].ai;
    // FEEDBACK #1: block Accept if the staged value is outside [lb, ub]
    if (isOob(allProds[globalIdx], currentVal)) return;
    setFcstState(s => ({ ...s, [globalIdx]: { ...s[globalIdx], approved: true, value: currentVal } }));
    setExpandedRow(null);
  }
  function editProd(globalIdx, val) {
    // Editing is always allowed — the planner needs to be able to type freely.
    // The OOB state is computed downstream and gates Accept/Submit.
    // Preserve any reason/comment already captured for this row.
    setFcstState(s => ({ ...s, [globalIdx]: { ...s[globalIdx], approved: false, value: Number(val) || 0 } }));
  }
  function setReason(globalIdx, reason) {
    setFcstState(s => ({ ...s, [globalIdx]: { ...s[globalIdx], reason } }));
  }
  function setComment(globalIdx, comment) {
    setFcstState(s => ({ ...s, [globalIdx]: { ...s[globalIdx], comment } }));
  }
  function approveAll() {
    // AI values are always within bounds (lb ≤ ai ≤ ub by construction),
    // so Accept All is always safe. We also clear any prior edited values
    // that were OOB, since the planner has chosen to defer to AI.
    const ns = {};
    allProds.forEach((p, i) => { ns[i] = { approved: true, value: p.ai }; });
    setFcstState(ns);
  }
  function submit() {
    // FEEDBACK #1: belt-and-braces — never submit if any row is OOB
    if (hasOob) return;
    setFcstSubmitted(true);
    setTimeout(onResume, 600);
  }

  // ── DOWNSTREAM IMPACT tracking — autonomousToggle received as prop ──

  // For per-product globalIdx lookup
  function getGlobalIdx(p) { return allProds.indexOf(p); }

  return (

            </div>

            <DownstreamImpactPanel sc={sc} fcstState={fcstState} allProds={allProds} autonomousToggle={autonomousToggle} setAutonomousToggle={setAutonomousToggle} />
              </div>{/* end left column */}

              <ImplicationsSnapshot sc={sc} fcstState={fcstState} allProds={allProds} fcstSubmitted={fcstSubmitted} dec={dec} tot={tot} approved={approved} edited={edited} />

}

            <div style={{ marginTop: 16, background: 'rgba(168,85,247,0.04)', border: '1px solid rgba(168,85,247,0.2)', borderRadius: 'var(--radius-sm)', overflow: 'hidden' }}>
              <div style={{ padding: '10px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer', borderBottom: deepDiveOpen ? '1px solid rgba(168,85,247,0.15)' : 'none' }} onClick={() => setDeepDiveOpen(o => !o)}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--text)' }}>SHAP Deep-Dive Analysis</span>
                  <span style={{ fontSize: 9, color: '#A855F7', background: 'rgba(168,85,247,0.12)', padding: '2px 8px', borderRadius: 5, fontWeight: 600 }}>Optional</span>
                </div>
                <span style={{ fontSize: 11, color: '#A855F7' }}>{deepDiveOpen ? '▲' : '▼'}</span>
              </div>
              {deepDiveOpen && (
                <div style={{ padding: '12px 14px' }}>
                  <p style={{ fontSize: 11, color: 'var(--muted)', marginBottom: 10, lineHeight: 1.5 }}>Full SHAP feature attribution for this scenario. The values below represent the decomposed contribution of each feature to the AI's demand revision.</p>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(220px,1fr))', gap: 8 }}>
                    {(sc.agentData?.features || []).map((f, i) => {
                      const barW = Math.min(100, Math.abs(parseFloat(f.updated) - parseFloat(f.prev)) / Math.max(parseFloat(f.updated), parseFloat(f.prev), 1) * 100 + 20);
                      return (
                        <div key={i} style={{ background: 'var(--bg2)', borderRadius: 6, padding: '10px 12px', border: '1px solid var(--border)' }}>
                          <div style={{ fontSize: 8, color: '#A855F7', textTransform: 'uppercase', letterSpacing: '.4px', fontWeight: 700, marginBottom: 3 }}>{f.type}</div>
                          <div style={{ fontSize: 10, fontWeight: 600, marginBottom: 3, fontFamily: 'var(--font-mono)', color: 'var(--brand-light)' }}>{f.name}</div>
                          <div style={{ height: 4, background: 'var(--card)', borderRadius: 2, marginBottom: 5 }}>
                            <div style={{ height: '100%', width: `${barW}%`, background: 'linear-gradient(90deg,#A855F7,#7C3AED)', borderRadius: 2 }} />
                          </div>
                          <div style={{ fontSize: 9, color: 'var(--muted)', lineHeight: 1.4 }}>{f.impact}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          </>
        }
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   CUSTOM ALLOCATION PANEL (FEEDBACK #2 + STEP 4A)
   Used inside Next Best Action — Priority Store Allocation (n3).
   Lets the planner manually edit per-FSL allocation while
   enforcing the supply constraint: Σ allocations ≤ available inventory.
───────────────────────────────────────────── */
function CustomAllocationPanel({ sc, action, isSelected, customAllocs, setCustomAllocs, disabled }) {
  // Available inventory comes from the DC constraint when present;
  // fallback to a sensible aggregate if not.
  const dc = sc.dcConstraint;
  const totalAvailable = (dc && dc.atpAvailable)
    ? dc.atpAvailable
    : Math.max(800, Math.round((sc.affected || 30) * 16));

  // Build the per-FSL list deterministically from sc.locFSL.
  // Each entry: { id, name, region, baseAlloc (default fair share) }
  const storeList = (() => {
    const out = [];
    const locs = sc.locFSL || {};
    let storeNum = 1;
    Object.entries(locs).forEach(([region, count]) => {
      for (let i = 0; i < count; i++) {
        const fslOps = ['Network Carrier','LCC-A','Charter Op','Regional A','Wet-Lease Op','Cargo Op','ACMI Op'];
        const opN = fslOps[(storeNum * 3 + region.charCodeAt(0)) % fslOps.length];
        out.push({
          id: `${region}-${i}`,
          name: `${opN} — ${region}`,
          region,
        });
      }
    });
    // Fallback for scenarios without locFSL
    if (out.length === 0) {
      const n = sc.affected || 30;
      for (let i = 0; i < n; i++) out.push({ id: `S-${i}`, name: `Store #${(i+1).toString().padStart(4,'0')}`, region: sc.region || '—' });
    }
    return out;
  })();

  // Fair share = available / N (rounded down so we don't exceed budget).
  const fairShare = Math.floor(totalAvailable / storeList.length);

  // Initialise / read state. Stored under action.id (e.g. 'n3').
  const stateKey = action.id;
  const current = customAllocs[stateKey];
  const perStore = (current && current.perStore) || (() => {
    const init = {};
    storeList.forEach(s => { init[s.id] = fairShare; });
    return init;
  })();

  // ── ALLOCATION TOTALS & VALIDATION STATUS ──
  // Memoised so we don't recompute on unrelated re-renders. Recomputes
  // exactly when per-FSL values or the supply ceiling changes — giving
  // the planner immediate, real-time feedback as they edit any input.
  const { totalAllocated, remaining, utilPct, skippedCount, allocStatus } = useMemo(() => {
    const total = Object.values(perStore).reduce((a, b) => a + (Number(b) || 0), 0);
    const rem = totalAvailable - total;                      // +ve = under, -ve = over, 0 = exact
    const pct = totalAvailable > 0 ? Math.min(100, Math.round((total / totalAvailable) * 100)) : 0;
    const skipped = storeList.filter(s => (Number(perStore[s.id]) || 0) === 0).length;
    const status = total > totalAvailable ? 'over' : total < totalAvailable ? 'under' : 'exact';
    return {
      totalAllocated: total,
      remaining: rem,
      utilPct: pct,
      skippedCount: skipped,
      allocStatus: status,
    };
  }, [perStore, totalAvailable, storeList]);

  function update(storeId, val) {
    if (disabled) return;
    const v = Math.max(0, parseInt(val) || 0);
    setCustomAllocs(prev => ({
      ...prev,
      [stateKey]: {
        perStore: { ...((prev[stateKey] && prev[stateKey].perStore) || perStore), [storeId]: v },
        totalAvailable,
      }
    }));
  }

  function distributeEvenly() {
    if (disabled) return;
    const fs = Math.floor(totalAvailable / storeList.length);
    const next = {};
    storeList.forEach(s => { next[s.id] = fs; });
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable } }));
  }

  function autoBalance() {
    if (disabled) return;
    // Scale all current allocations proportionally to fit budget exactly.
    const cur = Object.values(perStore).reduce((a, b) => a + (Number(b) || 0), 0);
    if (cur === 0) { distributeEvenly(); return; }
    const ratio = totalAvailable / cur;
    const next = {};
    storeList.forEach(s => { next[s.id] = Math.floor((Number(perStore[s.id]) || 0) * ratio); });
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable } }));
  }

  function clearAll() {
    if (disabled) return;
    const next = {};
    storeList.forEach(s => { next[s.id] = 0; });
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable } }));
  }

  // Limit visible rows but allow scroll
  const [showAll, setShowAll] = useState(false);
  const visibleStores = showAll ? storeList : storeList.slice(0, 8);

  // Status colour — drives both the budget bar and the "Allocated" value
  // tint. Maps directly to the three allocation cases:
  //   over  → bad   (red)
  //   under → warn  (amber)
  //   exact → ok    (green)
  const utilCls = allocStatus === 'over' ? 'bad' : allocStatus === 'under' ? 'warn' : 'ok';

  return (
    <div className={`custom-panel${isSelected ? ' selected' : ''}`}>
      <div className="custom-panel-head">
        <span className="custom-tag">Custom</span>
        <div style={{ flex: 1 }}>
          <div className="custom-panel-title">Manual FSL allocation</div>
          <div className="custom-panel-sub">Edit any store. Total allocation must not exceed available inventory.</div>
        </div>
      </div>

      {/* SUPPLY BUDGET */}
      <div className="custom-budget">
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Available</div>
          <div className="custom-budget-val">{totalAvailable.toLocaleString()} units</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Allocated</div>
          <div className={`custom-budget-val ${utilCls}`}>{totalAllocated.toLocaleString()} units</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">
            {allocStatus === 'over' ? 'Over by' : allocStatus === 'under' ? 'Under by' : 'Remaining'}
          </div>
          <div className={`custom-budget-val ${utilCls}`}>
            {Math.abs(remaining).toLocaleString()} units
          </div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">FSLs covered</div>
          <div className="custom-budget-val">{storeList.length - skippedCount}/{storeList.length}</div>
        </div>
        <div className="custom-budget-bar" title={`${utilPct}% utilised`}>
          <div className={`custom-budget-bar-fill ${utilCls}`} style={{ width: `${Math.min(100, utilPct)}%` }} />
        </div>
      </div>

      {/* ── REAL-TIME ALLOCATION VALIDATION ──
          Exactly one primary status message is shown at a time, driven by
          allocStatus ('over' | 'under' | 'exact'). Updates live on every
          input change. Skipped-tails note is informational only and
          appears underneath when relevant. */}
      {allocStatus === 'over' && (
        <div className="custom-msg bad" role="alert" aria-live="polite">
          ⚠ You are over-allocating by {Math.abs(remaining).toLocaleString()} units.
          Reduce per-FSL quantities until total ≤ {totalAvailable.toLocaleString()} units.
        </div>
      )}
      {allocStatus === 'under' && (
        <div className="custom-msg warn" role="status" aria-live="polite">
          ⚠ You are under-allocating by {remaining.toLocaleString()} units.
          {totalAvailable.toLocaleString()} units available — {totalAllocated.toLocaleString()} units assigned.
        </div>
      )}
      {allocStatus === 'exact' && totalAllocated > 0 && (
        <div className="custom-msg ok" role="status" aria-live="polite">
          ✓ Allocation matches available supply ({totalAvailable.toLocaleString()} units).
        </div>
      )}
      {/* Secondary informational note — does not block, just flags intent */}
      {allocStatus !== 'over' && skippedCount > 0 && (
        <div className="custom-msg warn" style={{ marginTop: 6 }}>
          {skippedCount} store{skippedCount > 1 ? 's' : ''} set to 0 — these will receive no allocation. Acceptable if intentional.
        </div>
      )}

      {/* CONTROLS */}
      <div className="custom-actions">
        <button className="custom-mini-btn" disabled={disabled} onClick={distributeEvenly}>↔ Distribute evenly</button>
        <button className="custom-mini-btn" disabled={disabled} onClick={autoBalance}>⚖ Auto-balance to budget</button>
        <button className="custom-mini-btn" disabled={disabled} onClick={clearAll}>✕ Clear all</button>
        <span style={{ fontSize: 9, color: 'var(--muted)', marginLeft: 'auto' }}>
          Fair share: {fairShare.toLocaleString()} units/tail · {storeList.length} tails
        </span>
      </div>

      {/* PER-FSL TABLE */}
      <div className="custom-table" style={{ marginTop: 10, maxHeight: 300, overflowY: 'auto' }}>
        <div className="custom-row hdr">
          <div>Tail / FSL · Region</div>
          <div style={{ textAlign: 'center' }}>Fair share</div>
          <div style={{ textAlign: 'center' }}>Your allocation</div>
          <div style={{ textAlign: 'center' }}>Δ vs fair</div>
          <div></div>
        </div>
        {visibleStores.map(s => {
          const v = Number(perStore[s.id]) || 0;
          const delta = v - fairShare;
          const isZero = v === 0;
          return (
            <div key={s.id} className={`custom-row${isZero ? ' invalid' : ''}`}>
              <div>
                <div style={{ fontWeight: 600 }}>{s.name}</div>
                <div style={{ fontSize: 9, color: 'var(--muted)' }}>{s.region}</div>
              </div>
              <div style={{ textAlign: 'center', color: 'var(--muted)', fontSize: 10 }}>{fairShare}</div>
              <div>
                <input
                  type="number"
                  className={`custom-input${isZero ? ' invalid' : ''}`}
                  min="0"
                  value={v}
                  disabled={disabled}
                  onChange={e => update(s.id, e.target.value)}
                  onFocus={e => e.target.select()}
                />
              </div>
              <div className={`custom-row-tag ${delta > 0 ? 'ok' : delta < 0 ? 'warn' : ''}`} style={{ textAlign: 'center' }}>
                {delta > 0 ? `+${delta}` : delta < 0 ? delta : '—'}
              </div>
              <div style={{ textAlign: 'center', fontSize: 11, color: isZero ? 'var(--red-l)' : 'var(--muted)' }} title={isZero ? 'Skipped' : 'Allocated'}>
                {isZero ? '∅' : '✓'}
              </div>
            </div>
          );
        })}
      </div>
      {storeList.length > 8 && (
        <button className="custom-mini-btn" style={{ marginTop: 8 }} onClick={() => setShowAll(s => !s)}>
          {showAll ? '↑ Collapse list' : `↓ Show all ${storeList.length} tails`}
        </button>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────
   CUSTOM SUBSTITUTION PANEL (FEEDBACK #2 + STEP 4B)
   Used inside Next Best Action — Product Substitution (n4).
   Lets the planner manually define substitution quantities per substitute SKU,
   constrained by available substitute supply for each.
───────────────────────────────────────────── */
function CustomSubstitutionPanel({ sc, action, isSelected, customAllocs, setCustomAllocs, disabled }) {
  // Build alternate-fulfilment route list. Aerospace-valid: approved interchangeable P/N,
  // FAA-approved PMA, and USM / rotable-pool draw. No cross-elasticity — availability/approval factor instead.
  // Each route: { id, name, available (units), availFactor (=approval/availability factor 0–1) }
  const baseAvailable = Math.max(60, Math.round((sc.affected || 30) * 4));
  const substitutes = [
    { id: 'sub-a', name: 'Repair-return of serviceable cores', available: baseAvailable,            availFactor: 0.82 },
    { id: 'sub-b', name: 'Approved interchangeable P/N',        available: Math.round(baseAvailable*0.7), availFactor: 0.90 },
    { id: 'sub-c', name: 'USM / rotable-pool draw',             available: Math.round(baseAvailable*0.5), availFactor: 0.70 },
  ];

  const stateKey = action.id;
  const current = customAllocs[stateKey];
  const perSub = (current && current.perStore) || (() => {
    const init = {};
    // Default: 50% of each substitute used
    substitutes.forEach(s => { init[s.id] = Math.floor(s.available * 0.5); });
    return init;
  })();

  // Aggregate gap to fill = the original action.qty if defined, else use a sensible default
  const targetGap = action.qty || 180;
  const totalSubstituted = Object.values(perSub).reduce((a, b) => a + (Number(b) || 0), 0);
  const gapRemaining = Math.max(0, targetGap - totalSubstituted);
  const gapClosedPct = Math.min(100, Math.round((totalSubstituted / targetGap) * 100));

  // Per-SKU constraint check
  const perSkuViolations = substitutes.filter(s => (Number(perSub[s.id]) || 0) > s.available);
  const anyViolation = perSkuViolations.length > 0;

  function update(subId, val) {
    if (disabled) return;
    const v = Math.max(0, parseInt(val) || 0);
    setCustomAllocs(prev => ({
      ...prev,
      [stateKey]: {
        perStore: { ...((prev[stateKey] && prev[stateKey].perStore) || perSub), [subId]: v },
        totalAvailable: targetGap,
      }
    }));
  }

  function fillGap() {
    if (disabled) return;
    // Fill the gap greedily within each substitute's available stock, in elasticity order
    let need = targetGap;
    const next = {};
    substitutes.forEach(s => { next[s.id] = 0; });
    const sorted = [...substitutes].sort((a, b) => b.availFactor - a.availFactor);
    for (const s of sorted) {
      if (need <= 0) break;
      const take = Math.min(need, s.available);
      next[s.id] = take;
      need -= take;
    }
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable: targetGap } }));
  }

  function clearAll() {
    if (disabled) return;
    const next = {};
    substitutes.forEach(s => { next[s.id] = 0; });
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable: targetGap } }));
  }

  const utilCls = anyViolation ? 'bad' : (gapClosedPct < 50 ? 'warn' : 'ok');

  return (
    <div className={`custom-panel${isSelected ? ' selected' : ''}`}>
      <div className="custom-panel-head">
        <span className="custom-tag">Custom</span>
        <div style={{ flex: 1 }}>
          <div className="custom-panel-title">Manual alternate-fulfilment mix</div>
          <div className="custom-panel-sub">Define how many units to fulfil via each approved route. Total per route must respect available supply.</div>
        </div>
      </div>

      {/* GAP BUDGET */}
      <div className="custom-budget">
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Demand gap</div>
          <div className="custom-budget-val">{targetGap.toLocaleString()} units</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Substituted</div>
          <div className={`custom-budget-val ${utilCls}`}>{totalSubstituted.toLocaleString()} units</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Gap closed</div>
          <div className={`custom-budget-val ${utilCls}`}>{gapClosedPct}%</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Gap remaining</div>
          <div className={`custom-budget-val ${gapRemaining > 0 ? 'warn' : 'ok'}`}>{gapRemaining.toLocaleString()} units</div>
        </div>
        <div className="custom-budget-bar" title={`${gapClosedPct}% of gap covered`}>
          <div className={`custom-budget-bar-fill ${utilCls}`} style={{ width: `${Math.min(100, gapClosedPct)}%` }} />
        </div>
      </div>

      {/* MESSAGES */}
      {anyViolation && (
        <div className="custom-msg bad">
          ⚠ Supply violation on {perSkuViolations.length} route{perSkuViolations.length > 1 ? 's' : ''}. Reduce the highlighted quantities to within available supply.
        </div>
      )}
      {!anyViolation && gapRemaining > 0 && totalSubstituted > 0 && (
        <div className="custom-msg warn">
          Partial coverage. {gapRemaining.toLocaleString()} units of demand gap still uncovered — fill rate may dip on the primary P/N.
        </div>
      )}
      {!anyViolation && gapRemaining === 0 && totalSubstituted > 0 && (
        <div className="custom-msg ok">
          ✓ Demand gap fully covered within available route supply. No constraint violation.
        </div>
      )}

      {/* CONTROLS */}
      <div className="custom-actions">
        <button className="custom-mini-btn" disabled={disabled} onClick={fillGap}>⚡ Auto-fill gap (by availability)</button>
        <button className="custom-mini-btn" disabled={disabled} onClick={clearAll}>✕ Clear all</button>
      </div>

      {/* PER-SUBSTITUTE TABLE */}
      <div className="custom-table" style={{ marginTop: 10 }}>
        <div className="custom-row hdr">
          <div>Fulfilment route</div>
          <div style={{ textAlign: 'center' }}>Available</div>
          <div style={{ textAlign: 'center' }}>Your qty</div>
          <div style={{ textAlign: 'center' }}>Avail. factor</div>
          <div></div>
        </div>
        {substitutes.map(s => {
          const v = Number(perSub[s.id]) || 0;
          const violates = v > s.available;
          return (
            <div key={s.id} className={`custom-row${violates ? ' invalid' : ''}`}>
              <div>
                <div style={{ fontWeight: 600 }}>{s.name}</div>
                <div style={{ fontSize: 9, color: 'var(--muted)' }}>Alternate fulfilment for {(sc.dcConstraint && sc.dcConstraint.constrainedSku) || 'primary P/N'}</div>
              </div>
              <div style={{ textAlign: 'center', color: 'var(--muted)', fontSize: 10 }}>{s.available.toLocaleString()} units</div>
              <div>
                <input
                  type="number"
                  className={`custom-input${violates ? ' invalid' : ''}`}
                  min="0"
                  max={s.available}
                  value={v}
                  disabled={disabled}
                  onChange={e => update(s.id, e.target.value)}
                  onFocus={e => e.target.select()}
                />
              </div>
              <div className="custom-row-tag" style={{ textAlign: 'center' }}>{s.availFactor.toFixed(2)}</div>
              <div style={{ textAlign: 'center', fontSize: 11, color: violates ? 'var(--red-l)' : v === 0 ? 'var(--muted)' : 'var(--green-l)' }}
                title={violates ? 'Exceeds supply' : v === 0 ? 'Not used' : 'OK'}>
                {violates ? '⚠' : v === 0 ? '∅' : '✓'}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AgPanel8({ sc, nbaState, setNbaState, nbaSubmitted, setNbaSubmitted, onResume, fcstState, dcAllocChoice, setDcAllocChoice, customAllocs, setCustomAllocs }) {
  const actions = sc.agentData?.nbaActions || [];
  // LINKED NBA titles — derive each action's quantities from the live fleet plan so they
  // always agree with the approved forecast totals and every downstream tab.
  const fp8 = computeFleetPlan(sc, fcstState || {});
  const nbaTitle = (a) => {
    switch (a.id) {
      case 'n1':   return `Place New-Buy POs — ${fp8.autoPoUnits.toLocaleString()} units across ${fp8.buyLines} part numbers (lead-time feasible)`;
      case 'n2':   return `Confirm Interim Approval — ${fp8.interimCover.toLocaleString()} Old-P/N Units on Shelf (BA-31248-503)`;
      case 'npo1': return `Cancel Excess Open POs — ${fp8.cancelUnits.toLocaleString()} Legacy Units (drawdown)`;
      case 'n3':   return `Expedite Decision — ${fp8.expediteUnits.toLocaleString()} Units Remaining After Interim`;
      default:     return a.title;
    }
  };
  // LINKED NBA reasons — each description derives its quantities from the live fleet plan,
  // so the auto-approved write-ups can never drift from the actual numbers.
  const nbaReason = (a) => {
    const drawStr = (fp8.drawdown || []).map(l => `${l.planFleet.toLocaleString()} ${/repair/i.test(l.name) ? 'repair kits' : 'legacy actuators'}`).join(' + ');
    switch (a.id) {
      case 'n1':   return `Auto-PO across all ${fp8.buyLines} surge part numbers from the approved forecast — ${fp8.buyUnits.toLocaleString()} units total. Standard 22-week lead delivers ${fp8.autoPoUnits.toLocaleString()} of them in time. The new actuator BA-31248-601 is the lead-time-constrained line: ${fp8.atRiskUnits.toLocaleString()} units fall inside the gap and are handled by the interim bridge (#2) and expedite decision (#4) below.`;
      case 'n2':   return `Of the ${fp8.atRiskUnits.toLocaleString()} at-risk new-actuator units, ${fp8.oldStockAvailable.toLocaleString()} old-P/N BA-31248-503 units are available on the serviceable shelf. These bridge ${fp8.interimCover.toLocaleString()} units under the SB's 18-month transitional approval until the new units arrive — the remaining ${fp8.expediteUnits.toLocaleString()} have no old stock to cover them and drop to the expedite decision.`;
      case 'npo1': return `Forecast draws legacy demand to zero — the ${fp8.cancelUnits.toLocaleString()} planned legacy units (${drawStr}) are no longer needed and are cancelled from the open-order pipeline. The interim bridge uses existing shelf stock, not this procurement. Frees working capital and removes E&O write-off risk on superseded stock.`;
      case 'n3':   return `${fp8.atRiskUnits.toLocaleString()} new-actuator units are at risk; the interim old-P/N stock bridges ${fp8.interimCover.toLocaleString()}, leaving ${fp8.expediteUnits.toLocaleString()} units with no old stock to cover them. Choose how many of these to expedite (14-week lead, 35% premium) vs accept managed delay with operator coordination.`;
      default:     return a.reason;
    }
  };
  // Dynamic SL / cost impact strings for the auto-done rows (keep them in step with the plan).
  const nbaSLImpact = (a) => {
    switch (a.id) {
      case 'n1':   return `${fp8.autoPoUnits.toLocaleString()} of ${fp8.buyUnits.toLocaleString()} units at standard lead`;
      case 'n2':   return 'Maintains coverage during lead-time gap';
      case 'npo1': return 'No SL impact — cost management';
      default:     return a.slImpact;
    }
  };
  const nbaCostImpact = (a) => {
    switch (a.id) {
      case 'n1':   return `+$${(fp8.autoPoUnits * 1.8 / 1000).toFixed(1)}M new-buy commitment`;
      case 'n2':   return 'Zero — uses existing serviceable shelf pool';
      case 'npo1': return `−$${Math.round(fp8.cancelUnits * 1.5).toLocaleString()}K working capital freed`;
      default:     return a.costImpact;
    }
  };
  // LINKED EXPEDITE OPTIONS — the expedite premium scales with the live count of units expedited
  // (~35% of unit cost ≈ $5K/unit), and the option write-ups derive their quantities from the
  // fleet plan, so changing the forecast (which changes the remaining at-risk units) updates the
  // option titles, details, premiums and the economics below them. n3a expedites all remaining;
  // n3b the top 40 highest-urgency; n3c none.
  const EXP_PREMIUM_PER_UNIT = 5; // $K/unit
  const expUnitsFor = (oid) => oid === 'n3a' ? fp8.expediteUnits
                             : oid === 'n3b' ? Math.min(40, fp8.expediteUnits)
                             : 0;
  const expPremiumFor = (oid) => Math.round(expUnitsFor(oid) * EXP_PREMIUM_PER_UNIT);
  const nbaOptTitle = (a, opt) => {
    if (a.id !== 'n3') return opt.title;
    const u = expUnitsFor(opt.id);
    if (opt.id === 'n3a') return `Expedite all ${u} — full compliance on time`;
    if (opt.id === 'n3b') return `Expedite top ${u} — highest compliance risk only`;
    return 'No expedite — managed delay + operator coordination';
  };
  const nbaOptDetail = (a, opt) => {
    if (a.id !== 'n3') return opt.detail;
    const all = fp8.expediteUnits, allTails = Math.round(all / 2);
    const u = expUnitsFor(opt.id), prem = expPremiumFor(opt.id);
    if (opt.id === 'n3a') return `Expedite all ${all} remaining at-risk units (${allTails} tails) at 14-week lead time. ~35% premium ≈ $${prem}K above standard. Zero compliance risk. Recommended where operator AOG exposure is high.`;
    if (opt.id === 'n3b') return `Expedite the ${u} units with the shortest remaining compliance window (~$${prem}K premium). The other ${Math.max(0, all - u)} accept managed delay with coordinated maintenance slots.`;
    return `Accept managed delay on all ${all} remaining units (${allTails} tails). Old-P/N shelf stock is already fully committed to the interim bridge, so these coordinate with operators for new-P/N fitment at the next maintenance opportunity within the Week 78 window.`;
  };
  const nbaOptCost = (a, opt) => {
    if (a.id !== 'n3') return opt.costImpact;
    const prem = expPremiumFor(opt.id);
    return prem > 0 ? `+$${prem}K expedite premium` : 'Zero premium';
  };
  const dc = sc.dcConstraint;
  const noImpact = false;
  const slBase = SL_BASE_MAP[sc.id] || 76;
  const dcDecisionNeeded = dc?.affected && !dcAllocChoice && dc.shortfallUnits > 0;

  function toggleAction(id) {
    if (nbaSubmitted) return;
    setNbaState(s => ({ ...s, [id]: !s[id] }));
  }

  function submitNba() {
    setNbaSubmitted(true);
    setTimeout(onResume, 600);
  }

  // Compute projected outcome from NBA + DC decision
  const proj = computeNbaProjection(sc, fcstState || {}, nbaState, dcAllocChoice);
  // Resolution model with current NBA selections — aligns with Command Centre
  const r8 = computeResolutionModel(sc, nbaState, fcstState);

  // FEEDBACK #2: Detect if any selected Custom plan is over its supply budget.
  // Used to block the Confirm button until the planner fixes their custom plan.
  const customInvalid = (() => {
    for (const a of actions) {
      const sel = nbaState[a.id];
      if (!sel || !sel.endsWith || !sel.endsWith('-custom')) continue;
      const ca = customAllocs[a.id];
      if (!ca || !ca.perStore) continue;
      const total = Object.values(ca.perStore).reduce((s, v) => s + (Number(v) || 0), 0);
      if (/substitut/i.test(a.title)) {
        // For substitution: any single SKU exceeds its supply ⇒ invalid.
        // We re-derive the same supply caps used inside CustomSubstitutionPanel to keep parity.
        const baseAvailable = Math.max(60, Math.round((sc.affected || 30) * 4));
        const caps = { 'sub-a': baseAvailable, 'sub-b': Math.round(baseAvailable*0.7), 'sub-c': Math.round(baseAvailable*0.5) };
        for (const [k, v] of Object.entries(ca.perStore)) {
          if ((Number(v) || 0) > (caps[k] || Infinity)) return true;
        }
      } else {
        // For allocation: total must not exceed available.
        if (total > ca.totalAvailable) return true;
      }
    }
    return false;
  })();

  // DC alloc KPI note
  let dcKpiNote = null;
  if (dc?.affected && dcAllocChoice) {
    if (dcAllocChoice === 'full')          dcKpiNote = { text: `Full transfer approved — ${(dc.atpAvailable||0).toLocaleString()} units arriving from ${dc.transferOption?.from}`, color: '#22C55E' };
    else if (dcAllocChoice === 'top10')    dcKpiNote = { text: `Top tails prioritised — ${dc.shortfallTails || 28} tails at reduced allocation`, color: '#FBBF24' };
    else if (dcAllocChoice === 'proportional') dcKpiNote = { text: `Proportional allocation — all tails share shortfall equally`, color: '#FBBF24' };
    else if (dcAllocChoice === 'accept')   dcKpiNote = { text: `Constraint accepted — ${dc.shortfallTails || 28} tails will receive zero ${dc.constrainedSku}`, color: '#F87171' };
  }

  // Compute cumulative KPI impact of selected actions.
  // For planner-decision actions (with options), use the SELECTED option's kpiDelta —
  // not the action-level placeholder — so picking Option A/B/C changes the projected numbers.
  const selected = actions.filter(a => a.done || nbaState[a.id]);
  const effDelta = (a) => (a.options && nbaState[a.id])
    ? (a.options.find(o => o.id === nbaState[a.id])?.kpiDelta || {})
    : (a.kpiDelta || {});
  const totalSL = Math.min(22, selected.reduce((sum, a) => sum + (effDelta(a).sl || 0), 0));
  const totalFill = Math.min(8, selected.reduce((sum, a) => sum + (effDelta(a).fill || 0), 0)).toFixed(1);
  const totalCost = selected.reduce((sum, a) => sum + (effDelta(a).cost || 0), 0);
  const totalWaste = selected.reduce((sum, a) => sum + (effDelta(a).waste || 0), 0);
  const projSL = Math.min(98.5, slBase + totalSL + proj.fAdj);
  const pendingActions = actions.filter(a => !a.done);

  return (
    <div className="apanel" style={{ borderColor: 'rgba(217,119,6,0.3)' }}>
      <div className="aph" style={{ background: 'rgba(217,119,6,0.04)' }}>
        <div className="apb2" style={{ background: '#D97706' }}>08</div>
        <div><h3>Next Best Action</h3><div className="aps">Human checkpoint — select mitigation actions · {sc.affected} tails</div></div>
        <HelpBox text="<strong>What it does:</strong> The automation has already handled everything it can — repositions, early-buys, drawdowns. This is the human checkpoint for remaining exceptions that require judgment.<br><br><strong>Actions vary by part type:</strong> Rotables: expedite repair return, draw from exchange pool, inter-FSL reposition, new-buy PO. Expendables: expedite new-buy, approve PMA alternative, USM draw, proportional allocation. LLPs: new-buy is the only valid option — no repair, no USM.<br><br><strong>Criticality gates actions:</strong> AOG-Critical shortfalls are always surfaced first. If an AOG-Critical part cannot be covered by any action, the chain flags it for immediate escalation — not auto-resolution.<br><br><strong>How to use:</strong> Toggle actions on/off. Projected KPIs update live. When satisfied, submit to proceed to Adjudication." />
        <div className={`apst${nbaSubmitted ? '' : ' pend'}`}>{nbaSubmitted ? '✓ Actions Confirmed' : '⏳ Awaiting Decision'}</div>
      </div>
      <div className="apbody">
        {noImpact
          ? <div className="abox ok"><div className="abox-i" style={{ fontSize: 12, fontWeight: 700, color: '#22C55E' }}>✓</div><div className="abox-t"><strong>No supply constraints for selected filter</strong></div></div>
          : <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>

            {/* LEFT COLUMN — main actions */}
            <div style={{ flex: 1, minWidth: 0 }}>
            {/* SUPPLY RISK BANNER */}
            {sc.agentData?.supplyRisk && (
              <div className="abox crit" style={{ marginBottom: 14 }}>
                <div className="abox-i" style={{ fontSize: 14 }}>!</div>
                <div className="abox-t">
                  <strong>Supply Constraint Risk: {sc.agentData.supplyRisk.label}</strong>
                  <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 3, lineHeight: 1.5 }}>{sc.agentData.supplyRisk.detail}</div>
                </div>
              </div>
            )}

            {/* COUNTERFACTUAL — both sides share the same flow: $ headline → SL → OOS → Waste */}
            {(() => {
              const cfSL          = proj.projSL;
              const revProtected  = Math.round(sc.loss * (cfSL / 100));
              const residualSkus  = Math.max(0, Math.round(sc.skus * (1 - cfSL / 100)));
              return (
                <div className="imp-row">
                  <div className="imp-box bad">
                    <div className="imp-lbl">✕ No Action</div>
                    <div className="imp-v">−${sc.loss.toLocaleString()}K</div>
                    <div style={{ fontSize: 8, color: '#F87171', marginTop: 2 }}>revenue at risk</div>
                    <div style={{ fontSize: 9, color: 'var(--muted)', marginTop: 6, lineHeight: 1.7 }}>
                      SL: ~{slBase}%<br />
                      OOS: {sc.skus} SKUs
                    </div>
                  </div>
                  <div className="imp-arr">→</div>
                  <div className="imp-box good">
                    <div className="imp-lbl">✓ With Selected Actions</div>
                    <div className="imp-v">+${revProtected.toLocaleString()}K</div>
                    <div style={{ fontSize: 8, color: '#22C55E', marginTop: 2 }}>revenue protected · ROI {sc.roi}x</div>
                    <div style={{ fontSize: 9, color: 'var(--muted)', marginTop: 6, lineHeight: 1.7 }}>
                      SL: {cfSL.toFixed(1)}%<br />
                      OOS: {residualSkus} SKUs
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* AUTO-DONE ACTIONS */}
            <div style={{ fontWeight: 600, fontSize: 11, margin: '14px 0 8px', display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ background: 'rgba(34,197,94,0.1)', color: '#22C55E', padding: '2px 8px', borderRadius: 5, fontSize: 9, fontWeight: 700 }}>AUTOMATION COMPLETE</span>
              Actions already executed
            </div>
            {actions.filter(a => a.done).map(a => (
              <div key={a.id} style={{ background: 'rgba(34,197,94,0.05)', border: '1px solid rgba(34,197,94,0.2)', borderRadius: 'var(--radius-sm)', padding: '10px 14px', marginBottom: 8, display: 'flex', alignItems: 'flex-start', gap: 10 }}>
                <span style={{ fontSize: 10, fontWeight: 700, color: '#22C55E', flexShrink: 0, marginTop: 1 }}>Done</span>
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 3 }}>
                    <span style={{ fontSize: 11, fontWeight: 700 }}>#{a.rank} {nbaTitle(a)}</span>
                    <span style={{ fontSize: 8, color: '#22C55E', fontWeight: 700, background: 'rgba(34,197,94,0.1)', padding: '2px 7px', borderRadius: 4 }}>Auto-Executed</span>
                  </div>
                  <div style={{ fontSize: 10, color: 'var(--muted)', lineHeight: 1.4, marginBottom: 4 }}>{nbaReason(a)}</div>
                  <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
                    {[
                      { l: 'SL Impact', v: nbaSLImpact(a), c: '#22C55E' },
                      { l: 'Cost', v: nbaCostImpact(a), c: a.kpiDelta?.cost < 0 ? '#22C55E' : '#FBBF24' },
                    ].map(m => (
                      <div key={m.l} style={{ fontSize: 9 }}><span style={{ color: 'var(--muted)' }}>{m.l}:</span> <span style={{ fontWeight: 700, color: m.c }}>{m.v}</span></div>
                    ))}
                  </div>
                </div>
              </div>
            ))}


            {/* DC CONSTRAINT DECISION — blocking if present */}
            {dc?.affected && dc.shortfallUnits > 0 && (
              <div style={{ background: 'rgba(239,68,68,0.05)', border: '1px solid rgba(239,68,68,0.3)', borderRadius: 'var(--radius-sm)', padding: '12px 14px', marginBottom: 14 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                  <span style={{ fontSize: 11, fontWeight: 700, color: '#F87171' }}>⚠ DC Allocation Decision Required</span>
                  {!dcAllocChoice && <span style={{ fontSize: 9, fontWeight: 700, color: '#F87171', background: 'rgba(239,68,68,0.1)', padding: '2px 8px', borderRadius: 5 }}>Blocking submission</span>}
                  {dcAllocChoice  && <span style={{ fontSize: 9, fontWeight: 700, color: '#22C55E', background: 'rgba(34,197,94,0.1)', padding: '2px 8px', borderRadius: 5 }}>✓ Decision made</span>}
                </div>
                <div style={{ fontSize: 10, color: 'var(--muted)', lineHeight: 1.6, marginBottom: 10 }}>
                  {dc.constrainedSku} shortfall: <strong style={{ color: '#F87171' }}>{dc.shortfallUnits} units</strong> across {dc.shortfallTails || sc.affected} tails.
                  {dc.transferOption && ` Transfer from ${dc.transferOption.from}: ${dc.transferOption.cases} units, ${dc.transferOption.transitHrs}hr transit, +$${dc.transferOption.costK}K.`}
                  {dc.archetype === 'transfer_window' && ` Window closes ${dc.transferOption?.cutoffHr} tonight.`}
                </div>
                {[
                  { id: 'full',         label: `Option A — Approve FSL Transfer from ${dc.transferOption?.from || 'Secondary FSL'}`, desc: `${(dc.transferOption?.units||dc.transferOption?.units||dc.transferOption?.cases||0).toLocaleString()} units transfer closes most of the gap. +$${dc.transferOption?.costK||0}K logistics. Highest SL outcome.`, sl: '+4pp SL', risk: 'LOW',    color: '#22C55E' },
                  { id: 'top10',        label: 'Option B — Priority Allocate Top FSLs',         desc: `Concentrate available ${(dc.atpAvailable||0).toLocaleString()} units in highest-priority tails. ${dc.shortfallTails||28} tails at reduced allocation.`, sl: '+2pp SL', risk: 'MEDIUM', color: '#FBBF24' },
                  { id: 'proportional', label: 'Option C — Proportional Allocation',              desc: `Distribute ${(dc.atpAvailable||0).toLocaleString()} units equally across all ${sc.affected} tails. Operationally simplest.`,              sl: '+0pp SL', risk: 'MEDIUM', color: '#FBBF24' },
                  { id: 'accept',       label: 'Option D — Accept Constraint, No Transfer',       desc: `No logistics. ${dc.shortfallTails||28} tails receive zero ${dc.constrainedSku}. AOG exposure for compliance window.`,                             sl: '−3pp SL', risk: 'HIGH',   color: '#F87171' },
                ].map(opt => (
                  <div key={opt.id} className={`dc-alloc-option${dcAllocChoice === opt.id ? ' selected' : ''}`} onClick={() => !nbaSubmitted && setDcAllocChoice(opt.id)}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                      <span style={{ fontSize: 10, fontWeight: 700 }}>{opt.label}</span>
                      <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                        <span style={{ fontSize: 8, fontWeight: 700, padding: '2px 6px', borderRadius: 4, background: opt.risk === 'LOW' ? 'rgba(34,197,94,0.1)' : opt.risk === 'HIGH' ? 'rgba(239,68,68,0.1)' : 'rgba(245,158,11,0.1)', color: opt.color }}>{opt.risk} risk</span>
                        {dcAllocChoice === opt.id && <span style={{ fontSize: 8, fontWeight: 700, color: '#22C55E' }}>✓ Selected</span>}
                      </div>
                    </div>
                    <div style={{ fontSize: 9, color: 'var(--muted)', lineHeight: 1.4, marginBottom: 4 }}>{opt.desc}</div>
                    <span style={{ color: opt.color, fontWeight: 600, fontSize: 9 }}>{opt.sl}</span>
                  </div>
                ))}
                {dcKpiNote && <div style={{ marginTop: 8, fontSize: 9, fontWeight: 600, color: dcKpiNote.color }}>→ {dcKpiNote.text}</div>}
              </div>
            )}

            {/* PLANNER ACTIONS TO DECIDE */}
            {pendingActions.length > 0 && <>
              <div style={{ fontWeight: 600, fontSize: 11, margin: '14px 0 8px', display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ background: 'rgba(217,119,6,0.12)', color: '#D97706', padding: '2px 8px', borderRadius: 5, fontSize: 9, fontWeight: 700 }}>YOUR DECISION</span>
                Select your preferred approach — KPI panel updates live
              </div>
              {pendingActions.map(a => {
                if (a.options && a.options.length > 0) {
                  // Radio-style option group (A / B / C / Custom)
                  const selectedOpt = nbaState[a.id];
                  const customId = `${a.id}-custom`;
                  const customSelected = selectedOpt === customId;
                  // FEEDBACK #2: detect which custom panel to render based on action title
                  const isAllocationAction = /allocation|allocate|store/i.test(a.title);
                  const isSubstitutionAction = /substitut/i.test(a.title);
                  const customAvailable = isAllocationAction || isSubstitutionAction;
                  return (
                    <div key={a.id} style={{ background: 'var(--bg2)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', overflow: 'hidden', marginBottom: 12 }}>
                      <div style={{ padding: '10px 14px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <div>
                          <span style={{ fontSize: 11, fontWeight: 700 }}>#{a.rank} {nbaTitle(a)}</span>
                          <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 2 }}>{nbaReason(a)}</div>
                        </div>
                        <span style={{ fontSize: 8, fontWeight: 700, background: 'rgba(245,158,11,0.12)', color: '#FBBF24', padding: '2px 8px', borderRadius: 4, flexShrink: 0 }}>Choose one</span>
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: customAvailable ? 'repeat(4,1fr)' : 'repeat(3,1fr)', gap: 0 }}>
                        {a.options.map((opt, oi) => {
                          const isChosen = selectedOpt === opt.id;
                          // Marginal revenue protected by THIS option, on the same basis as the
                          // counterfactual headline (loss × SL/100). Computed as the exact difference
                          // so that: auto-approve protected + this option = the post-selection total.
                          const _autoSL = actions.filter(a => a.done).reduce((s, a) => s + (a.kpiDelta?.sl || 0), 0);
                          const _slPre  = slBase + _autoSL;
                          const _revProt = Math.round(sc.loss * (_slPre + (opt.kpiDelta?.sl || 0)) / 100)
                                         - Math.round(sc.loss * _slPre / 100);
                          return (
                            <div key={opt.id} onClick={() => !nbaSubmitted && setNbaState(s => ({ ...s, [a.id]: opt.id }))}
                              style={{ padding: '12px 14px', borderRight: oi < a.options.length - 1 || customAvailable ? '1px solid var(--border)' : 'none', cursor: nbaSubmitted ? 'default' : 'pointer', background: isChosen ? 'rgba(0,159,224,0.08)' : 'transparent', borderBottom: isChosen ? `2px solid var(--brand-light)` : '2px solid transparent', transition: 'all .2s' }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
                                <div style={{ width: 16, height: 16, borderRadius: '50%', border: `2px solid ${isChosen ? 'var(--brand-light)' : 'var(--muted)'}`, background: isChosen ? 'var(--brand-light)' : 'transparent', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 8, color: '#fff', transition: 'all .2s' }}>{isChosen ? '●' : ''}</div>
                                <span style={{ fontSize: 10, fontWeight: 700, color: isChosen ? 'var(--brand-light)' : 'var(--text)' }}>{opt.label}: {nbaOptTitle(a, opt)}</span>
                              </div>
                              <div style={{ fontSize: 9, color: 'var(--muted)', lineHeight: 1.4, marginBottom: 8 }}>{nbaOptDetail(a, opt)}</div>
                              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 4 }}>
                                {[
                                  { l: 'SL', v: '+' + (opt.kpiDelta?.sl || 0) + 'pp → ' + (_slPre + (opt.kpiDelta?.sl || 0)) + '%', c: '#22C55E' },
                                  { l: 'Cost', v: nbaOptCost(a, opt), c: expPremiumFor(opt.id) > 0 ? '#FBBF24' : 'var(--muted)' },
                                  { l: 'Rev Protected', v: '+$' + _revProt.toLocaleString() + 'K', c: '#22C55E' },
                                ].map(m => (
                                  <div key={m.l} style={{ background: 'var(--card)', borderRadius: 4, padding: '4px 6px', border: '1px solid var(--border)' }}>
                                    <div style={{ fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.3px' }}>{m.l}</div>
                                    <div style={{ fontSize: 9, fontWeight: 700, color: m.c }}>{m.v}</div>
                                  </div>
                                ))}
                              </div>
                            </div>
                          );
                        })}
                        {/* FEEDBACK #2: 4th option — Custom (manual planner override).
                            Pill is absolute-positioned in the top-right corner; title row reserves
                            paddingRight so the title text physically can't reach the pill. The body
                            (detail + KPI grid) uses the full card width below it. */}
                        {customAvailable && (
                          <div onClick={() => !nbaSubmitted && setNbaState(s => ({ ...s, [a.id]: customId }))}
                            style={{
                              padding: '12px 14px',
                              cursor: nbaSubmitted ? 'default' : 'pointer',
                              background: customSelected ? 'rgba(139,92,246,0.10)' : 'rgba(139,92,246,0.03)',
                              borderBottom: customSelected ? `2px solid var(--purple)` : '2px solid transparent',
                              borderLeft: '1px dashed rgba(139,92,246,0.4)',
                              transition: 'all .2s',
                              position: 'relative',
                            }}>
                            {/* Anchored badge — sits in the corner, doesn't participate in flex flow */}
                            <span
                              className="custom-tag"
                              style={{
                                position: 'absolute',
                                top: 8,
                                right: 8,
                                fontSize: 7,
                                padding: '2px 6px',
                                lineHeight: 1.2,
                                pointerEvents: 'none',
                              }}
                            >Custom</span>

                            {/* Title row — reserves paddingRight equal to pill width so title can never overlap it */}
                            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4, paddingRight: 56 }}>
                              <div style={{ width: 16, height: 16, borderRadius: '50%', border: `2px solid ${customSelected ? 'var(--purple)' : 'var(--muted)'}`, background: customSelected ? 'var(--purple)' : 'transparent', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 8, color: '#fff', transition: 'all .2s' }}>{customSelected ? '●' : ''}</div>
                              <span style={{ fontSize: 10, fontWeight: 700, color: customSelected ? 'var(--purple-l)' : 'var(--text)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                                Option D: Custom {isAllocationAction ? 'allocation' : 'substitution'}
                              </span>
                            </div>

                            {/* Detail + KPI grid use the full card width below the title — pill is well above */}
                            <div style={{ fontSize: 9, color: 'var(--muted)', lineHeight: 1.4, marginBottom: 8 }}>
                              {isAllocationAction
                                ? 'Manually edit per-FSL quantities. Useful when none of A/B/C fits — e.g., must protect specific tails or honour a customer commitment.'
                                : 'Manually define the alternate-fulfilment mix per approved route. Useful when a specific repair/USM/interchangeable split is required.'}
                            </div>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 4 }}>
                              {[
                                { l: 'SL', v: 'Depends on plan', c: 'var(--purple-l)' },
                                { l: 'Cost', v: 'Redistribution only', c: 'var(--muted)' },
                                { l: 'Risk', v: 'Planner-owned', c: 'var(--orange-l)' },
                              ].map(m => (
                                <div key={m.l} style={{ background: 'var(--card)', borderRadius: 4, padding: '4px 6px', border: '1px solid var(--border)' }}>
