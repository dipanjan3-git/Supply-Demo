function AgPanel9({ sc, filter, escState, setEscState, escSubmitted, setEscSubmitted, nbaState, fcstState }) {
  // CONNECTED TO FORECAST: the adjudication reviews exactly the parts the plan materially
  // changed (net ≠ 0). Each row is a part with its fleet quantity, expandable to the FSL
  // split. Unchanged SKUs in the affected fleet auto-approve. No hand-picked list.
  // DRIVEN BY THE NBA EXPEDITE OPTION: adjudication escalates the expedited units (premium spend
  // that needs human sign-off). Everything else in the order book auto-approves within policy.
  const adj = computeAdjudication(sc, fcstState || {}, nbaState);
  const fpAdj = adj.fp;
  const _totalTails = Object.values(sc.locFSL || {}).reduce((s, c) => s + c, 0) || sc.affected || 0;
  const _nFSL = Object.keys(sc.locFSL || {}).length || 1;
  const items = adj.escalatedUnits > 0 && adj.constrained ? [{
    prod: adj.constrained.name,
    criticality: 'aog',
    pri: 'Critical',
    s: 'EXPEDITE',
    loc: 'All FSLs',
    _isDraw: false,
    _expedite: true,
    _expediteQty: adj.escalatedUnits,
    _line: adj.constrained,
  }] : [];
  const dec = Object.keys(escState).length;
  // orderEdits: { itemIdx: { aggregate: number, tails: { storeIdx: number } } }
  const [orderEdits, setOrderEdits] = useState({});
  const [expandedStore, setExpandedStore] = useState(null);

  function approve(i) { setEscState(s => ({ ...s, [i]: 'approved' })); }
  function reject(i) { setEscState(s => ({ ...s, [i]: 'rejected' })); }
  function approveAll() { const ns = {}; items.forEach((_, i) => { ns[i] = 'approved'; }); setEscState(ns); }
  function submit() { setEscSubmitted(true); }

  // CONNECTED TO FORECAST: order qty = the part's fleet quantity (full demand for a buy,
  // reduction magnitude for a drawdown). FSL split happens in getStoreBreakdown.
  function fslShareOf(loc) {
    const locFSL = sc.locFSL || {};
    const total = Object.values(locFSL).reduce((s, c) => s + c, 0) || sc.affected || 1;
    for (const [k, v] of Object.entries(locFSL)) {
      const kn = k.split(',')[0].trim();
      if (k === loc || kn === loc || k.indexOf(loc) >= 0 || (loc && loc.indexOf(kn) >= 0)) return v / total;
    }
    return 1 / Math.max(1, Object.keys(locFSL).length);
  }
  function fslTailsOf(loc) {
    const locFSL = sc.locFSL || {};
    for (const [k, v] of Object.entries(locFSL)) {
      const kn = k.split(',')[0].trim();
      if (k === loc || kn === loc || k.indexOf(loc) >= 0 || (loc && loc.indexOf(kn) >= 0)) return v;
    }
    return Math.round((sc.affected || 0) / Math.max(1, Object.keys(locFSL).length));
  }
  function getBaseQty(e) {
    if (e._expedite && e._expediteQty != null) return Math.max(1, e._expediteQty);
    if (e._line) return Math.max(1, e._line.fleet > 0 ? e._line.fleet : Math.abs(e._line.net));
    const line = (fpAdj.lines || []).find(l => l.name === e.prod);
    let qty;
    if (line) qty = line.fleet > 0 ? line.fleet : Math.abs(line.net);
    else qty = sc.affected || 1;
    const v = Math.round(qty * fslShareOf(e.loc));
    return Math.max(1, isFinite(v) ? v : 1);
  }
  // ±25% bounds
  function getBounds(baseQty) {
    return { lb: Math.max(1, Math.round(baseQty * 0.75)), ub: Math.round(baseQty * 1.25) };
  }

  // Build store breakdown with deterministic seed (no Math.random on render)
  function getStoreBreakdown(e, itemIdx) {
    const storeList = Object.entries(sc.locFSL || {});
    if (storeList.length === 0) return [];
    const base = getBaseQty(e);
    const totalStoreCount = storeList.reduce((s, [,c]) => s + Math.min(c, 3), 0);
    let tails = [];
    let globalSi = 0;
    storeList.forEach(([loc, count]) => {
      const storeCount = Math.min(count, 3);
      // Distribute aggregate proportionally across FSLs in this location
      const locShare = (count / sc.affected);
      for (let si = 0; si < storeCount; si++) {
        const storeQty = Math.round((base * locShare) / storeCount);
        const currentEdit = orderEdits[itemIdx]?.tails?.[globalSi];
        const displayQty = currentEdit !== undefined ? currentEdit : storeQty;
        const operatorNames = ['Major Network Carrier','Low-Cost Carrier A','Low-Cost Carrier B','Regional Carrier A','Charter Operator A','Wet-Lease Operator','Cargo Carrier A','Regional Carrier B'];
        const operatorName = operatorNames[(itemIdx * 3 + globalSi * 7 + loc.charCodeAt(0)) % operatorNames.length];
        tails.push({ store: `${operatorName} — ${loc}`, loc, defaultQty: storeQty, qty: displayQty, pri: si === 0 && locShare > 0.3 ? 'AOG-Critical' : 'Routine', storeIdx: globalSi });
        globalSi++;
      }
    });
    return { tails, totalStoreCount };
  }

  // Edit aggregate → redistribute proportionally to FSLs
  function editAggregate(i, newVal) {
    const base = getBaseQty(items[i]);
    const { tails } = getStoreBreakdown(items[i], i);
    const totalDefault = tails.reduce((s, st) => s + st.defaultQty, 0) || 1;
    const newStores = {};
    tails.forEach(st => {
      newStores[st.storeIdx] = Math.max(1, Math.round((st.defaultQty / totalDefault) * newVal));
    });
    setOrderEdits(s => ({ ...s, [i]: { aggregate: newVal, tails: newStores } }));
  }

  // Edit individual FSL → update aggregate as sum
  function editStoreQty(itemIdx, storeIdx, newVal) {
    setOrderEdits(s => {
      const prev = s[itemIdx] || {};
      const base = getBaseQty(items[itemIdx]);
      const { tails } = getStoreBreakdown(items[itemIdx], itemIdx);
      const prevStores = prev.tails || {};
      const newStores = { ...prevStores, [storeIdx]: newVal };
      const newAggregate = tails.reduce((sum, st) => sum + (newStores[st.storeIdx] !== undefined ? newStores[st.storeIdx] : st.defaultQty), 0);
      return { ...s, [itemIdx]: { aggregate: newAggregate, tails: newStores } };
    });
  }

  // Auto-approved / escalated / autonomous rate — units-based, driven by the expedite option.
  const escalatedUnits = adj.escalatedUnits;
  const autoN = adj.autoUnits;
  const autoR = adj.autoR;
  const hasOob = items.some((e, i) => {
    const base = getBaseQty(e);
    const { lb, ub } = getBounds(base);
    const val = orderEdits[i]?.aggregate !== undefined ? orderEdits[i].aggregate : base;
    return val < lb || val > ub;
  });

  return (
    <div className="apanel">
      <div className="aph">
        <div className="apb2" style={{ background: '#00529F' }}>09</div>
        <div><h3>Adjudication & KPI Update</h3><div className="aps">{sc.affected} tails · Final gatekeeper</div></div>
        <HelpBox text="<strong>What it does:</strong> Orders within thresholds auto-approved. Exceptions (&gt;25% volume, &gt;$500/tail) escalated here for human review. KPIs update after submission.<br><br><strong>Order range:</strong> Each order has an allowed ±25% band around the AI-derived quantity. Values outside this range block approval — consistent with forecast approval bounds logic.<br><br><strong>FSL / Tail breakdown:</strong> Editing the aggregate redistributes quantities to tails proportionally. Editing individual FSL quantities updates the aggregate as the sum. The aggregate is what gets submitted to the hub.<br><br><strong>LPI Update:</strong> Fill Rate, Service Level, E&O Rate, Inventory Turns all recalculate on finalization." />
        <div className={`apst${escSubmitted ? '' : ' pend'}`}>{escSubmitted ? '✓ Done' : '⏳ Review'}</div>
      </div>
      <div className="apbody">
        {(() => {
          const actions = sc.agentData?.nbaActions || [];
          const fpl = adj.fp;
          // Same derivation as the NBA tab — keep the strategy recap in step with the live plan.
          const titleOf = (a) => {
            switch (a.id) {
              case 'n1':   return `Place New-Buy POs — ${fpl.autoPoUnits.toLocaleString()} units across ${fpl.buyLines} part numbers (lead-time feasible)`;
              case 'n2':   return `Confirm Interim Approval — ${fpl.interimCover.toLocaleString()} Old-P/N Units on Shelf (BA-31248-503)`;
              case 'npo1': return `Cancel Excess Open POs — ${fpl.cancelUnits.toLocaleString()} Legacy Units (drawdown)`;
              case 'n3':   return `Expedite Decision — ${fpl.expediteUnits.toLocaleString()} Units Remaining After Interim`;
              default:     return a.title;
            }
          };
          const summaryParts = [];
          actions.forEach(a => {
            if (a.done) { summaryParts.push(`${titleOf(a)} (auto-executed)`); }
            else if (a.options) { const chosenId = nbaState?.[a.id]; const chosen = chosenId && a.options.find(o => o.id === chosenId); if (chosen) summaryParts.push(`${titleOf(a)}: ${chosen.label} — ${chosen.title}`); }
            else if (nbaState?.[a.id]) { summaryParts.push(titleOf(a)); }
          });
          return summaryParts.length > 0 ? (
            <div style={{ background: 'rgba(0,82,159,0.08)', border: '1px solid rgba(0,82,159,0.25)', borderRadius: 'var(--radius-sm)', padding: '12px 16px', marginBottom: 14 }}>
              <div style={{ fontSize: 9, fontWeight: 700, color: 'var(--brand-light)', textTransform: 'uppercase', letterSpacing: '.5px', marginBottom: 6 }}>Strategy Confirmed in Next Best Action</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                {summaryParts.map((s, i) => (<div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 6, fontSize: 10 }}><span style={{ color: '#22C55E', fontWeight: 700, flexShrink: 0 }}>✓</span><span style={{ color: 'var(--text)' }}>{s}</span></div>))}
              </div>
              <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 8, paddingTop: 8, borderTop: '1px solid var(--border)' }}>{
                adj.optionLabel === 'C'
                  ? `Option C — no expedite. All ${adj.orderBook.toLocaleString()} units in the new-buy order book auto-approved within policy. No premium spend to review — nothing escalated.`
                  : adj.optionLabel === 'B'
                  ? `Option B — expedite top ${adj.escalatedUnits}. The ${adj.escalatedUnits} highest-urgency expedited new-actuator units carry a 35% premium and need approval below (${adj.deferred} more deferred to managed delay). The other ${adj.autoUnits.toLocaleString()} units auto-approved within policy.`
                  : `Option A — expedite all. The ${adj.escalatedUnits} expedited new-actuator units carry a 35% premium and need approval below. The other ${adj.autoUnits.toLocaleString()} units in the order book auto-approved within policy. You are ratifying the premium spend, not re-deciding the strategy.`
              }</div>
            </div>
          ) : null;
        })()}
        <div className="adj-r">
          <div className="adj-c a-au"><div className="an3">{autoN.toLocaleString()}</div><div className="al3">Auto-Approved (units)</div></div>
          <div className="adj-c a-rv2"><div className="an3">{escalatedUnits.toLocaleString()}</div><div className="al3">Escalated — expedite</div></div>
          <div className="adj-c a-rt"><div className="an3">{autoR}%</div><div className="al3">Autonomous Rate</div></div>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', margin: '8px 0' }}>
          <div style={{ fontWeight: 600, fontSize: 12 }}>{escalatedUnits > 0 ? `Escalated — ${escalatedUnits.toLocaleString()} expedited units (premium approval)` : 'Escalated Orders — none'}</div>
          {escalatedUnits > 0 && <button className="fcst-btn approve" style={{ padding: '4px 12px', fontSize: 9 }} onClick={approveAll} disabled={escSubmitted || hasOob}>Approve All</button>}
        </div>
        {items.length === 0 && (
          <div className="abox ok" style={{ marginBottom: 8 }}>
            <div className="abox-i" style={{ fontSize: 12, fontWeight: 700, color: '#22C55E' }}>✓</div>
            <div className="abox-t"><strong>No expedite selected — nothing to escalate.</strong> All {adj.orderBook.toLocaleString()} units auto-approved within policy. Finalize to update the parts-planning KPIs.</div>
          </div>
        )}
        {items.map((e, i) => {
          const st = escState[i];
          const base = getBaseQty(e);
          const { lb, ub } = getBounds(base);
          const isDraw = !!e._isDraw;
          const currentAgg = orderEdits[i]?.aggregate !== undefined ? orderEdits[i].aggregate : base;

/* ─────────────────────────────────────────────
   AGENTS VIEW — orchestrates chain
───────────────────────────────────────────── */
const CASE_FRACTION = 1.0; // MRO: units are units, no case-pack conversion
const SL_BASE_MAP = { w1:74, w2:72, p1:68, p2:70, p3:88, demand:71, d1:71, d2:73, e1:76, e2:82, llp1:9 };
const GROUNDING_COST_PER_TAIL = 30; // $K grounding/AOG exposure avoided (or incurred) per at-risk tail — demo placeholder; single source for panel + summary

// ── Forecast-coverage SL adjustment (percentage points) ─────────────────────────────
// Projected service level reflects how well the APPROVED 18-month forecast covers
// AI-projected demand. At the default (un-edited) forecast this returns exactly 0, so
// every baseline number is preserved. A planner override that approves LESS than demand
// on a critical part lowers achievable SL (you can't serve what you didn't buy);
// approving at/above demand adds no SL (surplus becomes inventory/waste, not service).
// This is the SINGLE source of the forecast→SL link — every tab adds this same term, so
// a forecast edit moves SL identically in Forecast Approval, NBA, Adjudication and the
// chain summary.
function fcstSLAdj(sc, fcstState) {
  const prods = (sc && sc.fcst) || [];
  const fs = fcstState || {};
  let penalty = 0;
  prods.forEach((p, i) => {
    const demand = p.ai || 0;
    if (demand <= 0) return;                       // drawdown / retiring rows: no demand to miss
    const st = fs[i];
    const approved = (st && st.value != null) ? st.value : demand;
    if (approved >= demand) return;                // meeting/exceeding demand → no SL loss
    const shortfallFrac = Math.min(1, (demand - approved) / demand);
    const weight = p.criticality === 'aog' ? 18 : p.criticality === 'critical' ? 8 : 2;
    penalty += shortfallFrac * weight;
  });
  return -(Math.min(40, Math.round(penalty * 10) / 10));   // ≤ 0 pp
}

// Net grounding impact for a scenario's BEST case (expedite all remaining at-risk units):
// grounding/AOG exposure avoided on the covered tails, minus the expedite premium. Scenarios
// with no lead-time/compliance shortfall return 0 (no grounding exposure to trade off).
function computeScenarioGrounding(sc) {
  if (!sc) return 0;
  const fp = computeFleetPlan(sc, {});
  const expediteUnits = fp.expediteUnits || 0;
  if (expediteUnits <= 0) return 0;
  const perTail      = (fp.lines.find(l => l.constrained)?.perTail) || 2;
  const coveredTails = Math.round(expediteUnits / perTail);   // expedite-all covers every remaining tail
  const premium      = expediteUnits * 5;                     // $5K/unit expedite premium (≈35% of unit cost)
  return coveredTails * GROUNDING_COST_PER_TAIL - premium;    // covered (incurred = 0 when expediting all)
}

/* ═══════════════════════════════════════════════════════════════
   SINGLE SOURCE OF TRUTH — computeFleetPlan
   Every tab reads from this. Forecast cell = per-tail requirement;
   fleet demand = per-tail × tails. Buy basket, lead-time split,
   interim cover, PO cancellation, FSL allocation and revenue
   exposure all derive here so no two tabs can disagree.
   Honors planner edits via fcstState.
   ═══════════════════════════════════════════════════════════════ */
function computeFleetPlan(sc, fcstState) {
  const _fs = fcstState || {};
  const tails = sc.affected || 0;
  const slBase = SL_BASE_MAP[sc.id] || 76;
  const loss = sc.loss || 0;
  const parts = sc.fcst || [];
  const dc = sc.agentData?.dcConstraint || sc.dcConstraint;

  // Revenue at risk tied to the fleet: loss spread across affected tails.
  const perTailExposure = tails > 0 ? loss / tails : 0;

  // Lead-time / compliance gap: tails that can't be served by standard lead.
  const shortfallTails = (dc && dc.affected && dc.shortfallTails != null)
    ? dc.shortfallTails : Math.round(tails * (1 - slBase / 100));
  const coveredTails = Math.max(0, tails - shortfallTails);
  const constrainedName = (dc && dc.affected) ? dc.constrainedSku : null;

  // Per-part fleet demand. The forecast value is now the 18-month FLEET TOTAL directly
  // (not a per-tail rate), so fleet = the value. Per-tail is derived for display/shortfall.
  const lines = parts.map((p, i) => {
    const st = _fs[i];
    const total = (st && st.value != null) ? st.value : p.ai;
    const fleet = Math.round(total);
    const planFleet = Math.round(p.old || 0);
    const perTail = tails > 0 ? fleet / tails : fleet;   // derived: avg units per tail
    const net = fleet - planFleet;
    const constrained = !!(constrainedName && p.name === constrainedName);
    // Only the lead-time-constrained part is capped; other parts are available at standard lead.
    const covered = constrained ? Math.round(fleet * (coveredTails / Math.max(1, tails))) : fleet;
    const shortfall = Math.max(0, fleet - covered);
    return { name: p.name, perTail, fleet, planFleet, net, constrained, covered, shortfall,
             newPart: !!p.newPart, criticality: p.criticality, partType: p.partType, idx: i };
  });

  const surge = lines.filter(l => l.net > 0);
  const drawdown = lines.filter(l => l.net < 0);
  const buyUnits      = surge.reduce((s, l) => s + l.fleet, 0);      // total demand for surge parts
  const buyLines      = surge.length;
  const autoPoUnits   = surge.reduce((s, l) => s + l.covered, 0);    // PO that lands at standard lead, in time

  // At-risk = surge units the standard-lead PO cannot deliver before the compliance deadline.
  const atRiskUnits = surge.reduce((s, l) => s + l.shortfall, 0);    // 168 = 84 tails × 2 (the constrained actuator)

  // INTERIM APPROVAL is limited by how much old-P/N serviceable stock is actually on the shelf.
  // It bridges min(at-risk, old-stock-available); whatever it can't cover drops to the expedite decision.
  const oldStockAvailable = (dc && dc.affected && dc.oldStockAvailable != null) ? dc.oldStockAvailable : 0;
  const interimCover  = Math.min(atRiskUnits, oldStockAvailable);    // bridged with old P/N
  const expediteUnits = Math.max(0, atRiskUnits - interimCover);     // remaining → expedite decision

  // PO cancellation: the full legacy planned procurement is no longer needed (drawn to zero).
  // The interim bridge uses existing on-shelf stock, not this cancelled procurement —
  // so cancel = the complete legacy drawdown.
  const cancelUnits = drawdown.reduce((s, l) => s + Math.max(0, l.planFleet), 0);

  const primary = lines.find(l => l.newPart)
    || surge.slice().sort((a, b) => b.fleet - a.fleet)[0] || null;

  return { tails, slBase, loss, perTailExposure, lines, surge, drawdown,
           buyUnits, buyLines, autoPoUnits, expediteUnits, interimCover, cancelUnits,
           atRiskUnits, oldStockAvailable,
           shortfallTails, coveredTails, primary, constrainedName };
}

/* FSL allocation — splits a part's fleet demand across the FSLs by tail share.
   Σ allocations = the part's fleet demand (tie-out guarantee). */
function computeFSLAllocation(sc, fleetQty) {
  const locFSL = sc.locFSL || {};
  const entries = Object.entries(locFSL);
  const totalTails = entries.reduce((s, [, c]) => s + c, 0) || sc.affected || 1;
  let allocated = 0;
  const rows = entries.map(([loc, tailCount], idx) => {
    const isLast = idx === entries.length - 1;
    const qty = isLast ? (fleetQty - allocated) : Math.round(fleetQty * (tailCount / totalTails));
    allocated += isLast ? 0 : qty;
    return { loc, tailCount, qty, share: tailCount / totalTails };
  });
  return { rows, totalTails };
}

/* ADJUDICATION — single source of truth shared by AgPanel9 and the chain-complete summary.
   Escalation is driven by the expedite OPTION chosen in NBA (Agent 8):
     Option A (n3a) → expedite all at-risk units            → all escalate
     Option B (n3b) → expedite the 40 highest-urgency units → 40 escalate
     Option C (n3c) → no expedite                           → 0 escalate (fully autonomous)
   The expedited units carry a premium and need human sign-off; everything else in the
   new-buy order book auto-approves within policy. */
function computeAdjudication(sc, fcstState, nbaState) {
  const fp = computeFleetPlan(sc, fcstState || {});
  const n3 = (sc.agentData?.nbaActions || []).find(a => a.id === 'n3');
  const chosen = n3 && nbaState ? nbaState[n3.id] : null;
  const optionTop = 40; // Option B expedites the 40 highest-urgency units
  let escalatedUnits;
  if (chosen === 'n3b')      escalatedUnits = Math.min(optionTop, fp.expediteUnits);
  else if (chosen === 'n3c') escalatedUnits = 0;
  else                        escalatedUnits = fp.expediteUnits; // n3a or not-yet-chosen → all
  const optionLabel = chosen === 'n3b' ? 'B' : chosen === 'n3c' ? 'C' : 'A';
  const orderBook  = fp.buyUnits || 0;
  const autoUnits  = Math.max(0, orderBook - escalatedUnits);
  const autoR      = orderBook > 0 ? Math.round((autoUnits / orderBook) * 1000) / 10 : 100;
  const constrained = fp.lines.find(l => l.constrained) || fp.surge.find(l => l.newPart) || null;
  return { fp, n3, chosen, optionLabel, escalatedUnits, orderBook, autoUnits, autoR, constrained, deferred: Math.max(0, fp.expediteUnits - escalatedUnits) };
}

function computeScenarioNums(sc, fcstState) {
  const _fs = fcstState || {};
  const prods = sc.fcst || [];
  const tails = sc.affected;
  const rows = prods.map((p, i) => {
    const st = _fs[i];
    const approvedVal = st ? st.value : p.ai;
    const oldCs = Math.ceil(p.old * CASE_FRACTION);
    const newCs = Math.ceil(approvedVal * CASE_FRACTION);
    // MRO inventory logic: IOH based on part type and criticality
    const isRotable = p.partType === 'rotable' || p.partType === 'repairable';
    const isLLP = p.partType === 'llp';
    const annualDemand = Math.max(1, approvedVal);
    // Rotables: IOH = serviceable pool fraction; Expendables: IOH = stock on hand
    // New part (just superseded-in): no initial stock exists yet — zero on-hand and nothing in transit
    const currentIOH = p.newPart
      ? 0
      : isRotable
      ? Math.max(1, Math.round(annualDemand * 0.35))   // rotable pool: ~35% of annual demand serviceable
      : isLLP
      ? Math.max(0, Math.round(annualDemand * 0.15))   // LLP: minimal buffer - hard deadlines drive ordering
      : Math.round(annualDemand * 0.42);               // expendable: ~5-month stock on hand
    const inTransit = p.newPart
      ? 0
      : isRotable
      ? Math.round(annualDemand * 0.18)  // rotables: units in repair pipeline
      : Math.round(annualDemand * 0.12); // expendables: in transit from supplier
    // Safety stock: rotables use pool cover days; expendables use demand-based buffer
    const ssTarget = isRotable
      ? Math.max(1, Math.round(annualDemand * 0.22))   // rotable: 2.6-month cover
      : p.criticality === 'aog'
      ? Math.round(annualDemand * 0.25)                // AOG expendable: higher safety stock
      : Math.round(annualDemand * 0.15);               // routine expendable: 1.8-month cover
    const netAvail = currentIOH + inTransit;
    const doh = (netAvail / Math.max(1, annualDemand / 12)).toFixed(1); // days on hand
    return { ...p, approvedVal, oldCs, newCs, deltaCs: newCs - oldCs, currentIOH, inTransit, ssTarget, netAvail, doh, wasEdited: !!(st && !st.approved) };
  });
  // Forecast values are 18-month FLEET TOTALS, so they are NOT multiplied by tails.
  const totalBaselineUnits = rows.reduce((s, r) => s + r.oldCs, 0);
  const totalNewCases = rows.reduce((s, r) => s + r.newCs, 0);
  const incrCases = totalNewCases - totalBaselineUnits;
  const slBase  = SL_BASE_MAP[sc.id] || 76;
  const autoSL  = (sc.agentData?.nbaActions || []).filter(a => a.done).reduce((s, a) => s + (a.kpiDelta?.sl || 0), 0);
  const bestNBASL = (sc.agentData?.nbaActions || []).filter(a => a.options && !a.done)
    .reduce((s, a) => {
      if (!a.options || !a.options.length) return s;
      return s + Math.max(...a.options.map(o => o.kpiDelta?.sl || 0));
    }, 0);
  const fAdj    = fcstSLAdj(sc, _fs);
  const slAfter = Math.min(98.5, slBase + autoSL + bestNBASL + fAdj);
  return { rows, totalBaselineUnits, totalNewCases, incrCases, slBase, slAfter, tails, fAdj };
}

function computeImplications(sc, fcstState, allProds) {
  const REVENUE_PER_UNIT = 14.4;                    // $K revenue per unit (demo placeholder)
  const MARGIN           = 0.28;
  const UNIT_COST        = REVENUE_PER_UNIT * (1 - MARGIN); // ~$10.4K per unit
  const HOLDING_COST     = 0.18;                    // annual holding-cost rate

  // SOURCE OF TRUTH for unit counts: the fleet plan. Forecast values are 18-month FLEET
  // TOTALS, so they are used directly — never multiplied by tail count (that was the old
  // per-tail bug that inflated this panel into the hundreds-of-thousands).
  const fp = computeFleetPlan(sc, fcstState || {});
  const totalNewCases      = fp.lines.reduce((s, l) => s + l.fleet, 0);     // total approved buy
  const totalBaselineUnits = fp.lines.reduce((s, l) => s + l.planFleet, 0); // previously-planned total
  const incrCases          = totalNewCases - totalBaselineUnits;            // net vs old plan
  const surgeCount    = fp.lines.filter(l => l.net > 0).length;
  const suppressCount = fp.lines.filter(l => l.net < 0).length;

  // Gross margin on the incremental units (assumes they generate downstream MRO revenue).
  const grossMarginUplift = Math.round(incrCases * REVENUE_PER_UNIT * MARGIN);

  // Working capital: holding cost carried on the incremental stock, net of PO-cancellation savings.
  const holdingCostIncr = Math.round(Math.abs(incrCases) * UNIT_COST * HOLDING_COST);
  const poSavings = (sc.agentData?.nbaActions || [])
    .filter(a => a.done && (a.kpiDelta?.cost || 0) < 0)
    .reduce((s, a) => s + Math.abs(a.kpiDelta.cost), 0);
  const wcImpact = holdingCostIncr - poSavings;      // + = capital tied up, − = net freed

  const revenueExposure = sc.loss || 0;              // consistent with Command Centre sc.loss

  // SL projection — SAME single source as every other tab: baseline + auto-chain lift +
  // forecast-coverage term. A planner override that under-buys a critical part lowers SL here,
  // and that identical term flows through NBA, Adjudication and the chain summary.
  const slBase     = SL_BASE_MAP[sc.id] || 76;
  const autoSLLift = (sc.agentData?.nbaActions || [])
    .filter(a => a.done).reduce((s, a) => s + (a.kpiDelta?.sl || 0), 0);
  const fAdj   = fcstSLAdj(sc, fcstState);
  const projSL = Math.min(98.4, slBase + autoSLLift + fAdj);

  // Program inventory velocity — annualised demand ÷ average inventory carried. Bounded and
  // directionally honest (carrying more stock to protect service lowers turns).
  const avgInventory = Math.max(1, totalNewCases * 0.30);
  const projTurns    = Math.min(12, totalNewCases / avgInventory).toFixed(1) + 'x';

  return {
    totalNewCases, totalBaselineUnits, incrCases,
    grossMarginUplift, holdingCostIncr, poSavings, wcImpact,
    revenueExposure,
    projSL: projSL.toFixed(1) + '%', projTurns,
    surgeCount, suppressCount, slBase, fAdj,
  };
}

function computeNbaProjection(sc, fcstState, nbaState, dcAllocChoice) {
  const base = computeScenarioNums(sc, fcstState);
  const actions = sc.agentData?.nbaActions || [];
  let dSL = 0, dFill = 0, dCost = 0, dWaste = 0;
  actions.forEach(a => {
    const kd = a.done ? a.kpiDelta
      : (a.options && nbaState?.[a.id]) ? (a.options.find(o => o.id === nbaState[a.id])?.kpiDelta)
      : (!a.options && nbaState?.[a.id]) ? a.kpiDelta : null;
    if (kd) { dSL += kd.sl || 0; dFill += kd.fill || 0; dCost += kd.cost || 0; dWaste += kd.waste || 0; }
  });
  const dc = sc.dcConstraint;
  if (dc?.affected && dcAllocChoice) {
    if (dcAllocChoice === 'full')         { dSL += 4; dCost += dc.transferOption?.costK || 12; }
    else if (dcAllocChoice === 'top10')     dSL += 2;
    else if (dcAllocChoice === 'accept')    dSL -= 3;
  }
  const fAdj     = fcstSLAdj(sc, fcstState);
  const projSL   = Math.min(100, base.slBase + dSL + fAdj);
  const projFill = Math.min(98.8, 87 + Math.min(11, dFill));
  return { ...base, dSL, dFill, dCost, dWaste, projSL, projFill, fAdj };
}

function AgentsView({ trigId, scenarioId, onSelectScenario, chainState }) {
  const trig = TRIGGERS.find(t => t.id === trigId);

  // Chain state is now LIFTED to App level so the assistant panel can read/mutate it.
  // We destructure it here. Each setter is the canonical mutator used by both the UI and the bot.
  const {
    activeScenarioId, setActiveScenarioId,
    curAgent, setCurAgent,
    chainRunning, setChainRunning,
    chainComplete, setChainComplete,
    fcstState, setFcstState,
    fcstSubmitted, setFcstSubmitted,
    escState, setEscState,
    escSubmitted, setEscSubmitted,
    nbaState, setNbaState,
    nbaSubmitted, setNbaSubmitted,
    autonomousToggle, setAutonomousToggle,
    dcAllocChoice, setDcAllocChoice,
    customAllocs, setCustomAllocs,
  } = chainState;

  // Use scenarioId (prop) as the source of truth on render — activeScenarioId in chainState
  // is synced via the effect below but lags by one render after a scenario switch. Falling
  // back to the prop here prevents a "scenario not found" flash on first paint and during
  // scenario switches, since chainState lives at the App level.
  const effectiveScenarioId = activeScenarioId || scenarioId;
  const scenario = trig && effectiveScenarioId
    ? (() => {
        const found = trig.scenarios.find(s => s.id === effectiveScenarioId);
        return found ? { ...found, trigType: trigId } : null;
      })()
    : null;

  // Agents use their own local filters where relevant (ForecastFilterBar in 5/5b)
  // No global filter passed to agents — store/location filters removed from agent screens
  const filter = { cat: 'All Categories', loc: 'All Locations', fsl: 'All FSLs' };
  const timerRef = useRef(null);

  // FIX: when scenarioId prop changes, reset ALL chain state cleanly
  useEffect(() => {
    clearTimeout(timerRef.current);
    setActiveScenarioId(scenarioId);
    setCurAgent(1);
    setChainRunning(false);
    setChainComplete(false);
    setFcstState({});
    setFcstSubmitted(false);
    setEscState({});
    setEscSubmitted(false);
    setNbaState({});
    setNbaSubmitted(false);
    setAutonomousToggle(true);
    setDcAllocChoice(null);
    setCustomAllocs({});
  }, [scenarioId]);

  // AUTO-START when activeScenarioId is set/changed
  useEffect(() => {
    if (!trig) return;
    const t = setTimeout(() => { setChainRunning(true); }, 300);
    return () => clearTimeout(t);
  }, [activeScenarioId]);

  // CHAIN ADVANCE
  useEffect(() => {
    if (!chainRunning) return;
    const ag = getAgMeta(curAgent);
    if (!ag.auto) { setChainRunning(false); return; }
    timerRef.current = setTimeout(() => {
      const next = chainNext(curAgent);
      if (next !== null) {
        setCurAgent(next);
      } else {
        setChainRunning(false);
        setChainComplete(true);
      }
    }, ag.delay);
    return () => clearTimeout(timerRef.current);
  }, [chainRunning, curAgent]);

  function resumeChain() {
    const next = chainNext(curAgent);
    if (next !== null) {
      setCurAgent(next);
      setChainRunning(true);
    } else {
      setChainComplete(true);
    }
  }

  // Free navigation — always allowed. Clicking any tab just shows that agent's output.
  function navToAgent(i) {
    clearTimeout(timerRef.current);
    setChainRunning(false);
    setCurAgent(i);
  }

  // In-view scenario switcher — full clean reset
  function switchScenario(scId) {
    if (scId === activeScenarioId) return;
    clearTimeout(timerRef.current);
    setCurAgent(1);
    setChainRunning(false);
    setChainComplete(false);
    setFcstState({});
    setFcstSubmitted(false);
    setEscState({});
    setEscSubmitted(false);
    setNbaState({});
    setNbaSubmitted(false);
    setActiveScenarioId(scId);
    setCustomAllocs({});
    setTimeout(() => setChainRunning(true), 300);
  }

  const pct = Math.round(((curAgent + (chainComplete ? 1 : 0)) / AG_META.length) * 100);
  const ag = getAgMeta(curAgent);
  const canResume = (!chainRunning && !ag.auto) && (
    (ag.id === '6b' && fcstSubmitted) || (ag.id === 9 && escSubmitted) || (ag.id === 8 && nbaSubmitted)
  );

  if (!scenario) return <div className="view"><div className="abox warn"><div className="abox-i">⚠</div><div className="abox-t"><strong>Scenario not found.</strong></div></div></div>;


  return (
    <div style={{ paddingTop: 56 }}>

      {/* ── FIX 5: SCENARIO SWITCHER — switch sub-scenarios without going back ── */}
      {trig && trig.scenarios.length > 1 && (
        <div style={{ background: 'rgba(4,18,37,0.97)', borderBottom: '1px solid var(--border)', padding: '6px 24px', display: 'flex', alignItems: 'center', gap: 8, overflowX: 'auto' }}>
          <span style={{ fontSize: 9, fontWeight: 700, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.5px', flexShrink: 0 }}>{trig.label} —</span>
          {trig.scenarios.map(sc => (
            <button key={sc.id} onClick={() => switchScenario(sc.id)} style={{ flexShrink: 0, padding: '3px 12px', borderRadius: 6, fontSize: 9, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit', transition: 'all .2s', background: sc.id === activeScenarioId ? 'rgba(0,159,224,0.15)' : 'var(--card)', border: sc.id === activeScenarioId ? '1px solid var(--brand-light)' : '1px solid var(--border)', color: sc.id === activeScenarioId ? 'var(--brand-light)' : 'var(--muted)' }}>
              {sc.label}: {sc.title}
            </button>
          ))}
        </div>
      )}

      {/* ORCHESTRATOR NODE BAR — replaces flat tab bar */}
      <div className="orc-bar">
        <div className="orc-inner">
          {AG_META.map((a, i) => {
            let dotCls = 'orc-dot';
            let nodeCls = 'orc-node';
            const seqI = CHAIN_SEQ.indexOf(CHAIN_SEQ[i]);
            const seqCur = CHAIN_SEQ.indexOf(curAgent);
            const isActive = CHAIN_SEQ[i] === curAgent;
            const isDone = chainComplete || seqI < seqCur;
            if (isDone) { dotCls += ' orc-done'; nodeCls += ' orc-node-done'; }
            else if (isActive && chainRunning) { dotCls += ' orc-running'; nodeCls += ' orc-node-act'; }
            else if (isActive) { dotCls += ` ${!a.auto ? 'orc-human' : 'orc-dot'} orc-act`; nodeCls += ' orc-node-act'; }
            else if (!a.auto) dotCls += ' orc-human orc-idle';
            else dotCls += ' orc-idle';
            const connDone = chainComplete || seqI < seqCur;
            return (
              <div key={a.id} style={{ display: 'flex', alignItems: 'center' }}>
                <div className={nodeCls} onClick={() => navToAgent(CHAIN_SEQ[i])} title={a.n}>
                  <div className={dotCls} style={{ background: isDone ? '#22C55E' : (isActive && (chainRunning || !a.auto)) ? a.c : undefined }}>
                    {isDone ? '✓' : !a.auto ? 'H' : (seqI + 1).toString()}
                  </div>
                  <div className="orc-label">{a.n}</div>
                  {isActive && !a.auto && !chainComplete && (
                    <div style={{ fontSize: 6, color: '#FBBF24', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.3px', marginTop: 1 }}>WAITING</div>
                  )}
                  {isActive && chainRunning && (
                    <div style={{ fontSize: 6, color: a.c, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.3px', marginTop: 1 }}>RUNNING</div>
                  )}
                </div>
                {i < AG_META.length - 1 && (
                  <div className={`orc-conn${connDone ? ' orc-conn-done' : ''}`} />
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* CHAIN PROGRESS + CONTROLS */}
      <div className="run-controls">
        <div style={{ flex: 1 }}>
          <div className="chain-progress"><div className="chain-fill" style={{ width: `${pct}%` }} /></div>
        </div>
        {chainComplete ? (
          <div className="run-status"><strong>✅ Chain Complete</strong> — {Math.round(pct)}% · Click any agent above to review.</div>
        ) : chainRunning ? (
          <div className="run-status"><strong>Running...</strong> Agent {CHAIN_SEQ.indexOf(curAgent)+1}/{CHAIN_SEQ.length}: {ag.n}</div>
        ) : !ag.auto ? (
          <>
            <div className="run-status"><strong>⏸ Paused — {ag.n}</strong> · Complete the action above, then resume.</div>
            <button className="run-btn resume" disabled={!canResume} onClick={resumeChain}>▶ Resume Chain</button>
          </>
        ) : null}
      </div>

      {/* ACTIVE AGENT CONTENT */}
      <div style={{ maxWidth: 1400, margin: '0 auto', padding: '8px 24px 40px' }}>


        {curAgent === 1 && <AgPanel1 sc={scenario} filter={filter} />}
        {curAgent === 2 && <AgPanel2 sc={scenario} />}
        {curAgent === 3 && <AgPanel3 sc={scenario} />}
        {curAgent === 4 && <AgPanel4 sc={scenario} />}
        {curAgent === 5 && <AgPanel5 sc={scenario} filter={filter} />}
        {curAgent === 6 && <AgPanel6 sc={scenario} />}
        {curAgent === '6b' && <AgPanel6b sc={scenario} filter={filter} fcstState={fcstState} setFcstState={setFcstState} fcstSubmitted={fcstSubmitted} setFcstSubmitted={setFcstSubmitted} onResume={resumeChain} autonomousToggle={autonomousToggle} setAutonomousToggle={setAutonomousToggle} />}
        {curAgent === 7 && <AgPanel7 sc={scenario} fcstState={fcstState} autonomousToggle={autonomousToggle} />}
        {curAgent === 8 && <AgPanel8 sc={scenario} nbaState={nbaState} setNbaState={setNbaState} nbaSubmitted={nbaSubmitted} setNbaSubmitted={setNbaSubmitted} onResume={resumeChain} fcstState={fcstState} dcAllocChoice={dcAllocChoice} setDcAllocChoice={setDcAllocChoice} customAllocs={customAllocs} setCustomAllocs={setCustomAllocs} />}
        {curAgent === 9 && <AgPanel9 sc={scenario} filter={filter} escState={escState} setEscState={setEscState} escSubmitted={escSubmitted} setEscSubmitted={setEscSubmitted} nbaState={nbaState} fcstState={fcstState} />}

        {chainComplete && (() => {
          // CONNECTED: derives from the same adjudication helper as Agent 9, and reflects the
          // expedite OPTION the planner chose — so the summary can't contradict the screens above.
          const adjF = computeAdjudication(scenario, fcstState, nbaState);
          const fp = adjF.fp;
          const slBaseV = SL_BASE_MAP[scenario.id] || 76;
          const autoSLV = (scenario.agentData?.nbaActions || []).filter(a => a.done).reduce((s, a) => s + (a.kpiDelta?.sl || 0), 0);
          const chosenOptV = adjF.n3 && adjF.chosen ? adjF.n3.options.find(o => o.id === adjF.chosen) : null;
          const optSLV = chosenOptV ? (chosenOptV.kpiDelta?.sl || 0)
                       : (adjF.n3 ? Math.max(...adjF.n3.options.map(o => o.kpiDelta?.sl || 0)) : 0);
          const resultSL = Math.min(100, slBaseV + autoSLV + optSLV + fcstSLAdj(scenario, fcstState));
          const revProtected = Math.round((scenario.loss || 0) * resultSL / 100);
          return (
          <div className="chain-complete">
            <h2>✅ Agent Chain Complete</h2>
            <p style={{ marginBottom: 12 }}>{adjF.autoUnits.toLocaleString()} units auto-approved · {adjF.escalatedUnits.toLocaleString()} escalated (expedite premium, Option {adjF.optionLabel}). Revenue protected: <strong>${revProtected.toLocaleString()}K</strong> of ${(scenario.loss||0).toLocaleString()}K at risk across {scenario.affected} tails · {adjF.autoR}% autonomous rate</p>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(140px,1fr))', gap: 8, marginTop: 12 }}>
              {[
                { l: 'Service Level', v: resultSL + '%', c: '#22C55E' },
                { l: 'Revenue Protected', v: '$' + revProtected.toLocaleString() + 'K', c: '#22C55E' },
                { l: 'Total New-Buy', v: fp.buyUnits.toLocaleString() + ' units', c: '#22C55E' },
                { l: 'Interim Bridge', v: fp.interimCover.toLocaleString() + ' old-P/N units', c: '#4DC4F0' },
                { l: 'Expedited', v: adjF.escalatedUnits.toLocaleString() + ' units', c: '#4DC4F0' },
                { l: 'Autonomous Rate', v: adjF.autoR + '%', c: '#4DC4F0' },
              ].map(m => (
                <div key={m.l} style={{ background: 'rgba(34,197,94,0.06)', border: '1px solid rgba(34,197,94,0.2)', borderRadius: 8, padding: '10px 12px', textAlign: 'center' }}>
                  <div style={{ fontSize: 8, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.4px', marginBottom: 3 }}>{m.l}</div>
                  <div style={{ fontSize: 18, fontWeight: 700, color: m.c }}>{m.v}</div>
                </div>
              ))}
            </div>
          </div>
          );
        })()}
      </div>
    </div>
  );
}

function App() {
  const [splashHidden, setSplashHidden] = useState(false);
  const [helpOpen, setHelpOpen] = useState(false);
  const [view, setView] = useState('splash'); // splash | exec | triggers | usecase | agents

  const [activeScenario, setActiveScenario] = useState(null);
  const [filter, setFilter] = useState({ cat: 'All Categories', loc: 'All Locations', fsl: 'All FSLs' });

  // ── CHAIN STATE (lifted from AgentsView so the assistant panel can read/mutate it) ──
  const [activeScenarioId, setActiveScenarioId] = useState(null);
  const [curAgent, setCurAgent] = useState(1);
  const [chainRunning, setChainRunning] = useState(false);
  const [chainComplete, setChainComplete] = useState(false);
  const [fcstState, setFcstState] = useState({});
  const [fcstSubmitted, setFcstSubmitted] = useState(false);
  const [escState, setEscState] = useState({});
  const [escSubmitted, setEscSubmitted] = useState(false);
  const [nbaState, setNbaState] = useState({});
  const [nbaSubmitted, setNbaSubmitted] = useState(false);
  const [autonomousToggle, setAutonomousToggle] = useState(true);
  const [dcAllocChoice, setDcAllocChoice] = useState(null);
  const [customAllocs, setCustomAllocs] = useState({});

  const chainState = {
    activeScenarioId, setActiveScenarioId,
    curAgent, setCurAgent,
    chainRunning, setChainRunning,
    chainComplete, setChainComplete,
    fcstState, setFcstState,
    fcstSubmitted, setFcstSubmitted,
    escState, setEscState,
    escSubmitted, setEscSubmitted,
    nbaState, setNbaState,
    nbaSubmitted, setNbaSubmitted,
    autonomousToggle, setAutonomousToggle,
    dcAllocChoice, setDcAllocChoice,
    customAllocs, setCustomAllocs,
  };

  // ── ASSISTANT PANEL STATE ──
  const [asstOpen, setAsstOpen] = useState(false);
  const [asstWidth, setAsstWidth] = useState(380);
  const [asstDragging, setAsstDragging] = useState(false);

  // Drag handler for resizing the assistant panel
  useEffect(() => {
    if (!asstDragging) return;
    function onMove(e) {
      const next = Math.max(320, Math.min(720, window.innerWidth - e.clientX));
      setAsstWidth(next);
    }
    function onUp() { setAsstDragging(false); }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'col-resize';
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
    };
  }, [asstDragging]);

  function enterApp() {
    setSplashHidden(true);
    setView('exec');
  }

  function handleLaunch(trigId, scenarioId) {
    if (!trigId) { setView('triggers'); return; }
    setActiveTrig(trigId);
    setActiveScenario(scenarioId);
    setView('agents');
  }

  function handleSelectScenario(trigId, scenarioId) {
    setActiveTrig(trigId);
    setActiveScenario(scenarioId);
    setView('agents');
  }

  // Effective right padding: 0 on splash, 44px collapsed (rail), or width when expanded
  const rightPad = !splashHidden ? 0 : (asstOpen ? asstWidth : 44);

  return (
    <>
      <style>{CSS}</style>

          <AppHeader
            view={view}
            activeTrig={activeTrig}
            activeScenario={activeScenario}

            <div style={{ background: 'var(--card)', border: '1px solid var(--border)', borderRadius: 'var(--radius)', maxWidth: 640, width: '100%', maxHeight: 'calc(100vh - 100px)', overflowY: 'auto' }} onClick={e => e.stopPropagation()}>

        {view === 'triggers' && <TriggersView onSelectScenario={handleSelectScenario} />}
        {view === 'usecase' && <UseCaseView />}
        {view === 'agents' && <AgentsView trigId={activeTrig} scenarioId={activeScenario} onSelectScenario={handleSelectScenario} chainState={chainState} />}
      </div>

      {/* ASSISTANT PANEL (right side, persistent, resizable) */}
      {splashHidden && (
        asstOpen ? (
          <div className="asst-panel" style={{ width: asstWidth }}>
            <div

              onMouseDown={(e) => { e.preventDefault(); setAsstDragging(true); }}

            <AssistantPanel
              view={view}
              activeTrig={activeTrig}
              activeScenario={activeScenario}
              filter={filter}
              setFilter={setFilter}
              chainState={chainState}
              setView={setView}
              setActiveTrig={setActiveTrig}
              setActiveScenario={setActiveScenario}
              onCollapse={() => setAsstOpen(false)}
            />
          </div>
        ) : (
          <div className="asst-collapsed-rail" onClick={() => setAsstOpen(true)} title="Open Planning Assistant">
            <div className="asst-rail-icon">AI</div>
            <div className="asst-rail-label">Assistant</div>
            <div className="asst-rail-pulse" title="Live · monitoring context" />
          </div>
        )
      )}
    </>
  );
}

function DownstreamImpactPanel({ sc, fcstState, allProds, autonomousToggle, setAutonomousToggle }) {
  // Shows per-SKU line impact for each edited row — NOT duplicate plan-level SL (that lives in ImplicationsSnapshot)
  const editedProds = allProds.map((p, i) => {
    const st = fcstState[i];
    if (!st) return null;
    if (st.value === p.ai) return null;
    const userCs = Math.ceil(st.value) * sc.affected;
    const aiCs   = Math.ceil(p.ai) * sc.affected;
    const deltaCs = userCs - aiCs;
    const revDelta = Math.round(deltaCs * 14.4 * 0.28 / 1000);
    const isOob = st.value < p.lb || st.value > p.ub;
    return { ...p, idx:i, userVal:st.value, aiVal:p.ai, deltaCs, revDelta, isOob };
  }).filter(Boolean);

  if (editedProds.length === 0) return null;

  const AGENTS = ['Inventory Update (07)', 'NBA (08)', 'Adjudication (09)'];

  return (
    <div className="ds-summary-bar" style={{ flexDirection: 'column', alignItems: 'stretch' }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'8px 14px', borderBottom:'1px solid rgba(245,158,11,0.14)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <span style={{ fontSize:13 }}>⚡</span>
          <span style={{ fontSize:8, fontWeight:700, color:'#FBBF24', textTransform:'uppercase', letterSpacing:'.5px' }}>Line-Level Impact — Your Edits vs AI</span>
          <span style={{ fontSize:8, color:'var(--muted)' }}>{editedProds.length} SKU{editedProds.length>1?'s':''} changed</span>
        </div>
        <div className="ds-toggle-row">
          <span style={{ fontSize:7, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'.4px', whiteSpace:'nowrap' }}>
            {autonomousToggle ? 'Auto-propagating ↓' : 'Auto-propagate OFF'}
          </span>
          <div className="ds-toggle" style={{ background: autonomousToggle ? '#22C55E' : 'rgba(123,155,191,0.3)', marginLeft:6 }} onClick={() => setAutonomousToggle(t => !t)}>
            <div className="ds-toggle-knob" style={{ transform: autonomousToggle ? 'translateX(13px)' : 'translateX(0)' }} />
          </div>
        </div>
      </div>
      <div style={{ overflowX:'auto' }}>
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:9 }}>
          <thead>
            <tr style={{ borderBottom:'1px solid rgba(245,158,11,0.14)' }}>
              {['P/N & Description', 'AI Qty', 'Your Qty', 'Units Δ (all FSLs)', 'Cost Δ', 'Status'].map(h => (
                <th key={h} style={{ padding:'5px 10px', textAlign:'left', fontSize:7, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'.4px', whiteSpace:'nowrap' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {editedProds.map(p => (
              <tr key={p.idx} style={{ borderBottom:'1px solid rgba(245,158,11,0.08)' }}>
                <td style={{ padding:'5px 10px', fontWeight:600, color:'var(--text)', whiteSpace:'nowrap', maxWidth:180, overflow:'hidden', textOverflow:'ellipsis' }}>{p.name}</td>
                <td style={{ padding:'5px 10px', color:'var(--muted)' }}>{p.aiVal}</td>
                <td style={{ padding:'5px 10px', fontWeight:700, color: p.isOob ? '#F87171' : '#818CF8' }}>{p.userVal}{p.isOob ? ' ⚠' : ''}</td>
                <td style={{ padding:'5px 10px', fontWeight:700, color: p.deltaCs >= 0 ? '#22C55E' : '#F87171' }}>{p.deltaCs >= 0 ? '+' : ''}{p.deltaCs.toLocaleString()} units</td>
                <td style={{ padding:'5px 10px', fontWeight:700, color: p.revDelta >= 0 ? '#22C55E' : '#F87171' }}>{p.revDelta >= 0 ? '+' : ''}${p.revDelta}K</td>

/* inline per-row impact dot — used inside AgPanel6b forecast table */
function RowImpactDot({ p, val, sc }) {
  const [show, setShow] = useState(false);
  const [pos, setPos] = useState({ top: 0, left: 0 });
  const dotRef = useRef(null);

  const isEdited = val !== p.ai;
  if (!isEdited) return <div style={{ width:36 }} />;

  const rowCaseDelta  = (Math.ceil(val) - Math.ceil(p.ai)) * sc.affected;
  const rowRevDelta   = Math.round(rowCaseDelta * 14.4 * 0.28 / 1000);
  const rowSlDelta    = ((rowCaseDelta / (Math.ceil(p.ai * 1) * sc.affected)) * 18).toFixed(1);
  const isBelowLB     = val < p.lb;
  const isAboveUB     = val > p.ub;
  const bandLabel     = isBelowLB ? '⚠ Below LB — OOS risk' : isAboveUB ? '⚠ Above UB — Waste risk' : '✓ Within confidence band';
  const bandColor     = isBelowLB ? '#F87171' : isAboveUB ? '#FBBF24' : '#22C55E';

  function handleMouseEnter(e) {
    const rect = dotRef.current.getBoundingClientRect();
    // place tooltip above the dot, right-aligned to viewport
    const tooltipW = 268;
    let left = rect.left + rect.width/2 - tooltipW/2;
    // clamp to viewport
    if (left < 8) left = 8;
    if (left + tooltipW > window.innerWidth - 8) left = window.innerWidth - tooltipW - 8;
    setPos({ top: rect.top - 8, left }); // will shift up via transform
    setShow(true);
  }

  return (
    <div style={{ position:'relative', display:'flex', alignItems:'center', justifyContent:'center', padding:'0 8px' }}>
      <div ref={dotRef} className="ds-dot" onMouseEnter={handleMouseEnter} onMouseLeave={() => setShow(false)} />
      {show && (
        <div className="ds-tooltip" style={{ top: pos.top, left: pos.left, transform:'translateY(-100%)' }}>
          <div className="ds-tooltip-title"><span>⚡</span> Downstream Impact — {p.name.split(' ').slice(0,3).join(' ')}</div>
          <div className="ds-tooltip-grid">
            <div className="ds-tooltip-metric">
              <div className="dtm-label">Units Δ</div>
              <div className="dtm-val" style={{ color: rowCaseDelta>=0?'#22C55E':'#F87171' }}>{rowCaseDelta>=0?'+':''}{rowCaseDelta.toLocaleString()}</div>
              <div className="dtm-sub" style={{ color:'var(--muted)' }}>across {sc.affected} tails</div>
            </div>
            <div className="ds-tooltip-metric">
              <div className="dtm-label">Revenue Δ</div>
              <div className="dtm-val" style={{ color: rowRevDelta>=0?'#22C55E':'#F87171' }}>{rowRevDelta>=0?'+':''}${rowRevDelta}K</div>
              <div className="dtm-sub" style={{ color:'var(--muted)' }}>margin proxy</div>
            </div>
            <div className="ds-tooltip-metric" style={{ gridColumn:'1/-1' }}>
              <div className="dtm-label">SL Impact</div>
              <div className="dtm-val" style={{ color: rowCaseDelta>=0?'#22C55E':'#F87171', fontSize:11 }}>{rowCaseDelta>=0?'+':''}{rowSlDelta}pp</div>
              <div className="dtm-sub" style={{ color: bandColor }}>{bandLabel}</div>
            </div>
          </div>
          <div className="ds-tooltip-agents">
            <strong>Notified →</strong>
            {['Order Gen','NBA','Adjudication'].map(a => (
              <span key={a} style={{ background:'rgba(245,158,11,0.08)', border:'1px solid rgba(245,158,11,0.2)', color:'#FBBF24', fontSize:7, padding:'1px 4px', borderRadius:3 }}>{a}</span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}
