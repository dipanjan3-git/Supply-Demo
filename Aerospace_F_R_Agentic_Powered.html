/* ─────────────────────────────────────────────────────────────
   ASSISTANT PANEL — context-aware, action-capable side assistant.

   Architecture summary (see AssistantPanel below for details):
   - Reads UI state via props (view, scenario, chain state).
   - Parses user input through a deterministic intent layer first
     (approve, reduce/set forecast, pick allocation option, navigate,
      autonomous toggle, summary). This produces a STAGED `pendingAction`
     rendered as an action card with Confirm / Cancel.
   - Free-form questions fall through to the Claude API with a
     compact JSON snapshot of current state injected as context.
   - All mutations go through named action handlers — never direct
     state writes from the chat surface — so every change is auditable
     in the chat log and reversible via Cancel before confirmation.
───────────────────────────────────────────────────────────────── */

// Build a compact, structured snapshot of the current UI state for the bot.
// This is the chatbot's "world model" — small enough to send to the LLM,
// rich enough to ground all suggestions in real values.
function buildContextSnapshot({ view, activeTrig, activeScenario, filter, chainState }) {
  const trig = activeTrig ? TRIGGERS.find(t => t.id === activeTrig) : null;
  const scenario = trig && activeScenario ? trig.scenarios.find(s => s.id === activeScenario) : null;
  const ag = chainState && chainState.curAgent != null ? AG_META[chainState.curAgent] : null;

  const snapshot = {
    view,
    currentAgent: ag ? { id: ag.id, name: ag.n, autonomous: ag.auto } : null,
    chainProgress: chainState ? {
      curAgent: chainState.curAgent,
      total: AG_META.length,
      running: chainState.chainRunning,
      complete: chainState.chainComplete,
    } : null,
    filter,
    scenario: scenario ? {
      id: scenario.id, title: scenario.title, region: scenario.region,
      severity: scenario.severity, affectedStores: scenario.affected,
      revenueAtRiskK: scenario.loss, revenueSwingK: scenario.swing, roi: scenario.roi,
    } : null,
    forecast: scenario ? scenario.fcst.map((p, i) => {
      const st = chainState && chainState.fcstState && chainState.fcstState[i];
      return {
        idx: i, sku: p.name, category: p.cat, location: p.loc,
        oldFcst: p.old, aiFcst: p.ai, lb: p.lb, ub: p.ub, confidence: p.conf, scope: p.scope,
        currentValue: st ? st.value : p.ai,
        approved: st ? !!st.approved : false,
        edited: st ? !st.approved : false,
      };
    }) : [],
    forecastSubmitted: chainState ? chainState.fcstSubmitted : false,
    autonomousToggle: chainState ? chainState.autonomousToggle : null,
    nbaActions: scenario && scenario.agentData && scenario.agentData.nbaActions ? scenario.agentData.nbaActions.map(a => ({
      id: a.id, rank: a.rank, title: a.title, mode: a.mode,
      planner_required: a.mode === 'Planner decision required',
      selected: chainState && chainState.nbaState ? chainState.nbaState[a.id] || null : null,
      options: a.options ? a.options.map(o => ({ id: o.id, label: o.label, title: o.title, slImpact: o.slImpact, costImpact: o.costImpact })) : null,
    })) : [],
    nbaSubmitted: chainState ? chainState.nbaSubmitted : false,
    dcConstraint: scenario && scenario.agentData && scenario.agentData.dcConstraint && scenario.agentData.dcConstraint.affected ? scenario.agentData.dcConstraint : null,
    escalationItems: scenario && scenario.escItems ? scenario.escItems.length : 0,
  };
  return snapshot;
}

/*  Deterministic intent parser.
    Returns either:
      - { type: 'action', action: <pendingAction> }   — staged for confirmation
      - { type: 'reply', text: '...' }                — direct text reply
      - null                                          — fall through to LLM
*/
function parseIntent(input, ctx) {
  const text = input.trim();
  const low = text.toLowerCase();
  const { view, chainState, scenario, snapshot } = ctx;

  // ── Navigation intents ──
  if (/(go|nav|open|take me) (to )?(home|command ?cent(re|er)|exec)/.test(low)) {
    return {
      type: 'action',
      action: {
        kind: 'navigate', target: 'exec',
        summary: 'Navigate to the Command Centre.',
        impactLines: [['View', 'Command Centre']],
      }
    };
  }
  if (/(go|nav|open|show) (to )?(scenarios|triggers)/.test(low)) {
    return {
      type: 'action',
      action: {
        kind: 'navigate', target: 'triggers',
        summary: 'Navigate to the Scenarios overview.',
        impactLines: [['View', 'Scenarios']],
      }
    };
  }
  // Jump to a specific agent
  const agentJump = low.match(/(?:go|jump|take me|open|show) (?:to )?(?:agent |the )?(?:forecast(?: approval)?|next best action|adjudication|delta|alert|data correction|feature|inventory|explainability)/);
  if (agentJump && view === 'agents') {
    const agentMap = {
      'delta': 0, 'alert': 1, 'data correction': 2, 'feature': 3,
      'forecast approval': 5, 'forecast': 4,
      'inventory': 6, 'explainability': 7, 'next best action': 8, 'adjudication': 9,
    };
    const matched = Object.keys(agentMap).find(k => low.includes(k));
    if (matched != null) {
      const idx = agentMap[matched];
      return {
        type: 'action',
        action: {
          kind: 'goAgent', target: idx,
          summary: `Jump to agent ${idx + 1} — ${AG_META[idx].n}.`,
          impactLines: [['Agent', AG_META[idx].n], ['Type', AG_META[idx].auto ? 'Autonomous' : 'Human-in-the-loop']],
        }
      };
    }
  }

  // The rest of the intents only make sense inside an active scenario.
  if (!scenario || view !== 'agents') return null;

  // ── Approve all forecasts ──
  if (/^(approve|accept) (all|every|the (whole|entire) (plan|forecast))/.test(low) || low === 'approve all') {
    if (chainState.fcstSubmitted) return { type: 'reply', text: 'Forecast plan is already submitted — no further changes possible on this agent.' };
    const oob = scenario.fcst.filter(p => {
      const v = chainState.fcstState[scenario.fcst.indexOf(p)]?.value ?? p.ai;
      return v < p.lb || v > p.ub;
    }).length;
    if (oob > 0) {
      return { type: 'reply', text: `Cannot approve all — ${oob} row(s) are out of the model's [LB, UB] bounds. Bring them back inside the band first.` };
    }
    const total = scenario.fcst.length;
    return {
      type: 'action',
      action: {
        kind: 'approveAllForecast',
        summary: `Accept all ${total} forecast lines at the AI-recommended values.`,
        impactLines: [
          ['Lines accepted', `${total}`],
          ['Avg confidence', `${Math.round(scenario.fcst.reduce((s,p)=>s+p.conf,0)/total)}%`],
          ['Then', 'Forecast Approval ready to submit'],
        ],
      }
    };
  }

  // ── Reduce / set forecast for a SKU ──
  // Handles three phrasings + pronoun resolution:
  //   A) verb + SKU + (to|=) + number    — "set X to 19", "update X forecast to 19", "X = 19"
  //   B) verb + number + as/for + SKU    — "set 19 as the forecast for X", "update 19 as forecast for X"
  //   C) bare:  SKU + to + number        — "X to 19" (when "forecast" is in the sentence)
  //   D) pronoun: "reduce it to 18", "set that to 22" — resolves to last-mentioned SKU
  if (!chainState.fcstSubmitted) {
    let skuQuery = null, newVal = null, rawSku = null;

    // Pattern D: pronoun + verb + to + number (must check first; would otherwise be eaten by A)
    let m = text.match(/(?:reduce|cut|lower|set|change|update|raise|increase|bump|make)\s+(it|that|this|the same one|that one|this one)\s+(?:to|=|at)\s+(\d+)/i);
    if (m && ctx.lastSku) {
      rawSku = ctx.lastSku;
      newVal = parseInt(m[2], 10);
    }

    // Pattern A: verb + target + to/= + number
    if (!m) {
      m = text.match(/(?:reduce|cut|lower|set|change|update|raise|increase|bump|make)\s+(?:forecast\s+(?:for\s+)?)?(.+?)\s+(?:forecast\s+)?(?:to|=|at)\s+(\d+)/i);
      if (m) { rawSku = m[1].trim(); newVal = parseInt(m[2], 10); }
    }

    // Pattern B: verb + number + as/for + target
    if (!m) {
      m = text.match(/(?:set|update|use|make|put|change)\s+(\d+)\s+(?:as|for)\s+(?:the\s+)?(?:forecast\s+(?:for\s+|of\s+)?)?(.+?)(?:[?.!]|$)/i);
      if (m) { newVal = parseInt(m[1], 10); rawSku = m[2].trim(); }
    }

    // Pattern C: bare equation-style with "forecast" mentioned
    if (!m && /\bforecast\b/i.test(text)) {
      m = text.match(/(.+?)\s+(?:to|=|at)\s+(\d+)/i);
      if (m) { rawSku = m[1].replace(/^(?:can\s+you\s+|please\s+|the\s+forecast\s+for\s+|forecast\s+for\s+)/i, '').trim(); newVal = parseInt(m[2], 10); }
    }

    if (rawSku && newVal != null && !isNaN(newVal)) {
      // Strip filler words from the SKU side ("the forecast for", "for the", trailing "forecast")
      skuQuery = rawSku
        .replace(/^(?:can\s+you\s+update\s+|can\s+you\s+set\s+|please\s+|the\s+forecast\s+(?:for|of)\s+|forecast\s+(?:for|of)\s+|the\s+|forecast\s+)/i, '')
        .replace(/\s+forecast\s*$/i, '')
        .replace(/[?.!]+$/g, '')
        .trim()
        .toLowerCase();

      // Fuzzy match: exact substring, then token overlap (handles "O organics Shampoo 16oz" vs "O Organics Shampoo 16oz")
      let idx = scenario.fcst.findIndex(p => p.name.toLowerCase().includes(skuQuery));
      if (idx === -1) {
        const queryTokens = skuQuery.split(/\s+/).filter(t => t.length > 2);
        idx = scenario.fcst.findIndex(p => {
          const pn = p.name.toLowerCase();
          const matchCount = queryTokens.filter(t => pn.includes(t)).length;
          return queryTokens.length > 0 && matchCount >= Math.min(2, queryTokens.length);
        });
      }
      if (idx === -1) {
        return { type: 'reply', text: `I couldn't match a SKU to "${rawSku}". SKUs in this scenario: ${scenario.fcst.map(p => p.name).join('; ')}.` };
      }
      const p = scenario.fcst[idx];
      const oob = newVal < p.lb || newVal > p.ub;
      return {
        type: 'action',
        action: {
          kind: 'setForecast', target: { idx, newVal },
          summary: `Set ${p.name} forecast to ${newVal} units (current AI: ${p.ai}, prior: ${p.old}).`,
          impactLines: [
            ['P/N', p.name],
            ['New value', `${newVal} units`],
            ['Model band', `${p.lb}–${p.ub}`],
            ['Status', oob ? '⚠ OUT OF BOUNDS — will block submit' : 'Within model band'],
            ['Scope', p.scope],
          ],
          warn: oob,
        }
      };
    }
  }

  // ── Pick an NBA option (priority allocation / substitution) ──
  // Patterns: "select option a for priority allocation", "pick option B", "go with option C for substitution"
  const optMatch = low.match(/(?:select|pick|choose|go with|use|apply)\s+option\s+([a-c])(?:\s+for\s+(.+))?/);
  if (optMatch) {
    const optLetter = optMatch[1].toLowerCase();
    const targetName = (optMatch[2] || '').trim();
    const nbaList = (scenario.agentData && scenario.agentData.nbaActions) || [];
    let action = null;
    if (targetName) {
      action = nbaList.find(a => a.title.toLowerCase().includes(targetName) ||
                                  (targetName.includes('alloc') && a.title.toLowerCase().includes('alloc')) ||
                                  (targetName.includes('sub') && a.title.toLowerCase().includes('substitution')));
    } else {
      // Default to the first action that has options and isn't yet decided
      action = nbaList.find(a => a.options && !chainState.nbaState[a.id]);
    }
    if (action && action.options) {
      const opt = action.options.find(o => o.id.endsWith(optLetter));
      if (opt) {
        return {
          type: 'action',
          action: {
            kind: 'selectNbaOption', target: { actionId: action.id, optionId: opt.id },
            summary: `Select ${opt.label} (${opt.title}) for "${action.title}".`,
            impactLines: [
              ['Action', action.title],
              ['Choice', opt.title],
              ['Service Level', opt.slImpact],
              ['Cost', opt.costImpact],
              ['Fill Rate', opt.fillImpact],
              ['Waste', opt.wasteImpact],
            ],
          }
        };
      }
    }
  }

  // ── Toggle autonomous mode ──
  if (/(turn|switch|toggle)\s+(off|on)\s+autonom/.test(low) || /autonom\w*\s+(off|on)/.test(low)) {
    const wantsOn = /\bon\b/.test(low) && !/\boff\b/.test(low);
    if (chainState.autonomousToggle === wantsOn) {
      return { type: 'reply', text: `Autonomous downstream execution is already ${wantsOn ? 'ON' : 'OFF'}.` };
    }
    return {
      type: 'action',
      action: {
        kind: 'setAutonomous', target: wantsOn,
        summary: `Turn autonomous downstream execution ${wantsOn ? 'ON' : 'OFF'}.`,
        impactLines: [
          ['Mode', wantsOn ? 'Autonomous (orders auto-submit)' : 'Manual (planner approval required per order)'],
        ],
      }
    };
  }

  // ── Summarise / what should I do ──
  if (/^(what|where) should i (do|focus|start|act)/.test(low) || /^summari[sz]e/.test(low) || /^status$/.test(low)) {
    return null; // Hand to LLM with full snapshot
  }

  // No deterministic match — fall through to LLM
  return null;
}

/* ─────────────────────────────────────────────────────────────
   composeContextualAnswer — local Q&A grounded in the snapshot.

   This is the bot's ability to answer free-form questions about
   the current screen WITHOUT calling an LLM. It works by classifying
   the question into intent classes (explain, summarise, trade-off,
   recommend, list, count, status), then composing a grounded answer
   from the snapshot — using real SKU names, real numbers, real options.

   Returns a string answer, or null if no class matched (in which
   case the caller should try the LLM).
───────────────────────────────────────────────────────────────── */
function composeContextualAnswer(input, ctx) {
  const text = input.trim();
  const low = text.toLowerCase();
  const { view, chainState, scenario, snapshot } = ctx;

  // Cheap intent classifier — multi-keyword bag-of-words.
  const askExplain   = /\b(what|whats|what's|explain|tell me about|how does|how is|describe)\b/.test(low) && /\b(this|happen|going on|screen|here|now|step|stage)\b/.test(low);
  const askNext      = /\b(next|what should|what do|what now|where do)\b/.test(low) || /^next$/.test(low);
  const askSummarise = /\b(summari[sz]e|summary|recap|overview|status)\b/.test(low);
  const askRecommend = /\b(recommend|suggest|advice|advise|best option|which option|what option)\b/.test(low);
  const askTradeoff  = /\btrade-?offs?\b|\b(downside|consequence|implication|pros|cons)\b/.test(low) || (/\b(risk|impact)\b/.test(low) && /\b(approv|accept|all\b)/.test(low));
  const askList      = /\b(list|show|which|what are|how many)\b.*\b(skus?|products?|tails?|forecasts?|actions?|options?|escalations?|items?)\b/i.test(low);
  const askConstraint= /\b(constraint|dc|distribution|capacity|atp|shortfall|stockout)\b/.test(low);
  const askWho       = /\b(who|whose)\b/.test(low) && /\b(approve|sign|escalat|notif|own)\b/.test(low);

  // Helper to reference the current agent
  const ag = chainState && chainState.curAgent != null ? AG_META[chainState.curAgent] : null;
  const onAgents = view === 'agents' && scenario && ag;

  // ── EXPLAIN-THIS-SCREEN ──
  if (askExplain && view === 'exec') {
    return `You're on the Command Centre — the network-level view across the global in-service fleet and 8 FSLs. Network fill rate sits at 97.6% with 12.4% MAPE. From here you can drill into the active trigger scenarios (engineering change, regulatory/AD, fleet/network) where the agent chain is staged. Open Scenarios to triage what's running.`;
  }
  if (askExplain && view === 'triggers') {
    const total = TRIGGERS.reduce((s, t) => s + t.scenarios.length, 0);
    return `You're on the Scenarios view — ${total} active scenarios across ${TRIGGERS.length} trigger categories (Engineering Change, Customer-Intent / Demand Capture, Regulatory, and Fleet / Network). Each scenario runs the full 10-agent chain. Pick one to step into the agent workflow; the highest-ROI scenarios are flagged.`;
  }
  if (askExplain && onAgents) {
    return explainAgentScreen(ag, scenario, chainState, snapshot);
  }

  // ── NEXT-STEP / WHAT-SHOULD-I-DO ──
  if (askNext && onAgents) {
    return nextStepFor(ag, scenario, chainState, snapshot);
  }
  if (askNext && view === 'exec') {
    return `Open the Scenarios view and triage by ROI — the weather and promo triggers usually have the highest revenue at risk. From there, step into the agent chain to approve forecasts and pick allocation options.`;
  }

  // ── SUMMARISE ──
  if (askSummarise) {
    if (onAgents) return summariseScenario(scenario, chainState, snapshot);
    if (view === 'exec') return `Network fill rate 97.6%, MAPE 12.4%, autonomous revision rate 87.3%. ${TRIGGERS.reduce((s,t)=>s+t.scenarios.length,0)} active scenarios with combined revenue at risk in the high six-figures. Open Scenarios to triage.`;
  }

  // ── RECOMMEND OPTION ──
  if (askRecommend && onAgents && ag.id === 8) {
    return recommendNbaOption(scenario, chainState);
  }
  if (askRecommend && onAgents && ag.id === '6b') {
    return recommendForecastApproval(scenario, chainState);
  }

  // ── TRADE-OFFS ──
  if (askTradeoff && onAgents) {
    return tradeoffsFor(ag, scenario, chainState, snapshot);
  }

  // ── DC CONSTRAINT QUESTIONS ──
  if (askConstraint && onAgents) {
    const dc = snapshot.dcConstraint;
    if (!dc) return `No active DC constraint on this scenario. Stock and ATP look adequate across the 67-store affected set.`;
    if (dc.archetype === 'stockout') {
      return `Supply constraint active at ${dc.dcName}: ${dc.atpAvailable.toLocaleString()} units of ${dc.constrainedSku} available against ${dc.atpRequired.toLocaleString()} required — ${dc.coveragePct}% coverage. ${dc.shortfallTails} tails will receive constrained allocation. A ${dc.transferOption?.from || 'secondary FSL'} transfer (${dc.transferOption?.cases} units, ${dc.transferOption?.transitHrs}hr transit) partially closes the gap. Decide priority allocation in Next Best Action.`;
    }
    return dc.description;
  }

  // ── LIST QUERIES ──
  if (askList && onAgents) {
    return listForScreen(low, ag, scenario, chainState, snapshot);
  }

  // ── ESCALATION OWNERSHIP ──
  if (askWho && onAgents) {
    return `Routing this scenario goes through the alert-routing tier: commodity managers for surge P/Ns, Hub/FSL Inventory Managers for stock impact, and FSL Planning Analysts for tail-level edits. AOG-Critical parts notify Commodity Managers and Hub Inventory Managers via SMS + dashboard; high-priority via email + dashboard.`;
  }

  // ── SKU DETAIL ── ("tell me about Body Wash", "what's the forecast for water 24pk", "why is shampoo flagged")
  // Match SKUs by token overlap. If the planner's question contains 2+ tokens
  // from a SKU name, treat it as a SKU-detail question and track it for follow-up
  // pronoun references ("reduce it to 18").
  if (onAgents) {
    const matchedSku = scenario.fcst.find(p => {
      const tokens = p.name.toLowerCase().split(/\s+/).filter(t => t.length > 2);
      return tokens.filter(t => low.includes(t)).length >= 2;
    });
    if (matchedSku) {
      const i = scenario.fcst.indexOf(matchedSku);
      const st = chainState.fcstState[i];
      const cur = st ? st.value : matchedSku.ai;
      const explain = scenario.agentData?.productExplain?.[matchedSku.name];
      // Track for follow-up "reduce it to N"
      if (ctx.lastSkuRef) ctx.lastSkuRef.current = matchedSku.name;
      let out = `${matchedSku.name}: prior forecast ${matchedSku.old}, AI revised to ${matchedSku.ai} (band ${matchedSku.lb}–${matchedSku.ub}, confidence ${matchedSku.conf}%). Current staged value ${cur}${st?.approved ? ' — accepted' : st ? ' — edited, not yet accepted' : ''}. Scope: ${matchedSku.scope}. `;
      if (explain && explain.driver) out += `Driver: ${explain.driver}`;
      return out;
    }
  }

  return null;
}

// Per-agent explanation — grounded in the scenario data
function explainAgentScreen(ag, scenario, chainState, snapshot) {
  switch (ag.id) {
    case 1:
      return `Delta Sensing detected the trigger: ${scenario.title}. ${scenario.affected} tails in ${scenario.region} are affected, severity ${scenario.severity}, with ~$${scenario.loss}K revenue at risk. The agent chain runs forward from here — most steps are autonomous; you'll be paused at Forecast Approval, Next Best Action, and Adjudication.`;
    case 2:
      return `Alert Generation routes this trigger to Commodity Managers, FSL Inventory Managers, and Planning Analysts based on criticality. AOG-Critical: SMS + dashboard. High-priority: email + dashboard. Routine: dashboard only. No action needed from you here — the chain will advance automatically.`;
    case 3:
      return `Data Correction updates the planning baseline with new external signals — weather data, promo flags, event signals. These feed the Feature Engineering and Forecast steps downstream. Auto-advances.`;
    case 4:
      return `Feature Engineering activates the model features that respond to this trigger — interaction terms like AD effectivity × finding rate, SB × shop-visit rate, utilization × cycle rate. SHAP weights are visible if you want to inspect drivers.`;
    case 5:
      return `Forecast generation has run. ${scenario.fcst.length} SKUs revised, average confidence ${Math.round(scenario.fcst.reduce((s,p)=>s+p.conf,0)/scenario.fcst.length)}%. The chain pauses next at Forecast Approval (5b) for your review.`;
    case '6b': {
      const dec = Object.keys(chainState.fcstState).length;
      const total = scenario.fcst.length;
      return `Forecast Approval — your decision point. ${total} SKUs need review across ${scenario.affected} tails. ${dec}/${total} decided so far. You can Accept at AI value, edit a value within the [LB, UB] band, or reject. Out-of-band values block submit. Once submitted, the chain proceeds to Inventory Update.`;
    }
    case 6:
      return `Inventory Update propagates approved forecasts into reorder quantities at the DC level. ${chainState.autonomousToggle ? 'Autonomous mode is ON — orders will auto-submit downstream.' : 'Autonomous mode is OFF — every order needs your approval.'} Toggle the autonomous switch in Forecast Approval if you want different behaviour.`;
    case 7:
      return `Explainability shows per-SKU attribution: which model features drove each revision, with historical hit-rate evidence. Useful before you approve borderline items, or to defend a revision in adjudication.`;
    case 8: {
      const undecided = (scenario.agentData?.nbaActions || []).filter(a => a.options && !chainState.nbaState[a.id]).length;
      return `Next Best Action — your decision point. ${undecided} action${undecided === 1 ? '' : 's'} await your choice (typically priority allocation and substitution). Each has Options A/B/C with service-level, cost, fill, and waste impact spelled out. Pick one per action, then submit.`;
    }
    case 9: {
      const items = scenario.escItems?.length || 0;
      return `Adjudication — ${items} FSL-level escalation${items === 1 ? '' : 's'} where AI confidence was below the auto-approve threshold or where the order changed >100%. Approve or reject each, then finalize. This locks in the LPI projections.`;
    }
    default:
      return `You're on ${ag.n}. ${ag.auto ? 'This step runs autonomously — no decision needed.' : 'This step needs your input — see the panel below.'}`;
  }
}

function nextStepFor(ag, scenario, chainState, snapshot) {
  if (ag.id === '6b' && !chainState.fcstSubmitted) {
    const dec = Object.keys(chainState.fcstState).length;
    const total = scenario.fcst.length;
    if (dec === 0) return `Start with the highest-confidence rows — they're the safest accepts. Hit "Approve all" if you trust the model, or work through them line by line. ${total} rows total.`;
    if (dec < total) return `${total - dec} of ${total} rows still undecided. Review the remaining ones (focus on rows where AI deviates most from prior). Once all rows are decided and within bounds, submit.`;
    return `All ${total} rows decided — submit Forecast Approval. The chain will advance to Inventory Update.`;
  }
  if (ag.id === 8 && !chainState.nbaSubmitted) {
    const undecided = (scenario.agentData?.nbaActions || []).filter(a => a.options && !chainState.nbaState[a.id]);
    if (undecided.length === 0) return `All NBA actions decided — submit to commit. The chain will advance to Adjudication.`;
    return `${undecided.length} action${undecided.length === 1 ? '' : 's'} still need a choice: ${undecided.map(a => a.title).join('; ')}. Pick A/B/C for each based on the trade-offs shown.`;
  }
  if (ag.id === 9 && !chainState.escSubmitted) {
    return `Work through each escalation. Approve if the revision looks defensible; reject if confidence is too low. Once all are decided, finalize.`;
  }
  if (ag.auto) return `This step is autonomous — no action needed. The chain will advance on its own.`;
  return `Resume the chain when you're ready, or click ahead to inspect downstream steps.`;
}

function summariseScenario(scenario, chainState, snapshot) {
  const dec = Object.keys(chainState.fcstState).length;
  const total = scenario.fcst.length;
  const dcLine = snapshot.dcConstraint ? ` DC constraint active at ${snapshot.dcConstraint.dcName} — ${snapshot.dcConstraint.coveragePct || ''}% coverage on ${snapshot.dcConstraint.constrainedSku}.` : '';
  return `${scenario.title}: ${scenario.affected} tails in ${scenario.region}, severity ${scenario.severity}. Revenue at risk ${scenario.loss ? '$' + scenario.loss + 'K' : 'TBD'}, projected swing $${scenario.swing}K, ROI ${scenario.roi}x.${dcLine} Forecast progress: ${dec}/${total} rows decided. ${chainState.fcstSubmitted ? 'Forecast submitted.' : 'Forecast pending submit.'}`;
}

function recommendNbaOption(scenario, chainState) {
  const actions = (scenario.agentData?.nbaActions || []).filter(a => a.options);
  if (actions.length === 0) return `No optionable NBA actions on this scenario.`;
  const lines = actions.map(a => {
    const current = chainState.nbaState[a.id];
    if (current) return `${a.title}: you've already picked ${current.toUpperCase()}.`;
    // Heuristic: prefer the option with highest SL impact unless cost penalty is steep
    const best = a.options.reduce((b, o) => {
      const slScore = (o.kpiDelta?.sl || 0);
      const costPenalty = Math.max(0, (o.kpiDelta?.cost || 0));
      const score = slScore - costPenalty * 0.3;
      return (b == null || score > b.score) ? { o, score } : b;
    }, null).o;
    return `${a.title}: I'd lean toward ${best.label} (${best.title}) — ${best.slImpact}, ${best.costImpact}. Trade-off: ${a.options.filter(x => x.id !== best.id).map(x => `${x.label} gives ${x.slImpact} at ${x.costImpact}`).join('; ')}.`;
  });
  return lines.join(' ');
}

function recommendForecastApproval(scenario, chainState) {
  const total = scenario.fcst.length;
  const dec = Object.keys(chainState.fcstState).length;
  const highConf = scenario.fcst.filter(p => p.conf >= 85).length;
  const lowConf = scenario.fcst.filter(p => p.conf < 80).length;
  const big = scenario.fcst.filter(p => Math.abs(p.ai - p.old) / Math.max(p.old, 1) > 1).length;
  return `${total} SKUs need review. ${highConf} are at ≥85% confidence — safe to accept directly. ${lowConf} are below 80% — worth a closer look at the explainability panel. ${big} SKUs have >100% revisions — these are the ones to defend in adjudication if questioned. ${dec === 0 ? 'Hit "Approve all" if you trust the model, or work line by line starting with the high-confidence rows.' : `You've decided ${dec} so far — keep going.`}`;
}

function tradeoffsFor(ag, scenario, chainState, snapshot) {
  if (ag.id === '6b') {
    return `Approving at AI values: faster, more autonomous, lets the chain advance. Risk: model may over-revise — historical MAPE on heat triggers is 8-12%. Editing down: protects margin if you doubt the lift. Risk: you'll OOS the surge categories and miss revenue. The middle path is to accept high-confidence rows and edit the borderline ones (<80% confidence).`;
  }
  if (ag.id === 8) {
    return `Priority allocation: concentrating stock at top-revenue tails maximises revenue protection but leaves smaller tails with lower fill — operational and PR risk. Spreading evenly is fairer but lowers total SL recovery. Substitution adds margin recovery on OOS SKUs but introduces shelf-life and customer-acceptance risk.`;
  }
  if (ag.id === 9) {
    return `Approving aggressive revisions: protects revenue but raises waste risk if demand falls short. Rejecting them: safer on cost but exposes you to stockout. The historical evidence in Explainability is your best signal — if a similar prior event was successfully revised, lean toward approve.`;
  }
  return `Trade-offs depend on the screen. On Forecast Approval it's accuracy vs over-revision; on NBA it's revenue protection vs cost; on Adjudication it's stockout vs waste.`;
}

function listForScreen(low, ag, scenario, chainState, snapshot) {
  if (/sku|product|forecast/.test(low)) {
    const lines = scenario.fcst.map(p => {
      const st = chainState.fcstState[scenario.fcst.indexOf(p)];
      const cur = st ? st.value : p.ai;
      const tag = st?.approved ? '✓' : st ? 'edited' : 'pending';
      return `${p.name}: ${p.old}→${cur} (band ${p.lb}-${p.ub}, conf ${p.conf}%) [${tag}]`;
    });
    return lines.join('\n');
  }
  if (/option|action/.test(low) && ag.id === 8) {
    return (scenario.agentData?.nbaActions || []).map(a => `${a.rank}. ${a.title} — ${a.mode}${a.options ? ` (${a.options.length} options)` : ''}`).join('\n');
  }
  if (/escalation|store/.test(low)) {
    return (scenario.escItems || []).slice(0, 8).map(e => `${e.s} ${e.loc} — ${e.prod}: ${e.chg} (${e.pri})`).join('\n');
  }
  return null;
}

// Used as a last-resort fallback when the LLM is unreachable.
function composeScreenSummary(ctx) {
  const grounded = composeContextualAnswer('what is happening on this screen', ctx);
  if (grounded) return grounded;
  return `I'm working with limited information on this screen. Try asking about a specific item, or use a direct command like "Approve all", "Set <SKU> to <number>", or "Pick option B for priority allocation".`;
}


function AssistantPanel({ view, activeTrig, activeScenario, filter, setFilter, chainState, setView, setActiveTrig, setActiveScenario, onCollapse }) {
  const trig = activeTrig ? TRIGGERS.find(t => t.id === activeTrig) : null;
  const scenario = trig && activeScenario ? trig.scenarios.find(s => s.id === activeScenario) : null;
  const snapshot = buildContextSnapshot({ view, activeTrig, activeScenario, filter, chainState });

  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [pendingActionId, setPendingActionId] = useState(null); // id of staged action awaiting confirmation
  const endRef = useRef(null);
  const inputRef = useRef(null);
  // Conversational reference: tracks the most recently referenced SKU so the
  // planner can say "reduce it to 18" after asking about a SKU.
  const lastSkuRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [msgs, loading]);

  // ── Action executor — central dispatch for all confirmed actions ──
  function executeAction(a) {
    switch (a.kind) {
      case 'navigate':
        setView(a.target);
        return `Navigated to ${a.target === 'exec' ? 'Command Centre' : 'Scenarios'}.`;
      case 'goAgent':
        chainState.setCurAgent(a.target);
        chainState.setChainRunning(false);
        return `Switched to ${AG_META[a.target].n}.`;
      case 'setForecast': {
        const { idx, newVal } = a.target;
        chainState.setFcstState(s => ({ ...s, [idx]: { approved: false, value: newVal } }));
        return `Forecast updated for ${scenario.fcst[idx].name} → ${newVal} units. (Not yet approved — review and Accept in the table when ready.)`;
      }
      case 'approveAllForecast': {
        const ns = {};
        scenario.fcst.forEach((p, i) => {
          const st = chainState.fcstState[i];
          ns[i] = { approved: true, value: st ? st.value : p.ai };
        });
        chainState.setFcstState(ns);
        return `All ${scenario.fcst.length} forecast lines accepted at current values.`;
      }
      case 'selectNbaOption':
        chainState.setNbaState(s => ({ ...s, [a.target.actionId]: a.target.optionId }));
        return `Option selected. The decision is staged in the Next Best Action panel — submit there to commit.`;
      case 'setAutonomous':
        chainState.setAutonomousToggle(a.target);
        return `Autonomous mode is now ${a.target ? 'ON' : 'OFF'}.`;
      default:
        return 'Action executed.';
    }
  }

  // ── Compact context summary the LLM sees ──
  function buildSystemPrompt() {
    return `You are a Planning Assistant embedded in a supply chain command centre. You support planners working through an agentic forecast-to-allocation chain.

You are decision-support, not a chatbot. Be specific, executive, and grounded in the data. Reference real SKUs, store counts, and option labels from the snapshot. Recommend a concrete next step. No bullet points. Under 110 words.

If the planner asks you to take an action (approve, edit forecast, pick an option, navigate), DO NOT execute it yourself — describe what you would do and ask them to phrase it as a command (e.g., "Approve all", "Set Actuator NEW P/N -601 to 50", "Pick option B for priority allocation"). The host application will then stage that as a confirmable action.

Current UI state snapshot (JSON):
${JSON.stringify(snapshot, null, 0)}`;
  }

  // ── Send handler ──
  async function send(rawText) {
    const userMsg = (rawText ?? input).trim();
    if (!userMsg || loading) return;
    setInput('');
    setMsgs(m => [...m, { id: crypto.randomUUID?.() || String(Date.now()), role: 'user', text: userMsg }]);

    // 1) Try deterministic intent first (commands → action cards)
    const intent = parseIntent(userMsg, { view, chainState, scenario, snapshot, lastSku: lastSkuRef.current });
    if (intent && intent.type === 'action') {
      const actionId = crypto.randomUUID?.() || ('act-' + Date.now());
      // Track the SKU referenced in this action so future "it"/"that" turns resolve.
      if (intent.action.kind === 'setForecast') {
        lastSkuRef.current = scenario?.fcst[intent.action.target.idx]?.name || null;
      }
      setMsgs(m => [...m, {
        id: actionId, role: 'bot',
        text: 'Here is what I will do — review and confirm:',
        action: { ...intent.action, id: actionId, status: 'pending' },
      }]);
      setPendingActionId(actionId);
      return;
    }
    if (intent && intent.type === 'reply') {
      setMsgs(m => [...m, { id: crypto.randomUUID?.() || String(Date.now()+1), role: 'bot', text: intent.text }]);
      return;
    }

    // 2) Try the offline contextual composer — answers most free-form Q&A directly
    //    from the snapshot, with no network dependency. Grounded, deterministic, instant.
    const grounded = composeContextualAnswer(userMsg, { view, chainState, scenario, snapshot, lastSkuRef });
    if (grounded) {
      setMsgs(m => [...m, { id: crypto.randomUUID?.() || String(Date.now()+2), role: 'bot', text: grounded }]);
      return;
    }

    // 3) Fall through to Claude API for genuinely open-ended questions.
    //    If the API is unreachable, we surface a helpful, grounded fallback
    //    rather than dead-ending the planner.
    setLoading(true);
    try {
      const apiMsgs = [...msgs, { role: 'user', text: userMsg }]
        .filter(m => !m.action)
        .map(m => ({ role: m.role === 'bot' ? 'assistant' : 'user', content: m.text }));
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 320,
          system: buildSystemPrompt(),
          messages: apiMsgs,
        }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const answer = (data.content || []).map(c => c.text || '').join('') || '';
      if (answer.trim()) {
        setMsgs(m => [...m, { id: crypto.randomUUID?.() || String(Date.now()+3), role: 'bot', text: answer }]);
      } else {
        // Empty API response — fall back to a grounded screen summary
        const fb = composeScreenSummary({ view, chainState, scenario, snapshot });
        setMsgs(m => [...m, { id: crypto.randomUUID?.() || String(Date.now()+4), role: 'bot', text: fb }]);
      }
    } catch (err) {
      // No network → still give the planner a useful grounded answer based on the screen.
      const fb = composeScreenSummary({ view, chainState, scenario, snapshot });
      setMsgs(m => [...m, { id: crypto.randomUUID?.() || String(Date.now()+5), role: 'bot', text: fb }]);
    } finally {
      setLoading(false);
    }
  }

  // ── Confirm/cancel pending actions ──
  function confirmAction(actionId) {
    setMsgs(m => m.map(msg => {
      if (msg.id !== actionId || !msg.action) return msg;
      const result = executeAction(msg.action);
      return { ...msg, action: { ...msg.action, status: 'executed' }, resultText: result };
    }));
    setPendingActionId(null);
  }
  function cancelAction(actionId) {
    setMsgs(m => m.map(msg => msg.id === actionId && msg.action
      ? { ...msg, action: { ...msg.action, status: 'cancelled' } }
      : msg));
    setPendingActionId(null);
  }

  // ── Quick actions are context-aware: they change with the current screen ──
  const quickActions = (() => {
    if (view === 'exec') return [
      { label: 'What needs my attention?', send: 'What should I act on first right now?' },
      { label: 'Network health summary', send: 'Summarise current network health.' },
      { label: 'Open scenarios', send: 'Open scenarios' },
    ];
    if (view === 'triggers') return [
      { label: 'Highest-ROI scenario', send: 'Which scenario has the highest ROI?' },
      { label: 'Back to home', send: 'Go to home' },
    ];
    if (view === 'agents' && scenario) {
      const ag = AG_META[chainState.curAgent];
      const base = [
        { label: 'Explain this screen', send: `What is happening on the ${ag.n} screen and what's the next step?` },
      ];
      if (ag.id === '6b' && !chainState.fcstSubmitted) {
        base.push({ label: 'Approve all', send: 'Approve all' });
        base.push({ label: 'Trade-offs?', send: 'What are the trade-offs of approving all forecasts at AI values?' });
      }
      if (ag.id === 8 && !chainState.nbaSubmitted) {
        const undecided = (scenario.agentData?.nbaActions || []).find(a => a.options && !chainState.nbaState[a.id]);
        if (undecided) base.push({ label: `Recommend option for ${undecided.title.split(' ')[0]}`, send: `Which option do you recommend for ${undecided.title}?` });
      }
      if (ag.id === 9 && !chainState.escSubmitted) {
        base.push({ label: 'Escalation summary', send: 'Summarise the escalations and risks.' });
      }
      return base;
    }
    return [{ label: 'Help', send: 'What can you do?' }];
  })();

  // ── Context pill text ──
  const contextLabel = (() => {
    if (view === 'exec') return 'Command Centre';
    if (view === 'triggers') return 'Scenarios';
    if (view === 'usecase') return 'Solution';
    if (view === 'agents' && scenario) {
      const ag = AG_META[chainState.curAgent];
      return `${scenario.title.slice(0, 24)}${scenario.title.length > 24 ? '…' : ''} · ${ag.n}`;
    }
    return '—';
  })();

  return (
    <>
      <div className="asst-header">
        <div className="asst-avatar">AI</div>
        <div className="asst-title">
          <div className="asst-title-main">Planning Assistant</div>
          <div className="asst-title-sub">
            <span className="asst-status-dot" />
            Live · Reads &amp; acts on your screen
          </div>
        </div>
        <button className="asst-iconbtn" onClick={onCollapse} title="Collapse">›</button>
      </div>

      <div className="asst-context-bar">
        <span className="asst-context-pill">Context</span>
        <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{contextLabel}</span>
      </div>

      <div className="asst-msgs">
        {msgs.length === 0 && (
          <div className="asst-empty">
            <div className="asst-empty-icon">◈</div>
            <div className="asst-empty-title">I read your screen and can take actions.</div>
            <div>
              Ask me about trade-offs, or tell me what to do — for example:<br/>
              <em style={{ color: 'var(--text-2)' }}>"Set Actuator NEW P/N -601 to 50"</em><br/>
              <em style={{ color: 'var(--text-2)' }}>"Approve all"</em><br/>
              <em style={{ color: 'var(--text-2)' }}>"Pick option B for priority allocation"</em>
            </div>
          </div>
        )}
        {msgs.map(m => (
          <div key={m.id} className={`asst-msg ${m.role}`}>
            <div className={`asst-msg-av ${m.role}`}>{m.role === 'user' ? 'YOU' : 'AI'}</div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div className="asst-msg-bubble">
                {m.text}
                {m.action && (
                  <div className="asst-action-card">
                    <div className="asst-action-title">
                      {m.action.warn ? '⚠' : '▸'} {m.action.status === 'pending' ? 'Proposed action' : m.action.status === 'executed' ? 'Executed' : 'Cancelled'}
                    </div>
                    <div className="asst-action-summary">{m.action.summary}</div>
                    {m.action.impactLines && (
                      <div className="asst-action-impact">
                        {m.action.impactLines.map((row, i) => (
                          <div key={i} className="asst-action-impact-row">
                            <span className="asst-action-impact-label">{row[0]}</span>
                            <span className="asst-action-impact-val">{row[1]}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    {m.action.status === 'pending' && (
                      <div className="asst-action-btns">
                        <button className="asst-action-btn primary" onClick={() => confirmAction(m.action.id)}>✓ Confirm</button>
                        <button className="asst-action-btn danger" onClick={() => cancelAction(m.action.id)}>Cancel</button>
                      </div>
                    )}
                    {m.action.status === 'executed' && (
                      <div className="asst-action-status executed">✓ Applied to UI</div>
                    )}
                    {m.action.status === 'cancelled' && (
                      <div className="asst-action-status cancelled">Cancelled — no change made</div>
                    )}
                  </div>
                )}
                {m.resultText && m.action && m.action.status === 'executed' && (
                  <div style={{ marginTop: 8, fontSize: 11, color: 'var(--text-2)', fontStyle: 'italic' }}>
                    {m.resultText}
                  </div>
                )}
              </div>
            </div>
          </div>
        ))}
        {loading && (
          <div className="asst-msg bot">
            <div className="asst-msg-av bot">AI</div>
            <div className="asst-msg-bubble">
              <div className="asst-thinking"><span/><span/><span/></div>
            </div>
          </div>
        )}
        <div ref={endRef} />
      </div>

      <div className="asst-quickactions">
        {quickActions.map(qa => (
          <button key={qa.label} className="asst-qa-btn" onClick={() => send(qa.send)}>
            {qa.label}
          </button>
        ))}
      </div>

      <div className="asst-input-area">
        <div className="asst-input-row">
          <input
            ref={inputRef}
            className="asst-input"
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
            placeholder="Ask, or tell me what to do..."
            disabled={loading}
          />
          <button className="asst-send" disabled={loading || !input.trim()} onClick={() => send()}>
            {loading ? '…' : '↵'}
          </button>
        </div>
      </div>
    </>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 40, fontFamily: 'monospace', color: '#F87171', background: '#0A0F1E', minHeight: '100vh' }}>
          <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 16 }}>⚠ Render Error</div>
          <div style={{ fontSize: 14, marginBottom: 8 }}>{this.state.error.message}</div>
          <pre style={{ fontSize: 11, color: '#7B9BBF', whiteSpace: 'pre-wrap' }}>{this.state.error.stack}</pre>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App /></ErrorBoundary>);

  </script>
</body>
</html>
