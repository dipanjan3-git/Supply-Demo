/* ─────────────────────────────────────────────
   SVG HELPERS — Gauge, Donut, TrendBand
───────────────────────────────────────────── */
function Gauge({ pct, color, size = 110 }) {
  const r = size / 2 - 10;
  const circ = Math.PI * 2 * r;
  const off = circ - (pct / 100) * circ;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="7" />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="7"
        strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`} style={{ transition: 'stroke-dashoffset 1.5s ease' }} />
    </svg>
  );
}

function DonutChart({ segs, size = 130 }) {
  const r = size / 2 - 14;
  const circ = Math.PI * 2 * r;
  let offset = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {segs.map((s, i) => {
        const len = (s.pct / 100) * circ;
        const el = <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={s.color}
          strokeWidth="18" strokeDasharray={`${len} ${circ - len}`}
          strokeDashoffset={-offset} transform={`rotate(-90 ${size/2} ${size/2})`} />;
        offset += len;
        return el;
      })}
    </svg>
  );
}

function TrendBandSVG({ name, hist, fcstPt, fcstLB, fcstUB, onExpand }) {
  const W = 340, H = 110, PAD = 28;
  const all = [...hist, ...fcstPt, ...fcstLB, ...fcstUB];
  const mn = Math.min(...all) * 0.75, mx = Math.max(...all) * 1.18;
  const scX = i => PAD + i * ((W - 2*PAD) / (hist.length + fcstPt.length - 1));
  const scY = v => H - PAD - (v - mn) / (mx - mn) * (H - 2*PAD);
  const fStart = hist.length - 1;

  const histPath = hist.map((v,i) => `${i===0?'M':'L'}${scX(i).toFixed(1)},${scY(v).toFixed(1)}`).join(' ');
  const fcstPath = `M${scX(fStart).toFixed(1)},${scY(hist[fStart]).toFixed(1)} ` +
    fcstPt.map((v,i) => `L${scX(fStart+1+i).toFixed(1)},${scY(v).toFixed(1)}`).join(' ');

  const ubPts = fcstUB.map((v,i) => `${scX(fStart+1+i).toFixed(1)},${scY(v).toFixed(1)}`);
  const lbPtsRev = [...fcstLB].reverse().map((v,i) => `${scX(fStart+fcstLB.length-i).toFixed(1)},${scY(v).toFixed(1)}`);
  const bandPoly = [...ubPts, ...lbPtsRev].join(' ');

  const baseY = scY(hist[hist.length-1]);
  const baseLine = `M${scX(fStart).toFixed(1)},${baseY.toFixed(1)} L${scX(fStart+fcstPt.length).toFixed(1)},${baseY.toFixed(1)}`;
  const ubPath = `M${scX(fStart).toFixed(1)},${scY(hist[fStart]).toFixed(1)} ` + fcstUB.map((v,i)=>`L${scX(fStart+1+i).toFixed(1)},${scY(v).toFixed(1)}`).join(' ');
  const lbPath = `M${scX(fStart).toFixed(1)},${scY(hist[fStart]).toFixed(1)} ` + fcstLB.map((v,i)=>`L${scX(fStart+1+i).toFixed(1)},${scY(v).toFixed(1)}`).join(' ');

  return (
    <div style={{ background: 'var(--bg2)', borderRadius: 8, padding: 10, border: '1px solid var(--border)', cursor: onExpand ? 'pointer' : 'default' }}
      onClick={onExpand} title={onExpand ? 'Click for full view' : ''}>
      <div style={{ fontSize: 10, fontWeight: 600, marginBottom: 4, display: 'flex', justifyContent: 'space-between' }}>
        <span>{name}</span>
        {onExpand && <span style={{ fontSize: 8, color: 'var(--brand-light)' }}>🔍 expand</span>}
      </div>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ display: 'block' }}>
        <rect x={scX(fStart)} y="4" width={W - scX(fStart) - 4} height={H-8} fill="rgba(0,159,224,0.03)" rx="3" />
        <text x={scX(fStart)+3} y="13" fontSize="7" fill="var(--muted)" fontFamily="DM Sans">Forecast</text>
        <text x={PAD} y="13" fontSize="7" fill="var(--muted)" fontFamily="DM Sans">Historical</text>
        <polygon points={bandPoly} fill="rgba(0,159,224,0.10)" stroke="none" />
        <path d={histPath} fill="none" stroke="rgba(255,255,255,0.28)" strokeWidth="1.5" />
        <path d={baseLine} fill="none" stroke="rgba(255,255,255,0.12)" strokeWidth="1" strokeDasharray="4 4" />
        <path d={ubPath} fill="none" stroke="rgba(0,159,224,0.38)" strokeWidth="1" strokeDasharray="3 3" />
        <path d={lbPath} fill="none" stroke="rgba(0,159,224,0.38)" strokeWidth="1" strokeDasharray="3 3" />
        <path d={fcstPath} fill="none" stroke="#009FE0" strokeWidth="2" strokeDasharray="5 3" />
        {fcstPt.map((v,i) => <circle key={i} cx={scX(fStart+1+i)} cy={scY(v)} r="2.5" fill="#009FE0" />)}
        <text x={scX(fStart+fcstPt.length)+2} y={scY(fcstUB[fcstUB.length-1])-2} fontSize="7" fill="rgba(0,159,224,0.55)" fontFamily="DM Sans">UB</text>
        <text x={scX(fStart+fcstPt.length)+2} y={scY(fcstLB[fcstLB.length-1])+9} fontSize="7" fill="rgba(0,159,224,0.55)" fontFamily="DM Sans">LB</text>
      </svg>
    </div>
  );
}

function TrendBandExpanded({ product, onClose }) {
  const W = 560, H = 200, PAD = 36;
  const hist = product.histData;
  const fcstPt = product.fcstData;
  const fcstLB = product.lbData;
  const fcstUB = product.ubData;

  const all = [...hist, ...fcstPt, ...fcstLB, ...fcstUB];
  const mn = Math.min(...all) * 0.75, mx = Math.max(...all) * 1.18;
  const scX = i => PAD + i * ((W - 2*PAD) / (hist.length + fcstPt.length - 1));
  const scY = v => H - PAD - (v - mn) / (mx - mn) * (H - 2*PAD);
  const fStart = hist.length - 1;

  const histPath = hist.map((v,i) => `${i===0?'M':'L'}${scX(i).toFixed(1)},${scY(v).toFixed(1)}`).join(' ');
  const fcstPath = `M${scX(fStart).toFixed(1)},${scY(hist[fStart]).toFixed(1)} ` +
    fcstPt.map((v,i) => `L${scX(fStart+1+i).toFixed(1)},${scY(v).toFixed(1)}`).join(' ');
  const ubPts = fcstUB.map((v,i) => `${scX(fStart+1+i).toFixed(1)},${scY(v).toFixed(1)}`);
  const lbPtsRev = [...fcstLB].reverse().map((v,i) => `${scX(fStart+fcstLB.length-i).toFixed(1)},${scY(v).toFixed(1)}`);
  const bandPoly = [...ubPts, ...lbPtsRev].join(' ');
  const ubPath = `M${scX(fStart).toFixed(1)},${scY(hist[fStart]).toFixed(1)} ` + fcstUB.map((v,i)=>`L${scX(fStart+1+i).toFixed(1)},${scY(v).toFixed(1)}`).join(' ');
  const lbPath = `M${scX(fStart).toFixed(1)},${scY(hist[fStart]).toFixed(1)} ` + fcstLB.map((v,i)=>`L${scX(fStart+1+i).toFixed(1)},${scY(v).toFixed(1)}`).join(' ');
  // Old forecast: flat amber dashed line across forecast window
  const oldY = scY(product.old);
  const oldFcstPath = `M${scX(fStart).toFixed(1)},${oldY.toFixed(1)} L${scX(fStart + fcstPt.length).toFixed(1)},${oldY.toFixed(1)}`;

  // Y-axis gridlines
  const yTicks = 4;
  const gridLines = Array.from({ length: yTicks + 1 }, (_, i) => {
    const v = mn + (mx - mn) * (i / yTicks);
    return { y: scY(v), label: Math.round(v) };
  });

  return (
    <div className="fcst-modal-overlay" onClick={onClose}>

        <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: 'block', background: 'var(--bg2)', borderRadius: 8 }}>
          {gridLines.map((gl, i) => (

          <div className="abox-t"><strong>Confidence band legend:</strong> Shaded area = 80% prediction interval. Blue dashed lines = LB/UB bounds. Forecast point = AI median estimate. Gray solid = 14-day historical baseline.</div>
        </div>
      </div>
    </div>
  );
}

/* build per-product history/forecast arrays from scenario data */
function buildProductChartData(p) {
  const seed = p.old;
  const hist = Array.from({ length: 13 }, (_, i) => Math.max(1, Math.round(seed * (0.85 + Math.sin(i * 0.7) * 0.12 + (i/13)*0.08))));
  hist.push(seed);
  const span = 3;
  const fcstPt = Array.from({ length: span }, (_, i) => Math.round(p.ai * (1 + Math.sin(i * 0.9) * 0.06)));
  const fcstLB = fcstPt.map(v => Math.round(v * (p.lb / p.ai)));
  const fcstUB = fcstPt.map(v => Math.round(v * (p.ub / p.ai)));
  return { ...p, histData: hist, fcstData: fcstPt, lbData: fcstLB, ubData: fcstUB };
}

/* ─────────────────────────────────────────────
   BOUNDED INPUT — for Forecast Approval "Your value"
   Non-blocking tooltip warning when value is outside [lb, ub]
───────────────────────────────────────────── */
function BoundedInput({ value, lb, ub, edited, disabled, onChange }) {
  const [focused, setFocused] = useState(false);
  const [hovered, setHovered] = useState(false);
  const numVal = Number(value);
  const oob = !isNaN(numVal) && (numVal < lb || numVal > ub);
  const showTip = oob && (focused || hovered);
  const direction = numVal < lb ? 'below' : numVal > ub ? 'above' : null;

  return (
    <div
      className="fcst-input-wrap"
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
    >
      <input
        type="number"
        className={`fcst-input${edited ? ' edited' : ''}${oob ? ' oob' : ''}`}
        value={value}
        min="0"
        disabled={disabled}
        onChange={e => {
          const v = parseInt(e.target.value);
          if (!isNaN(v) && v >= 0) onChange(v);
        }}
        onFocus={e => { setFocused(true); e.target.select(); }}
        onBlur={() => setFocused(false)}
        aria-invalid={oob}
        title={oob ? `Value is outside bounds [${lb}–${ub}]` : ''}
      />
      {showTip && (
        <div className="bounds-tip" role="alert">
          <strong>⚠ Value is outside bounds</strong>
          <div style={{ fontSize: 9, color: 'var(--text-3)', marginTop: 2, fontWeight: 500 }}>
            {direction === 'below' ? `Below LB ${lb}` : `Above UB ${ub}`} · Range [{lb}–{ub}]
          </div>
        </div>
      )}
    </div>
  );
}

// Reason-for-change options when a planner overrides the AI forecast.
// Retail/demand context (per Nourish scenario type), direction-aware.
function getForecastReasons(sc, p, editedVal) {
  const increasing = editedVal > p.ai;
  const t = ((sc && sc.id) || '')[0]; // w = weather, p = promo, e = major event
  const reasons = [];
  if (increasing) {
    reasons.push('Local demand signal stronger than model');
    reasons.push('Conservative buffer on a high-velocity SKU');
    if (t === 'w') reasons.push('Weather spike sharper than forecast');
    if (t === 'p') reasons.push('Promo lift trending above plan');
    if (t === 'e') reasons.push('Event footfall larger than modeled');
    reasons.push('DC / supplier lead-time risk — build safety stock');
  } else {
    reasons.push('On-hand + in-transit already covers demand');
    reasons.push('Model over-reacting to a one-time signal');
    if (t === 'w') reasons.push('Weather event milder than forecast');
    if (t === 'p') reasons.push('Slower promo uptake than modeled');
    if (t === 'e') reasons.push('Event impact narrower than modeled');
    reasons.push('Shelf-life / waste risk — avoid overstock');
  }
  reasons.push('Category manager judgment / SME override');
  reasons.push('Aligning with vendor commitment / planogram');
  reasons.push('Other (add comment below)');
  return reasons;
}

function AgPanel5b({ sc, filter, fcstState, setFcstState, fcstSubmitted, setFcstSubmitted, onResume, autonomousToggle, setAutonomousToggle }) {
  const [localFilter, setLocalFilter] = useState({ cat: 'All Categories', loc: 'All Locations' });
  const [expandedRow, setExpandedRow] = useState(null);

  // All products for this scenario (no filter — planner approves all)
  const allProds = sc.fcst;
  // Filtered view for the approval table
  const prods = allProds.filter(p => {
    const catMatch = localFilter.cat === 'All Categories' || p.cat === localFilter.cat;
    const locMatch = localFilter.loc === 'All Locations' || p.loc === localFilter.loc;
    return catMatch && locMatch;
  });

  const noImpact = prods.length === 0;
  const dec = Object.keys(fcstState).length;
  const tot = allProds.length; // submit requires ALL products reviewed, not just filtered
  const approved = Object.values(fcstState).filter(s => s.approved).length;
  const edited = dec - approved;

  // Aggregate metrics — always over all products × all stores
  const totalIncrCases = allProds.reduce((s, p) => {
    const st = fcstState[allProds.indexOf(p)];
    const v = st ? st.value : p.ai;
    return s + v * sc.affected;
  }, 0);
  const totalOldCases = allProds.reduce((s, p) => s + p.old * sc.affected, 0);
  const netIncrCases = totalIncrCases - totalOldCases;
  const avgConfidence = Math.round(allProds.reduce((s, p) => s + p.conf, 0) / allProds.length);
  // Revenue impact proxy
  const revImpact = Math.round(netIncrCases * 0.7 * 0.28 * 14.4 / 1000); // rough: cases × units/cs × margin × cost

  // Suppression count
  const suppressions = allProds.filter(p => p.ai < p.old).length;
  const surges = allProds.filter(p => p.ai > p.old).length;

  // FEEDBACK #1: Hard bounds enforcement.
  // A row is out-of-bounds when its current value is < lb or > ub.
  // Out-of-bounds rows cannot be Accepted, and the plan cannot be Submitted
  // until all rows are within bounds. This protects downstream order generation
  // from forecast values the model has not endorsed within its 80% prediction interval.
  function isOob(p, val) {
    const v = Number(val);
    if (isNaN(v)) return false;
    return v < p.lb || v > p.ub;
  }
  // Per-row OOB lookup against the value the planner currently has staged
  function rowOob(p, gi) {
    const st = fcstState[gi];
    const v = st ? st.value : p.ai;
    return isOob(p, v);
  }
  // Plan-level: any row out of bounds blocks Submit
  const oobCount = allProds.filter((p, i) => rowOob(p, i)).length;
  const hasOob = oobCount > 0;

  function approveProd(globalIdx) {
    // Accept = approve at whatever value is currently in the input (edited or AI)
    const currentVal = fcstState[globalIdx]?.value ?? allProds[globalIdx].ai;
    // FEEDBACK #1: block Accept if the staged value is outside [lb, ub]
    if (isOob(allProds[globalIdx], currentVal)) return;
    setFcstState(s => ({ ...s, [globalIdx]: { approved: true, value: currentVal } }));
    setExpandedRow(null);
  }
  function editProd(globalIdx, val) {
    // Editing is always allowed — the planner needs to be able to type freely.
    // The OOB state is computed downstream and gates Accept/Submit.
    setFcstState(s => ({ ...s, [globalIdx]: { approved: false, value: Number(val) || 0 } }));
  }
  function approveAll() {
    // AI values are always within bounds (lb ≤ ai ≤ ub by construction),
    // so Accept All is always safe. We also clear any prior edited values
    // that were OOB, since the planner has chosen to defer to AI.
    const ns = {};
    allProds.forEach((p, i) => { ns[i] = { approved: true, value: p.ai }; });
    setFcstState(ns);
  }
  function submit() {
    // FEEDBACK #1: belt-and-braces — never submit if any row is OOB
    if (hasOob) return;
    setFcstSubmitted(true);
    setTimeout(onResume, 600);
  }

  // ── DOWNSTREAM IMPACT tracking — autonomousToggle received as prop ──

  // For per-product globalIdx lookup
  function getGlobalIdx(p) { return allProds.indexOf(p); }
  function setReason(globalIdx, reason) {
    setFcstState(s => ({ ...s, [globalIdx]: { ...s[globalIdx], reason } }));
  }
  function setComment(globalIdx, comment) {
    setFcstState(s => ({ ...s, [globalIdx]: { ...s[globalIdx], comment } }));
  }

  return (
    <div className="apanel" style={{ borderColor: 'rgba(124,58,237,0.3)' }}>
      <div className="aph" style={{ background: 'rgba(124,58,237,0.04)' }}>
        <div className="apb2" style={{ background: '#7C3AED' }}>5b</div>
        <div><h3>Forecast Approval</h3><div className="aps">Human checkpoint — approving revised supply plan</div></div>
        <HelpBox text="<strong>What you are approving:</strong> The revised forecast across ALL affected stores for this scenario. The per-product numbers shown are units per store per day — the aggregate across all stores is shown in the banner above the table.<br><br><strong>Actions:</strong> Accept = use AI number as-is. Edit = type your own number. The aggregate totals update live when you change a value.<br><br><strong>Product explainability:</strong> Click any product row to expand the historical context — why the AI set this number and what happened in the most comparable past event.<br><br><strong>Analysis Assistant:</strong> Ask questions about any product before deciding. Q&amp;A is specific to this exact scenario.<br><br><strong>On submit:</strong> Chain resumes automatically." />
        <div className={`apst${fcstSubmitted ? '' : ' pend'}`}>{fcstSubmitted ? '✓ Done' : '⏳ Awaiting'}</div>
      </div>
      <div className="apbody">

        {/* CHANGE 7: AGGREGATE BANNER */}
        <div style={{ background: 'rgba(0,82,159,0.08)', border: '1px solid rgba(0,82,159,0.25)', borderRadius: 'var(--radius-sm)', padding: '12px 16px', marginBottom: 12 }}>
          <div style={{ fontSize: 9, fontWeight: 700, color: 'var(--brand-light)', textTransform: 'uppercase', letterSpacing: '.5px', marginBottom: 8 }}>
            Approving revised supply plan — {sc.affected} stores · {allProds.length} products
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(140px,1fr))', gap: 8 }}>
            {[
              { l: 'Total Revised Units', v: totalIncrCases.toLocaleString(), sub: `+${netIncrCases > 0 ? netIncrCases.toLocaleString() : 0} vs plan`, c: 'var(--brand-light)' },
              { l: 'Surge Products', v: surges, sub: 'demand up vs plan', c: 'var(--brand-light)' },
              { l: 'Suppressed Products', v: suppressions, sub: 'demand down vs plan', c: 'var(--muted)' },
              { l: 'Avg Model Confidence', v: `${avgConfidence}%`, sub: 'across all products', c: avgConfidence >= 85 ? '#22C55E' : '#FBBF24' },
              { l: 'Revenue Protected', v: `$${revProtectedFor(sc)}K`, sub: 'if plan approved', c: '#22C55E' },
              { l: 'Reviewed', v: `${dec}/${tot}`, sub: `${approved} accepted · ${edited} edited`, c: dec === tot ? '#22C55E' : '#FBBF24' },
            ].map(m => (
              <div key={m.l} style={{ background: 'var(--card)', borderRadius: 6, padding: '8px 10px', border: '1px solid var(--border)' }}>
                <div style={{ fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.4px', marginBottom: 2 }}>{m.l}</div>
                <div style={{ fontSize: 16, fontWeight: 700, color: m.c }}>{m.v}</div>
                <div style={{ fontSize: 8, color: 'var(--muted)', marginTop: 1 }}>{m.sub}</div>
              </div>
            ))}
          </div>
          {/* Cold snap: show net + gross breakdown */}
          {(surges > 0 && suppressions > 0) && (
            <div style={{ marginTop: 8, padding: '6px 10px', background: 'rgba(0,82,159,0.06)', borderRadius: 5, fontSize: 10, display: 'flex', gap: 16, flexWrap: 'wrap' }}>
              <span style={{ color: 'var(--brand-light)', fontWeight: 600 }}>
                Surge categories: +{allProds.filter(p=>p.ai>p.old).reduce((s,p)=>s+p.ai*sc.affected,0).toLocaleString()} units
              </span>
              <span style={{ color: '#94A3B8', fontWeight: 600 }}>
                Suppressed categories: -{allProds.filter(p=>p.ai<p.old).reduce((s,p)=>s+(p.old - p.ai)*sc.affected,0).toLocaleString()} units
              </span>
              <span style={{ color: 'var(--muted)' }}>
                Net: {netIncrCases >= 0 ? '+' : ''}{netIncrCases.toLocaleString()} units vs plan
              </span>
            </div>
          )}
        </div>

        <ForecastFilterBar filter={localFilter} onChange={setLocalFilter} products={sc.fcst} />
        <div style={{ fontSize: 9, color: 'var(--muted)', marginBottom: 8 }}>
          Numbers shown are <strong style={{ color: 'var(--text)' }}>units per store</strong>; the aggregate column is total units across all stores = value × {sc.affected} stores. Approve for all {sc.affected} affected stores simultaneously. Flag individual stores in Adjudication if needed.
        </div>

        {noImpact
          ? <div className="abox ok"><div className="abox-i" style={{ fontSize: 12, fontWeight: 700, color: '#22C55E' }}>✓</div><div className="abox-t"><strong>No products match selected filter.</strong> All products still require review — adjust filter or use Accept All above.</div></div>
          : <>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', margin: '8px 0' }}>
              <div style={{ fontSize: 10, color: 'var(--muted)' }}>Click any product row to see historical context before deciding.</div>
              <button className="fcst-btn approve" style={{ padding: '5px 14px', fontSize: 10 }} onClick={approveAll} disabled={fcstSubmitted}>Accept All</button>
            </div>

            <div style={{ display: 'flex', gap: 14, alignItems: 'flex-start' }}>
              {/* LEFT: APPROVAL TABLE */}
              <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ background: 'var(--card2)', border: '1px solid var(--border)', borderRadius: 'var(--radius)', overflow: 'visible', position: 'relative' }}>

              {prods.map((p, pIdx) => {
                const gi = getGlobalIdx(p);
                const st = fcstState[gi];
                // City header for multi-city event scenario
                const prevP = pIdx > 0 ? prods[pIdx-1] : null;
                const showCityHeader = sc.id === 'e1' && (!prevP || prevP.loc !== p.loc);
                const val = st ? st.value : p.ai;
                const isA = st && st.approved;
                const isE = st && !st.approved;
                const delta = p.ai - p.old;
                const pct = ((delta / p.old) * 100).toFixed(0);
                const totalCasesThisProd = val * sc.affected;
                const isExpanded = expandedRow === gi;
                const explain = sc.agentData?.productExplain?.[p.name];
                const isSuppress = p.ai < p.old;

                return (
                  <div key={gi}>

                      <div style={{ padding: '6px 12px', background: 'rgba(99,102,241,0.08)', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 8 }}>
                        <span style={{ fontSize: 10, fontWeight: 700, color: '#818CF8' }}>{p.loc}</span>
                        <span style={{ fontSize: 9, color: 'var(--muted)' }}>
                          {Object.entries(sc.locStores||{}).find(([k])=>k===p.loc)?.[1]||'?'} stores · {sc.affected} total
                        </span>
                      </div>
                    )}
                    <div className="fcst-row" style={{ cursor: 'pointer', borderLeft: `3px solid ${isA ? '#22C55E' : isE ? '#6366F1' : 'transparent'}` }}
                      onClick={() => !fcstSubmitted && setExpandedRow(isExpanded ? null : gi)}>
                      <div className="fcst-cell" style={{ fontWeight: 500 }}>
                        <div>{p.name}</div>
                        <div style={{ fontSize: 9, color: 'var(--muted)', marginTop: 1 }}>{p.cat} · {p.loc} · {p.conf}% conf</div>
                        <div style={{ fontSize: 8, color: 'var(--brand-light)', marginTop: 1 }}>{isExpanded ? '▲ collapse' : '▼ why this number?'}</div>
                      </div>
                      <div className="fcst-cell" style={{ textAlign: 'center', color: 'var(--muted)' }}>{p.old}</div>
                      <div className="fcst-cell" style={{ textAlign: 'center' }}>
                        <span style={{ fontWeight: 700, color: isSuppress ? '#94A3B8' : 'var(--brand-light)' }}>{p.ai}</span>
                        <span style={{ fontSize: 8, color: 'var(--muted)', display: 'block' }}>[{p.lb}–{p.ub}] · {delta > 0 ? '+' : ''}{pct}%</span>
                        {isSuppress && <span style={{ fontSize: 8, color: '#94A3B8', fontWeight: 600 }}>SUPPRESS</span>}
                      </div>
                      {/* CHANGE 8: Functional edit field — stops event propagation */}
                      {/* FEEDBACK #1: Bounds warning tooltip — non-blocking, shows when value is < lb or > ub */}
                      <div className="fcst-cell" onClick={e => e.stopPropagation()}>
                        <BoundedInput
                          value={val}
                          lb={p.lb}
                          ub={p.ub}
                          edited={isE}
                          disabled={fcstSubmitted}
                          onChange={(v) => editProd(gi, v)}
                        />
                      </div>
                      <div className="fcst-cell" style={{ textAlign: 'center', fontSize: 10, fontWeight: 600, color: 'var(--brand-light)' }}>
                        {totalCasesThisProd.toLocaleString()} units
                        <div style={{ fontSize: 8, color: 'var(--muted)', fontWeight: 400 }}>across {sc.affected} stores</div>
                      </div>
                      <div className="fcst-cell" style={{ textAlign: 'center' }} onClick={e => e.stopPropagation()}>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 4, alignItems: 'center' }}>
                          <button
                            className={`fcst-btn approve${isA ? ' active' : ''}`}
                            disabled={fcstSubmitted || isOob(p, val)}
                            onClick={() => approveProd(gi)}
                            title={isOob(p, val) ? `Cannot accept — value ${val} is outside bounds [${p.lb}–${p.ub}]` : ''}
                          >
                            {isOob(p, val) ? '⚠ Out of bounds' : 'Accept'}
                          </button>
                          <span className={`fcst-status ${isA ? 'fst-approved' : isE ? 'fst-edited' : 'fst-pending'}`}>{isA ? 'Accepted ✓' : isE ? 'Edited ✎' : 'Pending'}</span>
                        </div>
                      </div>
                      {/* ⚡ Per-row downstream impact dot */}
                      <div onClick={e => e.stopPropagation()}>
                        <RowImpactDot p={p} val={val} sc={sc} />
                      </div>
                    </div>

                    {/* REASON FOR CHANGE — shows whenever the planner's value differs from the AI number */}
                    {st && st.value !== p.ai && (
                      <div onClick={e => e.stopPropagation()}
                        style={{ padding: '8px 16px', background: 'rgba(99,102,241,0.05)', borderTop: '1px solid rgba(99,102,241,0.15)', display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
                        <span style={{ fontSize: 9, fontWeight: 700, color: '#818CF8', textTransform: 'uppercase', letterSpacing: '.4px', whiteSpace: 'nowrap' }}>
                          ✎ Reason for change
                        </span>
                        <select
                          value={st.reason || ''}
                          disabled={fcstSubmitted}
                          onChange={e => setReason(gi, e.target.value)}
                          style={{ fontSize: 10, padding: '4px 8px', borderRadius: 5, background: 'var(--bg)', color: 'var(--text)', border: `1px solid ${st.reason ? '#818CF8' : '#F87171'}`, fontFamily: 'inherit', cursor: fcstSubmitted ? 'default' : 'pointer', minWidth: 260, outline: 'none' }}>
                          <option value="" style={{ background: 'var(--bg)', color: 'var(--text)' }}>Select a reason…</option>
                          {getForecastReasons(sc, p, st.value).map(r => (
                            <option key={r} value={r} style={{ background: 'var(--bg)', color: 'var(--text)' }}>{r}</option>
                          ))}
                        </select>
                        {st.reason === 'Other (add comment below)' && (
                          <input
                            type="text"
                            placeholder="Describe the reason…"
                            value={st.comment || ''}
                            disabled={fcstSubmitted}
                            onChange={e => setComment(gi, e.target.value)}
                            style={{ flex: 1, minWidth: 180, fontSize: 10, padding: '4px 8px', borderRadius: 5, background: 'var(--bg)', color: 'var(--text)', border: `1px solid ${st.comment ? '#818CF8' : '#F87171'}`, fontFamily: 'inherit', outline: 'none' }} />
                        )}
                        {!st.reason && (
                          <span style={{ fontSize: 8, color: '#F87171', fontWeight: 600 }}>Required for audit trail</span>
                        )}
                      </div>
                    )}

                    {/* CHANGE 10: Inline explainability — expands on row click */}
                    {isExpanded && (
                      <div style={{ background: 'rgba(124,58,237,0.04)', borderTop: '1px solid rgba(124,58,237,0.15)', padding: '12px 16px', animation: 'slideUp .3s ease' }}>
                        {explain ? (
                          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(200px,1fr))', gap: 10 }}>
                            {[
                              { label: 'Why this number', value: explain.driver, color: 'var(--text)' },
                              { label: 'Historical comparable', value: explain.historical, color: 'var(--muted)' },
                              { label: 'What was done then', value: explain.action, color: 'var(--muted)' },
                              { label: 'Outcome', value: explain.outcome, color: '#22C55E' },
                            ].map(f => (
                              <div key={f.label}>
                                <div style={{ fontSize: 8, color: '#A855F7', textTransform: 'uppercase', letterSpacing: '.4px', fontWeight: 700, marginBottom: 3 }}>{f.label}</div>
                                <div style={{ fontSize: 10, color: f.color, lineHeight: 1.5 }}>{f.value}</div>
                              </div>
                            ))}
                          </div>
                        ) : (
                          <div style={{ fontSize: 10, color: 'var(--muted)' }}>
                            No historical comparable available for this specific product. Model confidence: {p.conf}%. Confidence band [{p.lb}–{p.ub}] represents the 80% prediction interval.
                          </div>
                        )}
                        <div style={{ marginTop: 10, display: 'flex', gap: 6 }}>
                          <button className="fcst-btn approve" disabled={fcstSubmitted} onClick={() => { setFcstState(s => ({ ...s, [gi]: { approved: true, value: p.ai } })); setExpandedRow(null); }}>Accept AI ({p.ai})</button>
                          <button
                            className="fcst-btn override"
                            disabled={fcstSubmitted || isOob(p, val)}
                            onClick={() => { setFcstState(s => ({ ...s, [gi]: { approved: true, value: val } })); setExpandedRow(null); }}
                            title={isOob(p, val) ? `Value ${val} is outside bounds [${p.lb}–${p.ub}]` : ''}
                          >
                            {isOob(p, val) ? `⚠ ${val} outside [${p.lb}–${p.ub}]` : `Accept my value (${val})`}
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* DOWNSTREAM AUTONOMOUS IMPACT — shows when any value is edited vs AI */}
            <DownstreamImpactPanel sc={sc} fcstState={fcstState} allProds={allProds} autonomousToggle={autonomousToggle} setAutonomousToggle={setAutonomousToggle} />
              </div>{/* end left column */}

              {/* RIGHT: IMPLICATIONS SNAPSHOT — sticky, live-updating */}
              <ImplicationsSnapshot sc={sc} fcstState={fcstState} allProds={allProds} fcstSubmitted={fcstSubmitted} dec={dec} tot={tot} approved={approved} edited={edited} />
            </div>{/* end two-column layout */}

            <div className="submit-bar">
              <div className="sb-info">
                <strong>{dec}/{tot}</strong> reviewed · {approved} accepted · {edited} edited — approving for {sc.affected} stores
                {hasOob && (
                  <span style={{ marginLeft: 10, color: 'var(--orange-l)', fontWeight: 600 }}>
                    · ⚠ {oobCount} {oobCount === 1 ? 'value is' : 'values are'} outside bounds
                  </span>
                )}
              </div>
              <button
                className={`sb-btn ${fcstSubmitted ? 'sb-submitted' : 'sb-submit'}`}
                disabled={fcstSubmitted || dec < tot || hasOob}
                onClick={submit}
                title={hasOob ? `${oobCount} value(s) are outside their [LB–UB] bounds. Adjust to within bounds before submitting.` : ''}
              >
                {fcstSubmitted ? '✓ Submitted — Chain Resuming' : hasOob ? `Fix ${oobCount} out-of-bounds value${oobCount === 1 ? '' : 's'} ↑` : `Submit ${sc.affected}-Store Plan & Resume →`}
              </button>
            </div>
          </>
        }
      </div>
    </div>
  );
}

function AgPanel6({ sc, fcstState, autonomousToggle }) {
  const { rows, totalOldCases, totalNewCases, incrCases, slBase, slAfter } = computeScenarioNums(sc, fcstState);
  const dc = sc.dcConstraint;
  const gain = sc.gain;
  const cost = sc.costDelta;
  const [visibleRows, setVisibleRows] = useState(0);
  const [done, setDone] = useState(false);
  useEffect(() => {
    setVisibleRows(0); setDone(false);
    const timers = [];
    rows.forEach((_, i) => timers.push(setTimeout(() => setVisibleRows(v => v + 1), 200 + i * 350)));
    timers.push(setTimeout(() => setDone(true), 200 + rows.length * 350 + 300));
    return () => timers.forEach(clearTimeout);
  }, [sc.id]);

  // Propagation: when autonomousToggle ON use planner edits, when OFF use AI values
  const effectiveFcstState = autonomousToggle ? fcstState :
    Object.fromEntries(Object.entries(fcstState).map(([k, v]) => [k, { ...v, value: sc.fcst[Number(k)]?.ai ?? v.value }]));
  const propagatedCount = sc.fcst.filter((p, i) => { const st = fcstState[i]; return st && st.value !== p.ai; }).length;

  return (
    <div className="apanel">
      <div className="handoff-strip">
        <span className="handoff-from">Forecast Approval (06b)</span>
        <span className="handoff-arrow">→</span>
        <span className="handoff-to">Inventory & Order Update (07)</span>
        <span className="handoff-payload">{rows.length} approved forecasts · {sc.affected} stores · converting to DC orders</span>
      </div>
      <div className="aph">
        <div className="apb2" style={{ background: '#16A34A' }}>06</div>
        <div><h3>Inventory & Order Update</h3><div className="aps">{sc.affected} stores · {rows.length} products</div></div>
        <HelpBox text="<strong>What it does:</strong> Converts approved forecasts into actual store order quantities. Factors in: on-hand stock, in-transit, shelf life, min/max order qty, case pack sizes, DC capacity, safety stock.<br><br><strong>Columns:</strong> Curr. IOH = estimated on-hand stock (5-day velocity proxy). In Transit = cases within 48hrs. Safety Stock = 3.5-day target buffer.<br><br><strong>LPI Note:</strong> Service level, safety stock, and order quantity impacts will update LPIs on finalization in Agent 9." />
        <div className="apst">{done ? '✓ Complete' : '⟳ Generating...'}</div>
      </div>

      {/* DC CONSTRAINT BANNER */}
      {dc?.affected && (
        <div className="dc-constraint-banner">
          <div className="dc-constraint-title">
            Supply Constraint Active — {dc.constrainedSku} · {dc.dcName} · {dc.coveragePct}% coverage
          </div>
          <div className="dc-constraint-body">{dc.description}</div>
          <div style={{ display: 'flex', gap: 16, marginTop: 8, flexWrap: 'wrap' }}>
            {dc.atpAvailable && <div className="dc-cm"><div className="dc-cm-l">ATP Available</div><div className="dc-cm-v" style={{ color: '#F87171', marginLeft: 8 }}>{dc.atpAvailable.toLocaleString()}cs</div></div>}
            {dc.atpRequired && <div className="dc-cm"><div className="dc-cm-l">ATP Required</div><div className="dc-cm-v" style={{ marginLeft: 8 }}>{dc.atpRequired.toLocaleString()}cs</div></div>}
            {dc.shortfallCases > 0 && <div className="dc-cm"><div className="dc-cm-l">Shortfall</div><div className="dc-cm-v" style={{ color: '#F87171', marginLeft: 8 }}>{dc.shortfallCases.toLocaleString()}cs</div></div>}
          </div>
          <div style={{ fontSize: 9, color: 'var(--muted)', marginTop: 4 }}>Constrained SKU flagged below (!!C). Allocation decision in Next Best Action (Agent 8).</div>
        </div>
      )}

      {/* AUTO-PROPAGATE BANNER */}
      {done && propagatedCount > 0 && (
        <div style={{ padding: '7px 20px', background: autonomousToggle ? 'rgba(34,197,94,0.06)' : 'rgba(245,158,11,0.06)', borderBottom: `1px solid ${autonomousToggle ? 'rgba(34,197,94,0.2)' : 'rgba(245,158,11,0.2)'}`, display: 'flex', alignItems: 'center', gap: 10, fontSize: 10, transition: 'background .3s' }}>
          <span style={{ fontSize: 13 }}>{autonomousToggle ? '⚡' : '⏸'}</span>
          <span style={{ fontWeight: 700, color: autonomousToggle ? '#22C55E' : '#FBBF24' }}>
            {autonomousToggle ? `Auto-propagate ON — ${propagatedCount} planner edit${propagatedCount > 1 ? 's' : ''} reflected in orders below` : `Auto-propagate OFF — showing AI values only. ${propagatedCount} planner edit${propagatedCount > 1 ? 's' : ''} suppressed`}
          </span>
        </div>
      )}

      <div className="apbody">
        <div className="tw2">
          <div className="tw2t">
            Revised Orders — Inventory Position Breakdown
            {!done && <span style={{ marginLeft: 8, fontSize: 8, color: '#16A34A', animation: 'pulse 1s infinite', fontWeight: 700 }}>● WRITING ORDERS</span>}
          </div>
          <table className="dt">
            <thead><tr>
              <th>Product</th>
              <th>Cat</th>
              <th style={{ color: '#4DC4F0' }}>Curr. IOH</th>
              <th style={{ color: '#6366F1' }}>In Transit</th>
              <th style={{ color: '#F59E0B' }}>Safety Stock</th>
              <th>Old Order</th>
              <th style={{ color: autonomousToggle && propagatedCount > 0 ? '#22C55E' : 'var(--brand-light)' }}>New Order{autonomousToggle && propagatedCount > 0 ? ' ⚡' : ''}</th>
              <th>Delta</th>
              <th>Src</th>
            </tr></thead>
            <tbody>
              {rows.slice(0, visibleRows).map((r, i) => {
                const isC = dc?.affected && r.name === dc.constrainedSku;
                const st = fcstState[i];
                const isPropagated = st && st.value !== r.ai && autonomousToggle;
                const effectiveSt = effectiveFcstState[i];
                const effectiveVal = effectiveSt ? effectiveSt.value : r.ai;
                const effectiveNewCs = effectiveVal;
                const effectiveDelta = effectiveNewCs - r.oldCs;
                return (
                  <tr key={i} className="stream-row" style={{ background: isC ? 'rgba(239,68,68,0.04)' : isPropagated ? 'rgba(34,197,94,0.03)' : undefined, transition: 'background .3s' }}>
                    <td style={{ fontWeight: 500 }}>
                      {isC && <span style={{ fontSize: 8, color: '#F87171', marginRight: 3, fontWeight: 700 }}>!!C</span>}
                      {r.name}
                      {isPropagated && <span style={{ marginLeft: 5, fontSize: 7, fontWeight: 700, padding: '1px 4px', borderRadius: 3, background: 'rgba(34,197,94,0.12)', color: '#22C55E' }}>EDITED</span>}
                    </td>
                    <td style={{ color: 'var(--muted)', fontSize: 10 }}>{r.cat}</td>
                    <td style={{ textAlign: 'center', color: '#4DC4F0', fontWeight: 600 }}>{r.currentIOH}</td>
                    <td style={{ textAlign: 'center', color: '#6366F1', fontWeight: 600 }}>{r.inTransit}</td>
                    <td style={{ textAlign: 'center', color: '#F59E0B', fontWeight: 600 }}>{r.ssTarget}</td>
                    <td style={{ textAlign: 'center', color: 'var(--muted)' }}>{r.oldCs}cs</td>
                    <td style={{ textAlign: 'center', fontWeight: 700, color: isC ? '#F87171' : isPropagated ? '#22C55E' : 'var(--brand-light)' }}>
                      {effectiveNewCs}cs
                      {isPropagated && <span style={{ fontSize: 8, color: effectiveDelta > effectiveNewCs - r.oldCs ? '#22C55E' : '#F87171', marginLeft: 3 }}>
                        ({effectiveDelta >= 0 ? '+' : ''}{effectiveDelta - r.deltaCs} vs AI)
                      </span>}
                    </td>
                    <td style={{ textAlign: 'center', fontWeight: 600, color: effectiveDelta > 0 ? 'var(--brand-light)' : effectiveDelta < 0 ? '#4ADE80' : 'var(--muted)' }}>
                      {effectiveDelta > 0 ? '+' : ''}{effectiveDelta}
                    </td>
                    <td><span className={`tag ${isPropagated ? 'tag-e' : r.wasEdited ? 'tag-e' : 'tag-ok'}`}>{isPropagated ? 'Propagated' : r.wasEdited ? 'Edited' : 'AI'}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div style={{ display: 'flex', gap: 14, fontSize: 9, color: 'var(--muted)', margin: '5px 0 14px', flexWrap: 'wrap' }}>
            <span style={{ color: '#4DC4F0' }}>Curr. IOH: est. on-hand (5-day)</span>
            <span style={{ color: '#6366F1' }}>In Transit: within 48hrs</span>
            <span style={{ color: '#F59E0B' }}>Safety Stock: 3.5-day target</span>
          </div>
        </div>

        <div style={{ fontWeight: 600, fontSize: 12, margin: '16px 0 8px' }}>Service Level Recovery</div>
        <div className="gauge-wrap">
          <div className="gauge"><Gauge pct={slBase} color="#EF4444" /><div className="g-val" style={{ color: '#F87171' }}>~{slBase}%</div><div className="g-label">SL Without Action</div></div>
          <div style={{ display: 'flex', alignItems: 'center', fontSize: 24, color: 'var(--muted)' }}>→</div>
          <div className="gauge"><Gauge pct={Math.min(slAfter, 98.5)} color="#22C55E" /><div className="g-val" style={{ color: 'var(--green-l)' }}>{Math.min(slAfter, 98.5).toFixed(1)}%</div><div className="g-label">SL After Revision</div></div>
          <div className="gauge"><Gauge pct={82} color="#F59E0B" /><div className="g-val" style={{ color: '#FBBF24' }}>+{(Math.min(slAfter, 98.5) - slBase).toFixed(1)}pp</div><div className="g-label">SL Recovery</div></div>
        </div>

        <div style={{ fontWeight: 600, fontSize: 12, margin: '16px 0 8px' }}>Cost vs Benefit</div>
        {[
          { label: 'Revenue Protected', val: revProtectedFor(sc), pct: Math.min(revProtectedFor(sc) / 16, 100), type: 'vb-green' },
          { label: 'Waste Saved', val: Math.round(gain * 0.28), pct: Math.min(Math.round(gain * 0.28) / 16, 100), type: 'vb-green' },
          { label: 'Product Cost', val: `-${cost}`, pct: Math.min(cost / 16, 100), type: 'vb-up' },
          { label: 'Net Benefit', val: revProtectedFor(sc) - cost, pct: Math.min((revProtectedFor(sc) - cost) / 16, 100), type: 'vb-green', bold: true },
        ].map(b => (
          <div key={b.label} className="vbar-wrap">
            <div className="vbar-label" style={{ color: b.type === 'vb-up' ? '#F87171' : '#22C55E', fontWeight: b.bold ? 700 : 500 }}>{b.label}</div>
            <div className="vbar-track"><div className={`vbar-fill ${b.type}`} style={{ width: `${b.pct}%` }}>${b.val}K</div></div>
          </div>
        ))}
        <div className="mg" style={{ marginTop: 14 }}>
          <div className="mc"><div className="ml">Volume Δ</div><div className="mv up">{sc.vol}</div></div>
          <div className="mc"><div className="ml">Stores Revised</div><div className="mv">{sc.affected}</div></div>
          <div className="mc"><div className="ml">Stores Unchanged</div><div className="mv dn">{2271 - sc.affected}</div></div>
          <div className="mc"><div className="ml">ROI</div><div className="mv" style={{ color: 'var(--brand-light)' }}>{sc.roi}x</div></div>
        </div>
      </div>
    </div>
  );
}

  return (

        <div className="apst">{noImpact ? 'N/A' : '✓ Ready'}</div>

            <div className="tw2" style={{ marginTop: 12 }}>

                  </tr>

            </div>


            {/* LEARNING LOOP CALLOUT for Coachella and Marathon */}
            {(sc.id === 'e2' || sc.id === 'e3') && (
              <div style={{ background: 'linear-gradient(135deg,rgba(34,197,94,0.06),rgba(0,159,224,0.04))', border: '1px solid rgba(34,197,94,0.25)', borderRadius: 'var(--radius-sm)', padding: '14px 16px', margin: '14px 0' }}>

                    { label: 'Captured', value: 'Historical event log recorded the gap. Tagged as "missed category — outdoor desert festival".', color: '#FBBF24' },

                    { label: 'Captured', value: 'Historical log recorded: "marathon events drive sports nutrition demand not present in other event types".', color: '#FBBF24' },
                    { label: 'Model Updated', value: 'Energy bars now auto-included for marathon events with 40K+ registered runners.', color: 'var(--brand-light)' },

                      <div style={{ fontSize: 8, color: f.color, textTransform: 'uppercase', letterSpacing: '.4px', fontWeight: 700, marginBottom: 4 }}>{f.label}</div>

            {/* HISTORICAL EVENTS */}

            {historical.map((h, i) => (
              <div key={i} style={{ background: 'var(--bg2)', borderRadius: 'var(--radius-sm)', border: '1px solid rgba(147,51,234,0.18)', marginBottom: 10, overflow: 'hidden' }}>

            {/* DEEP-DIVE ANALYSIS — collapsible static SHAP summary */}

                    {(sc.agentData?.features || []).map((f, i) => {

}

/* ─────────────────────────────────────────────
   CUSTOM ALLOCATION PANEL (FEEDBACK #2 + STEP 4A)
   Used inside Next Best Action — Priority Store Allocation (n3).
   Lets the planner manually edit per-store allocation while
   enforcing the supply constraint: Σ allocations ≤ available inventory.
───────────────────────────────────────────── */
function CustomAllocationPanel({ sc, action, isSelected, customAllocs, setCustomAllocs, disabled }) {
  // Available inventory comes from the DC constraint when present;
  // fallback to a sensible aggregate if not.
  const dc = sc.dcConstraint;
  const totalAvailable = (dc && dc.atpAvailable)
    ? dc.atpAvailable
    : Math.max(800, Math.round((sc.affected || 30) * 16));

  // Build the per-store list deterministically from sc.locStores.
  // Each entry: { id, name, region, baseAlloc (default fair share) }
  const storeList = (() => {
    const out = [];
    const locs = sc.locStores || {};
    let storeNum = 1;
    Object.entries(locs).forEach(([region, count]) => {
      for (let i = 0; i < count; i++) {
        out.push({
          id: `${region}-${i}`,
          name: `Store #${(storeNum++).toString().padStart(4, '0')}`,
          region,
        });
      }
    });
    // Fallback for scenarios without locStores
    if (out.length === 0) {
      const n = sc.affected || 30;
      for (let i = 0; i < n; i++) out.push({ id: `S-${i}`, name: `Store #${(i+1).toString().padStart(4,'0')}`, region: sc.region || '—' });
    }
    return out;
  })();

  // Fair share = available / N (rounded down so we don't exceed budget).
  const fairShare = Math.floor(totalAvailable / storeList.length);

  // Initialise / read state. Stored under action.id (e.g. 'n3').
  const stateKey = action.id;
  const current = customAllocs[stateKey];
  const perStore = (current && current.perStore) || (() => {
    const init = {};
    storeList.forEach(s => { init[s.id] = fairShare; });
    return init;
  })();

  // ── ALLOCATION TOTALS & VALIDATION STATUS ──
  // Memoised so we don't recompute on unrelated re-renders. Recomputes
  // exactly when per-store values or the supply ceiling changes — giving
  // the planner immediate, real-time feedback as they edit any input.
  const { totalAllocated, remaining, utilPct, skippedCount, allocStatus } = useMemo(() => {
    const total = Object.values(perStore).reduce((a, b) => a + (Number(b) || 0), 0);
    const rem = totalAvailable - total;                      // +ve = under, -ve = over, 0 = exact
    const pct = totalAvailable > 0 ? Math.min(100, Math.round((total / totalAvailable) * 100)) : 0;
    const skipped = storeList.filter(s => (Number(perStore[s.id]) || 0) === 0).length;
    const status = total > totalAvailable ? 'over' : total < totalAvailable ? 'under' : 'exact';
    return {
      totalAllocated: total,
      remaining: rem,
      utilPct: pct,
      skippedCount: skipped,
      allocStatus: status,
    };
  }, [perStore, totalAvailable, storeList]);

  function update(storeId, val) {
    if (disabled) return;
    const v = Math.max(0, parseInt(val) || 0);
    setCustomAllocs(prev => ({
      ...prev,
      [stateKey]: {
        perStore: { ...((prev[stateKey] && prev[stateKey].perStore) || perStore), [storeId]: v },
        totalAvailable,
      }
    }));
  }

  function distributeEvenly() {
    if (disabled) return;
    const fs = Math.floor(totalAvailable / storeList.length);
    const next = {};
    storeList.forEach(s => { next[s.id] = fs; });
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable } }));
  }

  function autoBalance() {
    if (disabled) return;
    // Scale all current allocations proportionally to fit budget exactly.
    const cur = Object.values(perStore).reduce((a, b) => a + (Number(b) || 0), 0);
    if (cur === 0) { distributeEvenly(); return; }
    const ratio = totalAvailable / cur;
    const next = {};
    storeList.forEach(s => { next[s.id] = Math.floor((Number(perStore[s.id]) || 0) * ratio); });
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable } }));
  }

  function clearAll() {
    if (disabled) return;
    const next = {};
    storeList.forEach(s => { next[s.id] = 0; });
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable } }));
  }

  // Limit visible rows but allow scroll
  const [showAll, setShowAll] = useState(false);
  const visibleStores = showAll ? storeList : storeList.slice(0, 8);

  // Status colour — drives both the budget bar and the "Allocated" value
  // tint. Maps directly to the three allocation cases:
  //   over  → bad   (red)
  //   under → warn  (amber)
  //   exact → ok    (green)
  const utilCls = allocStatus === 'over' ? 'bad' : allocStatus === 'under' ? 'warn' : 'ok';

  return (
    <div className={`custom-panel${isSelected ? ' selected' : ''}`}>
      <div className="custom-panel-head">
        <span className="custom-tag">Custom</span>
        <div style={{ flex: 1 }}>
          <div className="custom-panel-title">Manual per-store allocation</div>
          <div className="custom-panel-sub">Edit any store. Total allocation must not exceed available inventory.</div>
        </div>
      </div>

      {/* SUPPLY BUDGET */}
      <div className="custom-budget">
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Available</div>
          <div className="custom-budget-val">{totalAvailable.toLocaleString()} cs</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Allocated</div>
          <div className={`custom-budget-val ${utilCls}`}>{totalAllocated.toLocaleString()} cs</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">
            {allocStatus === 'over' ? 'Over by' : allocStatus === 'under' ? 'Under by' : 'Remaining'}
          </div>
          <div className={`custom-budget-val ${utilCls}`}>
            {Math.abs(remaining).toLocaleString()} cs
          </div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Stores covered</div>
          <div className="custom-budget-val">{storeList.length - skippedCount}/{storeList.length}</div>
        </div>
        <div className="custom-budget-bar" title={`${utilPct}% utilised`}>
          <div className={`custom-budget-bar-fill ${utilCls}`} style={{ width: `${Math.min(100, utilPct)}%` }} />
        </div>
      </div>

      {/* ── REAL-TIME ALLOCATION VALIDATION ──
          Exactly one primary status message is shown at a time, driven by
          allocStatus ('over' | 'under' | 'exact'). Updates live on every
          input change. Skipped-stores note is informational only and
          appears underneath when relevant. */}
      {allocStatus === 'over' && (
        <div className="custom-msg bad" role="alert" aria-live="polite">
          ⚠ You are over-allocating by {Math.abs(remaining).toLocaleString()} cs.
          Reduce per-store quantities until total ≤ {totalAvailable.toLocaleString()} cs.
        </div>
      )}
      {allocStatus === 'under' && (
        <div className="custom-msg warn" role="status" aria-live="polite">
          ⚠ You are under-allocating by {remaining.toLocaleString()} cs.
          {totalAvailable.toLocaleString()} cs available — {totalAllocated.toLocaleString()} cs assigned.
        </div>
      )}
      {allocStatus === 'exact' && totalAllocated > 0 && (
        <div className="custom-msg ok" role="status" aria-live="polite">
          ✓ Allocation matches available supply ({totalAvailable.toLocaleString()} cs).
        </div>
      )}
      {/* Secondary informational note — does not block, just flags intent */}
      {allocStatus !== 'over' && skippedCount > 0 && (
        <div className="custom-msg warn" style={{ marginTop: 6 }}>
          {skippedCount} store{skippedCount > 1 ? 's' : ''} set to 0 — these will receive no allocation. Acceptable if intentional.
        </div>
      )}

      {/* CONTROLS */}
      <div className="custom-actions">
        <button className="custom-mini-btn" disabled={disabled} onClick={distributeEvenly}>↔ Distribute evenly</button>
        <button className="custom-mini-btn" disabled={disabled} onClick={autoBalance}>⚖ Auto-balance to budget</button>
        <button className="custom-mini-btn" disabled={disabled} onClick={clearAll}>✕ Clear all</button>
        <span style={{ fontSize: 9, color: 'var(--muted)', marginLeft: 'auto' }}>
          Fair share: {fairShare.toLocaleString()} cs/store · {storeList.length} stores
        </span>
      </div>

      {/* PER-STORE TABLE */}
      <div className="custom-table" style={{ marginTop: 10, maxHeight: 300, overflowY: 'auto' }}>
        <div className="custom-row hdr">
          <div>Store · Region</div>
          <div style={{ textAlign: 'center' }}>Fair share</div>
          <div style={{ textAlign: 'center' }}>Your allocation</div>
          <div style={{ textAlign: 'center' }}>Δ vs fair</div>
          <div></div>
        </div>
        {visibleStores.map(s => {
          const v = Number(perStore[s.id]) || 0;
          const delta = v - fairShare;
          const isZero = v === 0;
          return (
            <div key={s.id} className={`custom-row${isZero ? ' invalid' : ''}`}>
              <div>
                <div style={{ fontWeight: 600 }}>{s.name}</div>
                <div style={{ fontSize: 9, color: 'var(--muted)' }}>{s.region}</div>
              </div>
              <div style={{ textAlign: 'center', color: 'var(--muted)', fontSize: 10 }}>{fairShare}</div>
              <div>
                <input
                  type="number"
                  className={`custom-input${isZero ? ' invalid' : ''}`}
                  min="0"
                  value={v}
                  disabled={disabled}
                  onChange={e => update(s.id, e.target.value)}
                  onFocus={e => e.target.select()}
                />
              </div>
              <div className={`custom-row-tag ${delta > 0 ? 'ok' : delta < 0 ? 'warn' : ''}`} style={{ textAlign: 'center' }}>
                {delta > 0 ? `+${delta}` : delta < 0 ? delta : '—'}
              </div>
              <div style={{ textAlign: 'center', fontSize: 11, color: isZero ? 'var(--red-l)' : 'var(--muted)' }} title={isZero ? 'Skipped' : 'Allocated'}>
                {isZero ? '∅' : '✓'}
              </div>
            </div>
          );
        })}
      </div>
      {storeList.length > 8 && (
        <button className="custom-mini-btn" style={{ marginTop: 8 }} onClick={() => setShowAll(s => !s)}>
          {showAll ? '↑ Collapse list' : `↓ Show all ${storeList.length} stores`}
        </button>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────
   CUSTOM SUBSTITUTION PANEL (FEEDBACK #2 + STEP 4B)
   Used inside Next Best Action — Product Substitution (n4).
   Lets the planner manually define substitution quantities per substitute SKU,
   constrained by available substitute supply for each.
───────────────────────────────────────────── */
function CustomSubstitutionPanel({ sc, action, isSelected, customAllocs, setCustomAllocs, disabled }) {
  // Build substitute SKU list. Use scenario-derived defaults so it works for any scenario.
  // Each substitute: { id, name, available (cs), crossElasticity }
  // Available is derived from scenario gain/affected.
  const baseAvailable = Math.max(60, Math.round((sc.affected || 30) * 4));
  const substitutes = [
    { id: 'sub-a', name: 'Sig SELECT Sparkling Water 12pk', available: baseAvailable,            crossElasticity: 0.78 },
    { id: 'sub-b', name: 'Refreshe Water 24pk',             available: Math.round(baseAvailable*0.7), crossElasticity: 0.85 },
    { id: 'sub-c', name: 'O Organics Flavored Water 12pk',  available: Math.round(baseAvailable*0.5), crossElasticity: 0.62 },
  ];

  const stateKey = action.id;
  const current = customAllocs[stateKey];
  const perSub = (current && current.perStore) || (() => {
    const init = {};
    // Default: 50% of each substitute used
    substitutes.forEach(s => { init[s.id] = Math.floor(s.available * 0.5); });
    return init;
  })();

  // Aggregate gap to fill = the original action.qty if defined, else use a sensible default
  const targetGap = action.qty || 180;
  const totalSubstituted = Object.values(perSub).reduce((a, b) => a + (Number(b) || 0), 0);
  const gapRemaining = Math.max(0, targetGap - totalSubstituted);
  const gapClosedPct = Math.min(100, Math.round((totalSubstituted / targetGap) * 100));

  // Per-SKU constraint check
  const perSkuViolations = substitutes.filter(s => (Number(perSub[s.id]) || 0) > s.available);
  const anyViolation = perSkuViolations.length > 0;

  function update(subId, val) {
    if (disabled) return;
    const v = Math.max(0, parseInt(val) || 0);
    setCustomAllocs(prev => ({
      ...prev,
      [stateKey]: {
        perStore: { ...((prev[stateKey] && prev[stateKey].perStore) || perSub), [subId]: v },
        totalAvailable: targetGap,
      }
    }));
  }

  function fillGap() {
    if (disabled) return;
    // Fill the gap greedily within each substitute's available stock, in elasticity order
    let need = targetGap;
    const next = {};
    substitutes.forEach(s => { next[s.id] = 0; });
    const sorted = [...substitutes].sort((a, b) => b.crossElasticity - a.crossElasticity);
    for (const s of sorted) {
      if (need <= 0) break;
      const take = Math.min(need, s.available);
      next[s.id] = take;
      need -= take;
    }
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable: targetGap } }));
  }

  function clearAll() {
    if (disabled) return;
    const next = {};
    substitutes.forEach(s => { next[s.id] = 0; });
    setCustomAllocs(prev => ({ ...prev, [stateKey]: { perStore: next, totalAvailable: targetGap } }));
  }

  const utilCls = anyViolation ? 'bad' : (gapClosedPct < 50 ? 'warn' : 'ok');

  return (
    <div className={`custom-panel${isSelected ? ' selected' : ''}`}>
      <div className="custom-panel-head">
        <span className="custom-tag">Custom</span>
        <div style={{ flex: 1 }}>
          <div className="custom-panel-title">Manual substitution mix</div>
          <div className="custom-panel-sub">Define how much of each substitute SKU to deploy. Total per SKU must respect available supply.</div>
        </div>
      </div>

      {/* GAP BUDGET */}
      <div className="custom-budget">
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Demand gap</div>
          <div className="custom-budget-val">{targetGap.toLocaleString()} cs</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Substituted</div>
          <div className={`custom-budget-val ${utilCls}`}>{totalSubstituted.toLocaleString()} cs</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Gap closed</div>
          <div className={`custom-budget-val ${utilCls}`}>{gapClosedPct}%</div>
        </div>
        <div className="custom-budget-item">
          <div className="custom-budget-lbl">Gap remaining</div>
          <div className={`custom-budget-val ${gapRemaining > 0 ? 'warn' : 'ok'}`}>{gapRemaining.toLocaleString()} cs</div>
        </div>
        <div className="custom-budget-bar" title={`${gapClosedPct}% of gap covered`}>
          <div className={`custom-budget-bar-fill ${utilCls}`} style={{ width: `${Math.min(100, gapClosedPct)}%` }} />
        </div>
      </div>

      {/* MESSAGES */}
      {anyViolation && (
        <div className="custom-msg bad">
          ⚠ Supply violation on {perSkuViolations.length} substitute{perSkuViolations.length > 1 ? 's' : ''}. Reduce the highlighted quantities to within available supply.
        </div>
      )}
      {!anyViolation && gapRemaining > 0 && totalSubstituted > 0 && (
        <div className="custom-msg warn">
          Partial coverage. {gapRemaining.toLocaleString()} cs of demand gap still uncovered — service level may dip on the primary SKU.
        </div>
      )}
      {!anyViolation && gapRemaining === 0 && totalSubstituted > 0 && (
        <div className="custom-msg ok">
          ✓ Demand gap fully covered within substitute supply. No constraint violation.
        </div>
      )}

      {/* CONTROLS */}
      <div className="custom-actions">
        <button className="custom-mini-btn" disabled={disabled} onClick={fillGap}>⚡ Auto-fill gap (by elasticity)</button>
        <button className="custom-mini-btn" disabled={disabled} onClick={clearAll}>✕ Clear all</button>
      </div>

      {/* PER-SUBSTITUTE TABLE */}
      <div className="custom-table" style={{ marginTop: 10 }}>
        <div className="custom-row hdr">
          <div>Substitute SKU</div>
          <div style={{ textAlign: 'center' }}>Available</div>
          <div style={{ textAlign: 'center' }}>Your qty</div>
          <div style={{ textAlign: 'center' }}>Elasticity</div>
          <div></div>
        </div>
        {substitutes.map(s => {
          const v = Number(perSub[s.id]) || 0;
          const violates = v > s.available;
          return (
            <div key={s.id} className={`custom-row${violates ? ' invalid' : ''}`}>
              <div>
                <div style={{ fontWeight: 600 }}>{s.name}</div>
                <div style={{ fontSize: 9, color: 'var(--muted)' }}>Cross-sub for {(sc.dcConstraint && sc.dcConstraint.constrainedSku) || 'primary SKU'}</div>
              </div>
              <div style={{ textAlign: 'center', color: 'var(--muted)', fontSize: 10 }}>{s.available.toLocaleString()} cs</div>
              <div>
                <input
                  type="number"
                  className={`custom-input${violates ? ' invalid' : ''}`}
                  min="0"
                  max={s.available}
                  value={v}
                  disabled={disabled}
                  onChange={e => update(s.id, e.target.value)}
                  onFocus={e => e.target.select()}
                />
              </div>
              <div className="custom-row-tag" style={{ textAlign: 'center' }}>{s.crossElasticity.toFixed(2)}</div>
              <div style={{ textAlign: 'center', fontSize: 11, color: violates ? 'var(--red-l)' : v === 0 ? 'var(--muted)' : 'var(--green-l)' }}
                title={violates ? 'Exceeds supply' : v === 0 ? 'Not used' : 'OK'}>
                {violates ? '⚠' : v === 0 ? '∅' : '✓'}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AgPanel8({ sc, nbaState, setNbaState, nbaSubmitted, setNbaSubmitted, onResume, fcstState, dcAllocChoice, setDcAllocChoice, customAllocs, setCustomAllocs }) {
  const actions = sc.agentData?.nbaActions || [];
  const dc = sc.dcConstraint;
  const noImpact = false;
  const slBase = SL_BASE_MAP[sc.id] || 76;
  const rm = computeResolutionModel(sc);
  const autoOnlySL = rm ? rm.autoOnlySL : slBase;  // SL after autonomous actions, before planner options
  // Baseline-consistent SL labels: auto-done cards show the running cumulative on top of
  // slBase; the per-option labels (below) show auto-only + that option's lift. Every SL
  // figure on this screen derives from the same slBase, so they are at par with the chain.
  const doneSLByIdx = (() => { let cum = 0; const m = {}; actions.filter(a => a.done).forEach(a => { cum += (a.kpiDelta?.sl || 0); m[a.id] = Math.min(98.5, slBase + cum); }); return m; })();
  function doneSLLabel(a) { return (a.kpiDelta && a.kpiDelta.sl) ? `+${a.kpiDelta.sl}pp → ${doneSLByIdx[a.id].toFixed(0)}%` : a.slImpact; }
  function toggleSLLabel(a) { return (a.kpiDelta && a.kpiDelta.sl) ? `+${a.kpiDelta.sl}pp → ${Math.min(98.5, autoOnlySL + a.kpiDelta.sl).toFixed(0)}%` : a.slImpact; }
  const dcDecisionNeeded = dc?.affected && !dcAllocChoice && dc.shortfallCases > 0;

  function toggleAction(id) {
    if (nbaSubmitted) return;
    setNbaState(s => ({ ...s, [id]: !s[id] }));
  }

  function submitNba() {
    setNbaSubmitted(true);
    setTimeout(onResume, 600);
  }

  // Compute projected outcome from NBA + DC decision
  const proj = computeNbaProjection(sc, fcstState || {}, nbaState, dcAllocChoice);

  // FEEDBACK #2: Detect if any selected Custom plan is over its supply budget.

    for (const a of actions) {
      const sel = nbaState[a.id];
      if (!sel || !sel.endsWith || !sel.endsWith('-custom')) continue;
      const ca = customAllocs[a.id];
      if (!ca || !ca.perStore) continue;
      const total = Object.values(ca.perStore).reduce((s, v) => s + (Number(v) || 0), 0);
      if (/substitut/i.test(a.title)) {
        // For substitution: any single SKU exceeds its supply ⇒ invalid.
        // We re-derive the same supply caps used inside CustomSubstitutionPanel to keep parity.
        const baseAvailable = Math.max(60, Math.round((sc.affected || 30) * 4));
        const caps = { 'sub-a': baseAvailable, 'sub-b': Math.round(baseAvailable*0.7), 'sub-c': Math.round(baseAvailable*0.5) };
        for (const [k, v] of Object.entries(ca.perStore)) {
          if ((Number(v) || 0) > (caps[k] || Infinity)) return true;
        }
      } else {
        // For allocation: total must not exceed available.
        if (total > ca.totalAvailable) return true;
      }
    }
    return false;
  })();

  // DC alloc KPI note

function AgPanel9({ sc, filter, escState, setEscState, escSubmitted, setEscSubmitted, nbaState, fcstState }) {
  const items = sc.escItems;
  const dec = Object.keys(escState).length;
  // orderEdits: { itemIdx: { aggregate: number, stores: { storeIdx: number } } }
  const [orderEdits, setOrderEdits] = useState({});
  const [expandedStore, setExpandedStore] = useState(null);

  function approve(i) { setEscState(s => ({ ...s, [i]: 'approved' })); }
  function reject(i) { setEscState(s => ({ ...s, [i]: 'rejected' })); }
  function approveAll() { const ns = {}; items.forEach((_, i) => { ns[i] = 'approved'; }); setEscState(ns); }
  function submit() { setEscSubmitted(true); }

  // ── Orders flow from the APPROVED FORECAST (Forecast Approval → NBA → Adjudication) ──
  // Match each escalated line to its forecast product by name, then use the value the
  // planner approved upstream (fcstState), falling back to the AI value. The store's
  // order quantity = that approved per-store forecast. If a line has no matching forecast
  // product (e.g. a substitute SKU), fall back to the authored chg% heuristic.
  function matchFcst(e) {
    const idx = (sc.fcst || []).findIndex(p => p.name === e.prod);
    return idx >= 0 ? { p: sc.fcst[idx], idx } : null;
  }
  function approvedValOf(e) {
    const m = matchFcst(e);
    if (!m) return null;
    const st = fcstState && fcstState[m.idx];
    return st ? st.value : m.p.ai;
  }
  function getBaseQty(e) {
    const v = approvedValOf(e);
    if (v != null) return v;                       // approved per-store forecast units
    const chgPct = parseFloat(e.chg.replace('%','').replace('+','')) / 100;
    return Math.round(sc.affected * 0.5 * chgPct); // fallback for non-forecast SKUs
  }
  // Change vs plan, derived from the forecast (old → approved). Falls back to authored chg.
  function getChgLabel(e) {
    const m = matchFcst(e);
    if (m && m.p.old) {
      const v = approvedValOf(e);
      const pct = Math.round(((v - m.p.old) / m.p.old) * 100);
      return `${pct >= 0 ? '+' : ''}${pct}%`;
    }
    return e.chg;
  }

  // ±25% bounds
  function getBounds(baseQty) {
    return { lb: Math.max(1, Math.round(baseQty * 0.75)), ub: Math.round(baseQty * 1.25) };
  }

  // Build store breakdown with deterministic seed (no Math.random on render)
  function getStoreBreakdown(e, itemIdx) {
    const storeList = Object.entries(sc.locStores || {});
    if (storeList.length === 0) return [];
    const base = getBaseQty(e);
    const totalStoreCount = storeList.reduce((s, [,c]) => s + Math.min(c, 3), 0);
    let stores = [];
    let globalSi = 0;
    storeList.forEach(([loc, count]) => {
      const storeCount = Math.min(count, 3);
      // Distribute aggregate proportionally across stores in this location
      const locShare = (count / sc.affected);
      for (let si = 0; si < storeCount; si++) {
        const storeQty = Math.round((base * locShare) / storeCount);
        const currentEdit = orderEdits[itemIdx]?.stores?.[globalSi];
        const displayQty = currentEdit !== undefined ? currentEdit : storeQty;
        const storeNum = 1000 + (itemIdx * 100 + globalSi * 17 + loc.charCodeAt(0)) % 8000;
        stores.push({ store: `Store #${storeNum}`, loc, defaultQty: storeQty, qty: displayQty, pri: si === 0 && locShare > 0.3 ? 'High' : 'Normal', storeIdx: globalSi });
        globalSi++;
      }
    });
    return { stores, totalStoreCount };
  }

  // Edit aggregate → redistribute proportionally to stores
  function editAggregate(i, newVal) {
    const base = getBaseQty(items[i]);
    const { stores } = getStoreBreakdown(items[i], i);
    const totalDefault = stores.reduce((s, st) => s + st.defaultQty, 0) || 1;
    const newStores = {};
    stores.forEach(st => {
      newStores[st.storeIdx] = Math.max(1, Math.round((st.defaultQty / totalDefault) * newVal));
    });
    setOrderEdits(s => ({ ...s, [i]: { aggregate: newVal, stores: newStores } }));
  }

  // Edit individual store → update aggregate as sum
  function editStoreQty(itemIdx, storeIdx, newVal) {
    setOrderEdits(s => {
      const prev = s[itemIdx] || {};
      const base = getBaseQty(items[itemIdx]);
      const { stores } = getStoreBreakdown(items[itemIdx], itemIdx);
      const prevStores = prev.stores || {};
      const newStores = { ...prevStores, [storeIdx]: newVal };
      const newAggregate = stores.reduce((sum, st) => sum + (newStores[st.storeIdx] !== undefined ? newStores[st.storeIdx] : st.defaultQty), 0);
      return { ...s, [itemIdx]: { aggregate: newAggregate, stores: newStores } };
    });
  }

  const autoN = parseInt(sc.autoN.replace(/,/g,''));
  const autoR = sc.autoR;
  const hasOob = items.some((e, i) => {
    const base = getBaseQty(e);
    const { lb, ub } = getBounds(base);
    const val = orderEdits[i]?.aggregate !== undefined ? orderEdits[i].aggregate : base;
    return val < lb || val > ub;
  });

  return (
    <div className="apanel">
      <div className="aph">
        <div className="apb2" style={{ background: '#00529F' }}>09</div>
        <div><h3>Adjudication & LPI Update</h3><div className="aps">{sc.affected} stores · Final gatekeeper</div></div>
        <HelpBox text="<strong>What it does:</strong> Orders within thresholds auto-approved. Exceptions (&gt;25% volume, &gt;$500/store) escalated here for human review. LPIs update after submission.<br><br><strong>Order range:</strong> Each order has an allowed ±25% band around the AI-derived quantity. Values outside this range block approval — consistent with forecast approval bounds logic.<br><br><strong>Store breakdown:</strong> Editing the aggregate redistributes quantities to stores proportionally. Editing individual stores updates the aggregate as the sum. The aggregate is what gets submitted to DC.<br><br><strong>LPI Update:</strong> Fill Rate, Service Level, Waste Rate, Inventory Turns all recalculate on finalization." />
        <div className={`apst${escSubmitted ? '' : ' pend'}`}>{escSubmitted ? '✓ Done' : '⏳ Review'}</div>
      </div>
      <div className="apbody">
        {(() => {
          const actions = sc.agentData?.nbaActions || [];
          const summaryParts = [];
          actions.forEach(a => {
            if (a.done) { summaryParts.push(`${a.title} (auto-executed)`); }
            else if (a.options) { const chosenId = nbaState?.[a.id]; const chosen = chosenId && a.options.find(o => o.id === chosenId); if (chosen) summaryParts.push(`${a.title}: ${chosen.label} — ${chosen.title}`); }
            else if (nbaState?.[a.id]) { summaryParts.push(a.title); }
          });
          return summaryParts.length > 0 ? (
            <div style={{ background: 'rgba(0,82,159,0.08)', border: '1px solid rgba(0,82,159,0.25)', borderRadius: 'var(--radius-sm)', padding: '12px 16px', marginBottom: 14 }}>
              <div style={{ fontSize: 9, fontWeight: 700, color: 'var(--brand-light)', textTransform: 'uppercase', letterSpacing: '.5px', marginBottom: 6 }}>Strategy Confirmed in Next Best Action</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                {summaryParts.map((s, i) => (<div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 6, fontSize: 10 }}><span style={{ color: '#22C55E', fontWeight: 700, flexShrink: 0 }}>✓</span><span style={{ color: 'var(--text)' }}>{s}</span></div>))}
              </div>
              <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 8, paddingTop: 8, borderTop: '1px solid var(--border)' }}>The orders below are the exceptions that resulted from executing this strategy — those that exceeded the 25% volume escalation threshold. You are ratifying the output, not re-deciding the strategy.</div>
            </div>
          ) : null;
        })()}
        <div className="adj-r">
          <div className="adj-c a-au"><div className="an3">{autoN.toLocaleString()}</div><div className="al3">Auto-Approved</div></div>
          <div className="adj-c a-rv2"><div className="an3">{items.length}</div><div className="al3">Escalated (review)</div></div>
          <div className="adj-c a-rt"><div className="an3">{autoR}%</div><div className="al3">Autonomous Rate</div></div>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', margin: '8px 0' }}>
          <div style={{ fontWeight: 600, fontSize: 12 }}>Escalated Orders — {items.length} items</div>
          <button className="fcst-btn approve" style={{ padding: '4px 12px', fontSize: 9 }} onClick={approveAll} disabled={escSubmitted || hasOob}>Approve All</button>
        </div>
        {items.map((e, i) => {
          const st = escState[i];
          const base = getBaseQty(e);
          const { lb, ub } = getBounds(base);
          const currentAgg = orderEdits[i]?.aggregate !== undefined ? orderEdits[i].aggregate : base;
          const isOob = currentAgg < lb || currentAgg > ub;
          const storeExpanded = expandedStore === `${i}`;
          const { stores: breakdown } = storeExpanded ? getStoreBreakdown(e, i) : { stores: [] };
          const isEdited = orderEdits[i] !== undefined;

          return (
            <div key={i} style={{ background: 'var(--bg2)', border: `1px solid ${isOob ? 'rgba(239,68,68,0.35)' : st === 'approved' ? 'rgba(34,197,94,0.25)' : st === 'rejected' ? 'rgba(239,68,68,0.2)' : 'var(--border)'}`, borderRadius: 'var(--radius-sm)', marginBottom: 8, overflow: 'hidden' }}>
              <div className="esc-card" style={{ marginBottom: 0, background: 'transparent', border: 'none', borderRadius: 0 }}>
                <div style={{ fontSize: 13, width: 20, textAlign: 'center', color: e.pri === 'Critical' ? '#F87171' : '#FBBF24' }}>{i+1}</div>
                <div className="esc-info">
                  <div className="esc-store">{e.s} — {e.loc}</div>
                  <div className="esc-detail">{e.prod}</div>
                  <div className="esc-change">{getChgLabel(e)} · {e.pri}</div>
                </div>
                {/* Bounded aggregate order qty */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: 3, alignItems: 'center', minWidth: 110 }}>
                  <div style={{ fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.4px' }}>Order Qty (units)</div>
                  <div style={{ position: 'relative' }}>
                    <input
                      type="number" min={lb} max={ub}
                      value={currentAgg}
                      disabled={escSubmitted}
                      onChange={e2 => { const v = parseInt(e2.target.value); if (!isNaN(v) && v >= 0) editAggregate(i, v); }}
                      style={{ width: 88, background: 'var(--bg)', border: `1px solid ${isOob ? '#F87171' : isEdited ? '#818CF8' : 'var(--border)'}`, borderRadius: 5, padding: '4px 6px', color: isOob ? '#F87171' : 'var(--text)', fontFamily: 'inherit', fontSize: 11, fontWeight: 600, textAlign: 'center', outline: 'none' }}
