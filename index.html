<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply chain planning solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     Your pages + text live in the <script> at the bottom,
     marked "EDIT THIS LIST". Nothing else needs touching.
     ========================================================= */
  :root{
    --paper:#0A0E1A;--panel:#0F172A;--card:#1E293B;
    --ink:#F1F5F9;--muted:#94A3B8;--faint:#64748B;
    --line:#334155;--line-2:#3E4C61;
    --pine:#1AA8E8;--pine-dark:#7DD3FC;--pine-tint:#17304A;
    --gold:#5BCAEF;--sb:288px;--bannerH:60px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;
  }
  a{color:inherit;text-decoration:none}

  /* ---------------- top Accenture brand bar ---------------- */
  .brandbar{flex:none;height:var(--bannerH);display:flex;align-items:center;gap:16px;
    padding:0 clamp(16px,3vw,28px);color:#fff;position:relative;z-index:60;
    background:linear-gradient(100deg,#190630 0%,#3F1875 50%,#210A42 100%)}
  .brandbar .acc{font-family:'DM Sans',sans-serif;font-weight:700;font-size:21px;
    letter-spacing:-.01em;display:inline-flex;align-items:center;line-height:1}
  .brandbar .acc .chev{color:#5EEAD4;margin-left:1px;font-weight:700}
  .brandbar .divider{width:1px;height:26px;background:rgba(255,255,255,.3);flex:none}
  .brandbar .btitle{font-family:'DM Sans',sans-serif;font-weight:600;font-size:18px;color:#fff}
  @media (max-width:560px){ .brandbar .btitle{font-size:15px} .brandbar .acc{font-size:18px} }
  .brandbar .bar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .brandbar .live{display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.12em;font-weight:700;color:#fff;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    padding:5px 11px;border-radius:999px}
  .brandbar .live-dot{width:8px;height:8px;border-radius:50%;background:#22E37B;
    box-shadow:0 0 0 0 rgba(34,227,123,.7);animation:pulse 1.7s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,227,123,.6)}70%{box-shadow:0 0 0 8px rgba(34,227,123,0)}
    100%{box-shadow:0 0 0 0 rgba(34,227,123,0)}}
  .brandbar .globe{width:18px;height:18px;stroke:rgba(255,255,255,.75);fill:none;stroke-width:1.8;flex:none}
  .brandbar .wclock{display:flex;align-items:center;gap:14px}
  .brandbar .wclock .z{display:flex;flex-direction:column;line-height:1.15}
  .brandbar .wclock .zl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;
    color:rgba(255,255,255,.6);text-transform:uppercase}
  .brandbar .wclock .zt{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:#fff;
    font-variant-numeric:tabular-nums}
  @media (max-width:900px){ .brandbar .wclock .z:nth-child(n+2){display:none} }
  @media (max-width:680px){ .brandbar .live{display:none} }
  @media (max-width:520px){ .brandbar .wclock,.brandbar .globe{display:none} }
  .brandbar .logout{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;
    border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);
    color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;
    transition:background .13s,border-color .13s}
  .brandbar .logout:hover{background:rgba(255,255,255,.17)}
  .brandbar .logout svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  @media (max-width:520px){ .brandbar .logout span{display:none} .brandbar .logout{padding:0 9px} }

  /* ---------------- app row (sidebar + main) ---------------- */
  .app{flex:1;display:flex;min-height:0}

  /* ---------------- sidebar ---------------- */
  .sidebar{width:var(--sb);flex:none;height:100%;background:var(--panel);
    border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;
    transition:width .2s ease}
  body.collapsed .sidebar{width:0;border-right-width:0;overflow:hidden}
  .brand{padding:22px 22px 16px;display:flex;align-items:center;gap:11px;cursor:pointer}
  .brand .mark{width:34px;height:34px;border-radius:9px;flex:none;background:var(--pine);
    position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .brand .mark::before,.brand .mark::after{content:"";position:absolute;border-radius:2px}
  .brand .mark::before{left:9px;top:9px;width:16px;height:3px;background:#fff}
  .brand .mark::after{left:9px;top:16px;width:11px;height:3px;background:var(--gold)}
  .brand .name{font-family:'DM Sans',sans-serif;font-weight:700;font-size:19px;
    letter-spacing:-.02em;line-height:1}
  .brand .tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--pine);margin-top:3px}

  .search{position:relative;padding:4px 16px 14px}
  #q{width:100%;font:450 14px/1 'Inter',sans-serif;color:var(--ink);background:var(--card);
    border:1px solid var(--line-2);border-radius:9px;padding:11px 12px 11px 36px;
    transition:border-color .15s,box-shadow .15s}
  #q::placeholder{color:var(--faint)}
  #q:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px rgba(26,168,232,.25)}
  .search .mag{position:absolute;left:28px;top:15px;width:16px;height:16px;stroke:var(--muted);
    fill:none;stroke-width:2;pointer-events:none}
  .search .kbd{position:absolute;right:26px;top:13px;font-family:'JetBrains Mono',monospace;
    font-size:10.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;
    padding:2px 6px;background:var(--paper);pointer-events:none}

  .navwrap{flex:1;overflow-y:auto;padding:4px 12px 16px}
  .navlabel{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint);padding:8px 10px 6px}
  .nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;margin-bottom:2px;
    border-left:3px solid transparent;transition:background .13s,border-color .13s}
  .nav a:hover{background:var(--pine-tint)}
  .nav a.active{background:var(--pine-tint);border-left-color:var(--gold)}
  .nav a .ic{flex:none;width:18px;height:18px;display:flex}
  .nav a .ic svg{width:18px;height:18px;fill:none;stroke:var(--faint);stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;transition:stroke .13s}
  .nav a:hover .ic svg,.nav a.active .ic svg{stroke:var(--pine)}
  .nav a .t{font-weight:550;font-size:14.5px;line-height:1.25}
  .nav a.active .t{color:var(--pine-dark)}
  .navwrap .none{padding:16px 12px;color:var(--muted);font-size:13px;display:none}
  .navwrap .none.show{display:block}

  .foot{padding:12px 22px;border-top:1px solid var(--line);font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--faint);display:flex;align-items:center;justify-content:space-between;gap:8px}

  /* ---------------- main ---------------- */
  .main{flex:1;height:100%;display:flex;flex-direction:column;min-width:0}
  .viewbar{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;
    background:var(--card);border-bottom:1px solid var(--line)}
  .hamb{display:none;width:38px;height:38px;border:1px solid var(--line-2);border-radius:8px;
    background:var(--panel);cursor:pointer;align-items:center;justify-content:center;flex:none}
  .hamb svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2}
  .collapse-btn{display:inline-flex;width:38px;height:38px;border:1px solid var(--line-2);
    border-radius:8px;background:var(--panel);cursor:pointer;align-items:center;
    justify-content:center;flex:none;transition:border-color .13s}
  .collapse-btn:hover{border-color:var(--pine)}
  .collapse-btn svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2;fill:none}
  .viewbar .now{font-weight:600;font-size:15px;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .viewbar .now .crumb{color:var(--muted);font-weight:500;cursor:pointer;transition:color .13s}
  .viewbar .now .crumb:hover{color:var(--pine)}
  .viewbar .now .sep{color:var(--faint);font-weight:400;margin:0 9px}
  .viewbar .now .nf{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint);
    font-weight:400;margin-left:8px}
  .viewbar .actions{margin-left:auto;display:flex;gap:8px}
  .viewbar.home-mode .actions{display:none}
  .viewbar .btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;
    border:1px solid var(--line-2);border-radius:8px;background:var(--panel);font-size:13px;
    font-weight:500;color:var(--muted);cursor:pointer;transition:border-color .13s,color .13s}
  .viewbar .btn:hover{border-color:var(--pine);color:var(--pine-dark)}
  .viewbar .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

  .stage{flex:1;position:relative;background:var(--paper)}
  #frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper);display:none}
  #frame.show{display:block}

  /* ---------------- home screen ---------------- */
  .home{position:absolute;inset:0;overflow-y:auto;display:none}
  .home.show{display:block}
  .home-inner{max-width:1300px;margin:0 auto;padding:clamp(30px,5vw,60px) clamp(22px,5vw,44px) 60px}
  .home .eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:'JetBrains Mono',monospace;
    font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--pine)}
  .home .eyebrow::before{content:"";width:22px;height:8px;
    background:linear-gradient(var(--pine),var(--pine)) left/6px 100% no-repeat,
      linear-gradient(var(--gold),var(--gold)) 9px 0/6px 100% no-repeat,
      linear-gradient(var(--pine),var(--pine)) right/6px 100% no-repeat}
  .home h1{font-family:'DM Sans',sans-serif;font-weight:700;
    font-size:clamp(30px,4.6vw,50px);letter-spacing:-.02em;line-height:1.05;margin:16px 0 14px;
    max-width:20ch}
  .home .lede{color:var(--muted);font-size:clamp(15px,2vw,18px);max-width:60ch}
  .home .meta{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint);
    margin:26px 0 18px;padding-bottom:14px;border-bottom:1px solid var(--line)}

  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  @media (max-width:1024px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:560px){.cards{grid-template-columns:1fr}}
  .pcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:18px 16px 14px;min-height:196px;
    transition:transform .18s,border-color .18s,box-shadow .18s}
  .pcard:hover{transform:translateY(-3px);border-color:var(--pine);
    box-shadow:0 14px 30px -18px rgba(0,0,0,.55)}
  .pcard .chip{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;background:var(--pine-tint);border:1px solid rgba(26,168,232,.28);
    margin-bottom:13px}
  .pcard .chip svg{width:21px;height:21px;stroke:var(--pine);fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .pcard h3{font-family:'DM Sans',sans-serif;font-weight:600;font-size:16px;
    letter-spacing:-.01em;line-height:1.22;margin-bottom:6px}
  .pcard p{color:var(--muted);font-size:12.5px;line-height:1.45;flex:1}
  .pcard .row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;
    padding-top:12px;border-top:1px solid var(--line)}
  .pcard .open{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:var(--pine)}
  .pcard .ar{width:17px;height:17px;flex:none;stroke:var(--pine);fill:none;stroke-width:2;
    transition:stroke .18s,transform .18s}
  .pcard:hover .ar{stroke:var(--gold);transform:translateX(3px)}

  .scrim{position:fixed;inset:0;background:rgba(5,8,16,.55);z-index:35;opacity:0;
    pointer-events:none;transition:opacity .2s}

  @media (max-width:860px){
    .sidebar{position:fixed;left:0;top:var(--bannerH);bottom:0;height:auto;
      transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.5)}
    body.open .sidebar{transform:translateX(0)}
    body.open .scrim{opacity:1;pointer-events:auto}
    .hamb{display:inline-flex}
    .collapse-btn{display:none}
    .search .kbd{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---------------- login gate ---------------- */
  .login{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:30px;padding:24px;
    background:radial-gradient(1100px 520px at 50% -12%, rgba(74,26,122,.6), transparent 62%), var(--paper)}
  body.authed .login{display:none}
  .login .lacc{font-family:'DM Sans',sans-serif;font-weight:700;font-size:20px;color:#fff;
    display:inline-flex;align-items:center;justify-content:center}
  .login .lacc .chev{color:#5EEAD4;margin-left:1px}
  .login-head{text-align:center;max-width:680px;padding:0 12px}
  .login-head .wtag{display:block;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--pine);margin:18px 0 12px}
  .login-head h1{font-family:'DM Sans',sans-serif;font-weight:700;font-size:clamp(26px,4vw,40px);
    line-height:1.08;letter-spacing:-.02em;color:#fff;max-width:17ch;margin:0 auto}
  .login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:30px 30px 28px;box-shadow:0 30px 80px -30px rgba(0,0,0,.75)}
  .login-card h2{font-family:'DM Sans',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em;margin-bottom:18px}
  .login-card label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px;font-weight:500}
  .login-card input{width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:10px;
    color:var(--ink);font:450 15px/1 'Inter',sans-serif;padding:13px 14px;margin-bottom:16px;
    transition:border-color .15s,box-shadow .15s}
  .login-card input:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px rgba(26,168,232,.22)}
  .login-card .signin{width:100%;border:0;border-radius:10px;cursor:pointer;color:#fff;
    font:600 15px/1 'DM Sans',sans-serif;padding:14px;margin-top:4px;
    background:linear-gradient(100deg,#4A1A7A,#6B2C9E)}
  .login-card .signin:hover{filter:brightness(1.08)}
  .login-card .err{color:#F87171;font-size:13px;margin-top:12px;min-height:16px;display:none}
  .login-card .err.show{display:block}
  .login-card.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

  .foot .signout{background:none;border:0;color:var(--muted);font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:0;transition:color .13s}
  .foot .signout:hover{color:var(--pine)}
</style>
</head>
<body>
  <div class="login" id="login">
    <div class="login-head">
      <span class="lacc">accenture<span class="chev">&#8250;</span></span>
      <span class="wtag">Welcome</span>
      <h1>Reimagining Supply Chain Planning in the world of Agentic AI</h1>
    </div>
    <form class="login-card" id="login-card">
      <h2>Sign in</h2>
      <label for="u">Username</label>
      <input id="u" type="text" autocomplete="username" autofocus>
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password">
      <button class="signin" type="submit">Sign in</button>
      <div class="err" id="login-err">Incorrect username or password.</div>
    </form>
  </div>

  <header class="brandbar">
    <span class="acc">accenture<span class="chev">&#8250;</span></span>
    <span class="divider"></span>
    <span class="btitle" id="banner-title">Supply chain planning solutions</span>
    <div class="bar-right">
      <span class="live"><span class="live-dot"></span>LIVE</span>
      <svg class="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <div class="wclock" id="wclock"></div>
      <button class="logout" id="logout" title="Sign out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Sign out</span>
      </button>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar">
      <div class="brand" id="brand">
        <div class="mark"></div>
        <div>
          <div class="name" id="brand-name">My Pages</div>
          <div class="tag" id="brand-tag">Portal</div>
        </div>
      </div>
      <div class="search">
        <svg class="mag" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input id="q" type="text" placeholder="Filter…" autocomplete="off" spellcheck="false" aria-label="Filter pages">
        <span class="kbd">/</span>
      </div>
      <div class="navwrap">
        <nav class="nav" id="nav"></nav>
        <div class="none" id="none">No pages match.</div>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <div class="main">
      <div class="viewbar" id="viewbar">
        <button class="hamb" id="hamb" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
        <button class="collapse-btn" id="collapse" aria-label="Toggle sidebar" title="Toggle sidebar">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
        </button>
        <div class="now" id="now">Home</div>
        <div class="actions">
          <button class="btn" id="reload" title="Reload page">
            <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg>
            <span>Reload</span>
          </button>
          <a class="btn" id="newtab" target="_blank" rel="noopener" title="Open in new tab">
            <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            <span>Open</span>
          </a>
        </div>
      </div>
      <div class="stage">
        <iframe id="frame" title="Page view"></iframe>
        <section class="home" id="home">
          <div class="home-inner">
            <span class="eyebrow" id="home-eyebrow">Portal</span>
            <h1 id="home-headline">Everything in one place.</h1>
            <p class="lede" id="home-intro">A single home for all my pages.</p>
            <div class="meta" id="home-meta"></div>
            <div class="cards" id="cards"></div>
          </div>
        </section>
      </div>
    </div>
  </div>

<script>
  /* =====================================================================
     EDIT THIS LIST — one entry per HTML file next to this file.
       slug : clean name shown in the address bar (no spaces/dots)
       file : exact filename (case-sensitive on GitHub Pages)
       title: label shown in sidebar + on its home card
       desc : short line on the card
  ===================================================================== */
  const PAGES = [
    { slug: "apparel-us",               file: "Apparel_Retailer_F_R_US.html",       icon: "apparel", title: "Apparel US",                desc: "Forecast & replenishment supply intelligence for a US apparel retailer." },
    { slug: "food-manufacturer-cpg-us", file: "CPG_F_R.html",                        icon: "box",     title: "Food Manufacturer CPG US",  desc: "Forecast & replenishment planning for a US food manufacturer." },
    { slug: "life-science-clinics-us",  file: "Life_Sciences_F_R_S_OP.html",         icon: "flask",   title: "Life Science Clinics – US", desc: "Supply assurance and S&OP planning for US life-science clinics." },
    { slug: "aerospace-us",             file: "Aerospace_F_R_Agentic_Powered.html",  icon: "plane",   title: "Aerospace US",              desc: "Forecast & replenishment planning for US aerospace parts." },
  ];

  /* ---- header + branding text ---- */
  const SITE = {
    banner:   "Supply chain planning solutions",   /* purple Accenture bar title */
    name:     "Supply Intelligence",               /* sidebar brand */
    tag:      "Demos",
    headline: "Reimagining Supply Chain Planning in the world of Agentic AI",
    intro:    "Interactive forecast & replenishment showcases across sectors.",
  };

  /* ---- login: shared username + password (change these) ---- */
  const AUTH = { user: "accenture", pass: "planning2026" };
  /* ===================== stop editing below ===================== */

  document.getElementById('banner-title').textContent = SITE.banner;
  document.getElementById('brand-name').textContent   = SITE.name;
  document.getElementById('brand-tag').textContent    = SITE.tag;
  document.getElementById('home-eyebrow').textContent = SITE.tag;
  document.getElementById('home-headline').textContent= SITE.headline;
  document.getElementById('home-intro').textContent   = SITE.intro;

  const nav=document.getElementById('nav'), none=document.getElementById('none'),
        q=document.getElementById('q'), frame=document.getElementById('frame'),
        home=document.getElementById('home'), cards=document.getElementById('cards'),
        now=document.getElementById('now'), newtab=document.getElementById('newtab'),
        viewbar=document.getElementById('viewbar'), foot=document.getElementById('foot'),
        homeMeta=document.getElementById('home-meta');

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  const arrow='<svg class="ar" viewBox="0 0 24 24"><line x1="4" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>';
  const ICONS = {
    home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>',
    apparel:'<path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>',
    agentic:'<path d="M9.94 15.5 8.5 14.06 2.37 12.48a.5.5 0 0 1 0-.96L8.5 9.94 9.94 8.5l1.58-6.13a.5.5 0 0 1 .96 0L14.06 8.5l1.44 1.44 6.13 1.58a.5.5 0 0 1 0 .96L15.5 14.06l-1.44 1.44-1.58 6.13a.5.5 0 0 1-.96 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/>',
    chart:'<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
    box:'<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
    bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
    cpgai:'<rect x="3.5" y="8" width="14" height="12" rx="2"/><path d="M3.5 12h14"/><path d="M20 2.5L20.7 4.3L22.5 5L20.7 5.7L20 7.5L19.3 5.7L17.5 5L19.3 4.3Z"/>',
    flask:'<path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/>',
    plane:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  };

  // sidebar: Home item + page items (with icons, no filename)
  nav.innerHTML =
    `<a href="#" class="nav-home" data-key="__home__" data-search="home"><span class="ic"><svg viewBox="0 0 24 24">${ICONS.home}</svg></span><div class="t">Home</div></a>`
    + `<div class="navlabel">Solutions</div>`
    + PAGES.map(p=>`
      <a href="#${encodeURIComponent(p.slug)}" data-key="${esc(p.slug)}"
         data-search="${esc((p.title+' '+(p.desc||'')+' '+p.slug).toLowerCase())}">
        <span class="ic"><svg viewBox="0 0 24 24">${ICONS[p.icon]||''}</svg></span>
        <div class="t">${esc(p.title||p.file)}</div>
      </a>`).join('');

  // home cards (no filename shown; whole card is the link)
  cards.innerHTML = PAGES.map(p=>`
    <a class="pcard" href="#${encodeURIComponent(p.slug)}">
      <span class="chip"><svg viewBox="0 0 24 24">${ICONS[p.icon]||''}</svg></span>
      <h3>${esc(p.title||p.file)}</h3>
      <p>${esc(p.desc||'')}</p>
      <span class="row"><span class="open">Open</span>${arrow}</span>
    </a>`).join('');



  function setActive(key){
    nav.querySelectorAll('a').forEach(a=>a.classList.toggle('active', a.dataset.key===key));
  }
  function showHome(){
    frame.classList.remove('show'); frame.removeAttribute('src');
    home.classList.add('show'); viewbar.classList.add('home-mode');
    now.textContent='Home'; setActive('__home__'); document.title=SITE.banner;
    if(document.body.classList.contains('open')) close();
  }
  function load(slug){
    const p=PAGES.find(x=>x.slug===slug);
    if(!p){ showHome(); return; }
    home.classList.remove('show'); viewbar.classList.remove('home-mode');
    frame.classList.add('show'); frame.src=p.file;
    now.innerHTML='<a class="crumb" href="#">Home</a><span class="sep">/</span>'+esc(p.title||p.file);
    newtab.href=p.file; setActive(slug);
    document.title=(p.title||p.file)+' · '+SITE.banner;
    if(document.body.classList.contains('open')) close();
  }
  function route(){
    const h=decodeURIComponent(location.hash.replace(/^#/,''));
    if(h && PAGES.some(p=>p.slug===h)) load(h); else showHome();
  }
  window.addEventListener('hashchange', route);
  document.getElementById('brand').addEventListener('click', ()=>{ location.hash=''; route(); });

  q.addEventListener('input', ()=>{
    const t=q.value.trim().toLowerCase(); let shown=0;
    nav.querySelectorAll('a').forEach(a=>{
      if(a.dataset.key==='__home__'){ a.style.display=(!t||'home'.includes(t))?'block':'none'; return; }
      const hit=!t||a.dataset.search.includes(t);
      a.style.display=hit?'block':'none'; if(hit) shown++;
    });
    none.classList.toggle('show', shown===0 && t!=='');
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='/' && document.activeElement!==q){e.preventDefault();q.focus();}
    if(e.key==='Escape'){ if(document.activeElement===q){q.value='';q.dispatchEvent(new Event('input'));q.blur();} else if(document.body.classList.contains('open')) close(); }
  });
  document.getElementById('reload').addEventListener('click',()=>{ if(frame.getAttribute('src')) frame.src=frame.src; });

  const hamb=document.getElementById('hamb'), scrim=document.getElementById('scrim');
  function open(){document.body.classList.add('open')}
  function close(){document.body.classList.remove('open')}
  hamb.addEventListener('click',open); scrim.addEventListener('click',close);
  document.getElementById('collapse').addEventListener('click',()=>document.body.classList.toggle('collapsed'));

  /* ---- login gate ---- */
  const loginCard=document.getElementById('login-card'),
        uEl=document.getElementById('u'), pEl=document.getElementById('p'),
        errEl=document.getElementById('login-err');
  function isAuthed(){ try{return sessionStorage.getItem('scp_auth')==='1';}catch(e){return false;} }
  if(isAuthed()) document.body.classList.add('authed');
  loginCard.addEventListener('submit',e=>{
    e.preventDefault();
    if(uEl.value.trim()===AUTH.user && pEl.value===AUTH.pass){
      errEl.classList.remove('show');
      try{sessionStorage.setItem('scp_auth','1');}catch(e){}
      document.body.classList.add('authed');
    } else {
      errEl.classList.add('show');
      loginCard.classList.remove('shake'); void loginCard.offsetWidth; loginCard.classList.add('shake');
      pEl.value=''; pEl.focus();
    }
  });
  document.getElementById('logout').addEventListener('click',()=>{
    try{sessionStorage.removeItem('scp_auth');}catch(e){}
    document.body.classList.remove('authed');
    uEl.value=''; pEl.value=''; errEl.classList.remove('show'); location.hash=''; uEl.focus();
  });

  /* ---- live local clock (auto-detects the viewer's time zone) ---- */
  const wclock=document.getElementById('wclock');
  const localTZ=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'';
  const tzLabel=localTZ ? localTZ.split('/').pop().replace(/_/g,' ') : 'Local';
  wclock.innerHTML=`<span class="z"><span class="zl">${esc(tzLabel)} · local time</span><span class="zt" id="localtime"></span></span>`;
  function tick(){
    document.getElementById('localtime').textContent=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
  }
  tick(); setInterval(tick,1000);

  route();
</script>
</body>
</html>
